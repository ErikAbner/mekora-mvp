<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · área pessoal</title>
<style>
/* ════════════════════════════════════════════════════════════
   Neutros limpos para a interface; o creme do repositório
   (--paper #f1eee7) fica reservado à superfície de leitura.
   Acento derivado das cores de livro do canvas-motion.
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#ffffff;--bg-2:#f7f7f5;--bg-3:#f0efec;--nav:#f4f3f0;
  /* --ink-3 media 3,66:1 no branco e 3,16:1 no papel — reprovado em AA.
     #706c65 dá 4,52:1 no pior fundo do app. --ink-4 fica só para borda e
     ponto: em texto ele media 2,16:1, e nenhum ajuste de tom salvaria. */
  --ink:#1a1917;--ink-2:#57534d;--ink-3:#706c65;--ink-4:#b5b0a8;
  --line:#e6e4de;--line-2:#efede8;
  --acc:#c8481f;--acc-soft:#fdf0ea;
  --ok:#2f7d55;--warn:#a8701c;--dan:#b23b2a;
  --paper:#f1eee7;                       /* só o leitor */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r1:6px;--r2:10px;--h1:32px;--h2:38px;
  --ui:-apple-system,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
/* a preferência de movimento precisa desligar transição de verdade */
body[data-motion="Reduzido"] *{transition-duration:.001s!important;animation:none!important;
  scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001s!important;animation:none!important}
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ MOLDURA DO PRODUTO ═══ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topo{display:flex;align-items:center;gap:var(--s2);height:56px;flex:0 0 56px;padding:0 var(--s5);
  border-bottom:1px solid var(--line);background:var(--bg)}
.marca{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;margin-right:var(--s5)}
.topo nav{display:flex;gap:2px}
.topo nav button{padding:7px 13px;border-radius:var(--r1);color:var(--ink-2);font-size:13.5px}
.topo nav button:hover{background:var(--bg-2);color:var(--ink)}
.topo nav button[aria-current="true"]{background:var(--ink);color:#fff}
.topo .sp{flex:1}
.busca{display:flex;align-items:center;gap:var(--s2);height:var(--h1);padding:0 var(--s3);
  border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:13px;background:var(--bg-2);min-width:0}
.busca:hover{border-color:var(--ink-4)}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff}
/* controle de usuário persistente */
.uctl{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-2)}
.uctl:hover{border-color:var(--ink-4);background:#fff}
.uctl[aria-expanded="true"]{border-color:var(--ink);background:#fff}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.uctl .ch{font-size:9px;color:var(--ink-3)}

/* menu do usuário */
.umenu{position:absolute;top:52px;right:var(--s5);width:264px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r2);box-shadow:0 16px 44px rgba(26,25,23,.14);z-index:60;overflow:hidden}
.umenu .id{padding:var(--s4);border-bottom:1px solid var(--line-2);display:flex;gap:var(--s3);align-items:center}
.umenu .id .ava{width:38px;height:38px;font-size:14px}
.umenu .id .n{font-size:14px;font-weight:600}
.umenu .id .e{font-size:12px;color:var(--ink-3);margin-top:1px}
.umenu ul{list-style:none;margin:0;padding:var(--s2)}
.umenu li button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:9px var(--s3);
  border-radius:var(--r1);font-size:13.5px}
.umenu li button:hover{background:var(--bg-2)}
.umenu li button .ic{width:16px;text-align:center;color:var(--ink-3);font-size:13px}
.umenu .div{height:1px;background:var(--line-2);margin:var(--s2) 0}

/* ═══ ÁREAS ═══ */
.corpo{flex:1;min-height:0;display:flex;overflow:hidden}
.rolo{flex:1;min-height:0;overflow-y:auto}
.pad{padding:var(--s6) var(--s7) var(--s7)}
h1.t{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 var(--s1)}
.sub{font-size:13.5px;color:var(--ink-3);margin:0 0 var(--s5);line-height:1.55}

/* biblioteca */
.libtop{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.libtop .ti{flex:1;min-width:160px}
.grade{display:grid;gap:var(--s5);grid-template-columns:repeat(auto-fill,minmax(var(--cw,150px),1fr))}
.bk{text-align:left;position:relative;padding-top:12px;display:block;width:100%}
/* span é inline: sem display:block a altura por padding-bottom não existe */
.bk .cv{display:block;position:relative;width:100%;padding-bottom:140%;border-radius:var(--r1);background:var(--c);
  box-shadow:0 4px 14px rgba(26,25,23,.14);transition:transform .14s,box-shadow .14s;overflow:hidden}
.bk:hover .cv{transform:translateY(-3px);box-shadow:0 12px 26px rgba(26,25,23,.2)}
.bk .cvin{position:absolute;inset:0;padding:11px;display:flex;flex-direction:column;justify-content:space-between}
/* .55 de alfa sobre as capas dava 3,35:1 — a 10px isso reprova em AA */
.bk .ini{font-family:var(--mono);font-size:10px;color:rgba(26,25,23,.82)}
.bk .ct{font-size:12px;font-weight:600;color:#1a1917;line-height:1.2}
.bk .tab{position:absolute;top:0;right:11%;background:var(--ink);color:#fff;font-size:9.5px;font-weight:600;
  padding:3px 6px 8px;border-radius:3px 3px 0 0;z-index:2}
.bk .prg{position:absolute;left:0;bottom:0;height:3px;background:#fff}
.bk .t{font-size:13px;font-weight:600;margin-top:var(--s2);line-height:1.25}
.bk .a{font-size:12px;color:var(--ink-3);margin-top:1px}
.bk .src{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* painel contextual (o elo com Settings) */
.ctxwrap{position:relative}
.ctx{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:0 18px 46px rgba(26,25,23,.16);width:300px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.ctx .row{padding:var(--s2) 0;border:none}
.ctx .ponte{margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--acc);font-weight:550}
.ctx .ponte:hover{text-decoration:underline}

/* ═══ CONFIGURAÇÕES ═══ */
.cfg{flex:1;min-height:0;display:flex;overflow:hidden}
.cfgnav{width:246px;flex:0 0 246px;border-right:1px solid var(--line);background:var(--nav);
  display:flex;flex-direction:column;min-height:0}
.cfgnav .volta{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s4) var(--s3);
  font-size:13px;color:var(--ink-2)}
.cfgnav .volta:hover{color:var(--acc)}
.cfgnav .bs{margin:0 var(--s3) var(--s3);display:flex;align-items:center;gap:var(--s2);height:var(--h1);
  padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r1);background:#fff}
.cfgnav .bs input{border:none;outline:none;background:none;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.cfgnav .lista{overflow-y:auto;padding:0 var(--s2) var(--s5);flex:1}
.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  padding:var(--s4) var(--s3) var(--s2)}
.cat{display:flex;align-items:center;gap:var(--s3);width:100%;padding:8px var(--s3);border-radius:var(--r1);
  font-size:13.5px;color:var(--ink-2)}
.cat:hover{background:var(--bg-3);color:var(--ink)}
.cat[aria-current="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,25,23,.07)}
.cat[aria-current="true"] .ic{color:var(--acc)}
.cat .ic{width:15px;text-align:center;color:var(--ink-3);font-size:12px}
.cat .badge{margin-left:auto}
.cfgmain{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
.cfgpad{padding:var(--s6) var(--s7);max-width:760px}
.cfghead{margin-bottom:var(--s5)}
.cfghead .trilha{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:var(--s2)}
.cfghead h2{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}
.cfghead p{margin:var(--s2) 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.55;max-width:60ch}
.bloco{margin-bottom:var(--s6)}
.bloco h3{margin:0 0 var(--s2);font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--ink-2)}
.cartao{border:1px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s5);align-items:center;
  padding:var(--s4);border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row.hit{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.lb{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ds{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:3px;max-width:52ch}
@media (max-width:620px){.row{grid-template-columns:1fr;gap:var(--s3)}}

/* controles */
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:999px;padding:2px 7px;color:var(--ink-3);white-space:nowrap}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.sim{border-color:var(--warn);color:var(--warn)}
.sw{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:0 0 40px;display:block;
  transition:background .16s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(26,25,23,.28);transition:left .16s}
.sw.on{background:var(--ink)}.sw.on i{left:19.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;height:var(--h1);background:#fff}
.seg button{padding:0 var(--s3);font-size:12.5px;border-right:1px solid var(--line);display:flex;align-items:center;
  white-space:nowrap;color:var(--ink-2)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--bg-2)}
.seg button.on{background:var(--ink);color:#fff}
select.sel{height:var(--h1);border:1px solid var(--line);border-radius:var(--r1);padding:0 var(--s2);
  background:#fff;font:inherit;font-size:13px;color:var(--ink)}
.inp{height:var(--h2);border:1px solid var(--line);border-radius:var(--r1);padding:0 var(--s3);background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink);min-width:240px;max-width:100%}
.btn{height:var(--h2);padding:0 var(--s5);border-radius:var(--r1);background:var(--ink);color:#fff;font-size:13.5px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--acc)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.sec:hover{background:var(--bg-2)}
.btn.dan{background:var(--dan)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.lnk{font-size:13px;color:var(--acc);font-weight:550}
.lnk:hover{text-decoration:underline}
.acts{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.faixa{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r1);
  background:var(--bg-2);border:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.faixa .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--ok)}.d-sim{background:var(--warn)}.d-off{background:var(--ink-4)}
.faixa .sp{flex:1}

/* ═══ PERFIL ═══ */
.pcabec{display:flex;gap:var(--s5);align-items:center;padding-bottom:var(--s5);border-bottom:1px solid var(--line);
  margin-bottom:var(--s5);flex-wrap:wrap}
.pcabec .ava{width:72px;height:72px;font-size:26px}
.pcabec h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.pcabec .h{font-size:13px;color:var(--ink-3);margin-top:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s4);margin-bottom:var(--s6)}
.num{border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);background:#fff}
.num b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em}
.num span{font-size:12.5px;color:var(--ink-3)}
.linhat{display:grid;grid-template-columns:78px minmax(0,1fr);gap:var(--s4);padding:var(--s3) 0;
  border-bottom:1px solid var(--line-2);font-size:13px}
.linhat .q{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ═══ LEITOR ═══ */
.leitor{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:var(--s3);height:52px;flex:0 0 52px;padding:0 var(--s5);
  border-bottom:1px solid rgba(26,25,23,.1);font-size:13px;color:var(--ink-2)}
.ltop .ti{font-family:var(--serif);font-size:15px;color:var(--ink)}
.ltop .sp{flex:1}
.lbody{flex:1;overflow-y:auto;padding:var(--s7) var(--s5) 90px}
.lcol{max-width:620px;margin:0 auto;font-family:var(--serif);line-height:1.62;color:#26221c}
.lcol p{margin:0 0 1em}
.lcol .hl{background:#f3dd8c;padding:2px 0}

/* ═══ CONHECIMENTO ═══ */
.kviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;margin:var(--s5) 0;max-width:760px}
.kv{background:var(--bg);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:3px}
.kv:hover{background:var(--bg-2)}
.kv.on{background:var(--ink);color:var(--bg)}
.kv b{font-size:13px;font-weight:600}
.kv span{font-size:11px;opacity:.62;line-height:1.35}
.klista{display:flex;flex-direction:column;gap:var(--s3);max-width:760px;margin-top:var(--s4)}
.kdia,.kgrupo{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s4);
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.kcard{border:1px solid var(--line);border-radius:var(--r1);background:var(--bg);overflow:hidden}
.kcard.aberto{border-color:var(--ink)}
.kcorpo{padding:var(--s4)}
.kexp{display:flex;width:100%;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:10px var(--s4);border-top:1px solid var(--line);background:var(--bg-2);
  font-size:12px;color:var(--ink-2);text-align:left}
.kexp:hover{background:var(--ink);color:var(--bg)}
.kexp.on{background:var(--ink);color:var(--bg)}
.kexp.vazia{color:var(--ink-3);cursor:default;font-style:italic}
.kseta{font-size:10px}
.ktrecho{margin:0 0 10px;font-family:var(--serif);font-size:15.5px;line-height:1.5;font-style:italic;
  color:var(--ink);border-left:2px solid var(--acc);padding-left:12px}
.knota{margin:0 0 12px;font-size:14px;line-height:1.62;color:var(--ink)}
.kmeta{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.kliv{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.kliv i{width:9px;height:12px;border-radius:1px;display:inline-block}
.kliv.grande{font-size:14px;font-weight:600;color:var(--ink)}
.kliv.grande i{width:12px;height:16px}
.ktags{display:inline-flex;gap:5px;flex-wrap:wrap}
.ktag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:3px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-2)}
.ktag:hover{border-color:var(--ink);color:var(--ink)}
.ktag.grande{font-size:11px;padding:6px 11px;display:inline-flex;align-items:center;gap:7px}
.ktag.grande span{font-family:var(--ui);opacity:.5}
.ktag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ktag.on span{opacity:.7}
.kcx{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-left:auto}
.knuvem{display:flex;flex-wrap:wrap;gap:7px;max-width:760px;margin:var(--s4) 0 var(--s3)}
/* ═══ REDE ═══ o nó é o objeto, com rótulo legível — não uma bolinha */
.rwrap{max-width:980px;margin:var(--s3) 0;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--bg);overflow-x:auto}
.rede{display:block;width:100%;min-width:740px;height:auto}
.rl{fill:none;stroke:var(--ink-3);stroke-width:1.1;opacity:.4}
.rl.tema{stroke-dasharray:3 3}
.rl.apagada{opacity:.07}
.rl.viva{opacity:.95;stroke:var(--ink);stroke-width:1.7}
.rn{cursor:pointer}
.rn .rbox{fill:var(--bg);stroke:var(--line);stroke-width:1}
.rn.livro .rbox{fill:var(--bg-2)}
.rn.assunto .rbox{fill:var(--ink);stroke:var(--ink)}
.rn:hover .rbox,.rn:focus-visible .rbox{stroke:var(--ink);stroke-width:1.8}
.rn:focus-visible{outline:none}
.rn:focus-visible .rbox{stroke:var(--acc);stroke-width:2.4}
.rn.sel .rbox{stroke:var(--acc);stroke-width:2.2}
.rn.apagado{opacity:.16}
.rt{font-family:var(--ui);fill:var(--ink);pointer-events:none}
.rt.livro{font-size:11.5px;font-weight:600}
.rt.assunto{font-size:11.5px;font-weight:600;fill:var(--bg);letter-spacing:.01em}
.rt.nota{font-size:11px}
.rt.nota2{font-size:11px;fill:var(--ink-2)}
.rlegenda{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);max-width:980px;
  margin-top:var(--s4);font-size:11.5px;color:var(--ink-2)}
.rlegenda span{display:inline-flex;align-items:center;gap:6px}
.rle{width:13px;height:11px;border-radius:3px;border:1px solid var(--line);background:var(--bg);display:inline-block}
.rle.livro{background:var(--bg-2)}
.rle.assunto{background:var(--ink);border-color:var(--ink)}
.rle.lorigem,.rle.ltema{height:0;border-radius:0;border:0;border-top:1.4px solid var(--ink-3);width:18px}
.rle.ltema{border-top-style:dashed}
.rlsep{width:1px;height:14px;background:var(--line);margin:0 2px}
.rlegenda .lnk{margin-left:auto}
@media (max-width:640px){.rlegenda .lnk{margin-left:0}}
/* assuntos: a unidade da área, não a nota */
.ktemas{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:var(--s3);
  max-width:760px;margin-top:var(--s4)}
.ktema{border:1px solid var(--line);border-radius:var(--r1);background:var(--bg);padding:var(--s4);
  text-align:left;display:flex;flex-direction:column;gap:7px}
.ktema:hover{border-color:var(--ink);background:var(--bg-2)}
.ktema-t{font-size:16px;font-weight:600;color:var(--ink)}
.ktema-n{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3)}
.ktema-caps{display:flex;gap:3px}
.ktema-caps i{width:8px;height:11px;border-radius:1px;display:inline-block}
.ktema-x{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.ktemaAberto{max-width:760px;margin-top:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.ktema-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.ktema-h h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.ktema-h .lnk{margin-left:auto}
.ktema-p{margin:9px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2);max-width:600px}
.ksoltas{max-width:760px;margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
.krel{border-top:1px solid var(--line);padding:var(--s4);background:var(--bg-2);
  display:flex;flex-direction:column;gap:var(--s3)}
.krow{border:1px solid var(--line);border-radius:var(--r1);padding:var(--s3);background:var(--bg)}
.krow.aceita{border-left:3px solid #4f8a4a}
.krow.recusada{opacity:.55;border-left:3px solid var(--ink-3)}
.krow-b{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.kforca{display:inline-flex;gap:4px;margin-left:auto}
.kt{font-family:var(--mono);font-size:9px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:3px;padding:2px 5px;color:var(--ink-2)}
.krow-n{margin:0 0 9px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.kacts{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.kest{font-size:11.5px;color:var(--ink-2)}
.kfiltro{display:flex;align-items:center;gap:11px;font-size:13px;padding:9px 13px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--r1);max-width:760px;margin-bottom:var(--s3)}
.kdossie{max-width:640px;display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s4)}
.klbl2{font-size:12.5px;color:var(--ink-2)}
.kvazio{max-width:560px;display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5);
  padding:var(--s5);border:1px dashed var(--line);border-radius:var(--r1)}
.kv-t{margin:0;font-size:17px;font-weight:600}
.kv-p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink-2)}
@media (max-width:640px){
  .kviews{grid-template-columns:1fr 1fr}
  .kcx{margin-left:0}
  /* no toque, alvo de 19px é erro de clique esperando acontecer */
  .ktag{padding:9px 11px;font-size:10.5px}
  .kacts .lnk,.kfiltro .lnk{min-height:34px;display:inline-flex;align-items:center}
  .kexp{padding:14px var(--s4)}
}

/* ═══ LEITOR ═══ */
.leitor{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;overflow:hidden}
.licone{width:36px;height:36px;border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink-2);flex:0 0 36px}
.licone:hover{background:rgba(26,25,23,.07);color:var(--ink)}
.licone.on{background:var(--ink);color:#fff}
.licone.aa{font-family:var(--serif);font-size:17px}
.ltop,.lbar{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5);flex:0 0 54px;height:54px;
  transition:opacity .2s,transform .2s;background:inherit;position:relative;z-index:5}
.ltop{border-bottom:1px solid rgba(26,25,23,.08)}
.lbar{border-top:1px solid rgba(26,25,23,.08);gap:var(--s5)}
.ltop .ti{font-family:var(--serif);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-left:var(--s2)}
.ltop .sp{flex:1}
.oculto{opacity:0;pointer-events:none;transform:translateY(-6px)}
.lbar.oculto{transform:translateY(6px)}
.lflut{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:var(--s1);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;
  box-shadow:0 10px 30px rgba(26,25,23,.18);transition:opacity .2s}
.lflut.oculto{opacity:0;pointer-events:none}
.lborda{position:absolute;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;
  gap:var(--s1);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px;
  box-shadow:0 8px 24px rgba(26,25,23,.14);transition:opacity .2s}
.lborda.esq{left:14px}.lborda.dir{right:14px}
.lborda.oculto{opacity:0;pointer-events:none}
.lbody{flex:1;min-height:0;overflow-y:auto;padding:var(--s7) var(--s5) 96px;cursor:text}
.lcol{margin:0 auto}
.lcol .lcap{font-family:var(--ui);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  opacity:.5;margin:0 0 var(--s6)}
.lcol p{margin:0 0 1.05em}
.lcol p.alvo{animation:pisca 1.6s ease-out}
@keyframes pisca{0%,30%{background:rgba(200,72,31,.14)}100%{background:transparent}}
.lfim{margin-top:var(--s7);padding-top:var(--s5);border-top:1px solid rgba(26,25,23,.1)}
.lh3{font-family:var(--ui);font-size:.82em;font-weight:650;letter-spacing:.01em;margin:2em 0 .7em;opacity:.75}
.lq{margin:1.4em 0;padding-left:1.1em;border-left:2px solid currentColor;opacity:.72;font-style:italic}
.lul{margin:0 0 1.05em;padding-left:1.3em}
/* ═══ GRID EDITORIAL (alternativa B) ═══
   Quatro faixas derivadas da coluna. O corpo nunca se move; o que
   muda é quanto cada outra coisa escapa dele — para cima ou para baixo. */
.gridE .lcol{overflow:visible}
.gridE .lq{               /* 1.17× — escapa, porque é destaque do próprio texto */
  width:var(--faixa-esc);max-width:none;margin-left:calc((var(--col) - var(--faixa-esc))/2);
  padding-left:0;border-left:0;opacity:1;font-style:normal;
  font-size:1.16em;line-height:1.34;text-indent:0;margin-top:1.8em;margin-bottom:1.8em}
.gridE .lq::before{content:"";display:block;width:34px;height:1px;background:currentColor;
  opacity:.35;margin-bottom:.7em}
.gridE .lul{              /* 0.93× recuado — subordinado ao corpo, como legenda */
  width:var(--faixa-sub);margin-left:calc(var(--col) - var(--faixa-sub));
  font-family:var(--ui);font-size:.8em;line-height:1.5;opacity:.78}
/* A RÉGUA SANGRA, O TÍTULO NÃO.
   A primeira versão jogava a faixa inteira até a borda da tela, e o título
   ficava a ~450px do texto: para lê-lo o olho tinha de sair da coluna e
   voltar, a cada capítulo. O que marca a fronteira na rolagem é a linha
   atravessando a tela — não o texto acompanhá-la. */
.gridE .lcap{position:relative;opacity:1;font-size:12px;
  padding:var(--s6) 0 var(--s4);margin-bottom:var(--s3);
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4)}
.gridE .lcap::before{content:"";position:absolute;top:0;height:1px;
  left:calc(50% - 50vw + var(--sbw,0px)/2);width:calc(100vw - var(--sbw,0px));
  background:currentColor;opacity:.22}
.gridE .lsec:first-child .lcap::before{display:none}
.gridE .lcap::after{content:attr(data-faixa);font-family:var(--ui);opacity:.5;letter-spacing:.1em;
  white-space:nowrap}
/* com a margem ligada, a régua para na coluna: atravessar cortaria as notas */
.lbody.commargem.gridE .lcap::before{left:0;width:100%}
@media (max-width:700px){.gridE .lq,.gridE .lul{width:100%;margin-left:0}}
.lul li{margin-bottom:.4em}
.marcanota{font-size:.62em;opacity:.5;margin-left:.35em;vertical-align:super;line-height:1}
.marcanota:hover{opacity:1;color:var(--acc)}
.dst.cat{box-shadow:inset 0 -2px 0 rgba(26,25,23,.32)}
.dst.ativo{outline:2px solid var(--acc);outline-offset:1px}
.temnota{font-size:.6em;vertical-align:super;opacity:.55;margin-left:.15em}
.lsec{scroll-margin-top:70px}
.lsec+.lsec{margin-top:3.2em;padding-top:2.4em;border-top:1px solid currentColor;border-color:rgba(26,25,23,.12)}
.fioprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(26,25,23,.1);z-index:5}
.fioprog i{display:block;height:100%;background:var(--ink)}
/* correção de trecho */
.selbar.corrige{background:var(--acc)}
.grpajuste{display:flex;align-items:center;gap:2px;padding:0 var(--s2);
  border-left:1px solid rgba(255,255,255,.25)}
.grpajuste .ajr{font-size:10.5px;color:rgba(255,255,255,.7);margin-right:3px}
.grpajuste button{padding:6px 9px;font-size:14px;line-height:1}
.destaque-corrige{font-weight:600}
/* notas de margem (desktop largo) */
/* ═══ A COLUNA NÃO PODE ANDAR AO LIGAR A MARGEM ═══
   A faixa esquerda vale (100% + coluna)/2, então a borda direita do texto cai
   exatamente onde cairia se ele estivesse centrado sozinho: ligar a margem não
   move uma linha. Ela ocupa o vazio que já existia à direita.
   Quando esse vazio não dá, .apertada centra o conjunto — o texto anda, mas
   metade do que andaria, e só nesse caso. */
.lbody.commargem{display:grid;gap:var(--s6);align-items:start;
  grid-template-columns:calc((100% + var(--col,640px))/2) 300px}
.lbody.commargem .lcol{justify-self:end;margin:0}
.lbody.commargem.apertada{grid-template-columns:minmax(0,1fr) 300px}
.margem{position:relative;min-height:100%}
.notamg{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-left:3px solid #f7e08a;border-radius:var(--r1);padding:var(--s3);text-align:left;
  box-shadow:0 2px 8px rgba(26,25,23,.06);transition:box-shadow .14s}
.notamg:hover{box-shadow:0 8px 20px rgba(26,25,23,.14);z-index:2}
.mgtrecho{display:block;font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--ink-3);
  margin-bottom:5px;line-height:1.4}
.mgnota{display:block;font-size:12.5px;line-height:1.5;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.notamg.ativa{border-color:var(--ink);box-shadow:0 8px 20px rgba(26,25,23,.16);z-index:3;
  display:flex;flex-direction:column;gap:8px}
.mgentrada{width:100%;min-width:0;font:inherit;font-size:12.5px;line-height:1.5;color:var(--ink);
  background:transparent;border:1px solid var(--line);border-radius:var(--r1);padding:8px;resize:vertical}
.mgentrada:focus{outline:2px solid var(--ink);outline-offset:1px}
.mgacts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* fio que devolve a nota deslocada ao trecho de origem */
.fio{position:absolute;left:-13px;width:1px;background:linear-gradient(var(--line),var(--ink-3));
  opacity:.6;pointer-events:none}
.notamg:hover .fio,.notamg.ativa .fio{opacity:1;background:var(--ink-3)}
.mgrupo{position:absolute;left:0;right:0;background:var(--bg-2);border:1px dashed var(--ink-3);
  border-radius:var(--r1);padding:9px var(--s3);text-align:left;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.mgrupo:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}
@media (max-width:1179px){.lbody.commargem{display:block}.margem{display:none}}
.dst{padding:2px 0;border-radius:2px;cursor:pointer;background:#f7e08a}
.dst.rosa{background:#f6c9d8}.dst.verde{background:#c8e6bd}
.lprog{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center}
.ltrilho{width:100%;max-width:320px;height:3px;background:rgba(26,25,23,.14);border-radius:2px;overflow:hidden}
.ltrilho i{display:block;height:100%;background:var(--ink)}
/* os dois controles do chrome do leitor tinham 16px e 17px de alvo —
   no toque isso é erro de clique esperando acontecer */
.lprogtxt{font-size:12px;color:var(--ink-3);min-height:32px;display:inline-flex;
  align-items:center;padding:0 var(--s2)}
.lprogtxt:hover{color:var(--acc)}
.lpanel-h .lnk{min-height:32px;display:inline-flex;align-items:center;padding:0 var(--s2);margin-right:-8px}

/* seleção */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:78;background:var(--ink);
  border-radius:999px;display:flex;align-items:center;gap:2px;padding:5px;
  box-shadow:0 14px 34px rgba(26,25,23,.34)}
.selbar button{color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.selbar button:hover{background:rgba(255,255,255,.16)}
.selbar .cores{display:flex;gap:4px;padding:0 var(--s2);border-left:1px solid rgba(255,255,255,.2);
  margin-left:var(--s1)}
.selbar .cor{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}
.selbar .cor.amarelo{background:#f7e08a}.selbar .cor.rosa{background:#f6c9d8}.selbar .cor.verde{background:#c8e6bd}
.selbar .cor.on{border-color:#fff}

/* nota lateral — o trecho continua visível */
.notaed{position:absolute;top:0;right:0;bottom:0;width:360px;background:#fff;border-left:1px solid var(--line);
  z-index:76;display:flex;flex-direction:column;box-shadow:-18px 0 46px rgba(26,25,23,.14)}
.notaed-h{display:flex;align-items:center;padding:var(--s4);border-bottom:1px solid var(--line-2)}
.notaed-h .lbl{flex:1}
.notaed-b{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);overflow-y:auto}
.trecho{margin:0;border-left:3px solid #f7e08a;padding:var(--s2) 0 var(--s2) var(--s3);font-family:var(--serif);
  font-size:14px;line-height:1.55;color:var(--ink-2)}
.notaentrada{border:1px solid var(--line);border-radius:var(--r1);padding:var(--s3);font:inherit;font-size:14px;
  line-height:1.55;resize:vertical;color:var(--ink);background:var(--bg-2)}
.notaentrada:focus{outline:2px solid var(--acc);outline-offset:-1px;background:#fff}
.notadica{margin:0;font-size:12px;line-height:1.5;color:var(--ink-3)}
.erroSalvar{font-size:12.5px;line-height:1.5;color:var(--ink-2);background:#fdf0ea;border:1px solid #f0c9b8;
  border-radius:var(--r1);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.notaed-b{max-height:100%}
.notaed .notaentrada{max-height:46vh}

/* painéis do leitor */
.lpanel{position:absolute;top:0;right:0;bottom:0;width:340px;background:#fff;border-left:1px solid var(--line);
  z-index:75;display:flex;flex-direction:column;box-shadow:-18px 0 46px rgba(26,25,23,.12)}
.lpanel-h{display:flex;align-items:center;padding:var(--s4);border-bottom:1px solid var(--line-2)}
.lpanel-h .lbl{flex:1}
.lpanel-b{padding:var(--s4);overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:var(--s2)}
.tocit{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s3);border-radius:var(--r1);
  font-size:13.5px;color:var(--ink-2)}
.tocit:hover{background:var(--bg-2);color:var(--ink)}
.tocit.on{background:var(--bg-3);color:var(--ink);font-weight:600}
.hit,.anot{display:flex;flex-direction:column;gap:5px;padding:var(--s3);border-radius:var(--r1);
  border:1px solid var(--line-2);text-align:left;background:#fff}
.hit:hover,.anot:hover{border-color:var(--ink-4);background:var(--bg-2)}
.anot mark{font-family:var(--serif);font-size:13px;line-height:1.5}
.anotnota{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.vaziop{margin:0;font-size:13px;color:var(--ink-3);line-height:1.6}

/* painel de tipografia */
.ctx.aa{width:340px}
.ctx.aa .prev{padding:var(--s3);border-radius:var(--r1);border:1px solid var(--line-2);margin-bottom:var(--s2)}
.linhactx{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--s3);align-items:center;padding:5px 0}
.linhactx .rot{font-size:12.5px;color:var(--ink-2)}
.linhactx .seg{width:100%}
.linhactx .seg button{flex:1;justify-content:center;padding:0 var(--s1)}
.escopo{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line-2)}
@media (max-width:720px){
  .notaed,.lpanel{width:100%;top:auto;height:74%;border-left:none;border-top:1px solid var(--line);
    border-radius:var(--r2) var(--r2) 0 0}
  .ctx.aa{width:calc(100vw - 32px);right:-8px}
  .lbody{padding:var(--s5) var(--s4) 110px}
  .selbar{bottom:auto;top:auto;position:fixed;left:8px;right:8px;transform:none;justify-content:space-between}
  .selbar button{padding:10px 10px;font-size:12.5px}
}

/* variantes de nota e destaque */
.notainline{display:block;margin:0 0 1.05em;padding:var(--s3) var(--s4);background:rgba(26,25,23,.045);
  border-left:3px solid var(--acc);border-radius:0 var(--r1) var(--r1) 0;font-family:var(--ui)}
.notainline .acts{margin-top:var(--s2)}
.notainline.lida{cursor:pointer;border-left-color:#f7e08a}
.notainline.lida:hover{background:rgba(26,25,23,.07)}
.notainline.lida p{margin:3px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.notaflut{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:78;width:min(420px,90vw);
  background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);
  box-shadow:0 20px 50px rgba(26,25,23,.24);display:flex;flex-direction:column;gap:var(--s2)}
.notaflut-h{display:flex;align-items:center}
.notaflut-h .lbl{flex:1}
/* fechar de 17px era o menor alvo do leitor: 32px é o mínimo do toque */
.notaflut-h .lnk{min-width:32px;min-height:32px;display:inline-flex;align-items:center;
  justify-content:center;margin:-6px -6px -6px 0}
.selbar .selrot{color:rgba(255,255,255,.7);font-size:12px;padding:0 var(--s2)}
.selbar .pt{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.selbar .pt.amarelo{background:#f7e08a}.selbar .pt.rosa{background:#f6c9d8}.selbar .pt.verde{background:#c8e6bd}
.catdst{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:999px;align-self:flex-start;color:#3a3128}
.catdst.amarelo{background:#f7e08a}.catdst.rosa{background:#f6c9d8}.catdst.verde{background:#c8e6bd}
.grpcap{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:var(--s3) 0 var(--s1);border-top:1px solid var(--line-2);margin-top:var(--s2)}
.grpcap:first-child{border:none;margin:0}
.filtroanot{display:flex;gap:5px;align-items:center;padding:var(--s2) 0}
.fa{font-size:11.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
@media (max-width:768px){.fa{padding:9px 14px}.acts .lnk{min-height:32px;display:inline-flex;align-items:center}}
.fa:hover{background:var(--bg-2)}
.fa.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.rnum{background:var(--bg-2);border-radius:var(--r1);padding:var(--s3);text-align:center}
.rnum b{display:block;font-size:20px;font-weight:650}
.rnum span{font-size:11px;color:var(--ink-3)}
.ideia{border:1px solid var(--line-2);border-radius:var(--r1);padding:var(--s3);background:#fff;
  display:flex;flex-direction:column;gap:var(--s2)}
.ideia .itxt{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.ideia .ipass{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-3);text-align:left}
.ideia .ipass:hover{color:var(--acc)}

/* ═══ BUSCA GLOBAL ═══ */
.velo{position:fixed;inset:0;background:rgba(26,25,23,.24);z-index:80}
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,92%);z-index:81;background:#fff;

/* notas na margem: alinhadas ao parágrafo de origem, sem mexer na coluna de texto */
/* ════════════════════════════════════════════════════════════
   O BREAKPOINT DERIVADO DA LEGIBILIDADE
   1180px era herdado. Aqui ele é calculado: a margem só existe
   enquanto a coluna mantém 60 caracteres e a nota mantém 40.
   ════════════════════════════════════════════════════════════ */
var MIN_CH_NOTA=40,PAD_LEITOR=24,GUTTER=32,MARGEM_W=300;
function larguraDeChars(n,px,fam){
 var p=document.createElement("span");
 p.style.cssText="visibility:hidden;white-space:nowrap;position:absolute;font:"+px+"px "+(fam||"serif");
 p.textContent="abcdefghijklmnopqrstuvwxyz";document.body.appendChild(p);
 var w=p.getBoundingClientRect().width/26;p.remove();return Math.round(w*n)}
function limiarMargem(){
 /* usa a coluna REALMENTE em uso, não uma mínima teórica: com a coluna em 760
    a margem exige mais tela do que com 560, e o número precisa dizer isso */
 var col=+v("largura")||640,chave=col;
 if(st.limiarChave===chave)return st.limiar;
 var notaMin=larguraDeChars(MIN_CH_NOTA,12.5,"system-ui"),respiro=2*PAD_LEITOR+16;
 st.limiarChave=chave;st.limiar=col+GUTTER+Math.max(MARGEM_W,notaMin)+respiro;
 st.limiarPartes={coluna:col,gutter:GUTTER,nota:Math.max(MARGEM_W,notaMin),respiro:respiro};
 return st.limiar}
/* largura real da barra de rolagem do corpo do leitor — o bleed depende dela */
function medirScrollbar(){
 var b=document.getElementById("lbody");if(!b)return;
 document.documentElement.style.setProperty("--sbw",(b.offsetWidth-b.clientWidth)+"px")}
/* Três degraus, do melhor ao pior:
   1. texto imóvel  — sobra vazio à direita para a margem inteira
   2. apertada      — o conjunto se centra; o texto anda, mas metade do que andaria
   3. sem margem    — abaixo do limiar, as notas voltam para o painel           */
function larguraInterna(){return larguraTela()-2*PAD_LEITOR-16}
function cabeTextoImovel(col){return larguraInterna()>=col+2*(GUTTER+MARGEM_W)}

function desenharMargem(){

 var base=m.getBoundingClientRect().top;   /* origem do posicionamento absoluto */
 var comNota=st.dst.filter(function(d){return d.nota});
 /* posição ideal de cada nota = topo do trecho de origem */
 var itens=comNota.map(function(d){
  var mk=null;document.querySelectorAll("#lcol mark").forEach(function(x){if(x.dataset.k===d.k)mk=x});
  var el=mk||document.querySelector('[data-p="'+d.pid+'"]');
  return el?{d:d,ideal:el.getBoundingClientRect().top-base}:null})
  .filter(Boolean).sort(function(a,b){return a.ideal-b.ideal});
 /* empilha usando a ALTURA REAL medida, não um passo fixo */
 var fim=-1e9,grupos=[];
 itens.forEach(function(it){
  var y=Math.max(it.ideal,fim+10);
  it.y=y;it.desvio=y-it.ideal;
  /* quando o empurrão passa do limite, a nota entra num grupo colapsado */
  if(it.desvio>DESVIO_MAX){
   var g=grupos[grupos.length-1];
   if(g&&it.ideal-g.ideal<260)g.itens.push(it);
   else grupos.push({ideal:it.ideal,itens:[it]});
   return}
  fim=y+alturaEstimada(it.d)});
 var html=itens.filter(function(it){return it.desvio<=DESVIO_MAX}).map(function(it){
  var d=it.d,ativa=st.nota===d.k,
   fio=it.desvio>26?'<span class="fio" style="height:'+Math.round(it.desvio)+'px;top:-'+Math.round(it.desvio)+'px"></span>':'',
   pos='style="top:'+Math.round(it.y)+'px"',
   trecho='<span class="mgtrecho">'+esc(textoDoId(d.k).slice(0,42))+'…</span>';
  /* a nota ativa vira editor no próprio lugar — a margem não é só leitura */
  if(ativa)return'<div class="notamg ativa" '+pos+'>'+fio+trecho+
   '<textarea id="notatxt" class="mgentrada" rows="5" placeholder="O que este trecho te fez pensar?">'+
   esc(d.nota||"")+'</textarea>'+
   '<div class="mgacts"><button class="btn sm" data-a="salvarnota">Salvar</button>'+
   (d.nota?'<button class="lnk" data-a="conhecimento" data-id="'+d.k+'">Ao conhecimento →</button>':"")+
   '<button class="lnk" data-a="fecharnota">fechar</button></div></div>';
  return'<button class="notamg" data-a="anotarid" data-id="'+d.k+'" '+
   'aria-describedby="mk-'+d.k+'" '+pos+'>'+fio+trecho+
   '<span class="mgnota">'+esc(d.nota)+'</span></button>'}).join("");
 /* Modelo B como escape: grupo colapsado em marcador */
 html+=grupos.map(function(g){
  return'<button class="mgrupo" data-a="grupomg" data-ks="'+g.itens.map(function(i){return i.d.k}).join(",")+
   '" style="top:'+Math.round(g.ideal)+'px">'+g.itens.length+' notas aqui</button>'}).join("");
 m.innerHTML=html}

function rotuloEl(e){return"<"+e.tagName.toLowerCase()+(e.className?"."+String(e.className).split(" ")[0]:"")+">"}

 function rgb(s){var m=String(s).match(/[\d.]+/g);return m?m.map(Number):null}
 function lum(c){var a=c.slice(0,3).map(function(v){v/=255;
  return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*a[0]+.7152*a[1]+.0722*a[2]}
 function fundoDe(el){var e=el;while(e&&e!==document.documentElement){
   var c=rgb(getComputedStyle(e).backgroundColor);
   if(c&&(c.length<4||c[3]>.95))return c;e=e.parentElement}return[255,255,255]}
 function razao(f,b){var L1=lum(f),L2=lum(b);
  return +(((Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05)).toFixed(2))}
 var r={contraste:[],html:[],cortado:[],alvo:[],transbordo:false},toque=larguraTela()<768;
 [].slice.call(document.querySelectorAll("body *")).forEach(function(e){
  var cs=getComputedStyle(e);
  if(cs.visibility==="hidden"||cs.display==="none")return;
  var bb=e.getBoundingClientRect();if(!bb.width||!bb.height)return;
  var txt=[].slice.call(e.childNodes).filter(function(n){return n.nodeType===3&&n.textContent.trim()})
   .map(function(n){return n.textContent.trim()}).join(" ");
  if(txt&&+cs.opacity>=.5){
   var fg=rgb(cs.color),bg=fundoDe(e);
   if(fg&&fg.length>3&&fg[3]<1)fg=fg.slice(0,3).map(function(v,i){return v*fg[3]+bg[i]*(1-fg[3])});
   var px=parseFloat(cs.fontSize),gr=px>=24||(px>=18.66&&+cs.fontWeight>=700),
    rz=razao(fg,bg),min=gr?3:4.5;
   if(rz<min)r.contraste.push(rotuloEl(e)+" — "+rz+":1, mínimo "+min)}
  if(e.tagName==="BUTTON"||e.tagName==="A"){
   var b2=e.querySelector("div,p,blockquote,ul,ol,section,article,h1,h2,h3,table,button");
   if(b2)r.html.push(rotuloEl(e)+" contém &lt;"+b2.tagName.toLowerCase()+"&gt;")}
  /* scrollWidth conta pseudo-elemento absoluto e dá falso positivo — a régua
     de capítulo inflava .lcap para 1073px sem cortar texto nenhum. Range mede
     só o conteúdo real. */
  /* elemento inline tem clientWidth 0 e daria falso positivo em tudo:
     a checagem só faz sentido em caixa de bloco, que é quem corta */
  if(txt&&e.clientWidth>0&&cs.display.indexOf("inline")!==0&&
     cs.overflowX!=="auto"&&cs.overflowX!=="scroll"&&
     cs.textOverflow!=="ellipsis"&&cs.whiteSpace!=="nowrap"){
   var rg=document.createRange();rg.selectNodeContents(e);
   var lt=rg.getBoundingClientRect().width;
   if(lt>e.clientWidth+2)r.cortado.push(rotuloEl(e)+" — texto de "+Math.round(lt)+"px em "+e.clientWidth+"px")}

     versão anterior desta checagem não os enxergava */
  if(toque&&(e.tagName==="BUTTON"||e.tagName==="A"||e.getAttribute("role")==="button")&&
     bb.height<30&&!e.closest("#lab"))
   r.alvo.push(rotuloEl(e)+" — "+Math.round(bb.height)+"px de altura")});
 r.transbordo=document.documentElement.scrollWidth>larguraTela()+1;
 ["contraste","html","cortado","alvo"].forEach(function(k){
  r[k]=r[k].filter(function(v,i,a){return a.indexOf(v)===i})});

   ["Rede com nó legível em vez de bolinha","candidato","O grafo comum esconde o nó atrás do hover: a bolinha não carrega informação. Aqui o nó é o objeto — capa e título, começo da nota, a palavra. Custa espaço (24 nós em 740×760) e em troca se lê parado. Layout determinístico: o mesmo mapa entre visitas. Falta testar com 50+ ideias, onde o espaço deixa de sobrar."],
   ["Conhecimento organizado por assunto","provavel","<b>Correção de rota.</b> A área abria numa lista cronológica e era isso que parecia: várias notas. O assunto e as conexões ficavam atrás de um clique. Agora o assunto é a unidade e o que se acumulou nele aparece de saída."],

   ["Conhecimento recebe só o que foi levado","candidato","<b>A tese da área.</b> Destacar não manda nada; a ponte no fim da nota manda. A vista Por livro mostra a diferença sem explicar — “3 de 9 anotações levadas”. Falta saber se a pessoa entende a separação sem ler o texto do estado vazio."],
   ["Relações determinísticas por tag","aceito","Veio do mapa de capacidades, não de suposição: <i>“começar determinístico por tags; não prometer IA”</i>. Implementado assim, com as tags que justificam cada relação visíveis e confirmar/rejeitar em toda uma. Verificado: aceitar num item vale no outro extremo."],
   ["Busca do dossiê por radical","provavel","A versão literal falhava em “por que guardo demais”, com uma nota sobre isso no acervo. Cortar as duas últimas letras resolve — 8 de 8 perguntas, incluindo o zero correto para “blockchain”. Não sabe sinônimo, e a tela diz isso."],
   ["Canvas espacial no Conhecimento","rejeitado","Não implementado, de propósito. O mapa marca risco <b>alto</b> e pede modelo espacial e comportamento acessível decididos antes. O mundo contínuo já existe no <code>canvas-motion</code> — duplicá-lo aqui criaria uma quarta exploração."],
   ["Breakpoint de 1180px","rejeitado","<b>Substituído por um limiar derivado.</b> Era herdado e conservador demais: desligava a margem em telas onde ela ainda cabia. Agora sai da tipografia em uso — 60 caracteres de coluna + gutter + 40 de nota + respiro. Medido: <b>854px no corpo 16, 1004px no corpo 21</b>."],
   ["Grid de quatro faixas","candidato","Medido no doc.cc e implementado como alternativa B, com o baseline intacto. As faixas são proporções da coluna (0,93× / 1,00× / 1,17× / bleed) e acompanham a largura de leitura — verificado em 640px e em 560px. Falta ler um capítulo inteiro nele para saber se o escape ajuda ou interrompe."],
   ["Bleed na fronteira de capítulo","provavel","Resolve de lado um problema que estava aberto: na rolagem contínua a passagem de capítulo era fraca. A faixa atravessa a tela e carrega a posição no livro. Recua sozinha quando a margem de notas está ligada."],
   ["Medida de 50 caracteres do DOC","rejeitado","Não trazida. É ritmo de ensaio curto — retorno de linha a cada oito palavras. Os 71 caracteres do Mekora ficam no meio da faixa de Bringhurst e servem melhor a 300 páginas."],
   ["Recuo de parágrafo e papéis tipográficos","aberto","Medidos no DOC e documentados, fora do escopo desta iteração. O recuo tem consequência técnica: os 22px entre parágrafos somam 396px de altura sem caractere nenhum, afastando o progresso visual do semântico."]].map(function(d){

  st.de=st.leitor?"leitor":st.rota==="perfil"?"perfil":"lib";

  irCfg(c,st.de);

 else if(a==="voltar"){if(st.de==="leitor"){st.rota="lib";st.leitor=true}

 else if(a==="ir"){st.cat=el.dataset.c;st.hit=el.dataset.k||null;st.catAberta=true;

 else if(a==="fechacat"){st.catAberta=false}
 else if(a==="ler"){st.leitor=true;st.ctx=null;st.chromeVis=true;st.painel=null;st.sel=null;st.nota=null}
 else if(a==="fecharleitor"){st.leitor=false;st.ctx=null;st.painel=null;st.sel=null;st.nota=null}

 else if(a==="destacar"||a==="destacarcor"||a==="destacarcat"){

/* ── seleção real: converte a Range em offsets de caractere do parágrafo ── */
function offsetsDaSelecao(p){
 var s=window.getSelection();if(!s||!s.rangeCount)return null;
 var r=s.getRangeAt(0);
 if(!p.contains(r.startContainer)||!p.contains(r.endContainer))return null;
 var pre=document.createRange();pre.selectNodeContents(p);pre.setEnd(r.startContainer,r.startOffset);
 var ini=pre.toString().length,fim=ini+r.toString().length;
 return fim>ini?{ini:ini,fim:fim}:null}
$("app").addEventListener("mouseup",function(e){
 if(!st.leitor||st.nota||st.corrigindo)return;
 var s=window.getSelection();if(!s||!s.toString().trim())return;
 var p=e.target.closest("[data-p]");if(!p)return;
 var o=offsetsDaSelecao(p);if(!o)return;
 st.pendente={pid:p.dataset.p,ini:o.ini,fim:o.fim};st.sel=null;
 marcar("selecionar");draw()});
/* ── progresso real, por peso de texto lido ── */
/* ════════════════════════════════════════════════════════════
   POSIÇÃO LÓGICA × POSIÇÃO VISUAL
   A âncora {bloco, offset de caractere} é a fonte da verdade.
   O scroll em pixels é consequência dela, nunca o contrário.
   Só a rolagem do usuário reescreve a âncora; qualquer mudança de
   layout reposiciona o scroll A PARTIR da âncora preservada.
   ════════════════════════════════════════════════════════════ */
var PONTO_LEITURA=0.32; /* onde no viewport consideramos "a linha que se lê" */
function ancoraDaGeometria(){
 var body=document.getElementById("lbody");if(!body)return null;
 var alvo=body.getBoundingClientRect().top+body.clientHeight*PONTO_LEITURA;
 var ps=[].slice.call(document.querySelectorAll("#lcol p[data-p]"));
 for(var i=0;i<ps.length;i++){var r=ps[i].getBoundingClientRect();
  if(r.bottom>=alvo){
   var b=blocoPorId(ps[i].dataset.p);
   var frac=Math.min(1,Math.max(0,(alvo-r.top)/Math.max(1,r.height)));
   /* converte fração geométrica em offset de caractere — este sobrevive ao reflow */
   return{id:ps[i].dataset.p,off:Math.round(frac*(b?b.n:0))}}}
 if(ps.length){var ub=blocoPorId(ps[ps.length-1].dataset.p);
  return{id:ps[ps.length-1].dataset.p,off:ub?ub.n:0}}
 return null}
function progressoDaAncora(a){
 if(!a)return 0;
 return Math.min(1,Math.max(0,((ACUM[a.id]||0)+a.off)/TOTAL_CHARS))}
function calcProgresso(origem){
 var body=document.getElementById("lbody");if(!body)return;
 /* a âncora só muda quando quem move é o usuário */
 if(origem!=="layout"||!st.ancora){var nova=ancoraDaGeometria();if(nova)st.ancora=nova}
 if(!st.ancora)return;
 if(st.algo==="semantico")st.prog=progressoDaAncora(st.ancora);
 else{var max0=Math.max(1,body.scrollHeight-body.clientHeight);
  st.prog=Math.min(1,Math.max(0,body.scrollTop/max0))}
 /* extremidades: heurística visual deliberada, para o fim do livro marcar 100% */
 var maxScroll=Math.max(1,body.scrollHeight-body.clientHeight);
 if(body.scrollTop<=2)st.prog=0;
 else if(body.scrollTop>=maxScroll-2)st.prog=1;
 var b=blocoPorId(st.ancora.id);st.cap=b?b.ci:0;
 var barra=document.getElementById("barra");
 if(barra)barra.style.width=Math.round(st.prog*100)+"%";
 var txt=document.getElementById("progtxt");
 if(txt)txt.textContent=textoProgresso();
 if(st.lab&&st.labSec==="scroll")drawLab()}
/* recoloca o scroll para que a âncora volte ao ponto de leitura */
function reposicionarPelaAncora(){
 var a=st.ancora,body=document.getElementById("lbody");if(!a||!body)return;
 var el=document.querySelector('[data-p="'+a.id+'"]');if(!el)return;
 var b=blocoPorId(a.id),frac=b&&b.n?Math.min(1,a.off/b.n):0;
 body.scrollTop=el.offsetTop+frac*el.offsetHeight-body.clientHeight*PONTO_LEITURA;
 calcProgresso("layout")}
/* restaura a posição pela âncora de parágrafo, não por pixels */
function restaurarPos(){
 var a=st.pos["livro"];if(!a)return;
 st.ancora={id:a.id,off:a.off};
 reposicionarPelaAncora()}
function guardarPos(){if(st.ancora)st.pos["livro"]={id:st.ancora.id,off:st.ancora.off}}

addEventListener("keydown",function(e){
 /* destaque e nota de margem operáveis por teclado, não só por mouse */
 if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('mark[data-a],.notamg,.mgrupo,.rn')){
  /* <g> de SVG não tem .click() em todo navegador: dispara o evento na mão */
  e.preventDefault();
  e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
 if(e.key==="ArrowRight"&&e.target.matches&&e.target.matches("mark[data-a]")){
  var nt=document.querySelector('.notamg[data-id="'+e.target.dataset.k+'"]');
  if(nt){e.preventDefault();nt.focus()}return}
 if(e.key==="ArrowLeft"&&e.target.matches&&e.target.matches(".notamg")){
  var mk=document.getElementById("mk-"+e.target.dataset.id);
  if(mk){e.preventDefault();mk.focus()}return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();st.pal="";st.palq="";draw()}
 else if(e.key==="Escape"){if(st.pal!==null)st.pal=null;else if(st.ctx)st.ctx=null;
  else if(st.menu)st.menu=false;else if(st.leitor)st.leitor=false;draw()}});
/* redimensionar também reflui: a âncora manda, o pixel obedece */
addEventListener("resize",function(){
 if(!st.leitor)return;
 clearTimeout(st.rz);st.rz=setTimeout(function(){
  /* a largura muda os três degraus da margem: precisa redesenhar, não só reposicionar */
  if(st.mNota==="M")draw();
  reposicionarPelaAncora();
  if(st.mNota==="M")desenharMargem()},140)});

  /* cenDens gera a carga de anotações em vez de listá-la no config */

 var c=e.target.closest("[data-chr]");if(c){st.chrome=c.dataset.chr;st.chromeVis=true;

/* BLOCOS já existe aqui: só agora dá para ancorar as anotações iniciais */

draw();
})();
