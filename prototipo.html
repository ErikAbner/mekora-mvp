<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · protótipo navegável</title>
<style>
/* ═══════════════ SISTEMA ═══════════════
   escala de espaço  4 8 12 16 24 32 48
   raio              r1 4 (controles) · r2 8 (superfícies) · 999 (pílulas)
   altura de controle  h1 32 (compacto) · h2 38 (padrão)
   tipo              11 12 13 15 18 22 30
   ═══════════════════════════════════════ */
:root{
  --canvas:#F1EEE8;--card:#FCFBF8;--ink:#141311;--ink-2:#55504A;--ink-3:#8A857C;
  --rule:#C6C0B1;--rule-2:#E4E0D6;--bench-2:#E7E3D9;--bench-3:#D2CCBE;
  --accent:#C33B1E;--good:#4A6B45;--warn:#A8791F;--crit:#C33B1E;--slab:#141311;--shadow:20,19,17;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r1:4px;--r2:8px;--h1:32px;--h2:38px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --tr:.14s;
}
[data-motion="off"] *{transition:none!important;animation:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0E0D0C;color:var(--ink);font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══ ANDAIME (fora do produto) ═══ */
.rig{background:#0E0D0C;color:#8B857A;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);
  height:38px;flex:0 0 38px;font-family:var(--mono);font-size:10px;border-bottom:1px solid #262320}
.rig b{color:#EDE8DE;font-weight:400}
.rig .sep{width:1px;height:15px;background:#2B2825;flex:0 0 1px}
.rig .grp{display:flex;align-items:center;gap:var(--s2);white-space:nowrap}
.rig button{font-family:var(--mono);font-size:10px;color:#8B857A;padding:5px 10px;border-radius:var(--r1);
  border:1px solid #2B2825;white-space:nowrap}
.rig button:hover{color:#EDE8DE;border-color:#454039}
.rig button[aria-pressed="true"]{background:#EDE8DE;color:#141311;border-color:#EDE8DE}
.rig .spacer{flex:1}
.rig .tag{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){.rig .tag{display:none}}
@media (max-width:620px){.rig>b,.rig .sep{display:none}
  .rig .grp:nth-of-type(2){display:none}
  .rig{gap:var(--s2);padding:0 var(--s2);overflow-x:auto;scrollbar-width:none}
  .rig::-webkit-scrollbar{display:none}}

/* ═══ PALCO ═══ */
.stage{flex:1;min-height:0;display:flex;background:var(--canvas);position:relative;overflow:hidden}
.app{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);position:relative}
.app[data-w="pequena"]{max-width:430px;margin:0 auto;border-left:1px solid var(--rule);
  border-right:1px solid var(--rule)}

/* ═══ TOPO ═══ */
.top{display:flex;align-items:center;gap:var(--s1);padding:0 var(--s5);height:56px;flex:0 0 56px;
  border-bottom:1px solid var(--rule-2)}
.top .brand{font-family:var(--serif);font-size:18px;letter-spacing:-.01em;margin-right:var(--s4)}
.top nav{display:flex;gap:2px;min-width:0}
.top nav button{font-size:13px;color:var(--ink-3);padding:7px 12px;border-radius:var(--r1);white-space:nowrap}
.top nav button:hover{background:var(--bench-3);color:var(--ink)}
.top nav button.on{color:var(--ink);font-weight:600}
.top .spacer{flex:1}
.srch{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);border-radius:999px;
  padding:0 var(--s3);height:var(--h1);color:var(--ink-3);font-size:12.5px;min-width:0;max-width:230px;flex:1}
.srch:hover{border-color:var(--ink-3)}
.srch .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--rule);border-radius:3px;padding:1px 4px}
.avbtn{width:var(--h1);height:var(--h1);border-radius:50%;background:var(--ink);color:var(--canvas);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 var(--h1)}
.avbtn:hover{background:var(--accent)}
@media (max-width:640px){.top{padding:0 var(--s4)}.top .brand{display:none}.srch .txt,.srch .kbd{display:none}
  .srch{max-width:var(--h1);flex:0 0 var(--h1);justify-content:center;padding:0}}

.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.libwrap{flex:1;min-height:0;display:flex;width:100%}
.pad{padding:var(--s6) var(--s7) var(--s7)}
.app[data-w="pequena"] .pad{padding:var(--s5) var(--s4) var(--s6)}
@media (max-width:700px){.pad{padding:var(--s5) var(--s4) var(--s6)}}
.col{max-width:720px;margin:0 auto}

h1.t{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.015em;margin:0 0 var(--s1)}
.sub{font-size:13px;color:var(--ink-3);margin:0 0 var(--s5);line-height:1.5}
h2.s{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:var(--s6) 0 var(--s1);padding-bottom:var(--s2);border-bottom:1px solid var(--ink)}
h2.s:first-child{margin-top:0}

/* ═══ LINHA DE AJUSTE ═══ */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s5);align-items:center;
  padding:var(--s4) 0;border-bottom:1px solid var(--rule-2);position:relative}
.row:last-child{border-bottom:none}
.lb{font-size:14px;font-weight:500;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;line-height:1.35}
.ds{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:var(--s1);max-width:52ch}
.row.chg::before{content:"";position:absolute;left:-14px;top:22px;width:6px;height:6px;border-radius:50%;
  background:var(--accent)}
.revert{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:underline}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:var(--s3)}}

.badge{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:2px 7px;color:var(--ink-3);white-space:nowrap}
.badge.dev{border-color:var(--ink-3)}
.badge.sync{border-color:var(--good);color:var(--good)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.new{border-color:var(--good);color:var(--good)}

/* ═══ CONTROLES ═══ */
.sw{width:40px;height:23px;border-radius:999px;background:var(--rule);position:relative;flex:0 0 40px;
  display:block;transition:background var(--tr)}
.sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:var(--card);
  box-shadow:0 1px 3px rgba(var(--shadow),.3);transition:left var(--tr)}
.sw.on{background:var(--ink)}
.sw.on i{left:19.5px}
.sw[disabled],.sw.off{opacity:.4;pointer-events:none}
.segc{display:flex;border:1px solid var(--rule);border-radius:var(--r1);overflow:hidden;height:var(--h1)}
.segc button{padding:0 var(--s3);font-size:12.5px;border-right:1px solid var(--rule);white-space:nowrap;
  display:flex;align-items:center}
.segc button:last-child{border-right:none}
.segc button:hover{background:var(--bench-3)}
.segc button.on{background:var(--ink);color:var(--canvas)}
select.sel{border:1px solid var(--rule);border-radius:var(--r1);padding:0 var(--s2);height:var(--h1);
  font-size:12.5px;background:var(--card);color:var(--ink);font-family:var(--sans)}
.stepc{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r1);overflow:hidden;
  height:var(--h1)}
.stepc button{padding:0 var(--s3);font-size:14px;border-right:1px solid var(--rule);display:flex;align-items:center}
.stepc button:last-child{border:none}
.stepc button:hover{background:var(--bench-3)}
.stepc .v{padding:0 var(--s2);font-family:var(--mono);font-size:12.5px;min-width:48px;text-align:center;
  border-right:1px solid var(--rule);display:flex;align-items:center;justify-content:center;height:100%}
.inp{border:1px solid var(--rule);border-radius:var(--r1);padding:0 var(--s3);height:var(--h2);font-size:13px;
  background:var(--card);color:var(--ink);font-family:inherit;min-width:240px;max-width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.inp.err{border-color:var(--crit)}
.err-msg{font-size:12px;color:var(--crit);margin-top:var(--s1);display:flex;gap:6px;align-items:center}
.btn{font-size:13px;font-weight:600;background:var(--ink);color:var(--canvas);border-radius:999px;
  padding:0 var(--s5);height:var(--h2);display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;transition:background var(--tr)}
.btn:hover{background:var(--accent);color:#F1EEE8}
.btn.sec{background:none;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.sec:hover{background:var(--bench-3);color:var(--ink)}
.btn.dan{background:var(--crit);color:#F1EEE8}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.lnk{font-size:13px;text-decoration:underline;color:var(--ink)}
.lnk:hover{color:var(--accent)}
.lnk.dan{color:var(--crit)}
.lnk.sm{font-size:12px}
.acts{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}

/* ═══ SUPERFÍCIES ═══ */
.strip{display:flex;align-items:center;gap:var(--s3);font-size:13px;padding:var(--s3) var(--s4);
  border-radius:var(--r1);background:var(--bench-2);border:1px solid var(--rule-2);color:var(--ink-2);
  margin:var(--s4) 0}
.strip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--good)}.d-err{background:var(--crit)}.d-off{background:var(--ink-3)}
.d-wait{background:var(--warn)}
.strip.err{border-color:var(--crit)}
.strip .spc{flex:1}
.empty{text-align:center;padding:var(--s7) var(--s4);color:var(--ink-3)}
.empty p{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.6;margin:0 0 var(--s4);
  max-width:44ch;margin-inline:auto}

/* ═══ CONTA ═══ */
.acct{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4) 0;border-bottom:1px solid var(--rule-2)}
.acct .av{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--canvas);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.acct .nm{font-size:15px;font-weight:600}
.acct .em{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.dev-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4) 0;border-bottom:1px solid var(--rule-2)}
.dev-row .dn{font-size:13.5px;font-weight:500;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.dev-row .dm{font-size:12px;color:var(--ink-3);margin-top:3px}
.here{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--good);
  border:1px solid var(--good);border-radius:999px;padding:2px 7px}

/* ═══ ÍNDICE ═══ */
.idx{display:flex;flex-direction:column}
.idx button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4) 0;border-bottom:1px solid var(--rule-2);width:100%}
.idx button:hover .nm{color:var(--accent)}
.idx .nm{font-size:15px;font-weight:500}
.idx .dc{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.idx .ct{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ═══ BIBLIOTECA ═══ */
.libbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5)}
.libbar .ttl{flex:1;min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s5)}
.chip{font-size:12.5px;border:1px solid var(--rule);border-radius:999px;padding:0 var(--s3);height:var(--h1);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:var(--bench-3)}
.chip.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.6}
.resume{display:flex;gap:var(--s4);align-items:center;background:var(--bench-2);border-radius:var(--r2);
  padding:var(--s4);margin-bottom:var(--s5)}
.resume .cv{width:52px;flex:0 0 52px;aspect-ratio:.72;border-radius:3px;background:var(--paper,#F6F3EC);
  box-shadow:0 3px 10px rgba(var(--shadow),.18)}
.resume .info{flex:1;min-width:0}
.resume .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.resume .t{font-size:15px;font-weight:600;margin-top:3px}
.resume .m{font-size:12.5px;color:var(--ink-3);margin-top:3px}

.shelf{display:grid;gap:var(--s5);grid-template-columns:repeat(auto-fill,minmax(var(--cw,146px),1fr))}
.shelf.lista{grid-template-columns:1fr;gap:0}
.bk{display:flex;flex-direction:column;gap:var(--s2);cursor:pointer;position:relative;padding-top:13px;
  text-align:left;border-radius:var(--r1)}
.bk .cv{position:relative;width:100%;padding-bottom:139%;border-radius:5px;overflow:hidden;
  background:var(--paper,#F6F3EC);box-shadow:0 5px 16px rgba(var(--shadow),.16);
  transition:transform var(--tr),box-shadow var(--tr)}
.bk:hover .cv{transform:translateY(-3px);box-shadow:0 12px 26px rgba(var(--shadow),.24)}
.bk[aria-selected="true"] .cv{outline:2px solid var(--ink);outline-offset:3px}
.bk .cvin{position:absolute;inset:0;display:flex;flex-direction:column}
.bk .cvt{padding:9% 9% 0;font-size:calc(var(--cw,146px)*.085);font-weight:700;line-height:1.15;color:#141311}
.bk .cva{flex:1;margin:6% 8% 0;background-image:radial-gradient(var(--tone,#141311) 12%,transparent 13%);
  background-size:15% 15%;-webkit-mask-image:linear-gradient(to bottom,transparent,#000);
  mask-image:linear-gradient(to bottom,transparent,#000)}
.bk .cvf{background:#141311;height:6%}
.bk .tab{position:absolute;top:0;right:11%;background:var(--slab);color:#F1EEE8;font-size:10px;font-weight:700;
  line-height:1;padding:4px 7px 9px;border-radius:3px 3px 0 0;z-index:2;transition:background var(--tr)}
.bk .tab:hover{background:var(--accent)}
.bk .prg{position:absolute;left:0;bottom:0;height:3px;background:#F1EEE8}
.bk .done{position:absolute;right:6px;bottom:6px;width:17px;height:17px;border-radius:50%;background:var(--slab);
  color:#F1EEE8;font-size:10px;display:flex;align-items:center;justify-content:center}
.bk .t{font-size:13px;font-weight:600;line-height:1.25}
.bk .a{font-size:11.5px;color:var(--ink-3)}
.bk .nt{font-size:11.5px;color:var(--ink-3);font-family:var(--serif);font-style:italic;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .hov{position:absolute;left:7px;right:7px;bottom:7px;display:flex;gap:5px;opacity:0;
  transition:opacity var(--tr);z-index:3}
.bk:hover .hov,.bk:focus-within .hov{opacity:1}
.bk .hov button{flex:1;text-align:center;font-size:11px;font-weight:600;background:var(--slab);color:#F1EEE8;
  border-radius:999px;padding:6px 0;box-shadow:0 3px 10px rgba(20,19,17,.34)}
.bk .hov button.g{flex:0 0 26px;background:var(--card);color:var(--ink);letter-spacing:1px}
.bk .hov button:hover{background:var(--accent);color:#F1EEE8}
.bk.list{flex-direction:row;align-items:center;gap:var(--s4);padding:var(--s3) var(--s2);
  border-bottom:1px solid var(--rule-2)}
.bk.list .cv{width:44px;flex:0 0 44px;padding-bottom:61px}
.bk.list .tab,.bk.list .hov{display:none}
.bk.list .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bk.list .side{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* inspector */
.insp{width:320px;flex:0 0 320px;border-left:1px solid var(--rule-2);background:var(--card);
  display:flex;flex-direction:column;min-height:0}
.insp-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--rule-2)}
.insp-h .lbl{flex:1}
.insp-tabs{display:flex;border-bottom:1px solid var(--rule-2)}
.insp-tabs button{flex:1;padding:var(--s3) 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);text-align:center}
.insp-tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.insp-b{padding:var(--s4);overflow-y:auto;display:flex;flex-direction:column;gap:var(--s3);flex:1}
.insp-b h3{margin:0;font-family:var(--sans);font-size:16px;font-weight:700;line-height:1.25}
.insp-b .meta{font-size:12.5px;color:var(--ink-3)}
.pbar{height:3px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink)}
.note{border-left:2px solid var(--rule-2);padding-left:var(--s3);font-family:var(--serif);font-style:italic;
  font-size:13px;line-height:1.55;color:var(--ink-2)}
.note b{display:block;font-family:var(--mono);font-style:normal;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;font-weight:400}
.tagl{display:flex;gap:5px;flex-wrap:wrap}
.tagl span{font-size:11px;background:var(--bench-2);border-radius:999px;padding:3px 9px;color:var(--ink-2)}
@media (max-width:860px){.insp{position:absolute;right:0;top:0;bottom:0;z-index:30;
  box-shadow:-14px 0 40px rgba(var(--shadow),.18)}}

/* ═══ LEITOR ═══ */
.reader{display:flex;flex-direction:column;height:100%;min-height:0}
.rtop{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:52px;flex:0 0 52px;
  border-bottom:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3)}
.rtop .ti{color:var(--ink);font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rtop .spc{flex:1}
.rtop button.ic{width:var(--h1);height:var(--h1);border-radius:var(--r1);display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--ink-2)}
.rtop button.ic:hover{background:var(--bench-3);color:var(--ink)}
.rtop button.ic.on{background:var(--ink);color:var(--canvas)}
.rmain{flex:1;min-height:0;display:flex}
.rscroll{flex:1;min-height:0;overflow-y:auto;background:var(--rbg,var(--card))}
.rbody{max-width:var(--rw,620px);margin:0 auto;padding:var(--s7) var(--s6) 80px;
  font-family:var(--rf,var(--serif));color:var(--rfg,var(--ink))}
.rbody .ch{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:var(--s5)}
.rbody p{margin:0 0 1em}
.rbody .hl{background:var(--hl,#F2E07A);padding:2px 0;border-radius:2px;cursor:pointer}
.rbody .sel{background:rgba(195,59,30,.16);border-radius:2px}
.rbar{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:56px;flex:0 0 56px;
  border-top:1px solid var(--rule-2);background:var(--canvas);flex-wrap:wrap}

 if(st.wiz&&(key==="mail"||key==="sender"))st.wiz[key]=e.target.value;
 else if(key==="pwdo"||key==="pwdn"){st.pwd[key==="pwdo"?"o":"n"]=e.target.value;
   var p3=e.target.selectionStart;draw();var n3=document.querySelector('[data-f="'+key+'"]');
   if(n3){n3.focus();n3.setSelectionRange(p3,p3)}return}
 else st[key]=e.target.value;
 if(key==="ksender")mark("fix")});
/* seleção de texto no leitor */
$("app").addEventListener("mouseup",function(e){
 if(st.route.v!=="reader")return;
 var s=window.getSelection();
 if(s&&String(s).trim().length>8&&e.target.closest(".rbody")){st.selText=true;mark("seltxt");draw()}});
$("app").addEventListener("keydown",function(e){
 if(e.target.id==="palq"){var rs=res();
  if(e.key==="ArrowDown"){e.preventDefault();st.palsel=Math.min(rs.length-1,st.palsel+1);draw()}
  else if(e.key==="ArrowUp"){e.preventDefault();st.palsel=Math.max(0,st.palsel-1);draw()}
  else if(e.key==="Enter"&&rs[st.palsel]){e.preventDefault();var r2=rs[st.palsel];st.pal=null;
   if(r2.bk!==undefined){go("lib");st.sel=r2.bk;st.inspTab=r2.q?"notas":"livro"}
   else if(r2.rt){go(r2.rt);if(r2.av)st.acctView=r2.av}
   else{go("sec",r2.sec);if(r2.k&&SM[r2.k].adv)st.adv=true}
   mark("land");toast("Achou: "+r2.lb);draw()}
  else if(e.key==="Escape"){st.pal=null;draw()}
  return}
 var cell=e.target.closest(".bk");
 if(cell&&st.route.v==="lib"){
  var L=books(),pos=L.findIndex(function(b){return b.i===+cell.dataset.i});
  var cols=getComputedStyle(document.querySelector(".shelf")).gridTemplateColumns.split(" ").length||1;
  var nx=null;
  if(e.key==="ArrowRight")nx=pos+1;else if(e.key==="ArrowLeft")nx=pos-1;
  else if(e.key==="ArrowDown")nx=pos+cols;else if(e.key==="ArrowUp")nx=pos-cols;
  else if(e.key==="Enter"){e.preventDefault();go("reader");mark("open");draw();return}
  else if(e.key===" "){e.preventDefault();st.sel=+cell.dataset.i;st.inspTab="livro";mark("insp");draw();return}
  if(nx!==null){e.preventDefault();if(nx<0||nx>=L.length)return;
   var t=document.querySelector('.bk[data-i="'+L[nx].i+'"]');
   if(t){document.querySelectorAll(".bk").forEach(function(c){c.tabIndex=-1});t.tabIndex=0;t.focus()}}}});
addEventListener("keydown",function(e){
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();
  st.pal="";st.palq="";st.palsel=0;mark("open");draw()}
 else if(e.key==="Escape"){
  if(st.pal!==null&&st.pal!==undefined){st.pal=null;draw()}
  else if(st.menu!==null){st.menu=null;draw()}
  else if(st.pop){st.pop=false;draw()}
  else if(st.selText){st.selText=false;draw()}
  else if(st.rpanel){st.rpanel=null;draw()}
  else if(st.sel!==null){st.sel=null;draw()}}});
$("devsw").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 st.dev=b.dataset.d;st.pop=false;st.menu=null;mark(st.dev==="ipad"?"dev":"back");
 toast("Você está no "+devName()+". O que é da conta veio junto; o que é do aparelho, não.");draw()});
$("sidebtn").addEventListener("click",function(){st.side=!st.side;
 this.setAttribute("aria-pressed",st.side);drawSide()});
$("side").addEventListener("click",function(e){
 var s=e.target.closest("[data-s]");if(s){startScen(s.dataset.s);return}
 var b=e.target.closest("#altsize button");if(b){st.altSize=b.dataset.v;draw();return}
 var p=e.target.closest("#altpanel button");if(p){st.altPanel=p.dataset.v;draw()}});
draw();
})();
</script>
