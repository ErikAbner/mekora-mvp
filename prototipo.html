<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · lab de UX</title>
<style>
/* ═══ tokens vindos de mekora-canvas-motion/app/globals.css ═══ */
:root{
  --paper:#f1eee7;--paper-2:#f5f2eb;--paper-3:#f6efe2;--paper-4:#edeae3;
  --ink:#24150f;--ink-2:#4d2e1d;--ink-3:#6c5a4f;--ink-4:#91613e;
  --rule:#ddd5c8;--rule-2:#e8e2d6;--nav:#2a2019;
  --lime:#d7ff63;--orange:#ff9f72;--gold:#e4c347;--lilac:#c7adff;--blue:#b4c3ff;
  --green:#37bc72;--red:#ec5a4f;--deep:#9e342e;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r1:4px;--r2:10px;--h1:32px;--h2:38px;
  --sans:"Helvetica Neue",Arial,Helvetica,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --tr:.42s cubic-bezier(.22,.61,.36,1);
}
[data-motion="reduzido"] *{transition-duration:.001s!important;animation:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#171310;color:var(--ink);font-family:var(--sans);font-size:13px;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--deep);outline-offset:2px;border-radius:var(--r1)}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ ANDAIME ═══ */
.rig{background:#171310;color:#9a8d80;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);
  height:40px;flex:0 0 40px;font-family:var(--mono);font-size:10px;border-bottom:1px solid #2b2119;
  overflow-x:auto;scrollbar-width:none}
.rig::-webkit-scrollbar{display:none}
.rig b{color:#f1eee7;font-weight:400;white-space:nowrap}
.rig .sep{width:1px;height:16px;background:#332619;flex:0 0 1px}
.rig .grp{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rig button{font-family:var(--mono);font-size:10px;color:#9a8d80;padding:5px 10px;border-radius:var(--r1);
  border:1px solid #332619;white-space:nowrap}
.rig button:hover{color:#f1eee7;border-color:#5b4632}
.rig button[aria-pressed="true"]{background:#f1eee7;color:#24150f;border-color:#f1eee7}
.rig .spacer{flex:1}
.rig .warn{color:var(--orange)}

/* ═══ PALCO ═══ */
.stage{flex:1;min-height:0;display:flex;position:relative;overflow:hidden;background:var(--paper)}
.app{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--paper)}
.app[data-w="pequena"]{max-width:430px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}

/* ═══ MUNDO ESPACIAL ═══ */
.world{position:absolute;inset:0;transition:transform var(--tr);transform-origin:0 0;
  background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:32px 32px}
.region{position:absolute;width:100vw;height:calc(100vh - 40px);padding:var(--s6) var(--s7);
  display:flex;flex-direction:column;gap:var(--s4)}
.region-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.region-h h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.01em}
.region-h .mk{font-size:18px;color:var(--ink-3)}
.region-h p{margin:0;font-size:12.5px;color:var(--ink-3)}

/* barra fixa de navegação do mundo */
.chrome{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);background:linear-gradient(to top,var(--paper) 62%,transparent);flex-wrap:wrap}
.modes{display:flex;gap:2px;background:rgba(255,255,255,.5);border:1px solid var(--rule);
  border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.modes button{padding:7px 14px;border-radius:999px;font-size:12.5px;display:flex;gap:7px;align-items:center;
  white-space:nowrap;transition:background .16s,color .16s}
.modes button:hover{background:var(--paper-3)}
.modes button[aria-current="true"]{background:var(--nav);color:var(--paper)}
.modes .mk{font-size:13px;opacity:.7}
.chrome .spacer{flex:1}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);background:linear-gradient(to bottom,var(--paper) 60%,transparent)}
.topbar .brand{font-family:var(--serif);font-size:19px;letter-spacing:-.01em}
.topbar .spacer{flex:1}
.srch{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);border-radius:999px;
  height:var(--h1);padding:0 var(--s3);color:var(--ink-3);font-size:12.5px;background:rgba(255,255,255,.5)}
.srch:hover{border-color:var(--ink-3)}
.kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--rule);border-radius:3px;padding:1px 4px}
.avbtn{width:var(--h1);height:var(--h1);border-radius:50%;background:var(--nav);color:var(--paper);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 var(--h1)}
.avbtn:hover{background:var(--deep)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.5)}
.fchip:hover{background:var(--paper-3)}
.fchip[aria-pressed="true"]{background:var(--nav);color:var(--paper);border-color:var(--nav)}

/* ═══ LIVRO — uma entidade, quatro representações ═══ */
.obj{position:absolute;transition:all var(--tr);cursor:pointer;background:none;border:none}
.obj .body{position:relative;width:100%;height:100%;border-radius:var(--r1);background:var(--c);
  display:flex;flex-direction:column;justify-content:space-between;padding:10px;overflow:hidden;
  box-shadow:0 6px 18px rgba(36,21,15,.18);transition:all var(--tr)}
.obj .ini{font-family:var(--mono);font-size:11px;color:rgba(36,21,15,.62);letter-spacing:.08em}
.obj .ttl{font-size:12px;font-weight:600;line-height:1.2;color:#24150f}
.obj .src{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:8px;letter-spacing:.06em;
  text-transform:uppercase;color:rgba(36,21,15,.5)}
.obj:hover .body{transform:translateY(-3px);box-shadow:0 12px 26px rgba(36,21,15,.26)}
.obj[aria-selected="true"] .body{outline:2px solid var(--ink);outline-offset:3px}
/* estante: lombada vertical */
.obj.shelf .body{border-radius:2px 3px 3px 2px;padding:8px 6px;justify-content:flex-end}
.obj.shelf .ttl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;white-space:nowrap;
  overflow:hidden;max-height:100%}
.obj.shelf .ini,.obj.shelf .src{display:none}
/* lista: linha */
.obj.list .body{flex-direction:row;align-items:center;gap:var(--s3);border-radius:var(--r1);
  background:var(--paper-2);box-shadow:none;border-bottom:1px solid var(--rule-2);padding:10px var(--s3)}
.obj.list .swatch{width:26px;height:34px;border-radius:2px;background:var(--c);flex:0 0 26px}
.obj.list .ttl{flex:1;font-size:13px}
.obj.list .ini{display:none}
.obj.list .src{position:static;color:var(--ink-3)}
/* conexões: nó */
.obj.node .body{border-radius:50%;align-items:center;justify-content:center;padding:0}
.obj.node .ttl{display:none}
.obj.node .src{display:none}
.obj.node .ini{font-size:12px;color:rgba(36,21,15,.75)}
.shelfline{position:absolute;height:4px;background:var(--ink-4);border-radius:2px;opacity:.5}
.svg-links{position:absolute;inset:0;pointer-events:none}
.svg-links line{stroke:var(--ink-3);stroke-width:1.5}
.svg-links line.sug{stroke:var(--orange);stroke-dasharray:5 4}

/* ═══ PAINEL LATERAL ═══ */
.panel{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--paper-2);
  border-left:1px solid var(--rule);z-index:30;display:flex;flex-direction:column;
  box-shadow:-16px 0 40px rgba(36,21,15,.12)}
.panel-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--rule-2)}
.panel-h .lbl{flex:1}
.tabs{display:flex;border-bottom:1px solid var(--rule-2)}
.tabs button{flex:1;padding:var(--s3) 0;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);text-align:center}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.panel-b{padding:var(--s4);overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:var(--s3)}
.panel-b h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.meta{font-size:12.5px;color:var(--ink-3)}
@media (max-width:720px){.panel{width:100%}}

/* ═══ COMPONENTES ═══ */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--rule-2)}
.row:last-child{border-bottom:none}
.lb{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ds{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:3px;max-width:46ch}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:2px 7px;color:var(--ink-3);white-space:nowrap}
.badge.sim{border-color:var(--orange);color:var(--ink-4)}
.badge.dev{border-color:var(--ink-3)}
.badge.acc{border-color:var(--green);color:var(--green)}
.sw{width:38px;height:22px;border-radius:999px;background:var(--rule);position:relative;flex:0 0 38px;display:block}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(36,21,15,.3);transition:left .15s}
.sw.on{background:var(--nav)}.sw.on i{left:18px}
.segc{display:flex;border:1px solid var(--rule);border-radius:var(--r1);overflow:hidden;height:var(--h1)}
.segc button{padding:0 var(--s3);font-size:12px;border-right:1px solid var(--rule);display:flex;align-items:center;
  white-space:nowrap}
.segc button:last-child{border-right:none}
.segc button:hover{background:var(--paper-3)}
.segc button.on{background:var(--nav);color:var(--paper)}
select.sel{border:1px solid var(--rule);border-radius:var(--r1);height:var(--h1);padding:0 var(--s2);
  font-size:12.5px;background:#fff;color:var(--ink);font-family:var(--sans)}
.btn{font-size:13px;font-weight:600;background:var(--nav);color:var(--paper);border-radius:999px;
  padding:0 var(--s5);height:var(--h2);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--deep)}
.btn.sec{background:none;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.sec:hover{background:var(--paper-3)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12px}
.btn.dan{background:var(--deep);color:#fff}
.lnk{font-size:12.5px;text-decoration:underline}
.lnk:hover{color:var(--deep)}
.lnk.dan{color:var(--deep)}
.acts{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.strip{display:flex;align-items:center;gap:var(--s3);font-size:12.5px;padding:var(--s3);border-radius:var(--r1);
  background:var(--paper-3);border:1px solid var(--rule-2);color:var(--ink-2)}
.strip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--green)}.d-sim{background:var(--orange)}.d-off{background:var(--ink-3)}
.note{border-left:2px solid var(--rule);padding-left:var(--s3);font-family:var(--serif);font-style:italic;
  font-size:13px;line-height:1.55;color:var(--ink-2)}
.note b{display:block;font-family:var(--mono);font-style:normal;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;font-weight:400}
.rel{border:1px solid var(--rule-2);border-radius:var(--r1);padding:var(--s3);display:flex;
  flex-direction:column;gap:var(--s2);background:#fff}
.rel .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rel .r{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.rel.sug{border-color:var(--orange);border-style:dashed}

/* leitura */
.reader{position:absolute;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
.rtop{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:52px;flex:0 0 52px;
  border-bottom:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3)}
.rtop .ti{color:var(--ink);font-family:var(--serif);font-size:15px}
.rtop .spc{flex:1}
.rbody{flex:1;overflow-y:auto;padding:var(--s7) var(--s5) 80px}
.rcol{max-width:620px;margin:0 auto;font-family:var(--serif);font-size:18px;line-height:1.62}
.rcol p{margin:0 0 1em}
.rcol .hl{background:#f2d66d;padding:2px 0;border-radius:2px}
.anchor-warn{max-width:620px;margin:var(--s5) auto 0;border:1px dashed var(--orange);border-radius:var(--r1);
  padding:var(--s3);font-family:var(--sans);font-size:12px;line-height:1.55;color:var(--ink-2)}

/* modais e busca */
.ovl{position:absolute;inset:0;background:rgba(36,21,15,.28);z-index:45}
.pal{position:absolute;top:12vh;left:50%;transform:translateX(-50%);width:min(540px,90%);z-index:50;
  background:#fff;border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;
  box-shadow:0 26px 60px rgba(36,21,15,.3);max-height:62vh;display:flex;flex-direction:column}
.pal-in{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);border-bottom:1px solid var(--rule-2)}
.pal-in input{border:none;outline:none;font:inherit;font-size:15px;width:100%;color:var(--ink);background:none}
.pal-res{overflow-y:auto}
.pal-g{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  padding:var(--s3) var(--s4) var(--s1)}
.pal-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);padding:var(--s2) var(--s4);
  font-size:13px;width:100%;align-items:center}
.pal-r:hover,.pal-r.on{background:var(--paper-3)}
.pal-r .pth{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:80px;z-index:60;background:var(--nav);
  color:var(--paper);font-size:12.5px;padding:var(--s3) var(--s5);border-radius:999px;
  box-shadow:0 12px 30px rgba(36,21,15,.3);max-width:80%}

/* importação como fase de movimento */
.phase{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;
  background:rgba(241,238,231,.94);flex-direction:column;gap:var(--s4);text-align:center;padding:var(--s6)}
.phase h3{margin:0;font-family:var(--serif);font-size:24px;font-weight:400}
.phase p{margin:0;font-size:13px;color:var(--ink-3);max-width:44ch;line-height:1.6}
.phase .bar{width:220px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--nav);width:40%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}

/* painel de teste */
.side{position:absolute;top:0;right:0;bottom:0;width:320px;background:#171310;color:#b3a698;z-index:70;
  padding:var(--s5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--s5);border-left:1px solid #2b2119}
.side h4{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7d7166}
.side .sc{display:flex;flex-direction:column;gap:3px}
.side .sc button{padding:var(--s3);border-radius:var(--r1);border:1px solid #241a13;display:flex;
  flex-direction:column;gap:3px}
.side .sc button:hover{background:#1f1812}
.side .sc button[aria-pressed="true"]{background:#f1eee7;border-color:#f1eee7}
.side .sc button[aria-pressed="true"] .n,.side .sc button[aria-pressed="true"] .d{color:#24150f}
.side .sc .n{font-family:var(--mono);font-size:9px;color:#7d7166;letter-spacing:.08em}
.side .sc .d{font-size:12px;color:#d9cfc4;line-height:1.3}
.side .an{display:flex;flex-direction:column;gap:var(--s2)}
.side .an div{display:flex;flex-direction:column;gap:3px}
.side .an b{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#7d7166;font-weight:400}
.side .an span{font-size:12px;line-height:1.5;color:#b3a698}
.side .an .f{border-left:2px solid var(--orange);padding-left:var(--s3)}
.side .ev{font-family:var(--mono);font-size:10px;color:#7d7166;line-height:1.5}
@media (max-width:860px){.side{width:100%}}
</style>
</head>
<body>

<div class="rig">
  <b>Mekora · lab</b>
  <span class="sep"></span>
  <span class="grp">modelo <span id="modosw" style="display:flex;gap:4px"></span></span>
  <span class="sep"></span>
  <span class="grp">aparelho <span id="devsw" style="display:flex;gap:4px"></span></span>
  <span class="sep"></span>
  <span class="grp warn" id="simcount"></span>
  <span class="spacer"></span>
  <button id="sidebtn" aria-pressed="false">cenários</button>
</div>

<div class="stage">
  <div class="app" id="app"></div>
  <div class="side" id="side" hidden></div>
</div>

<script>
(function(){
"use strict";
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ═══ dados vindos de mekora-canvas-motion/app/page.tsx ═══ */
var MODES=[{id:"canvas",label:"Canvas",mk:"◇"},{id:"shelf",label:"Estante 3D",mk:"▥"},
 {id:"list",label:"Lista",mk:"≡"},{id:"connections",label:"Conexões",mk:"✣"}];
var REGIONS={canvas:{x:0,y:0},shelf:{x:1,y:0},list:{x:0,y:1},connections:{x:1,y:1}};
var BOOKS=[
{id:"interface",t:"Design de Interfaces",a:"Jenifer Tidwell",f:"EPUB",src:"Amazon",c:"#ff9f72",ini:"DI",p:62},
{id:"research",t:"Pesquisa em Produto",a:"Documento pessoal",f:"PDF",src:"Pessoal",c:"#d7ff63",ini:"PP",p:100},
{id:"psychology",t:"Psicologia das Cores",a:"Eva Heller",f:"AZW3",src:"Amazon",c:"#f2d66d",ini:"PC",p:24},
{id:"systems",t:"Sistemas que Aprendem",a:"Arquivo de aula",f:"DOCX",src:"Pessoal",c:"#c7adff",ini:"SA",p:0},
{id:"espaco",t:"Organização Espacial",a:"Documento pessoal",f:"PDF",src:"Pessoal",c:"#b4c3ff",ini:"OE",p:41},
{id:"tipo",t:"Elementos do Estilo Tipográfico",a:"Robert Bringhurst",f:"EPUB",src:"Amazon",c:"#d7ffb8",ini:"ET",p:8}];
var RELS=[
{from:"interface",to:"psychology",kind:"Livro ↔ livro",status:"suggested",
 reason:"Os dois discutem como escolhas visuais alteram percepção, compreensão e comportamento."},
{from:"research",to:"systems",kind:"Livro ↔ livro",status:"confirmed",
 reason:"A pesquisa aparece como entrada para sistemas que aprendem e se adaptam com evidências."},
{from:"interface",to:"nota-1",kind:"Livro ↔ nota",status:"confirmed",
 reason:"A nota resume o princípio de tornar a interface discreta quando o conteúdo precisa de foco."},
{from:"espaco",to:"destaque-1",kind:"Livro ↔ destaque",status:"suggested",
 reason:"O trecho associa organização espacial à memória, tema recorrente no arquivo importado."}];
var NOTAS={interface:[{t:"tornar a interface discreta quando o conteúdo precisa de foco",pg:88}],
 research:[{t:"evidência sem decisão é só arquivo",pg:24}],
 espaco:[{t:"a organização espacial é uma forma de memória",pg:112}],
 psychology:[],systems:[],tipo:[]};
var PAGINA=["A interface que se faz notar cobra um preço em atenção que o conteúdo precisaria receber inteiro.",
"<span class=\"hl\">A organização espacial é uma forma de memória</span>: lembramos onde algo estava antes de lembrar o que era.",

var ANN={canvas:{t:"Se a pessoa entende que Canvas, Estante, Lista e Conexões são o mesmo acervo visto de outro ângulo — e não quatro páginas.",
 w:"É o modelo do código: WORLD_REGIONS + câmera GSAP. Trocar de modo move a câmera; os livros fazem morph.",
 d:"canvas-motion/app/page.tsx — ViewMode e WORLD_REGIONS.",
 f:"Alguém perguntar “onde ficou o outro livro?” ao trocar de região."},
 connections:{t:"Se a revisão de sugestões (confirmar/rejeitar com razão) é entendida como curadoria, não como mágica.",
 w:"RelationStatus tem três valores e cada relação carrega uma razão escrita.",
 d:"KnowledgeRelation no código real. O mapa proíbe chamar isso de rede neural.",
 f:"A pessoa achar que o sistema “descobriu” algo sozinho, ou ignorar as tracejadas."},
 shelf:{t:"Se a lombada preserva reconhecimento com menos informação que o card.",
 w:"Estante 3D existe em Three.js no protótipo V2 (MekoraShelf.tsx), com alternativa por teclado.",
 d:"Classe C: existe no protótipo, sem catálogo real por trás.",
 f:"Não conseguir achar um livro conhecido em menos tempo que na lista."},
 list:{t:"Se a lista serve ao caso “já sei o que procuro”.",
 w:"É a representação de menor custo cognitivo quando o alvo é conhecido.",
 d:"ViewMode list — mesma projeção, outra forma.",f:"Virar a região padrão de todos, o que indicaria que as outras não pagam o custo."}};
function drawSide(){
 var el=$("side");el.hidden=!st.side;if(!st.side)return;
 var sc=SCEN.filter(function(x){return x.k===st.scen})[0],an=ANN[st.mode]||ANN.canvas;
 el.innerHTML='<div><h4>Cenários</h4><div class="sc" style="margin-top:var(--s2)">'+
  SCEN.map(function(s){return'<button data-s="'+s.k+'" aria-pressed="'+(st.scen===s.k)+'">'+
   '<span class="n">CENÁRIO '+s.k+'</span><span class="d">'+s.t+'</span></button>'}).join("")+'</div></div>'+
  (sc?'<div><h4>Passos</h4><ol style="list-style:none;margin:var(--s2) 0 0;padding:0;display:flex;flex-direction:column;gap:7px">'+
   sc.steps.map(function(p){return'<li style="font-size:12px;color:'+(st.done[st.scen+p[0]]?"#7d7166":"#b3a698")+'">'+
    (st.done[st.scen+p[0]]?"✓ ":"· ")+p[1]+'</li>'}).join("")+'</ol></div>':'')+
  '<div><h4>Anotação · '+st.mode+'</h4><div class="an" style="margin-top:var(--s2)">'+
  '<div><b>o que se testa</b><span>'+an.t+'</span></div>'+
  '<div><b>por que existe</b><span>'+an.w+'</span></div>'+
  '<div><b>evidência no repo</b><span>'+an.d+'</span></div>'+
  '<div class="f"><b>sinal de fracasso</b><span>'+an.f+'</span></div></div></div>'+
  '<div><h4>Eventos</h4><div class="ev" style="margin-top:var(--s2)">'+
  (st.ev.length?st.ev.map(function(e){return"· "+esc(e)}).join("<br>"):"—")+'</div></div>'}

/* ═══ eventos ═══ */
$("app").addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.dataset.a,v=el.dataset.v,i=el.dataset.i;
 if(a==="mode"){st.mode=v;st.sel=null;st.panel=(v==="connections");
  mark({shelf:"shelf",list:"list",connections:"conn"}[v]||"");log("região → "+v)}
 else if(a==="sel"){st.sel=i;st.panel=true;st.tab="overview";mark("sel");
  var b=BOOKS.filter(function(x){return x.id===i})[0];if(b&&b.src==="Amazon")mark("amazon");log("livro "+i)}
 else if(a==="tab"){st.tab=v;mark("tab")}
 else if(a==="close"){st.panel=false;st.sel=null;st.prefs=false;st.conta=false;st.pal=null}
 else if(a==="origem"){st.origem=v;log("origem = "+v)}
 else if(a==="prefs"){st.prefs=true;st.conta=false}
 else if(a==="conta"){st.conta=true}
 else if(a==="prefsec"){st.prefsec=v}
 else if(a==="set"){var d=SM[el.dataset.k];set(el.dataset.k,d.t==="sw"?v==="true":v);toast("Salvo")}
 else if(a==="read"){st.reader=true;st.panel=false;mark("abrir");mark("ancora")}
 else if(a==="closeread"){st.reader=false}
 else if(a==="export"){toast(val("smtp")?"Enviado ao Kindle":"Exportação ao Kindle — opcional, não é o destino")}
 else if(a==="prep"){st.phase="processing";mark("start");draw();
  setTimeout(function(){st.phase="transitioning";mark("proc");draw();
   setTimeout(function(){st.phase="library";draw()},1400)},1400);return}
 else if(a==="phasedone"){st.phase=null;st.mode="canvas";mark("lib");toast("Objeto novo no Canvas")}
 else if(a==="rel"){st.rels[i].status=v;mark("dec");mark("ver");mark("ler");
  toast(v==="confirmed"?"Conexão confirmada":"Sugestão rejeitada")}
 else if(a==="pal"){st.pal="";st.palq=""}
 else if(a==="palgo"){var r=res()[+i];st.pal=null;
  if(r.bk){st.sel=r.bk;st.panel=true;st.tab=r.p==="Nota"?"notes":"overview"}
  else if(r.md)st.mode=r.md;else{st.prefs=true;st.prefsec=r.sec}}
 else if(a==="noop"){toast("Fora do escopo do lab")}
 draw()});
$("app").addEventListener("change",function(e){var s=e.target.closest("select[data-k]");if(!s)return;
 set(s.dataset.k,s.value);toast("Salvo");draw()});
$("app").addEventListener("input",function(e){if(e.target.id==="palq"){st.palq=e.target.value;draw()}});
addEventListener("keydown",function(e){
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();st.pal="";st.palq="";draw()}
 else if(e.key==="Escape"){if(st.pal!==null)st.pal=null;else if(st.reader)st.reader=false;
  else if(st.prefs){st.prefs=false;st.conta=false}else if(st.panel){st.panel=false;st.sel=null}draw()}});
$("modosw").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 st.modo=b.dataset.m;mark("troca");mark("cab");mark("amb");
 toast(st.modo==="conta"?"Modelo com conta — hipótese, não existe no repo":"Modelo local — o que o repositório sustenta");draw()});
$("devsw").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 st.dev=b.dataset.d;draw()});
$("sidebtn").addEventListener("click",function(){st.side=!st.side;
 this.setAttribute("aria-pressed",st.side);drawSide()});
$("side").addEventListener("click",function(e){var s=e.target.closest("[data-s]");
 if(s)startScen(s.dataset.s)});
draw();
})();
</script>
