<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · protótipo navegável</title>
<style>
:root{
  --canvas:#F1EEE8;--card:#FCFBF8;--ink:#141311;--ink-2:#55504A;--ink-3:#8A857C;
  --rule:#C6C0B1;--rule-2:#E4E0D6;--bench-2:#E7E3D9;--bench-3:#D2CCBE;
  --accent:#C33B1E;--good:#4A6B45;--warn:#A8791F;--crit:#C33B1E;--slab:#141311;--shadow:20,19,17;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0E0D0C;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

/* ══ ANDAIME DE TESTE — fora do produto, deliberadamente escuro ══ */
.rig{background:#0E0D0C;color:#8B857A;display:flex;align-items:center;gap:14px;padding:0 14px;
  height:38px;flex:0 0 38px;font-family:var(--mono);font-size:10px;border-bottom:1px solid #262320}
.rig b{color:#EDE8DE;font-weight:400}
.rig .sep{width:1px;height:15px;background:#2B2825}
.rig .grp{display:flex;align-items:center;gap:7px}
.rig button{font-family:var(--mono);font-size:10px;color:#8B857A;padding:4px 9px;border-radius:3px;
  border:1px solid #2B2825;white-space:nowrap}
.rig button:hover{color:#EDE8DE;border-color:#454039}
.rig button[aria-pressed="true"]{background:#EDE8DE;color:#141311;border-color:#EDE8DE}
.rig .spacer{flex:1}
.rig .tag{color:var(--accent)}

/* ══ PRODUTO ══ */
.stage{flex:1;min-height:0;display:flex;background:var(--canvas);position:relative;overflow:hidden}
.app{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);position:relative}
.app[data-w="pequena"]{max-width:430px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}

.top{display:flex;align-items:center;gap:6px;padding:0 22px;height:52px;flex:0 0 52px;
  border-bottom:1px solid var(--rule-2)}
.top .brand{font-family:var(--serif);font-size:18px;letter-spacing:-.01em;margin-right:14px}
.top nav{display:flex;gap:2px}
.top nav button{font-size:13px;color:var(--ink-3);padding:6px 11px;border-radius:4px}
.top nav button:hover{background:var(--bench-3);color:var(--ink)}
.top nav button.on{color:var(--ink);font-weight:600}
.top .spacer{flex:1}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;
  padding:6px 12px;color:var(--ink-3);font-size:12.5px;min-width:190px}
.srch:hover{border-color:var(--ink-3)}
.kbd{font-family:var(--mono);font-size:9px;border:1px solid var(--rule);border-radius:2px;padding:1px 4px}
.avbtn{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--canvas);font-size:12px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.pad{padding:34px 40px 60px}
.app[data-w="pequena"] .pad{padding:22px 20px 50px}
.col{max-width:720px;margin:0 auto}

h1.t{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.015em;margin:0 0 4px}
.sub{font-size:13.5px;color:var(--ink-3);margin:0 0 26px;line-height:1.5}
h2.s{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink)}

/* linhas de ajuste */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center;
  padding:15px 0;border-bottom:1px solid var(--rule-2);position:relative}
.row:last-child{border-bottom:none}
.lb{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ds{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:4px;max-width:52ch}
.row.chg::before{content:"";position:absolute;left:-16px;top:22px;width:6px;height:6px;border-radius:50%;
  background:var(--accent)}
.revert{font-family:var(--mono);font-size:10px;color:var(--accent);text-decoration:underline}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:2px 7px;color:var(--ink-3);white-space:nowrap}
.badge.dev{border-color:var(--ink-3)}
.badge.sync{border-color:var(--good);color:var(--good)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.new{border-color:var(--good);color:var(--good)}

/* controles */
.sw{width:40px;height:23px;border-radius:999px;background:var(--rule);position:relative;flex:0 0 40px;display:block}
.sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:var(--card);
  box-shadow:0 1px 3px rgba(var(--shadow),.3);transition:left .15s}
.sw.on{background:var(--ink)}
.sw.on i{left:19.5px}
.sw[disabled]{opacity:.4}
.segc{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.segc button{padding:7px 14px;font-size:12.5px;border-right:1px solid var(--rule);white-space:nowrap}
.segc button:last-child{border-right:none}
.segc button:hover{background:var(--bench-3)}
.segc button.on{background:var(--ink);color:var(--canvas)}
select.sel{border:1px solid var(--rule);border-radius:4px;padding:7px 10px;font-size:13px;
  background:var(--card);color:var(--ink);font-family:var(--sans)}
.stepc{display:flex;align-items:center;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.stepc button{padding:6px 13px;font-size:14px;border-right:1px solid var(--rule)}
.stepc button:last-child{border:none}
.stepc button:hover{background:var(--bench-3)}
.stepc .v{padding:6px 10px;font-family:var(--mono);font-size:13px;min-width:50px;text-align:center;
  border-right:1px solid var(--rule)}
.inp{border:1px solid var(--rule);border-radius:4px;padding:8px 11px;font-size:13px;background:var(--card);
  color:var(--ink);font-family:inherit;min-width:250px}
.inp.err{border-color:var(--crit)}
.btn{font-size:13px;font-weight:600;background:var(--ink);color:var(--canvas);border-radius:999px;padding:9px 20px;
  display:inline-block}
.btn:hover{background:var(--accent);color:#F1EEE8}
.btn.sec{background:none;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn.sec:hover{background:var(--bench-3);color:var(--ink)}
.btn.dan{background:var(--crit);color:#F1EEE8}
.lnk{font-size:13px;text-decoration:underline;color:var(--ink)}
.lnk:hover{color:var(--accent)}
.lnk.dan{color:var(--crit)}

/* cabeçalho de conta */
.acct{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:15px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--rule-2)}
.acct .av{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--canvas);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.acct .nm{font-size:15px;font-weight:600}
.acct .em{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* índice de seções */
.idx{display:flex;flex-direction:column}
.idx button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;
  border-bottom:1px solid var(--rule-2);width:100%}
.idx button:hover .nm{color:var(--accent)}
.idx .nm{font-size:15px;font-weight:500}
.idx .dc{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.idx .ct{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* faixas de estado */
.strip{display:flex;align-items:center;gap:11px;font-size:13px;padding:11px 15px;border-radius:4px;
  background:var(--bench-2);border:1px solid var(--rule-2);color:var(--ink-2);margin:14px 0}
.strip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--good)}.d-err{background:var(--crit)}.d-off{background:var(--ink-3)}.d-wait{background:var(--warn)}
.strip.err{border-color:var(--crit)}

/* biblioteca */
.shelf{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(var(--cw,146px),1fr))}
.bk{display:flex;flex-direction:column;gap:9px;cursor:pointer;position:relative;padding-top:13px;text-align:left}
.bk .cv{position:relative;width:100%;padding-bottom:139%;border-radius:5px;overflow:hidden;
  background:var(--paper,#F6F3EC);box-shadow:0 5px 16px rgba(var(--shadow),.16);
  transition:transform .13s,box-shadow .13s}
.bk:hover .cv{transform:translateY(-3px);box-shadow:0 12px 26px rgba(var(--shadow),.24)}
.bk .cvin{position:absolute;inset:0;display:flex;flex-direction:column}
.bk .cvt{padding:9% 9% 0;font-size:calc(var(--cw,146px)*.088);font-weight:700;line-height:1.15;color:#141311}
.bk .cva{flex:1;margin:6% 8% 0;background-image:radial-gradient(var(--tone,#141311) 12%,transparent 13%);
  background-size:15% 15%;-webkit-mask-image:linear-gradient(to bottom,transparent,#000);
  mask-image:linear-gradient(to bottom,transparent,#000)}
.bk .cvf{background:#141311;height:6%}
.bk .tab{position:absolute;top:0;right:11%;background:var(--slab);color:#F1EEE8;font-size:10px;font-weight:700;
  line-height:1;padding:4px 7px 9px;border-radius:3px 3px 0 0;z-index:2}
.bk .tab:hover{background:var(--accent)}
.bk .prg{position:absolute;left:0;bottom:0;height:3px;background:#F1EEE8}
.bk .t{font-size:13.5px;font-weight:600;line-height:1.25}
.bk .a{font-size:11.5px;color:var(--ink-3)}
.bk .dots{position:absolute;top:15px;right:2px;color:var(--ink-3);letter-spacing:1px;padding:2px 6px;
  opacity:0;background:var(--canvas);border-radius:3px}
.bk:hover .dots,.bk:focus-within .dots{opacity:1}
.bk.list{flex-direction:row;align-items:center;gap:16px;padding-top:0;border-bottom:1px solid var(--rule-2);
  padding-bottom:12px}
.bk.list .cv{width:52px;flex:0 0 52px;padding-bottom:72px}
.bk.list .tab{display:none}

/* leitor */
.reader{display:flex;flex-direction:column;height:100%}
.rtop{display:flex;align-items:center;gap:12px;padding:0 22px;height:46px;flex:0 0 46px;
  border-bottom:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3)}
.rtop .ti{color:var(--ink);font-family:var(--serif);font-size:15px}
.rtop .spacer{flex:1}
.rscroll{flex:1;min-height:0;overflow-y:auto;background:var(--rbg,var(--card))}
.rbody{max-width:var(--rw,620px);margin:0 auto;padding:56px 30px 90px;font-family:var(--rf,var(--serif));
  color:var(--rfg,var(--ink))}
.rbody p{margin:0 0 1em}
.rbody .hl{background:var(--hl,#F2E07A);padding:2px 0;border-radius:2px}
.rbar{display:flex;align-items:center;gap:12px;padding:0 22px;height:52px;flex:0 0 52px;
  border-top:1px solid var(--rule-2);background:var(--canvas);flex-wrap:wrap}
.rbar .note{font-size:12.5px;color:var(--ink-3);flex:1;min-width:150px}
.rbar .note b{color:var(--ink)}

/* sobreposições */
.ovl{position:absolute;inset:0;background:rgba(var(--shadow),.26);z-index:30}
.pop{position:absolute;z-index:40;background:var(--card);border:1px solid var(--rule);border-radius:6px;
  box-shadow:0 20px 46px rgba(var(--shadow),.24);padding:20px;width:320px;display:flex;flex-direction:column;gap:6px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:330px;background:var(--card);
  border-left:1px solid var(--rule);box-shadow:-14px 0 40px rgba(var(--shadow),.18);padding:24px;
  display:flex;flex-direction:column;gap:6px;z-index:40;overflow-y:auto}
.pop .row,.drawer .row{padding:11px 0}
.pop .lb,.drawer .lb{font-size:13px}

/* busca */
.palwrap{position:absolute;inset:0;z-index:50;display:flex;justify-content:center;padding-top:11vh;
  background:rgba(var(--shadow),.26)}
.pal{width:min(540px,90%);max-height:60vh;background:var(--card);border:1px solid var(--rule);border-radius:8px;
  box-shadow:0 26px 60px rgba(var(--shadow),.3);display:flex;flex-direction:column;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--rule-2)}
.pal-in input{border:none;outline:none;background:none;font:inherit;font-size:16px;color:var(--ink);width:100%}
.pal-res{overflow-y:auto}
.pal-g{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:13px 20px 5px}
.pal-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:10px 20px;font-size:13.5px;
  align-items:center;cursor:pointer}
.pal-r.on,.pal-r:hover{background:var(--bench-2)}
.pal-r .pth{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.pal-empty{padding:22px 20px;font-size:13px;color:var(--ink-3);line-height:1.55}

/* assistente */
.wiz{position:absolute;inset:0;z-index:45;background:var(--canvas);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px}
.wizbox{max-width:520px;width:100%;display:flex;flex-direction:column;gap:18px}
.wizdots{display:flex;gap:6px}
.wizdots i{width:22px;height:3px;border-radius:2px;background:var(--rule);display:block}
.wizdots i.on{background:var(--ink)}

/* destrutivo */
.dz{border-top:1px solid var(--rule);margin-top:34px;padding-top:20px;display:flex;flex-direction:column;gap:14px}
.dz h5{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--crit)}
.confirm{border-left:2px solid var(--crit);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:12px}
.confirm p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.confirm ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.7}
.confirm b{color:var(--ink)}

/* aparelhos */
.dev-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;
  border-bottom:1px solid var(--rule-2)}
.dev-row .dn{font-size:13.5px;font-weight:500;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.dev-row .dm{font-size:12px;color:var(--ink-3);margin-top:3px}
.here{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--good);
  border:1px solid var(--good);border-radius:999px;padding:2px 7px}

/* espaço */
.quota{display:flex;gap:1px;height:11px;border-radius:3px;overflow:hidden;background:var(--rule-2);margin:16px 0 10px}
.quota i{display:block;height:100%}
.qleg{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.qleg span{display:flex;align-items:center;gap:7px}
.qleg i{width:9px;height:9px;border-radius:2px;display:block}

/* aviso e conversão */
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;background:var(--slab);
  color:#F1EEE8;font-size:13px;padding:11px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(var(--shadow),.34);
  max-width:80%}
.filecard{display:flex;gap:16px;align-items:center;padding:18px;background:var(--bench-2);border-radius:6px;
  margin-bottom:8px}
.filecard .ic{width:44px;height:56px;background:var(--slab);border-radius:3px;color:#EDE8DE;font-size:9px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);flex:0 0 44px}

/* painel de cenários */
.side{position:absolute;top:0;right:0;bottom:0;width:310px;background:#0E0D0C;color:#B8B1A5;z-index:70;
  padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;border-left:1px solid #262320}
.side h4{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#6F6A61}
.side .sc{display:flex;flex-direction:column;gap:3px}
.side .sc button{padding:9px 11px;border-radius:4px;border:1px solid #211F1C;display:flex;flex-direction:column;gap:3px}
.side .sc button:hover{background:#1A1815}
.side .sc button[aria-pressed="true"]{background:#EDE8DE;border-color:#EDE8DE}
.side .sc button[aria-pressed="true"] .n,.side .sc button[aria-pressed="true"] .d{color:#141311}
.side .sc .n{font-family:var(--mono);font-size:9px;color:#6F6A61;letter-spacing:.08em}
.side .sc .d{font-size:12.5px;color:#D6CFC3;line-height:1.3}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.side ol li{font-size:12px;line-height:1.45;display:grid;grid-template-columns:14px 1fr;gap:9px;color:#B8B1A5}
.side ol li i{width:12px;height:12px;border-radius:50%;border:1px solid #3A3630;margin-top:2px;display:block;
  position:relative}
.side ol li.ok i{background:var(--good);border-color:var(--good)}
.side ol li.ok i::after{content:"";position:absolute;left:3.5px;top:1px;width:3px;height:6px;
  border:solid #0E0D0C;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.side ol li.ok{color:#6F6A61}
.side .an{display:flex;flex-direction:column;gap:9px}
.side .an div{display:flex;flex-direction:column;gap:3px}
.side .an b{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#6F6A61;
  font-weight:400}
.side .an span{font-size:12px;line-height:1.5;color:#B8B1A5}
.side .an .f{border-left:2px solid var(--accent);padding-left:10px}
.side .alt{display:flex;flex-direction:column;gap:10px}
.side .altseg{display:flex;border:1px solid #2B2825;border-radius:4px;overflow:hidden}
.side .altseg button{flex:1;padding:6px 4px;font-family:var(--mono);font-size:9.5px;text-align:center;
  border-right:1px solid #2B2825;color:#8B857A}
.side .altseg button:last-child{border:none}
.side .altseg button[aria-pressed="true"]{background:#EDE8DE;color:#141311}
.side .note{font-size:11px;line-height:1.45;color:#6F6A61}

@media (max-width:860px){.side{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="rig">
  <b>Protótipo Mekora</b>
  <span class="sep"></span>
  <span class="grp">aparelho <span id="devsw" style="display:flex;gap:4px"></span></span>
  <span class="sep"></span>
  <span class="grp">alterados <b id="ndiff">0</b></span>
  <span class="spacer"></span>
  <span class="tag" id="scenlabel"></span>
  <button id="sidebtn">cenários e anotações</button>
</div>

<div class="stage">
  <div class="app" id="app"></div>
  <div class="side" id="side" hidden></div>
</div>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ══ catálogo ══ */
var SEC=[
 {k:"aparencia",n:"Aparência",d:"Tema, densidade, idioma, tela inicial"},
 {k:"biblioteca",n:"Biblioteca",d:"Vista padrão, ordenação, capas, sinais de nota"},
 {k:"leitura",n:"Leitura",d:"Tipografia, tema do leitor, destaques"},
 {k:"arquivos",n:"Arquivos",d:"Conversão, OCR, importação"},
 {k:"conexoes",n:"Conexões",d:"Kindle"},
 {k:"dados",n:"Seus dados",d:"Espaço, offline, privacidade, apagar"}
];
var S=[

  if(a==="go"){go(el.dataset.r,el.dataset.sec);if(el.dataset.r==="conta")mark("conta");if(el.dataset.sec)mark("land")}
  else if(a==="set"){var d=SM[k];set(k,d.t==="sw"?v==="true":d.t==="step"?+v:v,st.route.v==="conv"?"Conversão":"Preferências");
    if(k==="theme")mark("theme");if(k==="ocr"&&st.route.v==="conv")mark("ocr");toast("Salvo")}
  else if(a==="bset"){var d2=SM[k];st.book[k]=d2.t==="step"?+v:v;if(k==="size")mark("size")}
  else if(a==="revert"){rst(k);toast("Voltou ao padrão")}
  else if(a==="aa"){st.pop=!st.pop;if(st.pop)mark("aa")}
  else if(a==="usedef"){Object.keys(st.book).forEach(function(x){set(x,st.book[x],"Leitor")});
    st.book={};mark("dec");toast("Agora é o seu padrão de leitura")}
  else if(a==="undo"){st.book={};mark("dec");toast("Descartado")}
  else if(a==="hl"){toast(val("noteonhl")?"Destacado — campo de nota aberto":"Destacado")}
  else if(a==="book"){go("reader")}
  else if(a==="notes"){toast(BOOKS[+el.dataset.i].n+" notas · painel de notas fora do escopo deste protótipo")}
  else if(a==="menu"){st.menu=+el.dataset.i;mark("menu")}
  else if(a==="close"){st.menu=null}
  else if(a==="send"){st.menu=null;mark("send");
    if(st.kindle==="on")toast("Enviado para o seu Kindle");
    else st.wiz={s:1,mail:st.kmail,sender:st.ksender,test:null}}
  else if(a==="wiz"){st.wiz={s:1,mail:st.kmail,sender:st.ksender,test:null}}
  else if(a==="wnext"){st.wiz.s++}else if(a==="wback"){st.wiz.s--}else if(a==="wcancel"){st.wiz=null}
  else if(a==="wtest"){st.wiz.test="run";draw();setTimeout(function(){st.wiz.test="ok";draw()},900);return}
  else if(a==="wdone"){st.kmail=st.wiz.mail;st.ksender=st.wiz.sender;st.kindle="on";st.wiz=null;
    mark("wiz");toast("Kindle conectado · livro enviado")}
  else if(a==="ktest"){if(st.ksender&&st.ksender.indexOf("@")>-1&&st.ksender!=="antigo@gmail.com"){
      st.kindle="on";mark("test");toast("Teste chegou ao seu Kindle")}
    else{st.kindle="error";toast("A Amazon recusou o remetente — corrija o endereço acima")}}
  else if(a==="kdisc"){st.kindle="off";set("sendafter",false,"Conexões");toast("Kindle desconectado · “enviar após converter” foi desligado")}
  else if(a==="adv"){st.adv=!st.adv}
  else if(a==="convdef"){st.convDef=!st.convDef;if(st.convDef)mark("def")}
  else if(a==="convert"){if(st.convDef)["format","ocr","ocrlang","quality"].forEach(function(x){set(x,val(x),"Conversão")});
    go("prefs");mark("diary");toast(st.convDef?"Convertido · padrão atualizado":"Convertido")}
  else if(a==="danger"){st.danger="del";mark("open");mark("read")}
  else if(a==="resetall"){st.danger="reset"}
  else if(a==="dcancel"){st.danger=false;mark("out")}
  else if(a==="delok"){st.danger=false;mark("out");toast("Apagado em todos os aparelhos")}
  else if(a==="rdev"){st.devv[st.dev]={};st.danger=false;toast("Restaurado neste aparelho")}
  else if(a==="racct"){st.acct={};st.devv={mac:{},ipad:{}};st.origin={};st.danger=false;toast("Restaurado na conta inteira")}
  else if(a==="export"){toast("Exportado · 214 livros e 1.482 notas")}
  else if(a==="free"){toast("740 MB liberados neste aparelho")}
  else if(a==="f2a"){st.f2a=!st.f2a;toast(st.f2a?"Verificação em duas etapas ligada":"Desligada")}
  else if(a==="endsess"){st.devices.splice(+el.dataset.i,1);mark("end");toast("Sessão encerrada · downloads daquele aparelho apagados")}
  else if(a==="logout"){st.danger="logout"}
  else if(a==="pal"){st.pal="";st.palq="";st.palsel=0;mark("open")}
  else if(a==="palbg"){st.pal=null}
  else if(a==="palgo"){var r2=res()[+el.dataset.i];st.pal=null;
    if(r2.rt)go(r2.rt);else go("sec",r2.sec);
    if(r2.k&&SM[r2.k].adv)st.adv=true;mark("land");toast("Achou: "+r2.lb)}
  else if(a==="noop"){toast("Fora do escopo deste protótipo")}
  draw()});
$("app").addEventListener("change",function(e){var s=e.target.closest("select[data-k]");if(!s)return;
  if(s.dataset.p==="book")st.book[s.dataset.k]=s.value;
  else set(s.dataset.k,s.value,st.route.v==="conv"?"Conversão":"Preferências");
  toast("Salvo");draw()});
$("app").addEventListener("input",function(e){
  if(e.target.id==="palq"){st.palq=e.target.value;st.palsel=0;if(st.palq)mark("type");draw();return}
  var f=e.target.closest("[data-f]");if(!f)return;
  if(st.wiz)st.wiz[f.dataset.f]=e.target.value;else st[f.dataset.f]=e.target.value;
  if(f.dataset.f==="ksender")mark("fix")});
$("app").addEventListener("keydown",function(e){
  if(e.target.id!=="palq")return;var rs=res();
  if(e.key==="ArrowDown"){e.preventDefault();st.palsel=Math.min(rs.length-1,st.palsel+1);draw()}
  else if(e.key==="ArrowUp"){e.preventDefault();st.palsel=Math.max(0,st.palsel-1);draw()}
  else if(e.key==="Enter"&&rs[st.palsel]){e.preventDefault();var r2=rs[st.palsel];st.pal=null;
    if(r2.rt)go(r2.rt);else go("sec",r2.sec);if(r2.k&&SM[r2.k].adv)st.adv=true;mark("land");toast("Achou: "+r2.lb);draw()}
  else if(e.key==="Escape"){st.pal=null;draw()}});
addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();
    st.pal="";st.palq="";st.palsel=0;mark("open");draw()}
  else if(e.key==="Escape"&&st.pal!==null){st.pal=null;draw()}});
$("devsw").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  st.dev=b.dataset.d;st.pop=false;st.menu=null;mark(st.dev==="ipad"?"dev":"back");
  draw();toast("Você está no "+devName()+". O que é da conta veio junto; o que é do aparelho, não.");draw()});
$("sidebtn").addEventListener("click",function(){st.side=!st.side;
  this.setAttribute("aria-pressed",st.side);drawSide()});
$("side").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");if(s){startScen(s.dataset.s);return}
  var b=e.target.closest("#altsize button");if(b){st.altSize=b.dataset.v;draw();return}
  var p=e.target.closest("#altpanel button");if(p){st.altPanel=p.dataset.v;draw()}});
draw();
})();
</script>
</body>
</html>
