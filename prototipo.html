<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · área pessoal</title>
<style>
/* ════════════════════════════════════════════════════════════
   Neutros limpos para a interface; o creme do repositório
   (--paper #f1eee7) fica reservado à superfície de leitura.
   Acento derivado das cores de livro do canvas-motion.
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#ffffff;--bg-2:#f7f7f5;--bg-3:#f0efec;--nav:#f4f3f0;
  --ink:#1a1917;--ink-2:#57534d;--ink-3:#8a857d;--ink-4:#b5b0a8;
  --line:#e6e4de;--line-2:#efede8;
  --acc:#c8481f;--acc-soft:#fdf0ea;
  --ok:#2f7d55;--warn:#a8701c;--dan:#b23b2a;
  --paper:#f1eee7;                       /* só o leitor */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r1:6px;--r2:10px;--h1:32px;--h2:38px;
  --ui:-apple-system,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ MOLDURA DO PRODUTO ═══ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topo{display:flex;align-items:center;gap:var(--s2);height:56px;flex:0 0 56px;padding:0 var(--s5);
  border-bottom:1px solid var(--line);background:var(--bg)}
.marca{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;margin-right:var(--s5)}
.topo nav{display:flex;gap:2px}
.topo nav button{padding:7px 13px;border-radius:var(--r1);color:var(--ink-2);font-size:13.5px}
.topo nav button:hover{background:var(--bg-2);color:var(--ink)}
.topo nav button[aria-current="true"]{background:var(--ink);color:#fff}
.topo .sp{flex:1}
.busca{display:flex;align-items:center;gap:var(--s2);height:var(--h1);padding:0 var(--s3);
  border:1px solid var(--line);border-radius:999px;color:var(--ink-3);font-size:13px;background:var(--bg-2);min-width:0}
.busca:hover{border-color:var(--ink-4)}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff}
/* controle de usuário persistente */
.uctl{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-2)}
.uctl:hover{border-color:var(--ink-4);background:#fff}
.uctl[aria-expanded="true"]{border-color:var(--ink);background:#fff}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.uctl .ch{font-size:9px;color:var(--ink-3)}

/* menu do usuário */
.umenu{position:absolute;top:52px;right:var(--s5);width:264px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r2);box-shadow:0 16px 44px rgba(26,25,23,.14);z-index:60;overflow:hidden}
.umenu .id{padding:var(--s4);border-bottom:1px solid var(--line-2);display:flex;gap:var(--s3);align-items:center}
.umenu .id .ava{width:38px;height:38px;font-size:14px}
.umenu .id .n{font-size:14px;font-weight:600}
.umenu .id .e{font-size:12px;color:var(--ink-3);margin-top:1px}
.umenu ul{list-style:none;margin:0;padding:var(--s2)}
.umenu li button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:9px var(--s3);
  border-radius:var(--r1);font-size:13.5px}
.umenu li button:hover{background:var(--bg-2)}
.umenu li button .ic{width:16px;text-align:center;color:var(--ink-3);font-size:13px}
.umenu .div{height:1px;background:var(--line-2);margin:var(--s2) 0}

/* ═══ ÁREAS ═══ */
.corpo{flex:1;min-height:0;display:flex;overflow:hidden}
.rolo{flex:1;min-height:0;overflow-y:auto}
.pad{padding:var(--s6) var(--s7) var(--s7)}
h1.t{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 var(--s1)}
.sub{font-size:13.5px;color:var(--ink-3);margin:0 0 var(--s5);line-height:1.55}

/* biblioteca */
.libtop{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.libtop .ti{flex:1;min-width:160px}
.grade{display:grid;gap:var(--s5);grid-template-columns:repeat(auto-fill,minmax(var(--cw,150px),1fr))}
.bk{text-align:left;position:relative;padding-top:12px;display:block;width:100%}
/* span é inline: sem display:block a altura por padding-bottom não existe */
.bk .cv{display:block;position:relative;width:100%;padding-bottom:140%;border-radius:var(--r1);background:var(--c);
  box-shadow:0 4px 14px rgba(26,25,23,.14);transition:transform .14s,box-shadow .14s;overflow:hidden}
.bk:hover .cv{transform:translateY(-3px);box-shadow:0 12px 26px rgba(26,25,23,.2)}
.bk .cvin{position:absolute;inset:0;padding:11px;display:flex;flex-direction:column;justify-content:space-between}
.bk .ini{font-family:var(--mono);font-size:10px;color:rgba(26,25,23,.55)}
.bk .ct{font-size:12px;font-weight:600;color:#1a1917;line-height:1.2}
.bk .tab{position:absolute;top:0;right:11%;background:var(--ink);color:#fff;font-size:9.5px;font-weight:600;
  padding:3px 6px 8px;border-radius:3px 3px 0 0;z-index:2}
.bk .prg{position:absolute;left:0;bottom:0;height:3px;background:#fff}
.bk .t{font-size:13px;font-weight:600;margin-top:var(--s2);line-height:1.25}
.bk .a{font-size:12px;color:var(--ink-3);margin-top:1px}
.bk .src{font-family:var(--mono);font-size:9px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em}

/* painel contextual (o elo com Settings) */
.ctxwrap{position:relative}
.ctx{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  box-shadow:0 18px 46px rgba(26,25,23,.16);width:300px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.ctx .row{padding:var(--s2) 0;border:none}
.ctx .ponte{margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--acc);font-weight:550}
.ctx .ponte:hover{text-decoration:underline}

/* ═══ CONFIGURAÇÕES ═══ */
.cfg{flex:1;min-height:0;display:flex;overflow:hidden}
.cfgnav{width:246px;flex:0 0 246px;border-right:1px solid var(--line);background:var(--nav);
  display:flex;flex-direction:column;min-height:0}
.cfgnav .volta{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s4) var(--s3);
  font-size:13px;color:var(--ink-2)}
.cfgnav .volta:hover{color:var(--acc)}
.cfgnav .bs{margin:0 var(--s3) var(--s3);display:flex;align-items:center;gap:var(--s2);height:var(--h1);
  padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r1);background:#fff}
.cfgnav .bs input{border:none;outline:none;background:none;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.cfgnav .lista{overflow-y:auto;padding:0 var(--s2) var(--s5);flex:1}
.grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);
  padding:var(--s4) var(--s3) var(--s2)}
.cat{display:flex;align-items:center;gap:var(--s3);width:100%;padding:8px var(--s3);border-radius:var(--r1);
  font-size:13.5px;color:var(--ink-2)}
.cat:hover{background:var(--bg-3);color:var(--ink)}
.cat[aria-current="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,25,23,.07)}
.cat[aria-current="true"] .ic{color:var(--acc)}
.cat .ic{width:15px;text-align:center;color:var(--ink-4);font-size:12px}
.cat .badge{margin-left:auto}
.cfgmain{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
.cfgpad{padding:var(--s6) var(--s7);max-width:760px}
.cfghead{margin-bottom:var(--s5)}
.cfghead .trilha{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:var(--s2)}
.cfghead h2{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}
.cfghead p{margin:var(--s2) 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.55;max-width:60ch}
.bloco{margin-bottom:var(--s6)}
.bloco h3{margin:0 0 var(--s2);font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--ink-2)}
.cartao{border:1px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s5);align-items:center;
  padding:var(--s4);border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row.hit{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.lb{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ds{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:3px;max-width:52ch}
@media (max-width:620px){.row{grid-template-columns:1fr;gap:var(--s3)}}

/* controles */
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:999px;padding:2px 7px;color:var(--ink-3);white-space:nowrap}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.sim{border-color:var(--warn);color:var(--warn)}
.sw{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:0 0 40px;display:block;
  transition:background .16s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(26,25,23,.28);transition:left .16s}
.sw.on{background:var(--ink)}.sw.on i{left:19.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;height:var(--h1);background:#fff}
.seg button{padding:0 var(--s3);font-size:12.5px;border-right:1px solid var(--line);display:flex;align-items:center;
  white-space:nowrap;color:var(--ink-2)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--bg-2)}
.seg button.on{background:var(--ink);color:#fff}
select.sel{height:var(--h1);border:1px solid var(--line);border-radius:var(--r1);padding:0 var(--s2);
  background:#fff;font:inherit;font-size:13px;color:var(--ink)}
.inp{height:var(--h2);border:1px solid var(--line);border-radius:var(--r1);padding:0 var(--s3);background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink);min-width:240px;max-width:100%}
.btn{height:var(--h2);padding:0 var(--s5);border-radius:var(--r1);background:var(--ink);color:#fff;font-size:13.5px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--acc)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.sec:hover{background:var(--bg-2)}
.btn.dan{background:var(--dan)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.lnk{font-size:13px;color:var(--acc);font-weight:550}
.lnk:hover{text-decoration:underline}
.acts{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.faixa{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r1);
  background:var(--bg-2);border:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.faixa .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.d-ok{background:var(--ok)}.d-sim{background:var(--warn)}.d-off{background:var(--ink-4)}
.faixa .sp{flex:1}

/* ═══ PERFIL ═══ */
.pcabec{display:flex;gap:var(--s5);align-items:center;padding-bottom:var(--s5);border-bottom:1px solid var(--line);
  margin-bottom:var(--s5);flex-wrap:wrap}
.pcabec .ava{width:72px;height:72px;font-size:26px}
.pcabec h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.pcabec .h{font-size:13px;color:var(--ink-3);margin-top:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--s4);margin-bottom:var(--s6)}
.num{border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);background:#fff}
.num b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em}
.num span{font-size:12.5px;color:var(--ink-3)}
.linhat{display:grid;grid-template-columns:78px minmax(0,1fr);gap:var(--s4);padding:var(--s3) 0;
  border-bottom:1px solid var(--line-2);font-size:13px}
.linhat .q{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

/* ═══ LEITOR ═══ */
.leitor{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:var(--s3);height:52px;flex:0 0 52px;padding:0 var(--s5);
  border-bottom:1px solid rgba(26,25,23,.1);font-size:13px;color:var(--ink-2)}
.ltop .ti{font-family:var(--serif);font-size:15px;color:var(--ink)}
.ltop .sp{flex:1}
.lbody{flex:1;overflow-y:auto;padding:var(--s7) var(--s5) 90px}
.lcol{max-width:620px;margin:0 auto;font-family:var(--serif);line-height:1.62;color:#26221c}
.lcol p{margin:0 0 1em}
.lcol .hl{background:#f3dd8c;padding:2px 0}

/* ═══ BUSCA GLOBAL ═══ */
.velo{position:fixed;inset:0;background:rgba(26,25,23,.24);z-index:80}
.pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,92%);z-index:81;background:#fff;
  border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 28px 64px rgba(26,25,23,.28);overflow:hidden;
  max-height:64vh;display:flex;flex-direction:column}
.pal .in{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line-2)}
.pal .in input{border:none;outline:none;font:inherit;font-size:15.5px;width:100%;background:none}
.pal .res{overflow-y:auto}
.pal .g{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);
  padding:var(--s3) var(--s4) var(--s1)}
.pal .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);padding:9px var(--s4);width:100%;
  align-items:center;font-size:13.5px}
.pal .r:hover,.pal .r.on{background:var(--bg-2)}
.pal .r .p{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.pal .vazio{padding:var(--s5);font-size:13px;color:var(--ink-3);line-height:1.6}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;background:var(--ink);color:#fff;
  font-size:13px;padding:11px var(--s5);border-radius:999px;box-shadow:0 14px 34px rgba(26,25,23,.3);max-width:82%}

/* ═══ LAB — secundário, fora do produto ═══ */
#labbtn{position:fixed;right:16px;bottom:16px;z-index:95;height:34px;padding:0 14px;border-radius:999px;
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  display:flex;align-items:center;gap:7px;box-shadow:0 8px 24px rgba(26,25,23,.28);opacity:.62}
#labbtn:hover{opacity:1}
#lab{position:fixed;top:0;right:0;bottom:0;width:330px;background:#14130f;color:#b6b0a6;z-index:96;
  padding:var(--s5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--s5);
  box-shadow:-18px 0 50px rgba(0,0,0,.34)}
#lab h4{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7b7469}
#lab .fechar{position:absolute;top:14px;right:16px;color:#7b7469;font-family:var(--mono);font-size:11px}
#lab .sc{display:flex;flex-direction:column;gap:3px}
#lab .sc button{padding:10px var(--s3);border-radius:var(--r1);border:1px solid #221f19;display:flex;
  flex-direction:column;gap:3px}
#lab .sc button:hover{background:#1c1a14}
#lab .sc button[aria-pressed="true"]{background:#f2f0eb;border-color:#f2f0eb}
#lab .sc button[aria-pressed="true"] .n,#lab .sc button[aria-pressed="true"] .d{color:#14130f}
#lab .sc .n{font-family:var(--mono);font-size:9px;color:#7b7469;letter-spacing:.07em}
#lab .sc .d{font-size:12.5px;color:#d5cec3;line-height:1.3}
#lab ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#lab ol li{font-size:12px;line-height:1.45;color:#b6b0a6}
#lab ol li.ok{color:#6f6a60}
#lab .seg{background:#1c1a14;border-color:#2a2620}
#lab .seg button{color:#b6b0a6;border-color:#2a2620;font-size:11px}
#lab .seg button.on{background:#f2f0eb;color:#14130f}
#lab .nota{font-size:11.5px;line-height:1.5;color:#7b7469}
@media (max-width:720px){#lab{width:100%}}
/* telas estreitas: o topo enxuga e Configurações vira lista → conteúdo */
@media (max-width:640px){
  .topo{padding:0 var(--s4);gap:var(--s1)}
  .marca{display:none}
  .topo nav button{padding:7px 10px;font-size:13px}
  .busca .kbd{display:none}
  .pad{padding:var(--s5) var(--s4) var(--s6)}
  .cfgpad{padding:var(--s5) var(--s4)}
  .umenu{right:var(--s4);left:var(--s4);width:auto}
  .cfg{flex-direction:column}
  .cfgnav{width:100%;flex:1;border-right:none;border-bottom:1px solid var(--line)}
  .cfgmain{display:none}
  .cfg[data-aberto="1"] .cfgnav{display:none}
  .cfg[data-aberto="1"] .cfgmain{display:block;flex:1}
  .voltacat{display:inline-flex!important}
}
.voltacat{display:none;align-items:center;gap:var(--s2);font-size:13px;color:var(--acc);
  margin-bottom:var(--s4);font-weight:550}
</style>
</head>
<body>
<div id="app"></div>
<button id="labbtn">◇ lab</button>
<div id="lab" hidden></div>

<script>
(function(){
"use strict";
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ═════ ARQUITETURA DE CONFIGURAÇÕES ═════ */
var GRUPOS=[
{n:"Preferências",cats:[
  {k:"geral",n:"Geral",ic:"◈"},{k:"aparencia",n:"Aparência",ic:"◐"},{k:"leitura",n:"Leitura",ic:"▤"},
  {k:"biblioteca",n:"Biblioteca",ic:"▦"},{k:"conhecimento",n:"Conhecimento",ic:"✳"}]},
{n:"Conexões",cats:[
  {k:"kindle",n:"Kindle",ic:"◨"},{k:"dispositivos",n:"Dispositivos",ic:"▢"},{k:"integracoes",n:"Integrações",ic:"⊞"}]},
{n:"Conta",cats:[
  {k:"identidade",n:"Conta e identidade",ic:"◉"},{k:"seguranca",n:"Segurança",ic:"⚿"},{k:"sessoes",n:"Sessões",ic:"◍"}]},
{n:"Dados",cats:[
  {k:"privacidade",n:"Privacidade",ic:"◇"},{k:"exportacao",n:"Exportação",ic:"↧"}]}];
var CATS={};GRUPOS.forEach(function(g){g.cats.forEach(function(c){c.grupo=g.n;CATS[c.k]=c})});
var DESC={geral:"Idioma, início e comportamento geral do Mekora.",
 aparencia:"Tema e densidade da interface.",
 leitura:"Tipografia e comportamento do leitor. Você também ajusta isso lendo, pelo Aa.",
 biblioteca:"Como a estante abre: representação, ordenação e sinais.",

  '<div class="cartao"><div class="row"><div><div class="lb">Encerrar as outras sessões</div>'+
  '<div class="ds">Os outros aparelhos vão pedir para entrar de novo.</div></div>'+
  '<button class="btn sec sm" data-a="noop">Encerrar</button></div></div>';return h}
 if(st.cat==="exportacao"){h+='<div class="cartao"><div class="row"><div><div class="lb">Exportar biblioteca e notas</div>'+
  '<div class="ds">Metadados, notas, destaques e coleções em formato aberto.</div></div>'+
  '<button class="btn sec sm" data-a="noop">Exportar…</button></div></div>';return h}
 if(!lista.length)h+='<div class="faixa"><span class="dot d-off"></span>Nada configurável aqui ainda.</div>';
 else h+='<div class="cartao">'+lista.map(linha).join("")+'</div>';
 if(st.cat==="privacidade")h+='<div class="bloco" style="margin-top:var(--s6)"><h3>Irreversível</h3>'+
  '<div class="cartao"><div class="row"><div><div class="lb">Apagar biblioteca</div>'+
  '<div class="ds">Remove livros, notas e coleções da sua conta, em todos os lugares.</div></div>'+
  '<button class="btn dan sm" data-a="noop">Apagar…</button></div></div></div>';
 return h}

/* ═════ LEITOR ═════ */
function vLeitor(){
 var tema=v("temaleitor"),bg=tema==="Escuro"?"#211f1b":tema==="Claro"?"#fff":"var(--paper)";
 var fg=tema==="Escuro"?"#ded8cd":"#26221c";
 var corpo={"16":16,"18":18,"21":21}[v("corpo")],el={"1,4×":1.4,"1,5×":1.5,"1,8×":1.8}[v("entrelinha")];
 var ff=v("fonte")==="Sem serifa"?"var(--ui)":"var(--serif)";
 return'<div class="leitor" style="background:'+bg+'"><div class="ltop">'+
  '<button class="lnk" data-a="fecharleitor">← Biblioteca</button>'+
  '<span class="ti">Organização Espacial</span><span class="sp"></span>'+
  '<span class="ctxwrap"><button class="btn sec sm" data-a="ctx" data-t="aa" style="font-family:var(--serif);font-size:15px">Aa</button>'+
  (st.ctx==="aa"?ctxAa():"")+'</span></div>'+
  '<div class="lbody"><div class="lcol" style="font-size:'+corpo+'px;line-height:'+el+';font-family:'+ff+';color:'+fg+'">'+
  PAG.map(function(p){return"<p>"+p+"</p>"}).join("")+'</div></div></div>'}
function ctxAa(){
 return'<div class="ctx" style="top:40px;right:0">'+
  '<div class="lbl">Leitura</div>'+
  ["fonte","corpo","entrelinha","temaleitor"].map(function(k){
   return'<div class="row" style="padding:6px 0;border:none"><div><div class="lb" style="font-size:13px">'+SM[k].lb+'</div></div>'+ctl(SM[k],1)+'</div>'}).join("")+
  '<div class="acts" style="margin-top:var(--s2)"><button class="btn sm sec" data-a="soeste">Só neste livro</button>'+
  '<button class="btn sm" data-a="padrao">Usar como padrão</button></div>'+
  '<button class="ponte" data-a="ponte" data-c="leitura">Gerenciar preferências de leitura →</button></div>'}

/* ═════ BUSCA GLOBAL ═════ */
function resGlobal(){var q=(st.palq||"").toLowerCase().trim();if(!q)return[];var o=[];
 LIVROS.forEach(function(b,i){if((b.t+" "+b.a).toLowerCase().indexOf(q)>-1)o.push({l:b.t,p:"Livro",i:i})});
 S.forEach(function(x){if((x.lb+" "+x.syn).toLowerCase().indexOf(q)>-1)
  o.push({l:x.lb,p:CATS[x.c].grupo+" → "+CATS[x.c].n,c:x.c,k:x.k})});
 [["Perfil","perfil"],["Configurações","cfg"]].forEach(function(d){
  if(d[0].toLowerCase().indexOf(q)>-1)o.push({l:d[0],p:"Área",r:d[1]})});
 return o.slice(0,8)}
function vPal(){var rs=resGlobal();
 return'<div class="velo" data-a="fecharpal"></div><div class="pal"><div class="in">⌕'+
  '<input id="palq" value="'+esc(st.palq)+'" placeholder="Buscar livro, ajuste ou área" autocomplete="off"></div>'+
  '<div class="res">'+(rs.length?rs.map(function(r,i){
   return'<button class="r" data-a="palgo" data-i="'+i+'"><span>'+esc(r.l)+'</span><span class="p">'+r.p+'</span></button>'}).join("")
   :'<div class="vazio">Busca livros, ajustes e áreas. Tente “kindle”, “fonte”, “tema” ou “perfil”.</div>')+'</div></div>'}

/* ═════ DESENHO ═════ */
function draw(){
 var h="";
 if(st.rota==="lib")h=vLib();
 else if(st.rota==="perfil")h=vPerfil();
 else if(st.rota==="cfg")h=vCfg();
 else if(st.rota==="canvas")h=vSimples("Canvas","Os livros como objetos que você posiciona. A mesma biblioteca, outro ângulo.","biblioteca","Gerenciar padrões da biblioteca");
 else h=vSimples("Conhecimento","Notas, destaques e as conexões entre o que você leu.","conhecimento","Gerenciar preferências de conhecimento");
 if(st.leitor)h+=vLeitor();
 if(st.pal!==null)h+=vPal();
 if(st.aviso)h+='<div class="aviso">'+esc(st.aviso)+'</div>';
 $("app").innerHTML=h;
 if(st.hit){var el=$("row-"+st.hit);if(el)el.scrollIntoView({block:"center",behavior:"smooth"})}
 var b=$("bs");if(b&&document.activeElement!==b&&st.bs){b.focus();b.setSelectionRange(b.value.length,b.value.length)}
 var p=$("palq");if(p){p.focus();p.setSelectionRange(p.value.length,p.value.length)}
 drawLab()}

/* ═════ LAB ═════ */
var ANOT={lib:["Biblioteca","O controle de usuário no topo direito é o único ponto pessoal persistente. Settings não disputa espaço com as áreas de trabalho.","Ninguém achar o controle em 5 segundos."],
 cfg:["Configurações","Quatro grupos visíveis: Preferências, Conexões, Conta, Dados. A hierarquia inteira fica à vista, e o retorno diz de onde você veio.","A pessoa não souber dizer quantas categorias existem depois de usar."],
 perfil:["Perfil","Perfil é visualização do que a leitura produziu; Conta é administração. “Editar perfil” atravessa essa fronteira de propósito.","Alguém procurar senha ou sessões aqui dentro."],
 canvas:["Canvas","Área de trabalho — existe para provar que dá para sair do produto para Settings e voltar ao mesmo lugar.","Voltar de Settings e cair em outro contexto."],
 conhecimento:["Conhecimento","Mesma função de contexto de saída e retorno.","Voltar de Settings e cair em outro contexto."]};
function drawLab(){
 var el=$("lab");el.hidden=!st.lab;if(!st.lab)return;
 var c=CEN.filter(function(x){return x.k===st.cen})[0],a=ANOT[st.rota]||ANOT.lib;
 el.innerHTML='<button class="fechar" data-l="fechar">fechar ✕</button>'+
  '<div><h4>Cenários</h4><div class="sc" style="margin-top:var(--s2)">'+
  CEN.map(function(s){return'<button data-s="'+s.k+'" aria-pressed="'+(st.cen===s.k)+'">'+
   '<span class="n">'+s.k+'</span><span class="d">'+s.t+'</span></button>'}).join("")+'</div></div>'+
  (c?'<div><h4>Passos</h4><ol style="margin-top:var(--s2)">'+c.p.map(function(p){
   return'<li class="'+(st.feito[st.cen+p[0]]?"ok":"")+'">'+(st.feito[st.cen+p[0]]?"✓ ":"· ")+p[1]+'</li>'}).join("")+'</ol></div>':'')+
  '<div><h4>Anotação · '+a[0]+'</h4><p class="nota" style="margin:var(--s2) 0 0">'+a[1]+'</p>'+
  '<p class="nota" style="margin:var(--s2) 0 0;border-left:2px solid var(--acc);padding-left:10px">'+
  '<b style="color:#d5cec3">Falha se:</b> '+a[2]+'</p></div>'+
  '<div><h4>Layout de Configurações</h4><div class="seg" style="margin-top:var(--s2)">'+
  [["A","lateral"],["B","compacto"],["C","busca"]].map(function(l){
   return'<button data-lay="'+l[0]+'" class="'+(st.layout===l[0]?"on":"")+'">'+l[1]+'</button>'}).join("")+'</div>'+
  '<p class="nota" style="margin:var(--s2) 0 0">'+
  ({A:"Navegação lateral persistente: a arquitetura inteira à vista o tempo todo. Escolhido — é o que responde “o que mais existe aqui?”.",
    B:"Navegador compacto e conteúdo largo: ganha área útil, perde a noção de conjunto.",
    C:"Busca primeiro: rápido para quem sabe o nome, cego para quem não sabe."})[st.layout]+'</p></div>'}

/* ═════ EVENTOS ═════ */
$("app").addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");
 if(!el){if(st.menu||st.ctx){st.menu=false;st.ctx=null;draw()}return}
 var a=el.dataset.a;
 if(a==="rota"){st.rota=el.dataset.r;st.menu=false;st.ctx=null;marcar("volta")}
 else if(a==="umenu"){st.menu=!st.menu;st.ctx=null;marcar("ava")}
 else if(a==="perfil"){st.rota="perfil";st.menu=false;st.de="perfil";marcar("perfil")}
 else if(a==="cfg"){irCfg(el.dataset.c,"lib",el.dataset.abrir==="1");marcar("menu")}
 else if(a==="ctx"){st.ctx=st.ctx===el.dataset.t?null:el.dataset.t;
  marcar(el.dataset.t==="aa"?"aa":el.dataset.t==="lib"?"vis":"status")}
 else if(a==="ponte"){var c=el.dataset.c;
  st.de=st.leitor?"leitor":st.rota==="perfil"?"perfil":"lib";
  if(st.leitor)st.leitor=false;
  irCfg(c,st.de);
  marcar(c==="leitura"?"ponte":c==="biblioteca"?"ponte2":c==="identidade"?"editar":"gerenciar");
  marcar("chegou");marcar("conta");
  aviso("Você veio "+(st.de==="leitor"?"do leitor":st.de==="perfil"?"do perfil":"da Biblioteca")+" — o botão de voltar leva de volta para lá")}
 else if(a==="voltar"){if(st.de==="leitor"){st.rota="lib";st.leitor=true}
  else if(st.de==="perfil")st.rota="perfil";else st.rota="lib";
  st.de=null;marcar("volta")}
 else if(a==="ir"){st.cat=el.dataset.c;st.hit=el.dataset.k||null;st.catAberta=true;
  if(el.dataset.k){st.bs="";marcar("achou")}marcar("nav")}
 else if(a==="fechacat"){st.catAberta=false}
 else if(a==="ler"){st.leitor=true;st.ctx=null}
 else if(a==="fecharleitor"){st.leitor=false;st.ctx=null}
 else if(a==="set"){var x=SM[el.dataset.k];
  setv(el.dataset.k,x.t==="sw"?el.dataset.v==="true":el.dataset.v,el.dataset.ctx?"ctx":"cfg");
  if(el.dataset.ctx)marcar("ctx")}
 else if(a==="soeste"){st.ctx=null;aviso("Vale só neste livro")}
 else if(a==="padrao"){st.ctx=null;aviso("Agora é o seu padrão de leitura")}
 else if(a==="salvar"){aviso("Identidade atualizada")}
 else if(a==="pal"){st.pal="";st.palq="";st.menu=false}
 else if(a==="fecharpal"){st.pal=null}
 else if(a==="palgo"){var r=resGlobal()[+el.dataset.i];st.pal=null;
  if(r.i!==undefined)st.leitor=true;else if(r.r==="perfil")st.rota="perfil";
  else if(r.c){st.de=st.rota==="cfg"?st.de:"lib";irCfg(r.c,st.de);st.hit=r.k}}
 else if(a==="noop"){aviso("Fora do escopo desta exploração")}
 draw()});
$("app").addEventListener("input",function(e){
 if(e.target.id==="bs"){st.bs=e.target.value;st.hit=null;if(st.bs)marcar("buscar");draw()}
 else if(e.target.id==="palq"){st.palq=e.target.value;draw()}});
$("app").addEventListener("change",function(e){var s=e.target.closest("select[data-k]");if(!s)return;
 setv(s.dataset.k,s.value,"cfg");draw()});
addEventListener("keydown",function(e){
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();st.pal="";st.palq="";draw()}
 else if(e.key==="Escape"){if(st.pal!==null)st.pal=null;else if(st.ctx)st.ctx=null;
  else if(st.menu)st.menu=false;else if(st.leitor)st.leitor=false;draw()}});
$("labbtn").addEventListener("click",function(){st.lab=!st.lab;drawLab()});
$("lab").addEventListener("click",function(e){
 var f=e.target.closest("[data-l]");if(f){st.lab=false;drawLab();return}
 var s=e.target.closest("[data-s]");if(s){comecar(s.dataset.s);return}
 var l=e.target.closest("[data-lay]");if(l){st.layout=l.dataset.lay;
  aviso("Layout "+l.dataset.lay+" — o escolhido é o A, com navegação lateral");drawLab()}});
draw();
})();
</script>
</body>
</html>
