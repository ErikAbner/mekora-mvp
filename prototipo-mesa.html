  uteis.forEach((a,i)=>uteis.slice(i+1).forEach(b=>{
    if(a.livro===b.livro)return;
    const t=comuns(a,b);if(t.length)pares.push({a:a,b:b,termos:t});
  }));
  /* junta TODOS os grupos que o par toca, e nao o primeiro: com o primeiro,
     dois grupos que o mesmo par deveria unir ficavam separados para sempre. */
  let gs=[];

    const toca=gs.filter(g=>g.n[p.a.k]||g.n[p.b.k]);
    const g=toca.length?toca[0]:{n:{},p:[]};
    toca.slice(1).forEach(o=>{Object.keys(o.n).forEach(k=>g.n[k]=1);g.p=g.p.concat(o.p);});
    gs=gs.filter(x=>toca.indexOf(x)<1||x===g);

       a sua propria forma de superficie e "repeticao", "repetido" e
       "repete" apareciam como tres achados, sendo o mesmo. */
    const porTermo={};

      termos:Object.keys(porTermo).map(t=>({p:t,w:inteira(t,notas),livros:[...porTermo[t]],

  const fortes=[];

  const terr=S.verEst&&S.verEst.length?S.estudos.find(t=>t.id===(S.verEstId||"")):null;
  let vis=q?lista.filter(d=>((d.nota||"")+" "+escTxt(d)).toLowerCase().indexOf(q)>-1):lista;
  if(S.verEst&&S.verEst.length)vis=vis.filter(d=>S.verEst.indexOf(d.k)>-1);
  /* A fila é uma PARTIÇÃO — toda nota está em exatamente uma das três. "Para
     revisar" não parte nada: é um estado que você marcou, e um subconjunto
     das outras. Lado a lado sem filete, as quatro se leriam como irmãs, e a
     fila voltaria a ensinar a coisa errada. */
  const ab=(k,rot,n)=>'<button data-a="nota-filtro" data-v="'+k+'"'+(f===k?' aria-current="true"':'')+
    '>'+rot+' <i>'+n+'</i></button>';
  /* TRES niveis, e nao seis irmaos. Antes, "Todas", "De livros", "Soltas",
     "Para revisar", "Ideias" e "Por pergunta" estavam lado a lado com o mesmo
     peso, sendo coisas de naturezas diferentes: tres eram particao da mesma
     lista, uma era estado, uma nem sequer era nota e a ultima era ferramenta.
     Agora o primeiro nivel diz do que a area trata, e os recortes descem. */
  const area=f==="estudos"?"estudos":f==="pergunta"?"pergunta":"notas";
  const abA=(k,rot,n)=>'<button data-a="nota-filtro" data-v="'+k+'"'+
    (area===k?' aria-current="true"':'')+'>'+rot+(n!=null?' <i>'+n+'</i>':'')+'</button>';
  let h='<div class="pad larga"><div class="colE larga">'+
    '<h1 class="t">Conhecimento</h1><p class="sub">Livros e notas reunidos em volta de uma mesma coisa. '+
    'Uma nota pode ficar de fora \u2014 nem toda ideia entra numa gaveta.</p>'+
    '<div class="nfila">'+
      abA("estudos","Estudos",S.estudos.length)+
      abA("notas","Todas as notas",F.todas.length)+
      abA("pergunta","Por pergunta",null)+
      '<span class="sp"></span>'+
      (comNota.length>12?'<input class="campoN" id="buscaNotas" placeholder="Buscar" '+
        'value="'+esc(S.qNotas||"")+'" autocomplete="off">':'')+
      '<button class="lnk mudo" data-a="nota-nova">Escrever uma nota</button></div>'+
    /* o segundo nivel so existe dentro de "Todas as notas", e e visivelmente
       menor: sao recortes de uma lista, e nao lugares. */
    (area==="notas"
      ?'<div class="nfila2">'+ab("todas","Todas",F.todas.length)+
        ab("livros","De livros",F.livros.length)+ab("soltas","Soltas",F.soltas.length)+
        /* conta NOTAS, porque agora o recorte e mesmo so de notas. E some quando
         nao ha nenhuma: recorte que sempre devolve zero e ruido permanente,
         regra que ja vale nos filtros da Estante. */
      (F.rever.length?ab("rever","Para revisar",F.rever.length):'')+'</div>'
      :'');

  /* veio do Canvas para escolher: a tela diz para que serve o proximo toque,
     em vez de deixar a pessoa adivinhar que a lista virou um seletor. */
  if(S.trazendo)
    h+='<div class="recorte"><span>Toque em <b>Levar ao Canvas</b> dentro de uma nota para '+
      'trazê-la.</span><button class="lnk" data-a="cv-cancelar" style="padding:0">cancelar</button></div>';
  if(S.verEst&&S.verEst.length)
    h+='<div class="recorte"><span>Mostrando '+num(S.verEst.length)+
      ' nota'+(S.verEst.length===1?"":"s")+
      (terr?' de “'+esc(terr.nome)+'”':(S.recorteMotivo||' de um assunto'))+'.</span>'+
      '<button class="lnk" data-a="est-todas" style="padding:0">ver todas</button></div>';
  /* aqui, e nao antes do cabecalho: a vista Ideias precisa do h que carrega
     o titulo e a fila. Antes disso "h" ainda esta na zona morta, e a vista
     estourava ao ser aberta. */
  else if(f==="estudos")return h+vEstudos()+'</div></div>';
  else if(f==="pergunta")return h+vPergunta()+'</div></div>';
  /* a pauta subiu para o topo da entrada: ela e sobre o produto inteiro —
     livro, relacoes, notas —, e nao um recorte desta lista. */
  if(!vis.length)
    h+='<p class="vazioN">'+(q?'Nada com “'+esc(q)+'”.':
      f==="rever"?'Nenhuma nota marcada à mão. Dentro de uma nota, <b>marcar para revisar</b> guarda ela aqui.':
      f==="soltas"?'Nenhuma nota solta. Uma nota solta nasce fora de um livro — de uma conversa, de um susto, de nada.':
      'Nada escrito ainda.')+'</p>';
  else {S.listaVisivel=vis.map(d=>d.k);h+=listaNotas(vis);}
  if(soMarcados&&f!=="rever"&&!q)
    h+='<p class="saldo" style="margin-top:var(--s6)">'+soMarcados+' trecho'+(soMarcados>1?"s":"")+
      ' marcado'+(soMarcados>1?"s":"")+' sem nota — '+
      (soMarcados>1?"eles ficam":"ele fica")+' no livro, e não aqui.</p>';
  return h+'</div></div>';
}
/* ═══ A VISTA IDEIAS ═══
   Nao e uma lista de notas: e a lista do que atravessou livros. Nomeadas
   primeiro, porque essas sao suas; depois as que o Mekora contou e ninguem
   batizou ainda. */
/* ═══ POR PERGUNTA ═══
   A busca comum recupera; esta MONTA. Voce faz uma pergunta e recebe o que
   ja pensou sobre ela, reunido — e a diferenca entre as duas nao e de
   qualidade, e de proposito.

   Duas decisoes que vieram da exploracao de 11 de agosto e que eu adoto
   inteiras, porque as duas ja tinham sido testadas la:

   1. Procura NAS SUAS PALAVRAS, e nao no texto dos livros. O dossie reune o
      que voce pensou, nao o que o autor escreveu. Sem isso ele devolve o
      livro de volta, que e o contrario do que se pediu.
   2. Casamento por RADICAL, cortando as duas ultimas letras: "guardo" acha
      "guardar". Sem sinonimo e sem modelo de linguagem — ele erra de um
      jeito previsivel, e e isso que o torna confiavel. Um acerto que voce
      nao consegue explicar vale menos do que um erro que voce consegue. */
/* Cortar duas letras resolve "guardo" -> "guardar" (6 viram 4), mas nao
   resolve "repeticao" -> "repetido": 9 viram 7, e "repetido" nao contem
   "repetic". Com teto de seis, os dois passam — e a regra continua cabendo
   numa frase: ele compara so o comeco da palavra. */
const radical=w=>w.length>4?w.slice(0,Math.max(4,Math.min(w.length-2,6))):w;
function respondePergunta(q){
  const t=semAcento(q).split(/[^a-z]+/).filter(w=>w.length>2&&!PARAR.has(w));
  if(!t.length)return null;
  const casa=d=>{
    const alvo=semAcento(d.nota||"");
    const achou=t.filter(w=>alvo.indexOf(radical(w))>-1);
    return achou.length?{d:d,termos:achou}:null;
  };
  const r=levadas().map(casa).filter(Boolean)
    .sort((a,b)=>b.termos.length-a.termos.length);
  return {termos:t,achados:r};
}
function vPergunta(){
  const q=(S.qPergunta||"").trim();
  /* o rotulo dizia "juntar o que voce leu" e o paragrafo logo abaixo dizia
     que a busca NAO olha o que voce leu, e sim o que voce escreveu. Um dos
     dois estava errado, e era o rotulo. */
  let h='<label class="pgL" for="campoPergunta">Sobre o que você já pensou?</label>'+
    '<input id="campoPergunta" class="campoB" placeholder="ex.: atenção, tipografia, por que guardo demais" '+
    'value="'+esc(S.qPergunta||"")+'" autocomplete="off">'+
    /* cinco linhas de metodo antes de a pessoa ter perguntado qualquer coisa
       e aula, e nao ajuda. Uma linha fica; o resto abre quando pedirem. */
    '<p class="pgN">Procura <b>no que você escreveu</b>, e não no texto dos livros. '+
    '<button class="como" data-a="pg-como" aria-expanded="'+(!!S.pgComo)+'">como isto procura '+
    (S.pgComo?"▴":"▾")+'</button></p>'+
    (S.pgComo
      ?'<p class="pgN">Ele compara só o <b>começo da palavra</b>: “guardo” acha '+
       '“guardar”, e “repetição” acha “repetido”. Sem sinônimo e sem modelo de '+
       'linguagem — ele erra de um jeito previsível, e é isso que o torna confiável.</p>'
      :'');
  const r=q?respondePergunta(q):null;
  if(!r)return h;
  if(!r.achados.length)
    return h+'<p class="vazioN">Nada seu sobre \u201c'+esc(q)+'\u201d ainda. '+
      'Isso pode ser resposta: \u00e9 um assunto que voc\u00ea leu e n\u00e3o escreveu sobre.</p>';
  /* o dossie diz de quantos livros ele veio: e a unica coisa que a pergunta
     sozinha nao consegue dizer, e a que faz a reuniao valer. */
  const lvs=[...new Set(r.achados.map(x=>x.d.livro).filter(Boolean))];
  h+='<div class="soltoE">'+r.achados.length+' de '+levadas().length+' \u2014 '+
    (lvs.length>1?'de '+numM(lvs.length)+' livros':lvs.length?'de um livro':'sem livro')+'</div>'+
    '<div class="grupoE">'+r.achados.map(x=>linhaNota(x.d)).join("")+'</div>'+
    '<p class="pgN">Casou por: '+r.termos.map(w=>'<span class="mono">'+esc(radical(w))+'</span>').join(", ")+
    '. Se algo que deveria estar aqui ficou de fora, provavelmente voc\u00ea usou outra palavra \u2014 '+
    'e isso \u00e9 o limite, n\u00e3o um defeito escondido.</p>';
  return h;
}
/* ═══ A ENTRADA: OS ESTUDOS ═══
   Os seus primeiro, depois o que o Mekora acha que pode virar um, e no fim o
   que ficou de fora. A ordem e essa porque e a ordem da posse: coisa sua,
   coisa proposta, coisa solta. */
/* ═══ QUADRO DE ESTUDOS ═══
   A Fila provou que kanban nao serve para estado de leitura: leitura e
   derivada de prog, e arrastar nao e ler. Aqui a conta INVERTE. Fechar um
   estudo e uma decisao que so a pessoa toma, e nenhuma leitura a produz —
   entao o gesto de kanban vale exatamente para esta coluna, e para nenhuma
   outra. As outras duas continuam saindo do livro.
   E "fechado" nao e daqueles campos de status que apodrecem: status apodrece
   por exigir manutencao continua, e fechar acontece uma vez. */
const estadoEstudo=e=>e.fechado?"fechado"
  :(livrosDoEstudo(e).some(t=>{const b=noAcervo(t);return b&&estadoDe(b)==="lendo";})?"andando":"guardado");
/* so fechar e reabrir sao movimento: entre andando e guardado quem decide e o
   livro, e nao a mao. */
const qLegal=(de,para)=>de!==para&&(de==="fechado"||para==="fechado");
const Q_COLS=[["andando","Andando"],["guardado","Guardado"],["fechado","Fechado"]];
const Q_VAZIO={andando:"Nenhum estudo tem livro aberto agora.",
  guardado:"Nada guardado — o que existe está andando ou fechado.",
  fechado:"Nada fechado ainda."};
function vQuadro(){
  const cartao=e=>{
    const ns=e.notas.map(escK).filter(Boolean),lvs=livrosDoEstudo(e),fech=!!e.fechado;
    return '<div class="qCard" data-e="'+esc(e.id)+'">'+
      '<h3><button class="abre" data-a="est-abrir" data-v="'+esc(e.id)+'">'+esc(e.nome)+'</button></h3>'+
      (e.sobre?'<p class="sobre">'+esc(e.sobre)+'</p>':'')+
      '<p class="me">'+lvs.length+' livro'+(lvs.length===1?'':'s')+' · '+
        ns.length+' nota'+(ns.length===1?'':'s')+'</p>'+
      (lvs.length?'<div class="caps">'+lvs.map(t=>{const b=noAcervo(t);
        return b?'<img src="'+capaDe(b)+'" alt="'+esc(t)+'" title="'+esc(t)+'" loading="lazy">':'';}).join("")+'</div>':'')+
      /* arrastar sozinho seria inacessivel: o botao faz o mesmo pelo teclado */
      '<div class="qAcs"><button data-a="'+(fech?"est-reabrir":"est-fechar")+
        '" data-v="'+esc(e.id)+'">'+(fech?"reabrir":"fechar")+'</button></div>'+
      '</div>';
  };
  return '<div class="quadro" id="quadroEst">'+Q_COLS.map(c=>{
    const es=S.estudos.filter(e=>estadoEstudo(e)===c[0]);
    return '<div class="qCol -'+c[0]+'" data-c="'+c[0]+'">'+
      '<div class="qCab"><h2>'+c[1]+'</h2><span class="n">'+es.length+'</span>'+
      (c[0]==="fechado"?'<span class="lb">arraste para cá</span>':'')+'</div>'+
      '<div class="qPil">'+(es.length?es.map(cartao).join("")
        :'<p class="qVazio">'+Q_VAZIO[c[0]]+'</p>')+'</div></div>';
  }).join("")+'</div>'+
  '<p class="qPor" id="quadroPor"></p>'+
  '<p class="qRegra">Você move para <b>fechado</b> — essa é a decisão, e nenhuma '+
  'leitura a toma por você. As outras duas são consequência da leitura: um estudo anda '+
  'enquanto algum livro dele está aberto. Fechar não apaga nada, e reabrir é o mesmo '+
  'gesto ao contrário.</p>';
}
/* a mesma receita da Fila, e nenhuma parte dela e opcional: nada no DOM se
   mexe durante o arrasto, a captura mora no container que nao se move, e o
   limiar de 4px impede que todo clique vire arrasto de zero pixel. */
function quadroArrastavel(){
  const q=document.getElementById("quadroEst");
  if(!q)return;
  const por=document.getElementById("quadroPor");
  q.addEventListener("pointerdown",ev=>{
    const c=ev.target.closest(".qCard");
    if(!c||ev.button||ev.target.closest("[data-a]"))return;
    const de=c.closest(".qCol").dataset.c;
    ev.preventDefault();
    const cols=[...q.querySelectorAll(".qCol")];
    const rs=cols.map(x=>x.getBoundingClientRect());
    const x0=ev.clientX,y0=ev.clientY;
    let arrastando=false,alvo=de;
    q.setPointerCapture(ev.pointerId);
    if(por)por.textContent="";
    const marca=()=>cols.forEach(x=>{
      const k=x.dataset.c,mira=arrastando&&k===alvo&&k!==de;
      x.classList.toggle("-alvo",mira&&qLegal(de,k));
      x.classList.toggle("-recusa",mira&&!qLegal(de,k));
    });
    const move=e=>{
      const dx=e.clientX-x0,dy=e.clientY-y0;
      if(!arrastando){if(Math.abs(dx)<4&&Math.abs(dy)<4)return;
        arrastando=true;c.classList.add("-arrastando");}
      c.style.transform="translate("+dx+"px,"+dy+"px)";
      /* o alvo sai do PONTEIRO e testa os DOIS eixos. So o eixo X funcionava a
         1440 e mentia a 390: empilhadas, as tres colunas tem o mesmo left e
         right, entao todas casavam e a ultima vencia — qualquer arrasto
         fechava o estudo. */
      let novo=de;
      rs.forEach((r,i)=>{
        if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)
          novo=cols[i].dataset.c;});
      if(novo!==alvo){
        alvo=novo;marca();
        if(por)por.textContent=(alvo!==de&&!qLegal(de,alvo))
          ?"Arrastar não é ler: andando e guardado saem do livro, e não do gesto."
          :"";
      }
    };
    const solta=()=>{
      q.removeEventListener("pointermove",move);
      q.removeEventListener("pointerup",solta);
      q.removeEventListener("pointercancel",solta);
      c.style.transform="";c.classList.remove("-arrastando");
      cols.forEach(x=>x.classList.remove("-alvo","-recusa"));
      if(!arrastando)return;
      if(alvo===de||!qLegal(de,alvo)){pinta();return;}
      const alv=estudoK(c.dataset.e);
      if(alv)alv.fechado=(alvo==="fechado");
      pinta();
    };
    q.addEventListener("pointermove",move);
    q.addEventListener("pointerup",solta);
    q.addEventListener("pointercancel",solta);
  });
}
function vEstudos(){
  const abertos=ideias().filter(g=>S.ignoradas.indexOf(g.id)<0&&!S.estudos.some(e=>e.id===g.id));
  const fora=semEstudo();
  let h=faixaPendente();
  /* Quadro e VISTA, e nao lugar: a navegacao tem quatro e nenhum deles e um
     recorte do Conhecimento. Mesma disciplina da Fila na Estante. */
  h+='<div class="acs estNv">'+
     '<span class="vista"><button data-a="est-vista" data-v="lista" aria-pressed="'+
       (S.estVista!=="quadro")+'">Lista</button>'+
     '<button data-a="est-vista" data-v="quadro" aria-pressed="'+
       (S.estVista==="quadro")+'">Quadro</button>'+
     /* LEITURA e a terceira vista do mesmo material: Lista diz o que voce
        estuda, Quadro diz em que pe estao os estudos, e Leitura diz o que os
        estudos pedem que voce leia. */
     '<button data-a="est-vista" data-v="leitura" aria-pressed="'+
       (S.estVista==="leitura")+'">Leitura</button></span>'+
     '<span class="sp" style="flex:1"></span>'+
     (S.estNova==="novo"
       ?''
       :'<button class="sec" data-a="est-nova" data-v="novo">+ Novo estudo</button>')+'</div>';
  if(S.estNova==="novo")
    h+='<div class="nomeia"><label for="nomeEst">Que estudo \u00e9 este?</label>'+
      '<input id="nomeEst" class="campoB" placeholder="M\u00e9todo de campo" autocomplete="off">'+
      '<label for="sobreEst" style="margin-top:var(--s3)">Do que se trata — pergunta, suspeita, ou uma frase que você quer testar</label>'+
      '<input id="sobreEst" class="campoB" placeholder="A série é a medida; a foto isolada é lembrança" autocomplete="off">'+
      '<div class="acs"><button class="pri" data-a="est-criar-ok" data-v="novo">Criar</button>'+
      '<button class="sec" data-a="est-nova" data-v="">cancelar</button></div></div>';
  /* Leitura existe mesmo sem estudo nenhum: os livros do acervo continuam
     esperando, e a fila e onde se decide por onde comecar. */
  if(S.estVista==="leitura")return h+vFila(ACERVO);
  if(S.estudos.length)
    h+=S.estVista==="quadro"?vQuadro()
      :'<div class="estL">'+S.estudos.map(cartaoEstudo).join("")+'</div>';
  else if(S.estNova!=="novo")
    h+='<p class="vazioN">Nenhum estudo ainda. Um estudo re\u00fane os livros e as notas de '+
      'uma coisa só — e é você quem decide quando ela acabou.</p>';
  if(abertos.length)
    h+='<div class="soltoE" style="margin-top:var(--s7)">Talvez um estudo</div>'+
      abertos.map(blocoIdeias).join("");
  if(fora.length)
    h+='<div class="soltoE" style="margin-top:var(--s7)">Fora de estudo \u2014 '+fora.length+'</div>'+
      '<p class="pgN" style="margin-top:0">Elas aparecem na busca e em Todas as notas do mesmo jeito. '+
      'For\u00e7ar uma gaveta seria pior do que deix\u00e1-las aqui.</p>'+
      '<div class="grupoE">'+fora.map(linhaNota).join("")+'</div>';
  return h;
}
/* ═══ O QUE FICOU PELA METADE ═══
   Primeira coisa da entrada, e nao a ultima. Numa tela onde nada mais tem
   prioridade definida, o que tem acao pendente e a prioridade — a observacao e
   do Erik, e ela derrubou a minha primeira versao, que mandava isto para o
   rodape.
   Mas presenca nao e massa: quatro manchetes em serifa aqui fariam do
   Conhecimento uma lista de tarefas, que e o modelo de caixa de entrada do qual
   esta area acabou de sair. Uma linha, a mais urgente, com as outras a um
   toque. Alta posicao, baixa massa.
   E ela conta COISAS, e nao linhas: quando era aba, somar dava 8 contra
   "Todas 7" e parecia subconjunto maior que o todo — mas nunca foi subconjunto
   de nada, e agora que nao e mais recorte a contagem honesta cabe. */
function faixaPendente(){
  const P=pauta();
  if(!P.length)return "";
  const n=P.reduce((a,x)=>a+x.n,0);
  const linha=x=>'<div class="pit2"><p><button class="abre" data-a="'+x.a+'" data-v="'+
    esc(x.v||x.k)+'">'+esc(x.t)+'</button></p><cite>'+x.r+'</cite></div>';
  const resto=P.slice(1);
  return '<div class="pmeio"><div class="pmcab"><span class="lb">O que ficou pela metade</span>'+
    '<span class="n">'+n+'</span><span class="sp"></span>'+
    (resto.length
      ?'<button data-a="pauta-abrir" aria-expanded="'+(!!S.pautaAberta)+'">'+
        (S.pautaAberta?'recolher':'ver as outras '+resto.length)+'</button>'
      :'')+'</div>'+
    linha(P[0])+(S.pautaAberta?resto.map(linha).join(""):'')+'</div>';
}
/* O cartao carrega O CENTRO em destaque, e nao o nome: o nome diz como o
   estudo se chama, e o centro diz do que ele trata — e ele nao precisa ser
   pergunta. As capas entram pequenas porque aqui contam quantos, nao quais. */
function cartaoEstudo(e){
  const ns=e.notas.map(escK).filter(Boolean);
  const lvs=livrosDoEstudo(e);
  return '<div class="estC"><h3><button class="abre" data-a="est-abrir" data-v="'+esc(e.id)+'">'+
    esc(e.nome)+'</button></h3>'+
    (e.sobre?'<p class="sobre">'+esc(e.sobre)+'</p>':'')+
    '<p class="me">'+lvs.length+' livro'+(lvs.length===1?'':'s')+' \u00b7 '+
      ns.length+' nota'+(ns.length===1?'':'s')+' \u00b7 '+
      (e.sua?'voc\u00ea reuniu':'voc\u00ea nomeou')+'</p>'+
    (lvs.length?'<div class="caps">'+lvs.map(t=>{const b=noAcervo(t);
      return b?'<img src="'+capaDe(b)+'" alt="'+esc(t)+'" title="'+esc(t)+'" loading="lazy">':'';}).join("")+'</div>':'')+
    '</div>';
}
/* agrupada por livro: é a organização que já existe no material, e não uma
   que o usuário precise inventar antes de ganhar alguma coisa. */
function listaNotas(vis){
  const ordemL=Object.keys(LIVROS);
  const grupos=[];
  ordemL.forEach(t=>{const ds=vis.filter(d=>d.livro===t);if(ds.length)grupos.push([t,ds]);});
  vis.filter(d=>d.livro&&ordemL.indexOf(d.livro)<0).forEach(d=>{
    const g=grupos.find(g=>g[0]===d.livro);if(g)g[1].push(d);else grupos.push([d.livro,[d]]);});
  const soltas=vis.filter(d=>!d.livro);
  if(soltas.length)grupos.push([null,soltas]);
  /* Dentro do livro, uma nota guardada sob uma pergunta mora DENTRO dela. Se
     a area de Notas achatasse isso, a pergunta viraria irma da propria
     resposta — que e exatamente o erro ja corrigido la dentro. O pai e um
     item da lista, e nao um cabecalho: sem filhos, ele so nao tem nada
     embaixo. */
  return grupos.map(g=>{
    const ds=g[1].slice().sort(ordem);
    const pais=ds.filter(d=>!ancora(d)&&ds.some(x=>x.perg===d.k));
    const sob={};pais.forEach(p=>sob[p.k]=ds.filter(x=>x.perg===p.k));
    const soltos=ds.filter(d=>pais.indexOf(d)<0&&!(d.perg&&sob[d.perg]));
    return '<div class="soltoE">'+(g[0]?esc(g[0]):"Sem livro")+'</div>'+
      pais.map(p=>'<div class="grupoE">'+linhaPai(p)+sob[p.k].map(linhaNota).join("")+'</div>').join("")+
      (soltos.length?'<div class="grupoE">'+soltos.map(linhaNota).join("")+'</div>':'');
  }).join("");
}
/* a pergunta nao e citacao: ela nao ganha o degrau de papel, e o que esta
   guardado sob ela ganha. A mesma regra de dentro do livro. */
/* MENU DE OBJETO, na categoria do Erik: age sobre a coisa daquela linha, e nao
   sobre a tela nem sobre uma selecao. Um controle por item, e nao seis — a
   regra de "texto e porta, botao e arrumacao" continua valendo: a porta e a
   frase, e isto aqui e a arrumacao. */
function menuLinha(d){
  const ab=S.linhaMenu===d.k, tr=ancora(d), rev=S.rever.indexOf(d.k)>-1,
        noC=S.canvasN.indexOf(d.k)>-1;
  const i=(a,v,rot)=>'<button data-a="'+a+'" data-v="'+v+'">'+rot+'</button>';
  return '<button class="mls" data-a="linha-menu" data-v="'+d.k+'" aria-expanded="'+ab+'" '+
    'aria-label="O que fazer com esta nota">⋯</button>'+
    (ab?'<div class="mlm">'+
      (tr?i("nota-origem",d.k,"Abrir no livro"):"")+
      i("nota-abrir",d.k,"Ver a nota")+
      i("nota-editar",d.k,"Editar")+
      i("nota-canvas",d.k,noC?"Já está no Canvas":"Levar ao Canvas")+
      i("nota-rever",d.k,rev?"Tirar de para revisar":"Marcar para revisar")+
      '<span class="ln"></span>'+
      '<button class="-dan" data-a="nota-apagar" data-v="'+d.k+'">Apagar</button>'+
      '</div>':'');
}
function linhaPai(d){
  const r=relacoesDe(d.k),rot=[];
  rot.push(d.cap!=null?"sobre o capítulo "+(d.cap+1):"sobre o livro");
  rot.push(d.dia||"hoje");
  if(r.length)rot.push(num(r.length)+" relacionada"+(r.length>1?"s":""));
  return '<div class="cab" id="n-'+d.k+'">'+
    '<p><button class="abre" data-a="nota-abrir" data-v="'+d.k+'">'+esc(d.nota)+'</button></p>'+
    '<cite>'+rot.join(" · ")+'</cite>'+
    (S.rever.indexOf(d.k)>-1?'<span class="rev">para revisar</span>':'')+
    menuLinha(d)+'</div>';
}
function linhaNota(d){
  const r=relacoesDe(d.k),tr=escTxt(d),an=ancoraDe(d),qs=quaseDe(d);
  const rot=[];
  if(d.livro!=null&&d.cap!=null)rot.push(ehVideo(d.livro)?mmss(tempoDe(d)):"Capítulo "+(d.cap+1));
  else if(!d.livro)rot.push("escrita aqui");
  rot.push(d.dia||"hoje");
  if(r.length)rot.push(num(r.length)+" relacionada"+(r.length>1?"s":""));
  return '<div class="cit" id="n-'+d.k+'">'+
    '<p class="-nota"><button class="abre" data-a="nota-abrir" data-v="'+d.k+'">'+esc(d.nota)+'</button></p>'+
    (tr?'<button class="volta" data-a="nota-origem" data-v="'+d.k+'">↩ '+
      esc(tr.slice(0,72))+(tr.length>72?"…":"")+'</button>'
      :(perdida(d)?'<span class="volta -perdida">↩ o trecho não existe mais neste texto</span>':''))+
    (an&&COMO[an.como]?'<span class="reanc">reencontrado \u00b7 '+conf(an)+'</span>':'')+
    (qs?'<span class="reanc">o mais parecido '+conf(qs)+', abaixo dos '+pc(LIMIAR)+' exigidos</span>':'')+
    '<cite>'+rot.join(" · ")+'</cite>'+
    ((d.tags||[]).length?'<span class="tgL">'+d.tags.map(t=>
      '<button data-a="tag-ver" data-v="'+esc(t)+'">#'+esc(t)+'</button>').join("")+'</span>':'')+
    (S.rever.indexOf(d.k)>-1?'<span class="rev">para revisar</span>':'')+
    menuLinha(d)+'</div>';
}
/* ═══ O BLOCO DA IDEIA ═══
   O que o Mekora tem é uma contagem, e o que ele mostra é uma contagem. Ele
   não nomeia: propõe as palavras que contou e deixa o nome com quem sabe o
   que elas querem dizer. Nomear é o gesto que transforma a sugestão em
   Território — e é do usuário, sempre. */
/* Recebe o grupo em vez de escolher o primeiro: na entrada dos Estudos todos
   os sugeridos aparecem, porque cada um e a sugestao de um estudo — e nao um
   aviso solto no topo de uma lista de notas. */
function blocoIdeias(g){
  if(!g)return "";
  const pal=g.termos.slice(0,3).map(t=>'<b>'+esc(t.w)+'</b>').join(" · ");
  /* uma nota por livro, na ordem dos livros, para a amostra mostrar a
     travessia em vez de tres notas do mesmo lugar. */
  const mostra=[];
  const forte=g.termos[0]&&g.termos[0].p;
  g.livros.forEach(l=>{const ns=g.notas.filter(d=>d.livro===l);
    /* a que USA a palavra forte, e nao a primeira do livro: a amostra existe
       para mostrar a travessia, e uma nota que nao tem o termo nao mostra. */
    /* entre duas do mesmo livro, a que carrega MAIS dos termos da ideia:
       a amostra existe para mostrar a travessia, e a que so tangencia
       mostra menos. */
    const pontos=d=>{const w=palavras(d);
      return g.termos.slice(0,3).filter(t=>w.indexOf(t.p)>-1).length;};
    const d=ns.slice().sort((x,z)=>pontos(z)-pontos(x))[0];
    if(d)mostra.push(d);});
  /* uma linha por PALAVRA, com os livros que ela atravessa: por par, a mesma
     palavra aparecia quatro vezes e parecia quatro achados. */
  const como=g.termos.slice(0,5).map(t=>
    '<li>'+esc(t.w)+': '+t.livros.map(esc).join(", ")+'</li>').join("");
  return '<div class="ideia">'+
    '<p class="pal">'+pal+'</p>'+
    '<p class="frase">'+maiuscula(num(g.notas.length))+' notas suas, em '+
      numM(g.livros.length)+' livros diferentes, usam as mesmas palavras.</p>'+
    /* tres notas, uma por livro quando da: a lista inteira aqui seria uma
       segunda lista de notas em cima da lista de notas. */
    '<div class="grupoE">'+mostra.map(d=>
      '<div class="cit"><p class="-nota"><button class="abre" data-a="nota-abrir" data-v="'+d.k+'">'+
      esc(d.nota)+'</button></p><cite>'+esc(d.livro)+'</cite></div>').join("")+'</div>'+
    (g.notas.length>mostra.length?'<p class="maisN">e mais '+num(g.notas.length-mostra.length)+
      ' nota'+(g.notas.length-mostra.length>1?"s":"")+'.</p>':'')+
    (S.nomeando===g.id
      ?'<div class="nomeia"><label for="nomeIdeia">Que nome este estudo tem para você?</label>'+
        '<input id="nomeIdeia" class="campoB" placeholder="Observação como sistema" autocomplete="off">'+
        '<div class="acs"><button class="pri" data-a="ideia-nome-ok" data-v="'+esc(g.id)+'">Nomear</button>'+
        '<button class="sec" data-a="ideia-nomear" data-v="">cancelar</button></div></div>'
      :'<div class="acs"><button class="pri" data-a="ideia-nomear" data-v="'+esc(g.id)+'">Virar um estudo</button>'+
        '<button class="sec" data-a="ideia-ignorar" data-v="'+esc(g.id)+'">ignorar</button></div>')+
    '<button class="como" data-a="ideia-como" aria-expanded="'+(!!S.comoIdeia)+'">como cheguei aqui '+
      (S.comoIdeia?"▴":"▾")+'</button>'+
    (S.comoIdeia?'<div class="comoD"><ul>'+como+'</ul>'+
      '<p>Não li o sentido. Contei palavras de mais de cinco letras que aparecem '+
      'em notas de livros diferentes. O que elas querem dizer juntas é a sua parte.</p></div>':'')+
    '</div>';
}
/* ═══ UMA NOTA ═══
   A nota ganha um lugar próprio porque ela é uma coisa, e não uma linha de
   lista. Aqui ela mostra tudo o que sabe de si: o que você escreveu, de onde
   veio, e com quem parece falar. O trecho de origem aparece inteiro — a nota
   sem ele é meia frase, e foi para não perder essa metade que ela nasceu
   presa a um lugar. */
/* O CONJUNTO. Ele existe quando voce entrou a partir de um recorte — um
   conceito, uma tag, um livro, uma pergunta. Guarda a lista e a posicao, e
   e isso que permite a nota dizer "3 de 7" e oferecer os vizinhos. Sem ele
   a nota e uma ilha, e voltar e um chute. */
function conjuntoDe(k){
  const c=S.conj;
  if(!c||!c.lista.length)return null;
  const i=c.lista.indexOf(k);
  if(i<0)return null;
  return {lista:c.lista,i:i,n:c.lista.length,nome:c.nome,recorte:!!c.recorte,
    conc:c.concId?S.estudos.find(x=>x.id===c.concId):null};
}
/* O conjunto e montado NO CLIQUE, e nao adivinhado depois: quem sabe de onde
   voce veio e o lugar de onde voce clicou. Depois disso a nota so precisa
   olhar para S.conj. */
function conjuntoDaqui(){
  if(S.verEst&&S.verEst.length){
    const t=S.verEstId?S.estudos.find(x=>x.id===S.verEstId):null;
    return {lista:S.verEst.slice(),concId:t?t.id:null,recorte:true,
      nome:t?t.nome:((S.recorteMotivo||"").replace(/^ (de |com |que |cujo )?/,"")
        .replace(/[“”]/g,"").trim()||"este recorte")};
  }
  if(S.lugar==="estudo"){
    const t=estudoK(S.estK);
    if(t)return {lista:t.notas.slice(),concId:t.id,nome:t.nome,recorte:true};
  }
  if(S.lugar==="notas"&&S.listaVisivel&&S.listaVisivel.length>1){
    /* a lista inteira nao tem nome porque nao e um recorte: e a area. Sem
       isto a migalha saia "Conhecimento > Conhecimento" e a faixa dizia
       "Em Conhecimento", que e onde a pessoa esta sempre. */
    /* "Todas as notas" voltou a ter nome. Sem nome, o contador aparecia como
       "2 de 7" logo abaixo de uma migalha que diz "Metodo de campo" — e um
       numero sem dono embaixo de um endereco com nome so pode ser lido como se
       fosse do mesmo conjunto. A decisao de deixar a area sem nome valia
       quando a migalha tambem dizia "Conhecimento"; parou de valer quando a
       vizinha mudou. */
    const nomes={todas:"Todas as notas",livros:"De livros",soltas:"Soltas",
      rever:"Para revisar",pergunta:"esta pergunta"};
    return {lista:S.listaVisivel.slice(),concId:null,
      /* nomear a lista inteira criou um "ver todas" que sai para onde voce ja
         esta. A saida e do RECORTE, e nao do nome — sao duas coisas, e uma
         delas nao existe quando voce esta na lista inteira. */
      recorte:(S.nfiltro||"todas")!=="todas",
      nome:nomes[S.nfiltro||"todas"]||null};
  }
  return null;
}
function faixaConjunto(c){
  if(!c)return "";
  const ant=c.i>0?c.lista[c.i-1]:null, prox=c.i<c.n-1?c.lista[c.i+1]:null;
  const bt=(k,rot,lado)=>k
    ? '<button data-a="nota-abrir" data-v="'+k+'" class="'+lado+'">'+rot+'</button>'
    : '<span class="'+lado+' -off">'+rot+'</span>';
  /* Posicao e vizinhos sao a MESMA informacao — onde estou na fila, e como
     ando nela — e estavam a 406px um do outro. Ficam juntos, e o nome do
     recorte fica na outra ponta, que e o que a pessoa le uma vez so. */
  /* Sem recorte nao ha o que anunciar, e a faixa vira uma barra cinza vazia
     com tres controles encolhidos num canto. Ali ela e so um par de setas com
     a posicao no meio, sem fundo e sem filete: o peso do recipiente tem que
     acompanhar o peso do que ele carrega. */
  return '<div class="conj'+(c.nome?'':' -simples')+'">'+
    bt(ant,"\u2039","ant")+
    '<span class="pos">'+(c.i+1)+' de '+c.n+'</span>'+
    bt(prox,"\u203a","prox")+
    (c.nome?'<span class="em">em <b>'+esc(c.nome)+'</b></span>':'')+
    '<span class="sp"></span>'+
    (c.recorte?'<button class="sai" data-a="est-todas">ver todas</button>':'')+
    '</div>';
}
function vNota(){
  const d=escK(S.notaK);
  if(!d)return '<div class="pad larga"><div class="colE"><p class="vazioN">Essa nota não existe mais. '+
    '<button class="lnk mudo" data-a="ir" data-v="notas" style="padding:0">Voltar às notas</button></p></div></div>';
  const tr=escTxt(d),lv=d.livro?LIVROS[d.livro]:null;
  const onde=[];
  if(d.livro){onde.push(esc(d.livro));if(lv&&lv.autor)onde.push(esc(lv.autor));
    /* num video a coordenada e o SEGUNDO, e nao o capitulo. E ele e mais
       estavel que pagina: video nao reflui, entao a nota volta ao ponto exato
       sem os cinco passos de reancoragem que o texto precisa. */
    if(d.cap!=null)onde.push(ehVideo(d.livro)
      ? "Vídeo · " + mmss(tempoDe(d)) + (lv?" — "+esc(lv.caps[d.cap].n):"")
      : "Capítulo "+(d.cap+1)+(lv?" — "+esc(lv.caps[d.cap].n):""));}
  else onde.push("Escrita aqui");   /* "sem livro" ja estava dito por "aqui" */
  onde.push(d.dia||"hoje");
  const conj=conjuntoDe(d.k);
  /* A migalha termina no PAI, e nao na propria nota: o ultimo item repetia
     o titulo truncado, que estava dois centimetros abaixo. E o meio dela e
     o conjunto de onde voce veio quando ele existe — senao, o livro. */
  let h='<div class="pad larga"><div class="colE">'+
    /* O endereco de uma nota e o ESTUDO dela — a unica coisa em volta que nao
       muda quando voce pula de nota. Antes o meio da migalha era o livro ou o
       recorte de onde voce veio, recalculado a cada salto: dois saltos e ela
       ja contava outra historia. */
    migalhas((function(){
      const es=estudosDaNota(d.k);
      const raiz=["Conhecimento","ir","notas"];
      if(es.length)return [raiz,["Estudos","nota-filtro","estudos"],[es[0].nome,"est-abrir",es[0].id]];
      return [raiz,["Fora de estudo","nota-filtro","estudos"]];
    })())+
    faixaConjunto(conj);
  /* editar é a mesma superfície de escrever dentro do livro: uma nota não
     muda de natureza por estar sendo lida noutro lugar. */
  h+=S.notaAberta===d.k?notaLivre(d)
    :'<p class="notaG">'+esc(d.nota||"—")+'</p>';
  h+='<p class="ondeN">'+onde.join(" · ")+'</p>';
  const r=ancoraDe(d), aviso=r&&COMO[r.como], qs=quaseDe(d);
  if(tr)h+='<div class="trechoN"><p>“'+esc(tr)+'”</p>'+
    (aviso?'<p class="reanc">'+aviso+' '+confLongo(r)+'</p>':'')+
    '<button class="volta" data-a="nota-origem" data-v="'+d.k+'">↩ '+
    (ehVideo(d.livro)?'abrir no vídeo, em '+mmss(tempoDe(d)):'abrir no livro, onde isto está')+
    '</button></div>';
  /* uma nota cujo trecho sumiu nao vira lixo: ela continua sendo o que voce
     escreveu, e a tela diz o que perdeu em vez de fingir que nada mudou. */
  else if(perdida(d))h+='<div class="trechoN -perdida"><p>O trecho que originou esta nota '+
    'não existe mais neste texto.</p><p class="reanc">Guardado: “'+esc(d.cita||"")+'” · '+
    esc(d.livro||"")+(d.cap!=null?', capítulo '+(d.cap+1):'')+'.</p>'+
    /* o que fez a recusa, com os dois numeros que a fizeram: sem eles o
       limiar e uma decisao secreta, e nao da para discordar de uma decisao
       que nao aparece. */
    (qs?'<p class="reanc">O mais parecido '+conf(qs)+', e a citação em si bate '+
      pc(qs.pC)+'. Reancorar pede '+pc(LIMIAR)+' no conjunto e '+pc(PISO_CITA)+
      ' na citação.</p>':'')+'</div>';
  const rev=S.rever.indexOf(d.k)>-1,noC=S.canvasN.indexOf(d.k)>-1;
  /* Cinco verbos de naturezas diferentes estavam na mesma fila com o mesmo
     peso. Agora sao tres grupos separados por filete vertical: o que abre,
     o que muda o estado da nota, e o que a destroi — este ultimo sozinho,
     no fim. */
  h+='<div class="acs acsN">'+
    (tr?'<button class="pri" data-a="nota-origem" data-v="'+d.k+'">'+
      (ehVideo(d.livro)?'Abrir no vídeo':'Abrir no livro')+'</button>':'')+
    '<button class="'+(tr?"sec":"pri")+'" data-a="nota-editar" data-v="'+d.k+'">Editar</button>'+
    '<span class="di"></span>'+
    '<button class="sec" data-a="levar" data-v="'+d.k+'">'+
      /* explicito ganha de curto num gesto que a pessoa esta aprendendo:
         "trazer para ca" nao diz para onde, se voce ja esta ca. */
      (d.levada?"Tirar do Conhecimento":"Levar ao Conhecimento")+'</button>'+
    '<button class="sec" data-a="nota-canvas" data-v="'+d.k+'">'+
      (noC?"no Canvas":"P\u00f4r no Canvas")+'</button>'+
    '<button class="sec" data-a="nota-rever" data-v="'+d.k+'">'+
      (rev?"n\u00e3o revisar":"Revisar depois")+'</button>'+
    (S.voltarCanvas?'<span class="di"></span><button class="sec" data-a="ir" data-v="canvas">\u2039 voltar ao Canvas</button>':'')+
    '<span class="sp" style="flex:1"></span>'+
    '<button class="sec -dan" data-a="nota-apagar" data-v="'+d.k+'">apagar</button></div>';
  /* Tags e Conceitos sao a MESMA pergunta — "como voce classifica isto" — e
     estavam separadas por 60px, o mesmo vao que separava tudo do resto. Com
     tudo a mesma distancia, nada agrupa. Agora sao um bloco, com respiro
     interno menor que o externo. */
  /* Vazio, este bloco gastava 202px para dizer que nao ha nada: duas
     etiquetas e dois convites, zero conteudo. Sem tag e sem conceito ele
     encolhe para uma linha — as duas portas continuam ali, e o andaime
     some. */
  const semClas=!(d.tags||[]).length&&!estudosDaNota(d.k).length;
  h+='<div class="bloco">'+
    (semClas
      ?'<div class="cabB"><div class="soltoE">Como voc\u00ea classifica</div>'+
       '<button class="sec" data-a="tag-nova" data-v="'+d.k+'">+ tag</button>'+
       '<button class="sec" data-a="est-nova" data-v="'+d.k+'">criar um estudo</button></div>'+
       (S.tagNova===d.k||S.estNova===d.k?secTags(d)+secConceitos(d):'')
      /* com conteudo, "Tags" e "Estudos" ja dizem o que este titulo dizia: ele
         era uma terceira camada de rotulo para dois chips, e custava uma linha
         mais 30px de margem propria que somavam aos 30 da caixa. No estado
         vazio ele fica, porque la e o unico texto que explica os dois botoes. */
      :secTags(d)+secConceitos(d))+
    '</div>';
  h+=secRelacoes(d);
  return h+'</div></div>';
}
/* ═══ TAGS ═══
   Uma palavra colada na nota, e nada alem disso: tag nao tem pagina, nao tem
   membros e nao se abre. Ela existe para reencontrar, e por isso tocar numa
   recorta a lista. Se ela tivesse pagina, seria um conceito com outro nome. */
function secTags(d){
  const ts=d.tags||[];
  let h='<div class="conc tagS -linha"><span class="sublbl">Tags</span>';
  h+='<div class="cchips">'+ts.map(t=>'<span class="cchip -tag">'+
      '<button class="ir" data-a="tag-ver" data-v="'+esc(t)+'">#'+esc(t)+'</button>'+
      '<button data-a="tag-tirar" data-v="'+esc(t)+'|'+d.k+'" aria-label="Tirar #'+esc(t)+
      '">\u2715</button></span>').join("")+
    (S.tagNova===d.k
      ?'<span class="cchip -campo"><input id="campoTag" class="campoT" placeholder="palavra" '+
        'autocomplete="off"><button data-a="tag-por" data-v="'+d.k+'">ok</button></span>'
      :'<button class="cchip -add" data-a="tag-nova" data-v="'+d.k+'">+ tag</button>')+'</div>';
  /* as tags que ja existem no acervo entram como sugestao: digitar de novo o
     que ja foi escrito e o caminho mais curto para ter "foto" e "fotos". */
  const todas=[...new Set(S.dst.flatMap(x=>x.tags||[]))].filter(t=>ts.indexOf(t)<0);
  if(S.tagNova===d.k&&todas.length)
    h+='<div class="tagSug"><span>j\u00e1 usadas:</span>'+todas.slice(0,8).map(t=>

function secRelacoes(d){

/* ═══════════════════════════════════════════════════════════════════
   CONEXÕES — três direções, e não três aparências
   As três respondem a perguntas diferentes, e é por isso que estão na
   mesma página: elas não se escolhem por gosto visual. O mapa responde
   "como está a minha cabeça?"; a trilha responde "como cheguei até
   aqui?"; o território responde "sobre o que eu ando pensando?".
   O mapa não é mais a porta: só a trilha e o território sobrevivem a um
   acervo pequeno, e é por isso que a ordem é trilha, território, mapa.
   O mapa fica como vista opcional — se ele continua existindo é outra
   pergunta, e não é desta correção.
   ═══════════════════════════════════════════════════════════════════ */
/* rotuloNota sobreviveu ao mapa: a rede pequena do conceito ainda
   precisa de um nome curto por ponto. */
const VAZIA=/^(o|a|os|as|um|uma|que|de|do|da|dos|das|e|é|em|no|na|ao|se|por|para|com|mais|isso|isto)$/i;
const rotuloNota=d=>{
  const w=(d.nota||"").split(/[\s,;.:?!—–]+/).filter(x=>x&&!VAZIA.test(x));
  const t=w.slice(0,2).join(" ");
  return t.length>18?w[0].slice(0,18):t;
};
/* Os filtros de tipo de no existem por um motivo que nao e salvar o mapa:
   e para poder LIGAR os trechos marcados e ver a nuvem acontecer. Um
   argumento que a pessoa confere sozinha vale mais do que um que ela precisa
   aceitar de mim. Por isso "trechos" comeca desligado, com a contagem
   escrita ao lado do interruptor. */
const ZOOM=[["De longe","livros e conceitos"],["Meio","mais as suas notas"],
  ["De perto","mais os trechos marcados"]];
/* ═══════════════════════════════════════════════════════════════════
   A PÁGINA DE UM CONCEITO
   Conexões saiu da navegação. A medida que a matou: a correlação entre
   força da relação e proximidade no mapa era −0,145, e notas sem nada
   em comum ficavam mais perto (180px) do que as relacionadas (202px).
   Num arranjo espacial em que a posição não significa nada, o desenho
   inteiro é enfeite — a informação estava só nas linhas, e linha se lê
   traçando com o olho, um par de cada vez.

   O que sobrou de Conexões não era uma área: era a página de uma ideia.
   A trilha é a forma de UM conceito atravessando livros, então ela mora
   dentro dele. E Territórios já existia duas vezes — aqui e em Notas ›
   Ideias, com o mesmo nome e quase as mesmas ações.
   ═══════════════════════════════════════════════════════════════════ */

/* pares entre um conjunto de notas. Atravessar livro é o sinal fraco (a
   contagem); a ligação que você escreveu vale mesmo dentro do mesmo livro,
   porque ela não foi contada — foi decidida. */
function paresEntre(ns) {
  const pares = [], vis = {};
  const por = (a, b, termos, sua) => {
    const id = [a.k, b.k].sort().join("|");
    if (vis[id]) return;
    vis[id] = 1;
    pares.push({ a: a, b: b, termos: termos, sua: !!sua });
  };
  ns.forEach((a, i) => ns.slice(i + 1).forEach(b => {
    if (S.rel.some(r => r.indexOf(a.k) > -1 && r.indexOf(b.k) > -1)) { por(a, b, [], true); return; }
    if (!a.livro || !b.livro || a.livro === b.livro) return;
    const t = comuns(a, b);
    if (t.length) por(a, b, t, false);
  }));
  return pares;
}

/* o caminho mais longo que não repete nota. Não repetir LIVRO era regra do
   mapa antigo, onde a trilha era sempre entre livros; dentro de um conceito
   feito à mão, duas notas do mesmo livro podem ser passos legítimos. */
/* entre os termos que um par compartilha, o que MAIS aparece no conceito
   inteiro: "encontrar" e "repeticao" pesavam igual num par, e so o segundo
   e o que a ideia e sobre. */
function termoForte(termos, ns) {
  if (!termos || !termos.length) return null;
  const conta = t => ns.filter(d => palavras(d).indexOf(t) > -1).length;
  return termos.slice().sort((a, b) => conta(b) - conta(a))[0];
}
function trilhaDe(ns) {
  const adj = {};
  paresEntre(ns).forEach(p => {
    (adj[p.a.k] || (adj[p.a.k] = [])).push({ k: p.b.k, t: p.termos, sua: p.sua });
    (adj[p.b.k] || (adj[p.b.k] = [])).push({ k: p.a.k, t: p.termos, sua: p.sua });
  });
  /* Maximizar comprimento sozinho produzia zigue-zague: Diario, Estudo,
     Diario, Malha, Diario. O que a trilha existe para mostrar e a IDEIA
     atravessando livros, entao livros distintos vem primeiro e o tamanho e
     so o desempate. */
  /* tres criterios, nesta ordem: quantos LIVROS o caminho atravessa, quantas
     PALAVRAS DIFERENTES o ligam, e so entao o tamanho. Sem o segundo, o
     vencedor era um caminho em que "registro" ligava tres notas seguidas —
     isso nao e uma ideia se desenvolvendo, e a mesma palavra repetida. */
  const nota=cam=>{const lv={},pl={};
    cam.forEach(p=>{if(p.nota.livro)lv[p.nota.livro]=1;if(p.termo)pl[p.termo]=1;});
    return [Object.keys(lv).length,Object.keys(pl).length,cam.length];};
  let melhor=[],melhorN=[0,0,0];
  const anda = (k, vis, cam) => {
    const n=nota(cam);
    if(n[0]>melhorN[0]||(n[0]===melhorN[0]&&(n[1]>melhorN[1]||
       (n[1]===melhorN[1]&&n[2]>melhorN[2])))){melhor=cam.slice();melhorN=n;}
    (adj[k] || []).forEach(e => {
      const o = escK(e.k);
      if (!o || vis[e.k]) return;
      vis[e.k] = 1;
      anda(e.k, vis, cam.concat([{ termo: termoForte(e.t, ns), sua: e.sua, nota: o }]));
      delete vis[e.k];
    });
  };
  Object.keys(adj).forEach(k => {
    const d = escK(k); if (!d) return;
    const vis = {}; vis[k] = 1;
    anda(k, vis, [{ termo: null, nota: d }]);
  });
  return melhor.length > 1 ? melhor : null;
}

/* itens: [rotulo, acao, valor]. O ultimo e onde voce esta, e nao e link —
   um link para a pagina atual e um convite a recarregar. */
function migalhas(itens){
  /* O que decide se e link nao e a POSICAO, e ter acao: na pagina de uma

  return '<nav class="migl" aria-label="Onde voce esta">'+itens.map((x,i)=>

        esc(x[0])+'</button>')+(i<itens.length-1?'<i>›</i>':'')).join("")+'</nav>';
}

      const d = passo.nota, tr = escTxt(d);
      if (passo.termo || passo.sua)
        h += '<div class="elo' + (passo.sua ? ' -nomeada' : '') + '" style="--i:' + i + '"><span>' +
          (passo.sua ? 'você ligou' : esc(inteira(passo.termo, [cam[i - 1].nota, d]))) + '</span>' +
          '<i>' + (passo.sua ? 'ligação sua' : 'palavra em comum') + '</i></div>';
      h += '<div class="pas" style="--i:' + i + '"><div class="lv">' + esc(d.livro || "sem livro") +
        (d.cap != null && d.livro ? ' · cap. ' + (d.cap + 1) : '') + '</div>' +
        (tr ? '<p class="tr">“' + esc(tr) + '”</p>' : '') +
        '<p class="nt"><button class="abre" data-a="nota-abrir" data-v="' + d.k + '">' +
        esc(d.nota) + '</button></p></div>';
    });
    h += '</div>';
  }
  if (soltas.length && cam)
    h += '<div class="soltoE">As outras notas</div><div class="grupoE">' +
      soltas.map(linhaNota).join("") + '</div>';

  /* A REDE, recolhida. Ela sobrevive só neste tamanho e só como opção: a
     posição continua não significando nada, mas com cinco pontos dá para ver
     a forma de uma vez, sem traçar linha com o olho. */
  h += '<button class="como" data-a="est-rede" aria-expanded="' + (!!S.redeAberta) + '">' +
    'ver como rede ' + (S.redeAberta ? "▴" : "▾") + '</button>' +
    (S.redeAberta ? redeDe(ns) : '');
  return h + '</div></div>';
}

/* ═══════════════════════════════════════════════════════════════════
   A REDE, REFEITA NO MODELO QUE FUNCIONA
   A que eu tinha morreu por medida: a posição não carregava informação
   (nós ligados ficavam 202px de distância, os sem relação 180px — pior
   que o acaso). Mas a exploração da área pessoal, de 11 de agosto, tem
   uma rede em que ligados ficam a 218px e não-ligados a 315px: 44% mais
   perto. Três diferenças, e nenhuma é de gosto:

     1. ARESTA É FATO, não palpite. "saiu deste livro" e "toca neste
        assunto" são verdades por construção. Prefixo de cinco letras em
        comum é adivinhação, e adivinhação desenhada vira ruído.
     2. LAYOUT DE FORÇA, não círculo por ordem de inserção. Quem se liga
        se atrai; quem não se liga se repele. É isso que faz a posição
        querer dizer alguma coisa.
     3. O NÓ É O OBJETO, não uma bolinha. Livro, ideia e assunto
        aparecem com o que são. Custa espaço; em troca a rede se lê
        parada, sem hover.

   O layout é determinístico: mesma entrada, mesmo desenho. A pessoa
   precisa reconhecer o próprio mapa entre uma visita e outra.
   ═══════════════════════════════════════════════════════════════════ */
function grafoDe(ns) {
  const nos = [], ar = [], idx = {};
  const por = (id, tipo, rot, extra) => {
    if (idx[id] !== undefined) return idx[id];
    idx[id] = nos.length;
    nos.push(Object.assign({ id: id, tipo: tipo, rot: rot }, extra || {}));
    return idx[id];
  };
  ns.forEach(d => {
    const ni = por("n:" + d.k, "nota", d.nota || escTxt(d), { k: d.k });
    if (d.livro) ar.push({ a: por("b:" + d.livro, "livro", d.livro), b: ni, tipo: "origem" });
    (d.tags || []).forEach(t => ar.push({ a: ni, b: por("t:" + t, "assunto", "#" + t), tipo: "tema" }));
    S.estudos.forEach(c => {
      if (c.notas.indexOf(d.k) > -1) ar.push({ a: ni, b: por("c:" + c.id, "estudo", c.nome), tipo: "tema" });
    });
  });
  /* a ligação que você escreveu à mão também é fato — a mais fato de todas */
  S.rel.forEach(r => {
    const a = idx["n:" + r[0]], b = idx["n:" + r[1]];
    if (a !== undefined && b !== undefined) ar.push({ a: a, b: b, tipo: "sua" });
  });
  return { nos: nos, ar: ar };
}
function posicionar(g, W, H) {
  const n = g.nos.length; if (!n) return;
  g.nos.forEach((o, i) => {
    const a = i * 2 * Math.PI / n, r = Math.min(W, H) * 0.34;
    o.x = W / 2 + Math.cos(a) * r; o.y = H / 2 + Math.sin(a) * r;
    /* a caixa É o nó, então a repulsão precisa saber o tamanho dela */
    o.w = o.tipo === "assunto" ? Math.max(56, o.rot.length * 7.4 + 20)
      : o.tipo === "livro" ? Math.max(108, Math.min(184, o.rot.length * 7.2 + 24))
      : o.tipo === "estudo" ? Math.max(96, Math.min(200, o.rot.length * 7.4 + 24))
      : 182;
    o.h = o.tipo === "nota" ? 52 : 32;
  });
  for (let it = 0; it < 600; it++) {
    /* o resfriamento nao chega a zero: as ultimas voltas ainda precisam de
       forca para desfazer a ultima sobreposicao. */
    const t = 1 - it / 600 * 0.86;
    g.ar.forEach(e => {
      const A = g.nos[e.a], B = g.nos[e.b];
      const dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const alvo = e.tipo === "origem" ? 146 : e.tipo === "sua" ? 104 : 118;
      const f = (d - alvo) * 0.012 * t;
      A.x += dx / d * f; A.y += dy / d * f; B.x -= dx / d * f; B.y -= dy / d * f;
    });
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const A = g.nos[i], B = g.nos[j];
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.max(1, Math.hypot(dx, dy));
      /* Separar nos dois eixos, e nao pela diagonal: duas caixas largas e
         baixas podem estar a 200px de centro e ainda assim se sobrepor, e
         empurrar na diagonal nao resolve isso. Aqui o teste e o mesmo que
         o olho faz — as caixas se cruzam? — e o empurrao vai no eixo em
         que a sobreposicao e menor. */
      const sx = (A.w + B.w) / 2 + 14 - Math.abs(dx);
      const sy = (A.h + B.h) / 2 + 12 - Math.abs(dy);
      if (sx > 0 && sy > 0) {
        const f = 0.55 * t;
        if (sx < sy) { const e = sx * f * (dx < 0 ? -1 : 1); A.x -= e; B.x += e; }
        else { const e = sy * f * (dy < 0 ? -1 : 1); A.y -= e; B.y += e; }
      }
    }
  }
}
function redeDe(ns) {
  const g = grafoDe(ns);
  if (!g.nos.length) return '';
  const W = 900, H = 560;
  posicionar(g, W, H);
  /* a moldura acompanha o desenho: cortar o grafo pela metade seria pior
     do que não desenhar. */
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  g.nos.forEach(o => {
    x0 = Math.min(x0, o.x - o.w / 2); x1 = Math.max(x1, o.x + o.w / 2);
    y0 = Math.min(y0, o.y - o.h / 2); y1 = Math.max(y1, o.y + o.h / 2);
  });
  const m = 18, vb = [x0 - m, y0 - m, (x1 - x0) + 2 * m, (y1 - y0) + 2 * m];
  const linhas = g.ar.map(e => {
    const A = g.nos[e.a], B = g.nos[e.b];
    /* curva leve: duas retas paralelas entre as mesmas caixas viram uma só
       aos olhos, e a curva separa sem precisar de cor. */
    const mx = (A.x + B.x) / 2 + (B.y - A.y) * 0.07;
    const my = (A.y + B.y) / 2 - (B.x - A.x) * 0.07;
    return '<path d="M' + A.x.toFixed(1) + ' ' + A.y.toFixed(1) + ' Q' + mx.toFixed(1) + ' ' +
      my.toFixed(1) + ' ' + B.x.toFixed(1) + ' ' + B.y.toFixed(1) + '" class="rl -' + e.tipo + '"/>';
  }).join("");
  /* a reticencia tambem recua ate o espaco: "nao" virava "na…", que le
     como erro de digitacao e nao como texto cortado. */
  const corta = (s, n) => {
    if (s.length <= n) return s;
    let c = s.lastIndexOf(" ", n);
    if (c < n * 0.6) c = n;
    return s.slice(0, c).replace(/[ ,;.]+$/, "") + "…";
  };
  const caixas = g.nos.map(o => {
    const x = (o.x - o.w / 2), y = (o.y - o.h / 2);
    let corpo;
    if (o.tipo === "nota") {
      /* cortar em 30 caracteres partia "lembranca" ao meio. A quebra
         procura o ultimo espaco antes do limite, como qualquer linha. */
      const quebra = (txt, n) => {
        if (txt.length <= n) return [txt, ""];
        let c = txt.lastIndexOf(" ", n);
        if (c < n * 0.5) c = n;
        return [txt.slice(0, c), txt.slice(c).trim()];
      };
      const par = quebra(o.rot, 30);
      const l1 = par[0], l2 = corta(par[1], 30);
      corpo = '<text x="' + (x + 11).toFixed(1) + '" y="' + (y + 21).toFixed(1) + '" class="rt">' + esc(l1) + '</text>' +
        (l2 ? '<text x="' + (x + 11).toFixed(1) + '" y="' + (y + 37).toFixed(1) + '" class="rt -2">' + esc(l2) + '</text>' : '');
    } else {
      corpo = '<text x="' + (o.x).toFixed(1) + '" y="' + (o.y + 4.5).toFixed(1) +
        '" class="rt -' + o.tipo + '" text-anchor="middle">' + esc(corta(o.rot, 24)) + '</text>';
    }
    const acao = o.tipo === "nota" ? ' data-a="nota-abrir" data-v="' + o.k + '"' : '';
    return '<g class="rn -' + o.tipo + '"' + acao + (o.tipo === "nota" ? ' tabindex="0" role="button"' : '') +
      ' aria-label="' + esc((o.tipo === "nota" ? "Ideia: " : o.tipo === "livro" ? "Livro: " : "Assunto: ") + corta(o.rot, 60)) + '">' +
      '<rect class="rbox" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + o.w +
      '" height="' + o.h + '" rx="' + (o.tipo === "assunto" ? o.h / 2 : 0) + '"/>' + corpo + '</g>';
  }).join("");
  const conta = t => g.nos.filter(o => o.tipo === t).length;
  return '<div class="redeW">' +
    '<div class="redeL"><span class="-livro">' + conta("livro") + ' livros</span>' +
    '<span class="-nota">' + conta("nota") + ' ideias</span>' +
    (conta("assunto") ? '<span class="-assunto">' + conta("assunto") + ' assuntos</span>' : '') +
    (conta("estudo") ? '<span class="-conceito">' + conta("estudo") + ' conceitos</span>' : '') +
    '<span class="di"></span><span class="-lorigem">saiu deste livro</span>' +
    '<span class="-ltema">toca neste assunto</span></div>' +
    '<svg viewBox="' + vb.map(v => v.toFixed(0)).join(" ") + '" class="rede" role="img" ' +
    'aria-label="Rede das ideias deste conceito">' + linhas + caixas + '</svg>' +
    '<p class="mapaN">As ligações são fatos: <b>de onde a ideia saiu</b> e <b>que assunto ela toca</b>. ' +
    'Nenhuma linha foi inferida — se duas ideias não se ligam aqui, é porque nada as liga de verdade.</p></div>';
}

const CVL = 210;   /* largura fixa do item: a variavel e a posicao, nao a caixa */

function cvPos(k, i) {
  const p = S.canvasPos[k];
  if (p) return p;
  /* quem chega sem lugar entra numa grade, e nao empilhado na origem */
  const col = i % 4, lin = Math.floor(i / 4);
  return { x: 28 + col * (CVL + 26), y: 28 + lin * 150 };
}
function vCanvas() {
  /* itens do campo: fonte e nota na mesma lista, porque a linha que liga uma a
     outra e o ponto do Canvas. */

    ? (fonteDaChave(k) ? {fonte:true, k:k, t:tituloDaChave(k)} : null)

  let h = '<div class="pad larga"><div class="cvTopo">' +
    '<div><h1 class="t">Canvas</h1>' +
    '<p class="sub">Aqui você junta de propósito o que ainda não tem lugar — fontes e notas, soltas. No Conhecimento elas viram estudo, se um dia virarem.</p></div>' +
    '<div class="cvFer">' + bt("mover", "Mover") + bt("ligar", "Ligar") + bt("tirar", "Tirar") +

      '<b>Escrever aqui</b> começa uma nota nova, que passa a existir também no Conhecimento. ' +
      'E uma <b>fonte</b> entra por <b>Este arquivo › Pôr no Canvas</b> — vídeo, imagem ou livro.</p></div></div>';
  h += '<div class="cvCampo" id="cvCampo"' + (modo === "ligar" ? ' data-ligando="1"' : '') + '>' +
    '<svg class="cvLinhas" id="cvLinhas"></svg>';
  itens.forEach((d, i) => {
    /* A FONTE E CONTINENTE E A NOTA E ATOMO, e no campo isso tem de ser visivel
       de longe: a fonte entra pela imagem e leva chao; a nota continua sendo
       texto no papel. Se as duas parecessem iguais, o Canvas viraria uma pilha
       de retangulos de texto — que e o que ele ja era. */
    if (d.fonte) {
      const b = noAcervo(d.t), lv = fonteDaChave(d.k);
      const p2 = cvPos(d.k, i), sel2 = S.cvLigando === d.k;
      const tipo = lv && lv.tipo === "video" ? "vídeo" : (lv && lv.tipo === "imagem" ? "imagem" : "livro");
      h += '<div class="cvIt -fonte' + (sel2 ? ' -sel' : '') + '" data-k="' + d.k + '" ' +

        (b ? '<img src="' + capaDe(b) + '" alt="">' : '') +
        (lv && lv.tipo === "video" ? '<span class="cvPlay">\u25b6</span>' : '') +
        '<b>' + esc(d.t) + '</b>' +
        '<cite>' + tipo + (lv && lv.autor ? ' \u00b7 ' + esc(lv.autor) : '') + '</cite>' +
        '<div class="cvAcs">' +
        '<button data-a="ir-livro" data-v="' + esc(d.t) + '">abrir</button>' +
        '</div></div>';
      return;
    }
    const p = cvPos(d.k, i), tr = escTxt(d);
    const sel = S.cvLigando === d.k;
    h += '<div class="cvIt' + (sel ? ' -sel' : '') + '" data-k="' + d.k + '" ' +
      'style="left:' + p.x + 'px;top:' + p.y + 'px">' +
      '<p>' + esc((d.nota || tr).slice(0, 120)) + ((d.nota || tr).length > 120 ? "…" : "") + '</p>' +
      '<cite>' + (d.livro
        ? esc(d.livro) + (d.cap != null
            ? ' · ' + (ehVideo(d.livro) ? mmss(tempoDe(d)) : 'cap. ' + (d.cap + 1))
            : '')
        : 'escrita aqui') + '</cite>' +
      '<div class="cvAcs">' +
      (ancora(d) ? '<button data-a="nota-origem" data-v="' + d.k + '">abrir no livro</button>' : '') +
      '<button data-a="nota-abrir" data-v="' + d.k + '">ver a nota</button></div></div>';
  });
  h += '</div>';
  /* o que foi ligado aqui é dito em palavras logo abaixo: uma linha diz que
     existe relação, e nunca diz qual. */
  const suas = S.rel.filter(r => S.canvasN.indexOf(r[0]) > -1 && S.canvasN.indexOf(r[1]) > -1);
  /* conta os DOIS, agora que o campo segura fonte tambem */
  const nf = itens.length - ns.length;
  h += '<p class="cvSaldo">' + ns.length + (ns.length === 1 ? ' nota' : ' notas') +
    (nf ? ' e ' + nf + (nf === 1 ? ' fonte' : ' fontes') : '') + ' no campo · ' +
    (suas.length ? suas.length + (suas.length > 1 ? ' ligações suas' : ' ligação sua') +
      ', e elas aparecem em <b>Você ligou</b> dentro de cada nota'
      : 'nenhuma ligação ainda — em <b>Ligar</b>, toque em duas') + '.</p>';
  return h + '</div>';
}

/* As linhas são desenhadas DEPOIS da pintura, medindo as caixas de verdade.
   Estimar o centro por largura fixa erra assim que o texto muda de altura, e
   uma linha que não encosta no que ela liga não está ligando nada. */
function desenhaLigacoes() {
  const campo = document.getElementById("cvCampo"), svg = document.getElementById("cvLinhas");
  if (!campo || !svg) return;
  const cr = campo.getBoundingClientRect();
  const centro = {};
  campo.querySelectorAll(".cvIt").forEach(el => {
    const r = el.getBoundingClientRect();
    centro[el.dataset.k] = { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 };
  });
  const linhas=S.rel.map(r=>({a:centro[r[0]],b:centro[r[1]],k:r.join("|")}))
    .filter(l=>l.a&&l.b);
  svg.setAttribute("viewBox","0 0 "+Math.round(cr.width)+" "+Math.round(cr.height));
  /* a linha nova se traca de A para B: uma linha que aparece inteira nao diz
     QUAIS duas coisas foram ligadas quando ha oito na mesa. O traco diz, e
     diz uma vez so. */
  const nk=S.novaRel?S.novaRel.split("|").sort().join("|"):null;
  svg.innerHTML=linhas.map(l=>{
    const nova=nk&&l.k.split("|").sort().join("|")===nk;
    const c=Math.round(Math.hypot(l.b.x-l.a.x,l.b.y-l.a.y));
    return '<line x1="'+l.a.x.toFixed(1)+'" y1="'+l.a.y.toFixed(1)+'" x2="'+l.b.x.toFixed(1)+
      '" y2="'+l.b.y.toFixed(1)+'"'+
      (nova?' class="-traca" style="stroke-dasharray:'+c+';stroke-dashoffset:'+c+'"':'')+'/>';
  }).join("");
}

/* Arrastar mexe no estilo do elemento, e só grava no estado ao soltar:
   repintar a tela inteira a cada movimento do ponteiro devolveria o objeto
   sob o cursor a cada quadro. */
function arrastavel() {
  const campo = document.getElementById("cvCampo");
  if (!campo || (S.cvModo || "mover") !== "mover") return;
  campo.addEventListener("pointerdown", ev => {
    const it = ev.target.closest(".cvIt");
    if (!it || ev.target.closest("[data-a]")) return;
    const cr = campo.getBoundingClientRect();
    const ir = it.getBoundingClientRect();
    const dx = ev.clientX - ir.left, dy = ev.clientY - ir.top;
    it.setPointerCapture(ev.pointerId);
    it.classList.add("-arrastando");
    const move = e => {
      const x = Math.max(0, Math.min(cr.width - ir.width, e.clientX - cr.left - dx));
      const y = Math.max(0, Math.min(cr.height - ir.height, e.clientY - cr.top - dy));
      it.style.left = x + "px"; it.style.top = y + "px";
      desenhaLigacoes();
    };
    const solta = () => {
      it.removeEventListener("pointermove", move);
      it.removeEventListener("pointerup", solta);
      it.classList.remove("-arrastando");
      S.canvasPos[it.dataset.k] = { x: parseFloat(it.style.left), y: parseFloat(it.style.top) };
    };
    it.addEventListener("pointermove", move);
    it.addEventListener("pointerup", solta);
  });
}

}

  if(f==="limpar-hist")return folha("Histórico","Apagar o histórico da conta?",

    '<div class="nota"><span>◆</span><div>É a única coisa que se apaga aqui, e ela não guarda nada sobre os '+

    '<button class="lnk mudo" data-a="fechar">Manter</button>'+

  if(f==="apagar-conta"){

'line-height:var(--lh-leitura);color:var(--ink-2)">Sai tudo, e não guardamos cópia:</p>'+
      '<div class="lista">'+

        li("er","✕","O que você escreveu","Notas presas a trechos, anotações sobre os livros, e as perguntas que você criou.","","")+
        li("er","✕","2 dispositivos e o histórico","","","")+
      '</div>'+
      '<p style="margin:var(--s4) 0 var(--s2);font-size:13.5px">Para confirmar, escreva <b>apagar</b>:</p>'+
      '<input id="pcampo" class="campoB" value="'+esc(S.prasc||"")+'" autocomplete="off" placeholder="apagar">'+
      '<div class="nota"><span>◆</span><div>Depois disto mandamos um e-mail para <b>erik@exemplo.com</b> com '+
      'um link de confirmação. A conta só sai quando você clicar nele — dá para desistir até lá.</div></div>',
      '<button class="lnk mudo" data-a="fechar">Cancelar</button>'+
      '<button class="btnD"'+(ok?'':' disabled style="opacity:.4;cursor:not-allowed"')+
      ' data-a="'+(ok?"conta-apagar-ok":"nada")+'">Apagar minha conta</button>');
  }
  if(f==="sair-processando")return folha("Sair","Há um arquivo sendo preparado",
    '<p style="margin:0;font-size:var(--t-leitura);font-family:var(--serif);line-height:var(--lh-leitura);color:var(--ink-2)">'+
    '<b>Censo de Fauna — digitalização.pdf</b> está no meio do reconhecimento de texto. O trabalho continua '+
    'do lado do Mekora mesmo se você sair — quando entrar de novo, ele estará na Mesa, pronto ou em curso.</p>'+
    '<div class="nota"><span>◆</span><div>Não perde nada. Só não dá para acompanhar de fora da conta.</div></div>',
    '<button class="lnk mudo" data-a="fechar">Ficar</button>'+
    '<button class="btnO forte" data-a="sair-ok">Sair mesmo assim</button>');
  if(f==="hist-item"){
    const x=HIST.find(y=>y[2]===S.prasc)||HIST[0];
    return folha("Histórico · "+x[0]+", "+x[1],esc(x[2]),
      '<div style="background:var(--branco);padding:0 var(--s4)">'+
      '<div class="campo"><span class="k">Onde</span><span class="v">'+x[3]+'</span><span></span></div>'+
      '<div class="campo"><span class="k">Quando</span><span class="v">'+x[0]+', '+x[1]+'</span><span></span></div>'+
      '<div class="campo"><span class="k">De onde</span><span class="v">'+x[4]+
      '<small>É o que dá para saber com honestidade hoje.</small></span><span></span></div></div>'+
      '<div class="pendencia"><span>◆</span><div>Navegador, sistema e cidade só apareceriam aqui se '+
      'existissem de verdade. Como autenticação ainda não está implementada, não há sessão para descrever — '+

'">Ir para '+x[3]+'</button>');
  }
  if(f==="usb"){
    const U=S.usb,ap=principal();
    if(U.p===0)return folha("Kindle","Conectar o Kindle no cabo",
      '<div class="usb"><div class="usbfig"><div class="usbmk">Mekora</div>'+
      '<div class="usbfio"></div><div class="usbap"><i></i></div></div>'+
      '<p class="usbst">Ligue o cabo e desbloqueie o aparelho. Ele aparece como um disco no computador.</p>'+
      '</div>'+
      '<div class="nota"><span>◆</span><div>Pelo cabo dá para fazer as duas coisas: <b>levar</b> os arquivos '+
      'preparados e <b>trazer</b> o que você marcou lendo. Pelo e-mail só dá para levar.</div></div>',
      '<button class="lnk mudo" data-a="fechar">Agora não</button>'+
      '<button class="btnO forte" data-a="usb" data-v="1">O aparelho está conectado</button>');
    if(U.p===1)return folha("Kindle","Lendo o aparelho",
      '<div class="usb"><div class="usbfig"><div class="usbmk">Mekora</div>'+
      '<div class="usbfio -volta"><i></i></div><div class="usbap -on"><i></i></div></div>'+
      '<p class="usbst"><b>'+esc(ap?ap.nome:"Kindle")+'</b> reconhecido · lendo <span class="mono">My Clippings.txt</span></p>'+
      '<div class="usbtr"><i style="width:'+U.pct+'%"></i></div>'+
      '<p class="usbst" style="font-size:12.5px;color:var(--ink-3)">É o arquivo onde o Kindle guarda tudo o '+
      'que você destacou. Não mexemos em mais nada do aparelho.</p></div>',
      '<button class="lnk mudo" data-a="fechar">Cancelar</button>');
    if(U.p===2){
      const novos=CLIPS.reduce((a,c)=>a+c.novo,0);
      return folha("Kindle","Encontrei "+novos+" destaques novos",
        '<p style="margin:0 0 var(--s4);font-size:14px;line-height:1.6;color:var(--ink-2)">'+
        'Em '+CLIPS.length+' livros. Os que você já tinha aqui não entram de novo.</p>'+
        '<div class="usbach">'+CLIPS.map(c=>'<div class="usbl">'+
          (c.capa?'<img src="'+capa(c.capa)+'" alt="">':'<span class="usbl-x" style="width:34px;height:44px;'+
            'border:1px dashed var(--line-3)"></span>')+
          '<span><span class="nm">'+esc(c.livro)+'</span>'+
          '<span class="ds">'+c.n+' destaques no aparelho'+(c.novo?', '+c.novo+' que ainda não estão aqui':'')+'</span></span>'+
          '<span class="st2 '+(c.st==="novo"?"novo":c.st==="conflito"?"conf":"")+'">'+
          (c.st==="novo"?"vai entrar":c.st==="iguais"?"já tenho":"sem livro")+'</span></div>').join("")+'</div>'+
        '<div class="nota"><span>◆</span><div><b>Manual de campo</b> não está na sua estante — ele foi lido no '+
        'Kindle e veio de outro lugar. Dá para guardar os destaques mesmo assim, soltos, ou deixar de fora.</div></div>',
        '<button class="lnk mudo" data-a="fechar">Deixar de fora</button>'+
        '<button class="btnO forte" data-a="usb-importar">Trazer os '+novos+' destaques</button>');
    }
    return folha("Kindle","Pronto",
      '<div class="usb"><div class="usbfig"><div class="usbmk">Mekora</div>'+
      '<div class="usbfio"></div><div class="usbap -on"><i></i></div></div>'+
      '<p class="usbst"><b>12 destaques</b> trazidos do aparelho. Em cada livro eles ficam presos ao trecho de origem.</p></div>'+
      '<div class="nota"><span>◆</span><div>O aparelho continua conectado. Se quiser, aproveite para '+
      '<b>levar</b> os prontos que ainda não foram.</div></div>',
      '<button class="lnk mudo" data-a="usb-fim">Concluir</button>'+
      '<button class="btnO forte" data-a="usb-fim">Levar 2 livros para o aparelho</button>');
  }
  /* UMA REGRA, QUATRO COMPONENTES:
       navegacao leva a LUGARES   .............. esta folha
       ferramenta muda o que voce FAZ  ......... a fita do topo
       menu de objeto age sobre a COISA  ....... a folha "arquivo"
       barra flutuante age sobre a SELECAO  .... selbar
     Esta folha misturava as tres primeiras e por isso lia como sitemap: quatro
     lugares, quatro acoes do arquivo e duas de conta, todos com o mesmo peso.
     Perguntar "para que serve este menu" era a resposta certa. */
  if(f==="menuL"){
    /* "Notas" virou "Conhecimento" no dia em que o portao entrou: uma area
     chamada Notas que nao mostra todas as suas notas e mentira, e uma
     chamada Conhecimento passa a ser honesta justamente por nao receber
     tudo. O nome nao e uma promessa sobre o valor — e a descricao do
     recorte. */
  const lug=[["mesa","Mesa"],["estante","Estante"],["notas","Conhecimento"],["canvas","Canvas"]];
    /* .linha e a grade da MESA: 38px de capa, texto, acao. Aqui nao ha capa,
       e a linha tinha dois filhos numa grade de tres colunas — o nome caia na
       coluna de 38px e quebrava uma palavra por linha. Modificador proprio. */
    const li=(a,v,nm,st)=>'<button class="linha -menu" data-a="'+a+'"'+(v?' data-v="'+v+'"':'')+'>'+
      '<span><span class="nm">'+nm+'</span>'+(st?'<span class="st">'+st+'</span>':'')+'</span>'+
      '<span class="ac">›</span></button>';
    return folha("Mekora","Onde você quer ir",
      '<div class="lista">'+lug.map(x=>li("ir",x[0],x[1],"")).join("")+'</div>'+
      '<div class="lista" style="margin-top:var(--s5)">'+
      li("folha","ajuda","Ajuda","")+li("ir","perfil","Perfil e conta","")+'</div>',
      '<button class="btnO" data-a="fechar">Fechar</button>');
  }
  /* "Controles do arquivo" era acao morta: tres botoes no produto — o ⋯ da
     leitura, o ⋮ do livro e o ⋮ do item — apontavam para uma folha que nunca
     foi escrita, e o clique nao fazia nada. Agora ela existe, e e o menu do
     OBJETO: o que se faz com este arquivo, nada do que leva a outro lugar. */
  if(f==="controles"){
    const li=(a,v,nm,st,cls)=>'<button class="linha -menu'+(cls?" "+cls:"")+'" data-a="'+a+'"'+
      (v?' data-v="'+v+'"':'')+'><span><span class="nm">'+nm+'</span>'+
      (st?'<span class="st">'+st+'</span>':'')+'</span><span class="ac">›</span></button>';
    return folha("Este arquivo",esc(ARQ.titulo),
      '<div class="lista">'+
      /* O Kindle e um MEIO, e nao o foco — como desktop, celular e tablet. Um
         video nao vai para la, e a linha fica dizendo por que em vez de sumir:
         sumir ensinaria que falta alguma coisa neste arquivo. */
      (ARQ.tipo==="video"
        ?li("nada","","Enviar ao Kindle","Vídeo não vai para o Kindle. Ele é um dos meios, e não o destino de tudo.")
        :li("folha","envio","Enviar ao Kindle",S.enviado?"Enviado hoje, 09:12":""))+
      (preparaTexto()?li("baixar","","Baixar o EPUB",""):li("baixar","","Baixar o arquivo",""))+
      /* a fonte inteira vai para o campo, e nao so uma nota dela: e assim que
         um video ou uma imagem entram no modo solto. */
      li("cv-fonte","",noCanvas(ARQ.titulo)?"Tirar do Canvas":"Pôr no Canvas",
        noCanvas(ARQ.titulo)?"Está no campo":"Para juntar com notas e outras fontes")+
      /* A derivacao erra em dois casos previsiveis: quem termina o livro sem
         rolar o ultimo pixel, e quem quer recomecar. Por isso ela e corrigivel
         — e a correcao mora aqui, junto do que se faz com o arquivo, e nao num
         seletor de status que alguem teria de manter. */
      (function(){const b=noAcervo(ARQ.titulo);if(!b)return "";
        const e=estadoDe(b);
        return li("marcar-lido","",e==="lido"?"Marcar como não lido":"Marcar como lido",
          e==="lido"?"Volta para “não comecei”":
          e==="lendo"?"Você está em "+b.prog+"%":"Ainda não aberto");})()+
      li("folha","traduzir","Traduzir","Gera um segundo arquivo; o original fica")+'</div>'+
      /* por o livro numa colecao mora aqui porque e uma acao SOBRE o arquivo,
         e "Este arquivo" e o menu de objeto dele. A colecao aparece na
         Estante; o gesto de entrar nela acontece no livro. */
      /* por o livro num estudo mora aqui porque e uma acao SOBRE o arquivo, e
         "Este arquivo" e o menu de objeto dele. */
      '<span class="kicker" style="display:block;margin-top:var(--s5)">Estudos</span>'+
      '<div class="colP">'+S.estudos.map(e=>
        '<button data-a="est-livro" data-v="'+esc(e.id)+'|'+esc(ARQ.titulo)+'" aria-pressed="'+
        ((e.livros||[]).indexOf(ARQ.titulo)>-1)+'">'+esc(e.nome)+'</button>').join("")+
        (S.estudos.length?'':'<span class="vaz">Nenhum estudo ainda. Crie um no Conhecimento.</span>')+
      '</div>'+
      '<span class="kicker" style="display:block;margin-top:var(--s5)">De onde ele veio</span>'+
      '<div class="lista">'+
      li("ver-preparo","","Ver o preparo",esc(ARQ.nome))+
      /* paginas do original e tela do preparo de TEXTO: um video nao tem
         original paginado, e a linha some junto com o pipeline. */
      (preparaTexto()?li("folha","paginas","Ver as páginas","Organização avançada"):'')+
      li("folha","info","Informações do arquivo",ARQ.fmt+" · "+ARQ.tam+" · "+
        (ARQ.tipo==="video"?mmss(ARQ.dur):ARQ.pgs+" páginas"))+'</div>'+
      '<div class="lista" style="margin-top:var(--s5)">'+
      li("nada","","Remover da estante","Sai o livro e sai o original","-perigo")+'</div>',
      '<button class="btnO" data-a="fechar">Fechar</button>');
  }
  if(f==="guardar"){
    const alvo=escK(S.guardando);
    /* primeiro os do mesmo capitulo do trecho, com o motivo na linha. Sem
       capitulo em comum nao ha recomendacao, e ela nao se inventa. */
    const ord=semAncora().slice().sort((x,z)=>
      ((z.cap===(alvo?alvo.cap:-1))?1:0)-((x.cap===(alvo?alvo.cap:-1))?1:0));
    return folha("Guardar","Guardar sob o que voc\u00ea escreveu",
      (alvo?'<div class="dossie" style="border:none;padding:0;margin:0 0 var(--s4)">'+
        '<div class="tr"><p>'+esc(escTxt(alvo))+'</p><cite>'+esc(escEnd(alvo))+'</cite></div></div>':"")+
      '<div class="pgs2" style="border:none;padding:0;margin:0">'+
      ord.map((e,n)=>'<button class="pg2i" data-a="perg-guardar" data-v="'+e.k+'">'+
        '<span class="n">'+String(n+1).padStart(2,"0")+'</span>'+
        '<span><span class="q">'+esc(e.nota)+'</span>'+
        '<span class="r">'+(alvo&&e.cap!=null&&e.cap===alvo.cap?"do mesmo cap\u00edtulo do trecho":
          (e.origem==="titulo"?"do t\u00edtulo do cap\u00edtulo "+(e.cap+1):"sua"))+'</span></span>'+
        '<span class="ch">\u203a</span></button>').join("")+'</div>',
      '<button class="lnk mudo" data-a="perg-guardar" data-v="">Deixar solto</button>'+
      '<button class="lnk mudo" data-a="esc-novo-guardar">Escrever e guardar aqui</button>');
  }
  if(f==="apagar-escrito"){
    const d=escK(S.apagando),n=d?filhos(d.k).length:0;
    return folha("Anota\u00e7\u00e3o","Apagar isto",
      (d?'<div class="dossie" style="border:none;padding:0;margin:0 0 var(--s4)">'+
        '<div class="tr -livre"><p>'+esc(d.nota)+'</p><cite>'+esc(escEnd(d))+'</cite></div></div>':"")+
      '<p style="margin:0;font-size:14px;line-height:1.65;color:var(--ink-2)">'+
      (n===1?'O trecho guardado sob isto continua no livro, solto.'
            :'Os '+n+' trechos guardados sob isto continuam no livro, soltos.')+
      ' <b>Nada do que você marcou é apagado.</b></p>',
      '<button class="lnk mudo" data-a="fechar">Deixar como est\u00e1</button>'+
      '<button class="btnD" data-a="esc-apagar" data-v="'+(S.apagando||"")+'" data-f="1">Apagar</button>');
  }
  if(f==="aviso")return folha("Simulação",S.aviso||"Ação representada",
    '<p style="margin:0;font-size:14px;line-height:1.65;color:var(--ink-2)">Este é um protótipo: o controle existe, '+
    'tem estado e leva a algum lugar, mas nada é gravado e nenhum arquivo real é tocado.</p>',
    '<button class="btn" data-a="fechar">Entendi</button>');
  return "";
}
function fer(t,k,off){
  return '<button data-a="ferr" data-v="'+esc(t)+'"'+(off?' disabled':'')+'>'+t+'<span class="k">'+k+'</span></button>';
}
function ctrl(rot,opts){
  return '<div class="ctrl"><b>'+rot+'</b><div class="opts">'+opts.map(o=>
    '<button data-a="prev" data-v="'+o[1]+'"'+(o[2]?' aria-pressed="true"':'')+'>'+o[0]+'</button>').join("")+'</div></div>';
}
function resultados(lista,q,escritos){
  escritos=escritos||[];
  if(!lista.length&&!escritos.length)
    return '<p style="margin:var(--s4) 0 0;font-size:var(--t-peq);color:var(--ink-3)">'+
      'Nada com \u201c'+esc(q)+'\u201d. A busca cobre t\u00edtulo, autor, formato e o que voc\u00ea '+
      'escreveu \u2014 ainda n\u00e3o o texto dentro dos livros.</p>';
  let h="";
  if(lista.length)
    h+='<div class="lista" style="margin-top:var(--s4)">'+lista.map(b=>
      '<button class="linha" data-a="ir-livro" data-v="'+esc(b.t)+'" style="grid-template-columns:30px minmax(0,1fr) auto">'+
      '<img class="capa" src="'+capa(b.c)+'" alt="" style="width:30px;height:40px">'+
      '<span><span class="nm">'+esc(b.t)+'</span><span class="st">'+esc(b.a)+' \u00b7 '+b.f+'</span></span>'+
      '<span class="ac">Abrir</span></button>').join("")+'</div>';
  if(escritos.length){
    /* a forma diz o que e, como na lista do livro: sem ancora nao tem trecho
       atras, e por isso nao tem para onde voltar alem do proprio livro */
    h+='<div class="grpM" style="margin-top:var(--s5)">No que voc\u00ea escreveu \u00b7 '+escritos.length+'</div>'+
      '<div class="dossie" style="border:none;padding:0;margin:0">'+
      escritos.map(d=>'<div class="tr'+(ancora(d)?(d.nota?" -ideia":""):" -livre")+'">'+
        '<p>'+esc((d.nota||escTxt(d)).slice(0,150))+((d.nota||escTxt(d)).length>150?"\u2026":"")+'</p>'+
        '<cite>'+esc(d.livro)+' \u00b7 '+esc(escEnd(d))+'</cite>'+
        '<div class="acs"><button class="lnk mudo" data-a="'+(ancora(d)?"dst-ir":"ir-esc")+
        '" data-v="'+d.k+'">'+(ancora(d)?"ir ao trecho":"ver no livro")+'</button></div></div>').join("")+
      '</div>';
  }
  return h+(q?'':'<p style="margin:var(--s3) 0 0;font-size:var(--t-peq);color:var(--ink-3)">Recentes.</p>');
}
/* A folha tinha 560px para tudo. Uma folha que carrega um paragrafo e uma
   que carrega uma bancada de duas ou tres colunas nao podem ter a mesma
   medida: a segunda espremia a previa de leitura em 200px e a tira de
   paginas em 100px. A largura passa a vir do que a folha carrega. */
function folha(ct,tit,corpo,pe,larg){
  return '<div class="veu" data-a="fechar-veu"><div class="folha'+(larg?" -"+larg:"")+'" data-stop="1">'+
    '<div class="fcab"><div><span class="ct">'+ct+'</span><h2>'+tit+'</h2></div><span class="sp"></span>'+
    '<button class="fx" data-a="fechar" aria-label="Fechar">✕</button></div>'+
    '<div class="fcorpo">'+corpo+'</div><div class="fpe"><span class="sp"></span>'+(pe||"")+'</div></div></div>';
}

function corpo(){
