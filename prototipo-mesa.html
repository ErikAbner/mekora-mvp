<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · Mesa e preparação</title>
<style>
/* ════════════════════════════════════════════════════════════
   Mesmos tokens do prototipo.html — os dois são o mesmo produto,
   e essa é justamente a correção: a preparação passa a morar na
   moldura que a área pessoal já tinha.
   Bordas translúcidas e sombra zero vêm do sistema candidato
   (Caderno 03, seção 11).
   ════════════════════════════════════════════════════════════ */
:root{
  /* ── EDITORIAL UTILITY ──
     Off-white em vez de branco puro, preto levemente suavizado.
     Isto sobrepõe a regra antiga de "o creme é só do leitor": se a estrutura
     vai ser reta, ela não pode ser fria também. As camadas passam a vir do
     fundo, não da borda — é o que permite tirar borda de quase tudo. */
  --bg:#faf9f5;--bg-2:#f4f3ef;--bg-3:#edebe4;--nav:#f4f3ef;--branco:#ffffff;
  --ink:#151515;--ink-2:#57534d;--ink-3:#6f6b64;--ink-4:#b5b0a8;
  --line:rgba(21,21,21,.12);--line-2:rgba(21,21,21,.07);--line-3:rgba(21,21,21,.24);
  --acc:#c8481f;--acc-soft:#fdf0ea;
  --ok:#2f7d55;--ok-soft:#eef6f1;--warn:#a8701c;--warn-soft:#fdf4e6;--dan:#b23b2a;--dan-soft:#fdefec;
  --paper:#f1eee7;
  /* ── espaço: base 20px como no DOC, com meio-passo de 10 ──
     O DOC opera em múltiplos de 20 e usa 40 e 80 como respiro grande.
     Mantive isso e só troquei a base de 5px por 4px, que já era do Mekora. */
  --s1:4px;--s2:8px;--s3:12px;--s4:20px;--s5:30px;--s6:40px;--s7:60px;--s8:80px;
  /* ── RAIO ── estrutura é reta. O 4px era o pior dos dois mundos: perdia a
     nitidez do 0 sem comprar a simpatia de uma curva de verdade.
     --r1  0 — ação e estrutura: botão, campo, card, lista, folha
     --r2  0 — superfície grande
     --rm  2px — só mídia recortada, para o canto não brigar com a borda
     --rp  pílula — dado: tag, chip, trilho, interruptor
     50%   círculo — avatar e ponto. Não é raio, é forma.
     Pílula e círculo são os 5% que quebram a regra, e é por serem raros
     que eles funcionam: numa composição reta, uma curva vira sinal. */
  --r1:0px;--r2:0px;--rm:2px;--rp:999px;--h1:2.2rem;--h2:2.6rem;
  /* movimento amacia o que a geometria endureceu */
  --curva:cubic-bezier(.16,1,.3,1);--d1:.16s;--d2:.26s;--d3:.42s;
  --ui:-apple-system,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* ── medida editorial ── as três larguras do DOC: 575 → 675 → 775 ── */
  --col:35.9375rem;
  /* ── escala tipográfica: quanto maior o texto, menor a entrelinha ── */
  --t-display:clamp(2.6rem,1.6rem + 3.4vw,5.2rem);
  --t-h1:2.15rem;--t-h2:1.5rem;--t-h3:1.14rem;
  --t-leitura:1.16rem;--t-ui:.94rem;--t-peq:.83rem;--t-mono:.68rem;
  --lh-display:.94;--lh-h1:1.06;--lh-h2:1.2;--lh-h3:1.34;--lh-leitura:1.62;--lh-ui:1.5;
  --tr-display:-.03em;--tr-h1:-.025em;--tr-h2:-.015em;
}
@media (min-width:1200px){:root{--col:42.1875rem}}
@media (min-width:1600px){:root{--col:48.4375rem}}
/* O escuro nao segue o sistema: um prototipo de revisao abre na paleta que
   esta sendo decidida. Ele existe abaixo, e entra so quando pedido. */
:root[data-tema="escuro"]{
  --bg:#161513;--bg-2:#1e1c1a;--bg-3:#252320;--nav:#1b1917;
  --ink:#f1eee8;--ink-2:#b9b2a6;--ink-3:#948d81;--ink-4:#6b655c;
  --line:hsla(40,20%,96%,.18);--line-2:hsla(40,20%,96%,.10);--line-3:hsla(40,20%,96%,.32);
  --acc:#e4613d;--acc-soft:#2a1d17;
  --ok:#8fb283;--ok-soft:#1c241d;--warn:#d3a448;--warn-soft:#282017;--dan:#e0705c;--dan-soft:#2a1a17;
    --branco:#1e1c1a;--paper:#201e1b;
}
/* comparação ao vivo — para julgar com o olho, não com o argumento */
:root[data-raio="4"]{--r1:4px;--r2:8px;--rm:4px}
:root[data-fundo="neutro"]{--bg:#ffffff;--bg-2:#f7f7f5;--bg-3:#f0efec;--branco:#ffffff}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001s!important;animation:none!important}}
/* ══ A ESCALA FLUIDA DO DOC, SEM O PREÇO DELE ══
   O DOC.cc fixa o root em px por breakpoint (14 → 20px) e escala tudo junto.
   O efeito é ótimo e o preço é anular a preferência de tamanho de fonte do
   navegador — inaceitável num produto para quem lê muito, que é justamente
   quem aumenta a fonte. Aqui o clamp está em rem: 87,5% a 125% do tamanho
   que a PESSOA escolheu. A identidade é a mesma; a preferência sobrevive. */
html{font-size:clamp(.875rem,.82rem + .28vw,1.25rem)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--t-ui);
  line-height:var(--lh-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
/* link nunca sublinha: borda inferior translúcida que escurece no hover */
a,.linkE{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);
  transition:border-color var(--d1) var(--curva)}
a:hover,.linkE:hover{border-bottom-color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ MOLDURA ═══ a mesma do prototipo.html */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topo{display:flex;align-items:center;gap:var(--s2);height:56px;flex:0 0 56px;padding:0 var(--s5);
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}
.tcam{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform var(--d3) var(--curva)}
.topo.-dentro .tcam{transform:translateY(-56px)}
.tlin{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5)}
.marca{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;margin-right:var(--s5);
  padding:3px 6px;border-radius:var(--r1)}
.marca:hover{background:var(--bg-2)}
.topo nav{display:flex;gap:2px}
.topo nav button{padding:7px 13px;border-radius:var(--r1);color:var(--ink-2);font-size:13.5px}
.topo nav button:hover{background:var(--bg-2);color:var(--ink)}
.topo nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.busca{display:flex;align-items:center;gap:var(--s2);height:var(--h1);padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r1);color:var(--ink-3);font-size:13px;background:var(--bg-2)}
.busca:hover{border-color:var(--line-3);color:var(--ink-2)}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:var(--r1);padding:1px 5px}
.icb{width:32px;height:32px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);font-size:14px;border:1px solid transparent}
.icb:hover{background:var(--bg-2);border-color:var(--line)}
.uctl{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:var(--r1);
  border:1px solid var(--line);background:var(--bg-2)}
.uctl:hover{border-color:var(--line-3)}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center}
.uctl .ch{font-size:9px;color:var(--ink-3)}
/* faixa contextual: o nome do arquivo assume a barra quando se entra nele */
.tlin .fnome{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tlin .fest{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.pt{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.pt-ok{background:var(--ok)}.pt-at{background:var(--warn)}.pt-er{background:var(--dan)}
.pt-go{background:var(--ink);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}

.corpo{flex:1;min-height:0;overflow-y:auto;position:relative}
.pad{padding:var(--s6) var(--s7) var(--s7);max-width:860px;margin:0 auto}
.pad.larga{max-width:1120px}
h1.t{font-size:25px;font-weight:650;letter-spacing:-.025em;margin:0 0 var(--s1)}
p.sub{font-size:14px;color:var(--ink-2);margin:0 0 var(--s5);line-height:1.55;max-width:58ch}

/* ═══ MESA ═══ */
.solta{border:1.5px dashed var(--line-3);border-radius:var(--r2);padding:var(--s7) var(--s5);
  text-align:center;background:var(--bg-2);display:flex;flex-direction:column;align-items:center;
  gap:var(--s3);width:100%;transition:border-color var(--d1) var(--curva),background var(--d1) var(--curva)}
.solta:hover{border-color:var(--acc);background:var(--acc-soft)}
.solta .tt{font-size:19px;font-weight:650;letter-spacing:-.02em}
.solta .ds{font-size:13.5px;color:var(--ink-2);max-width:44ch}
.solta .fm{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.07em}
.solta.fina{flex-direction:row;justify-content:center;align-items:center;padding:var(--s4);gap:var(--s4);text-align:left}
.solta.fina .tt{font-size:14.5px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--s5);margin-top:var(--s6)}
.passo{border-left:2px solid var(--line);padding-left:var(--s3)}
.passo b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.passo span{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.grupo{margin-top:var(--s6)}
.gcab{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--line-2)}
.gcab h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gcab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.linha{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2);background:var(--branco);
  width:100%;transition:background var(--d1) var(--curva)}
.linha:last-child{border-bottom:none}
.linha:hover{background:var(--bg-2)}
.linha .capa{width:38px;height:50px;border-radius:var(--rm);border:1px solid var(--line);object-fit:cover;
  object-position:top;background:var(--paper);display:block}
.linha .capa.vazia{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:8px;color:var(--ink-3);background:var(--bg-3)}
.linha .nm{font-size:14px;font-weight:600;letter-spacing:-.005em;display:block}
.linha .st{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.linha .ac{font-size:13px;color:var(--acc);font-weight:600;white-space:nowrap}
@media(max-width:620px){.linha{grid-template-columns:38px minmax(0,1fr)}.linha .ac{grid-column:2}}

/* ═══ ITEM ═══ */
.volta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);
  padding:5px 9px 5px 5px;border-radius:var(--r1);margin-bottom:var(--s4)}
.volta:hover{color:var(--acc);background:var(--bg-2)}
.icab{display:flex;gap:var(--s4);align-items:flex-start;margin-bottom:var(--s5);flex-wrap:wrap}
.icab .cp{width:74px;height:98px;border-radius:var(--rm);border:1px solid var(--line);object-fit:cover;
  object-position:top;flex:0 0 74px;background:var(--paper)}
.icab .tx{flex:1;min-width:220px}
.icab h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.metas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta{font-size:11.5px;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--rp);padding:3px 10px}
.modo{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--r1);padding:6px 12px;white-space:nowrap}
.modo:hover{border-color:var(--line-3)}
.modo b{color:var(--ink);font-weight:650}
.estado{display:flex;gap:var(--s3);padding:var(--s4);border-radius:var(--r2);
  background:var(--branco);margin-bottom:var(--s5);align-items:flex-start;
  box-shadow:inset 2px 0 0 var(--ink)}
.estado.ok{background:var(--ok-soft);box-shadow:inset 2px 0 0 var(--ok)}
.estado.at{background:var(--warn-soft);box-shadow:inset 2px 0 0 var(--warn)}
.estado .pt{margin-top:6px}
.estado h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.012em}
.estado p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:60ch}
.sec{margin-bottom:var(--s5)}
.sec>h3{margin:0 0 var(--s3);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.lista{background:var(--branco);border-radius:var(--r2);overflow:hidden}
.li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:var(--s3);align-items:start;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:none}
.sn{width:20px;height:20px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex:0 0 20px;margin-top:1px}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-at{background:var(--warn-soft);color:var(--warn)}
.s-er{background:var(--dan-soft);color:var(--dan)}.s-in{background:var(--bg-3);color:var(--ink-2)}
.li .tx b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.li .tx span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.li .ac{font-size:12.5px;color:var(--acc);font-weight:600;white-space:nowrap;padding:2px 5px;border-radius:var(--r1)}
.li .ac:hover{background:var(--acc-soft)}
.acoes{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s5)}
.btn{height:var(--h2);padding:0 var(--s5);border-radius:var(--r1);background:var(--ink);color:var(--bg);
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  white-space:nowrap;transition:background var(--d1) var(--curva)}
.btn:hover{background:var(--acc);color:#fff}
.btn.sec2{background:none;border:1px solid var(--line-3);color:var(--ink);font-weight:550}
.btn.sec2:hover{background:var(--bg-2);border-color:var(--ink);color:var(--ink)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.lnk{font-size:13px;color:var(--acc);font-weight:600;padding:4px 6px;border-radius:var(--r1)}
.lnk:hover{background:var(--acc-soft)}
.lnk.mudo{color:var(--ink-3);font-weight:550}
.lnk.mudo:hover{color:var(--ink);background:var(--bg-2)}
.nota{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0 0;
  border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3);
  line-height:1.55;margin-top:var(--s5)}
.nota b{color:var(--ink)}
.trilho{height:5px;border-radius:var(--rp);background:var(--bg-3);overflow:hidden;margin:var(--s3) 0 var(--s2)}
.trilho i{display:block;height:100%;background:var(--ink);border-radius:var(--rp);transition:width .4s linear}
.leg{display:flex;justify-content:space-between;gap:var(--s3);font-size:12.5px;color:var(--ink-2)}
.leg .mn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.etapas{display:flex;flex-direction:column;gap:1px;margin-top:var(--s4)}
.etapa{display:flex;align-items:center;gap:var(--s3);font-size:12.5px;padding:5px 0;color:var(--ink-3)}
.etapa.feita{color:var(--ink-2)}.etapa.agora{color:var(--ink);font-weight:600}
.etapa .mk{width:14px;text-align:center;font-size:11px}
.pend{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--warn);background:var(--warn-soft);
  border-radius:var(--r1);padding:8px 15px;font-size:13px;font-weight:600;color:var(--ink)}
.pend .n{font-family:var(--mono);font-size:10px;color:var(--warn)}

/* ═══ ESPAÇO DO LIVRO ═══ */
/* A coluna de 230px segurava uma capa e quatro botoes e depois rolava vazia
   por mais de mil pixels. Ela nao vira sticky nem indice: deixa de existir
   como celula. O cabecalho fica em 152+30+558; do resto para baixo e coluna
   unica, e a pagina volta para a mesma moldura do preparo. */
.livro{display:grid;grid-template-columns:152px minmax(0,1fr);gap:var(--s5);align-items:start}
@media(max-width:680px){.livro{grid-template-columns:1fr;gap:var(--s4)}
  .livro .capao{max-width:120px}}
.livro .capao{width:100%;max-width:152px;border-radius:var(--rm);border:1px solid var(--line);
  display:block;background:var(--paper)}
.livro h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.livro .autor{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.livro .tit{display:flex;align-items:flex-start;gap:var(--s3)}
.livro .tit .icb{margin-left:auto;flex:0 0 auto}
/* duas linhas mudas. A de cima e medida — mono, caixa alta. A de baixo tem
   nome de arquivo e fato, e nome nao se mede: grotesca, caixa normal. */
.fonte{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:var(--s2) 0 0}
.fonte b{color:var(--ink-2);font-weight:550}
.acoes.-mudas{margin-top:var(--s3);gap:var(--s4)}
/* a regua fina diz "isto e so seu": nao ha voz de autor atras. 2px em tinta
   e barra de citacao — tem fonte. 1px translucido nao tem. Junto com a
   ausencia do simbolo de volta, sao os dois unicos sinais. Sem rotulo. */
.dossie .tr.-livre{border-left-width:1px;border-left-color:var(--line-3);margin-top:var(--s6)}
.dossie .tr.-livre:first-child{margin-top:0}
.dossie .tr.-livre .o{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-top:6px}
.dossie .tr.-livre .campo{display:block;width:100%;min-height:3.4em;resize:vertical;
  font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:var(--r1);
  padding:0 0 var(--s2)}
.dossie .tr.-livre .campo:focus{outline:0;border-bottom-color:var(--ink)}
.dossie .tr.-livre .campo::placeholder{color:var(--ink-4)}
.dossie .tr.-livre .pe{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2)}
.dossie .tr[id]{scroll-margin-top:var(--s6)}
.faltam{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2) var(--s3);
  border-top:1px solid var(--line-2);margin-top:var(--s6);padding-top:var(--s4);
  font-size:12.5px;color:var(--ink-3)}
.dossie .tr p{max-width:34em}
.dossie .tr .cheio{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  margin:var(--s3) 0 0;max-width:34em}
#marcado{scroll-margin-top:var(--s6)}

/* ══════════════════════════════════════════════════════════

  margin:0 0 1.05em}

/* botão do DOC: outline puro que inverte no hover, sem raio */
.btnO{display:inline-flex;align-items:center;justify-content:center;padding:.7rem 1.25rem;
  border:1px solid var(--line-3);font-size:var(--t-ui);font-weight:500;color:var(--ink);

/* figura e legenda: legenda herda a largura da coluna, centralizada */

.opcao:hover{background:var(--bg-2)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-3);margin-top:2px;flex:0 0 16px;
  display:flex;align-items:center;justify-content:center}
.opcao[aria-pressed="true"] .radio{border-color:var(--ink);border-width:5px}
.opcao .nm{font-size:13.5px;font-weight:600}
.opcao .ds{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5;display:block}
.histdia{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:var(--s5) 0 var(--s2);border-bottom:1px solid var(--line-2)}
.histl{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.histl:hover{background:var(--bg-2)}
.histl .h{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.histl .t{font-size:13.5px}
.histl .o{font-size:12px;color:var(--ink-3)}
@media(max-width:620px){.histl{grid-template-columns:56px minmax(0,1fr)}.histl .o{grid-column:2}}
.perigo{border:1px solid var(--dan);padding:var(--s4);background:var(--dan-soft)}
.perigo b{display:block;font-size:14px;margin-bottom:var(--s2)}
.perigo p{margin:0 0 var(--s3);font-size:13px;color:var(--ink-2);line-height:1.55}
.btnD{height:var(--h2);padding:0 var(--s5);border:1px solid var(--dan);color:var(--dan);background:none;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center}
.btnD:hover{background:var(--dan);color:#fff}
.pendencia{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);
  border:1px dashed var(--line-3);font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:var(--s4)}

/* ══ MESA REDUZIDA ══ uma página editorial que por acaso é interativa.
   Quatro níveis com peso diferente: foco, exceção, estado do sistema,
   biblioteca. O tratamento visual é o que separa as categorias — dar o
   mesmo peso a todas foi o que produziu a sensação de painel. */
.mlede{font-family:var(--serif);font-size:clamp(1.6rem,1.1rem + 1.5vw,2.5rem);line-height:1.14;
  letter-spacing:-.02em;font-weight:400;margin:0;max-width:20ch;text-wrap:balance}
.mtopo{display:flex;align-items:flex-end;gap:var(--s6);flex-wrap:wrap;
  padding-bottom:var(--s7);margin-bottom:var(--s7);border-bottom:1px solid var(--line)}
.mtopo .tx{flex:1;min-width:280px}
.meyebrow{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:var(--s4)}
/* 1 · foco — um item dominante, tratado como matéria de capa */
.mfoco{display:grid;grid-template-columns:190px minmax(0,1fr);gap:var(--s6);align-items:start;
  margin-bottom:var(--s8)}
@media(max-width:680px){.mfoco{grid-template-columns:1fr;gap:var(--s4)}.mfoco img{max-width:150px}}
.mfoco img{width:100%;height:auto;border:1px solid var(--line);background:var(--paper)}
.mfoco h2{font-family:var(--serif);font-size:clamp(1.5rem,1.1rem + 1vw,2.1rem);line-height:1.1;
  letter-spacing:-.02em;font-weight:400;margin:0 0 var(--s3)}
.mfoco .onde{font-size:15px;line-height:1.6;color:var(--ink);margin:0 0 var(--s2)}
.mfoco .desde{font-size:13.5px;line-height:1.6;color:var(--ink-3);margin:0 0 var(--s5)}
/* 2 · exceção — chama atenção, e só existe quando existe */
.mexc{border-top:1px solid var(--line);padding-top:var(--s4);margin-bottom:var(--s7)}
.mexc .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.mexc .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--warn)}
.mexc .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3);margin-left:auto}
.mexc .it+.it{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line-2)}
.mexc .nm{font-size:16px;font-weight:650;letter-spacing:-.01em;display:block}
.mexc .pq{font-size:14px;color:var(--ink-2);line-height:1.6;margin:6px 0 var(--s4);max-width:52ch}
/* 3 · estado do sistema — informa sem chamar */
.mest{border-top:1px solid var(--line);padding-top:var(--s4);margin-bottom:var(--s7)}
.mest .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
.mest .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3)}
.mest .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3);margin-left:auto}
.mest .it{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;padding:7px 0;font-size:13.5px;
  color:var(--ink-2)}
.mest .it b{font-weight:600;color:var(--ink)}
.mest .it .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mest .it button{margin-left:auto}
/* 4 · biblioteca — amostra, não cópia da Estante */
.mbib{border-top:1px solid var(--line);padding-top:var(--s4)}
.mbib .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.mbib .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3)}
.mbib .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3)}
.mbib .cab .lnk{margin-left:auto}
.mbib .capas{display:flex;gap:var(--s4);align-items:flex-end;flex-wrap:wrap}
.mbib .capas button{display:block}
.mbib .capas img{width:82px;height:auto;border:1px solid var(--line);background:var(--paper);
  transition:transform var(--d2) var(--curva)}
.mbib .capas button:hover img{transform:translateY(-4px)}
/* a Mesa inteira vira área de solta ao arrastar */
#app.-arrastando .corpo{box-shadow:inset 0 0 0 2px var(--acc)}
.msoltando{position:absolute;inset:0;background:var(--acc-soft);display:flex;align-items:center;
  justify-content:center;z-index:50;pointer-events:none}
.msoltando span{font-family:var(--serif);font-size:1.6rem;letter-spacing:-.015em}

/* ══ MESA (explorações A, B, C — preservadas no seletor) ══ */
.mduas{display:grid;grid-template-columns:290px minmax(0,1fr);gap:var(--s7);align-items:start}
@media(max-width:900px){.mduas{grid-template-columns:1fr;gap:var(--s6)}}
.mresumo{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:var(--s6)}
.mresumo button{flex:1;padding:var(--s4) var(--s3) var(--s4) 0;text-align:left;
  border-right:1px solid var(--line-2)}
.mresumo button:last-child{border-right:none;padding-right:0}
.mresumo button:hover .n{color:var(--acc)}
.mresumo .n{display:block;font-size:1.7rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  transition:color var(--d1) var(--curva)}
.mresumo .l{display:block;font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.35}
.mresumo.fina button{padding:var(--s3) var(--s3) var(--s3) 0}
.mresumo.fina .n{font-size:1.25rem}
.msec{margin-bottom:var(--s7)}
.msec>h2{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line-2);
  display:flex;gap:var(--s2);align-items:baseline}
.msec>h2 .ct{margin-left:auto;font-size:11px;letter-spacing:.06em}
.mpend{padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.mpend:last-child{border-bottom:none}
.mpend .tipo{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--warn);display:block;margin-bottom:5px}
.mpend .nm{font-size:15px;font-weight:650;letter-spacing:-.01em;display:block}
.mpend .cons{font-size:13px;color:var(--ink-2);line-height:1.55;margin:5px 0 0;max-width:56ch}
.mpend .acao{margin-top:var(--s3)}
.mprep{padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.mprep:last-child{border-bottom:none}
.mprep .nm{font-size:14px;font-weight:600;display:block}
.mprep .et{font-size:13px;color:var(--ink-2);margin-top:4px;display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap}
.mprep .et .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprep .bg{font-size:12px;color:var(--ink-3);margin-top:5px;display:block}
.mcont{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--s4);align-items:start}
.mcont img{width:88px;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper)}
.mcont h3{font-family:var(--serif);font-size:1.45rem;line-height:1.15;letter-spacing:-.015em;font-weight:400;margin:0}
.mcont .meta{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.mcont .prog{height:2px;background:var(--line);margin:var(--s3) 0 var(--s2);max-width:240px}
.mcont .prog i{display:block;height:100%;background:var(--ink)}
.mprontos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--s4)}
.mpronto{text-align:left;display:block}
.mpronto img{width:100%;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper);
  transition:transform var(--d2) var(--curva)}
.mpronto:hover img{transform:translateY(-3px)}
.mpronto .t{display:block;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.25}
.mpronto .q{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mcapas{display:flex;gap:var(--s2);align-items:flex-end}
.mcapas img{width:58px;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper)}
@media(max-width:520px){.mcapas img:nth-child(n+5){display:none}}
.msolta{display:flex;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:var(--s6);flex-wrap:wrap}
.msolta .tx{flex:1;min-width:200px}
.msolta .tt{font-size:14px;font-weight:650;display:block}
.msolta .fm{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.07em;color:var(--ink-3);
  display:block;margin-top:4px}
.msolta.arrastando{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-soft)}
.mestados{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;padding-top:var(--s5);
  border-top:1px solid var(--line-2);margin-top:var(--s7)}
.mestados .lb{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.1em;color:var(--ink-3)}
.mvazio{padding:var(--s7) 0;max-width:44ch}
.mvazio h2{font-family:var(--serif);font-size:1.5rem;font-weight:400;letter-spacing:-.015em;margin:0 0 var(--s3)}
.mvazio p{font-size:14px;line-height:1.62;color:var(--ink-2);margin:0 0 var(--s4)}

/* ══ LEITURA ══ os ajustes agem por variável, e a superfície obedece */
.ed.-esq .txtE,.ed.-esq .lnota{text-align:left}
.ed.-just .txtE{text-align:justify;hyphens:auto}
.ed.-grot .txtE,.ed.-grot .lq{font-family:var(--ui)}
/* .marcaN e .lnota sao do DOCUMENTO — nota de rodape do original e nota de
   campo do autor. O grupo "Seus destaques" do Aa nao manda nelas: escondia o
   texto de outra pessoa e chamava de seu. Elas ficam sem controle, de proposito. */

/* ══ DESTAQUE E NOTA ══
   Nao ha grifo. Um degrau de papel e um filete: a marca usa a mesma camada
   que o sistema ja usa para separar superficies, e mora dentro da linha.
   Cor de marca-texto seria o unico elemento saturado da tela — mais alto que
   o acento, que esta reservado a excecao. */
.ed ::selection{background:var(--line)}
.dst{background:var(--bg-3);border-bottom:1px solid var(--line-3);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  padding:.06em 0;color:inherit;cursor:pointer;
  scroll-margin-top:calc(var(--topo-sticky,70px) + var(--s4));
  transition:border-color var(--d1) var(--curva)}
.dst:hover{border-bottom-color:var(--ink)}
.dst:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.ed.-semdst .dst{background:none;border-bottom:0}
.ed.-semdst .notaE{display:none}

/* a barra: lasca de papel com filete. Zero sombra, raio 0. Fundo escuro foi
   recusado — tinta cheia e o elemento mais alto da paleta, e o alto e da
   excecao. Gastar preto no gesto mais frequente do produto seria inflacao. */
.selE{position:absolute;z-index:40;display:flex;align-items:center;gap:var(--s3);
  height:38px;padding:0 var(--s3);background:var(--bg);border:1px solid var(--ink);
  border-radius:var(--r1);white-space:nowrap;transform:translateX(-50%);
  animation:selEntra var(--d1) var(--curva)}
@keyframes selEntra{from{opacity:0}to{opacity:1}}
.selE .dest{font-family:var(--ui);font-size:var(--t-peq);color:var(--ink-3);
  padding-right:var(--s3);border-right:1px solid var(--line)}
.selE button{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink);
  padding:5px 7px;border-radius:var(--r1)}
.selE button.mudo{color:var(--ink-3);font-weight:550}
.selE button:hover{background:var(--bg-3)}
.selE .exc{font-family:var(--ui);font-size:var(--t-peq);color:var(--dan);
  padding-right:var(--s2)}
.selE button.perigo{color:var(--dan)}
@media(max-width:760px){
  .selE{position:fixed;left:var(--s4);right:var(--s4);bottom:var(--s4);height:44px;
    transform:none;justify-content:space-between;overflow-x:auto}
}
body.-selecionando #notasbt{display:none}

/* a nota mora no fluxo, logo abaixo do paragrafo de origem. O recuo de 7% e
   da .lnota, que e do documento; aqui o filete carrega apenas "isto e nota". */
.notaE{border-left:2px solid var(--ink);padding-left:var(--s4);
  margin:0 0 var(--esp-par,1.05em);text-align:left}
.notaE p{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  margin:0;white-space:pre-wrap}
.notaE .campo{display:block;width:100%;min-height:4.8em;resize:vertical;
  font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--line);
  border-radius:var(--r1);padding:0 0 var(--s2)}
.notaE .campo:focus{outline:0;border-bottom-color:var(--ink)}
.notaE .campo::placeholder{color:var(--ink-4)}
.notaE .pe{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
.notaE .pe .sp{flex:1}
.notaE .dest{font-family:var(--ui);font-size:var(--t-peq);color:var(--ink-3)}
.notaE.-erro{border-left-color:var(--dan);background:var(--dan-soft);
  padding:var(--s3) var(--s4)}
.notaE .erro{font-family:var(--ui);font-size:var(--t-peq);color:var(--dan);
  line-height:1.5;margin:var(--s3) 0 0}

.qbar .cont{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.06em;
  color:var(--ink-3);padding:4px 6px;border-radius:var(--r1)}
.qbar button.cont:hover{color:var(--ink);background:var(--bg-3)}

/* as duas listas reusam .dossie .tr e so trocam os papeis por estado:
   com nota, a nota e o corpo e o trecho vira a volta. */
.dossie .tr.-ideia p,.dossie .tr.-livre p{font-size:var(--t-leitura);
  line-height:var(--lh-leitura);color:var(--ink)}
.dossie .tr .volta{font-family:var(--serif);font-style:italic;font-size:13px;
  color:var(--ink-3);display:block;margin-top:var(--s2);text-align:left}
.dossie .tr .volta:hover{color:var(--ink)}
/* uma acao visivel por item — ir ao trecho, que e o ponto da lista.
   As outras sao ferramenta avancada: aparecem quando a pessoa se aproxima.
   Em aparelho sem hover elas ficam sempre, porque la nao ha como pedir. */
.dossie .tr .acs{display:flex;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap;align-items:center}
.dossie .tr .acs .sob{opacity:0;transition:opacity var(--d1) var(--curva)}
.dossie .tr:hover .acs .sob,.dossie .tr:focus-within .acs .sob{opacity:1}
@media(hover:none){.dossie .tr .acs .sob{opacity:1}}
.dossie .tr .acs .tirar{color:var(--ink-3)}
.dossie .tr .acs .tirar:hover{color:var(--dan)}
.desfezL{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0 var(--s3) var(--s4);
  border-left:2px solid var(--ink);margin-bottom:var(--s4);font-size:13px;color:var(--ink)}
.dossie .tr .kd{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);
  padding:1px 5px;margin-left:var(--s2)}
.saldo{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 var(--s4)}
.grpM{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:var(--s5) 0 var(--s3)}
.grpM:first-of-type{margin-top:var(--s4)}
.txtE{margin-bottom:var(--esp-par,1.05em)}
/* @container e nao @media: o gatilho e a largura da FOLHA, nao a da janela.
   Com media query a previa continuava em duas colunas dentro de um container
   de 560px enquanto a janela tivesse 1900 — que era exatamente o defeito. */
.aacols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:var(--s6)}
@container (max-width:700px){.aacols{grid-template-columns:1fr;gap:var(--s5)}.aaprev{display:none}}
@media(max-width:760px){.aacols{grid-template-columns:1fr}.aaprev{display:none}}
.aactl{max-height:min(58vh,520px);overflow-y:auto;padding-right:var(--s3)}
.aagrupo{margin-bottom:var(--s5)}
.aagrupo>h4{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3)}
.especs{display:flex;gap:var(--s2);flex-wrap:wrap}
.espec{flex:1;min-width:64px;border:1px solid var(--line);padding:var(--s3) var(--s2);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color var(--d1) var(--curva)}
.espec:hover{border-color:var(--line-3)}
.espec[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.espec .am{height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.espec .rt{font-size:11px;color:var(--ink-3);line-height:1.2}
.espec[aria-pressed="true"] .rt{color:var(--ink)}
/* espécimes desenhados: a amostra mostra o efeito, não o nome dele */
.espec .lin{display:block;width:26px;height:16px;background-repeat:repeat-y;background-size:100% 100%}
.espec .lin.j{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 3px)}
.espec .lin.p{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 5px)}
.espec .lin.s{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 8px)}
.espec .col{display:block;height:18px;background:var(--ink)}
.espec .col.e{width:10px}.espec .col.p{width:20px}.espec .col.l{width:30px}
.espec .par{display:block;width:26px;height:18px;background-repeat:no-repeat;
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(var(--ink),var(--ink));
  background-size:100% 5px,100% 5px}
.espec .par.j{background-position:0 2px,0 10px}
.espec .par.p{background-position:0 0,0 13px}
.espec .par.s{background-position:0 0,0 16px}
.espec .al{display:block;width:26px;height:16px;background-repeat:no-repeat;
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(var(--ink),var(--ink)),
  linear-gradient(var(--ink),var(--ink));background-size:100% 3px,100% 3px,100% 3px;

.aaprev{border-left:1px solid var(--line-2);padding-left:var(--s6);max-height:min(58vh,520px);overflow:hidden}

.aaprev .pv p{font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);

/* ══ PERGUNTAS QUE GUIAM A LEITURA ══

.pgs2{border-top:1px solid var(--line);padding-top:var(--s4);margin-top:var(--s6)}

.dossie{border-top:1px solid var(--line);padding-top:var(--s5);margin-top:var(--s7)}
.dossie .q{font-family:var(--serif);font-size:1.24rem;line-height:1.3;margin:0 0 var(--s3)}
.dossie .tr{border-left:2px solid var(--ink);padding-left:var(--s4);margin:0 0 var(--s4)}

/* ══ KINDLE POR CABO ══ */
.usb{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s6) 0}

.nov{display:grid;grid-template-columns:116px minmax(0,1fr);gap:var(--s4);align-items:start;

/* ══ CENTRAL DE AJUDA ══ orientada por tarefa, não por índice de tópicos */
.htarefas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;

.wcont{max-width:520px;margin:0 auto}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════
   Protótipo navegável. Tudo simulado: nenhum arquivo é lido,

const CAPS=[

/* Progresso medido, nao declarado.
   A unidade e o PARAGRAFO, nao o pixel: mudar corpo, entrelinha ou coluna
   muda a altura do documento e nao pode mudar onde a pessoa esta no texto.
   medeProg() devolve o paragrafo que encosta no topo da leitura, e o quanto
   dele ficou para tras. */
function pars(){return document.querySelectorAll(".colE [data-tr]");}
/* mede o que ficou PARA TRAS: no primeiro paragrafo nada foi lido, e 0% e a
   unica resposta honesta. 100% so quando a rolagem acaba de verdade. */
function medeProg(){
  const c=app.querySelector(".corpo"),ps=pars();
  if(!c||!ps.length)return null;
  if(c.scrollTop+c.clientHeight>=c.scrollHeight-8)return {i:ps.length-1,prog:100};
  const topo=c.getBoundingClientRect().top;
  let i=ps.length-1;
  for(let k=0;k<ps.length;k++)if(ps[k].getBoundingClientRect().bottom>topo+4){i=k;break;}
  return {i:i,prog:Math.round(i/ps.length*100)};
}
function progresso(){
  const m=medeProg();
  return m?m.prog:(S.leit.lidoAte||0);
}
function rotuloProg(prog){
  return S.leit.progresso==="capitulo"?"cap. "+(S.cap+1)+" de "+CAPS.length:prog+"%";
}
/* uma passada de scroll atualiza fio, rotulo e S.cap sem repintar: repintar
   aqui destruiria a selecao e o cursor de quem esta escrevendo uma nota. */
function marcaProgresso(){
  if(S.lugar!=="leitura")return;
  const m=medeProg();if(!m)return;
  const ps=pars();
  S.leit.lidoAte=m.prog;S.leit.par=m.i;
  const cap=Number(ps[m.i].dataset.cap);
  if(!Number.isNaN(cap))S.cap=cap;
  const f=document.getElementById("progF");if(f)f.style.width=m.prog+"%";
  const t=document.getElementById("progT");if(t)t.textContent=rotuloProg(m.prog);
}
function vLeitura(){

     e (cap+1)/total anunciava 75% com a pessoa parada no primeiro paragrafo.

  h+='<div class="ed'+cls+'" style="padding-bottom:var(--s8)"><div class="colE">';
  CAPS.forEach((c,i)=>{
    h+='<section class="lsec" id="cap'+i+'"><div class="lcap"><span>'+esc(c.n)+'</span>'+
      '<span>Capítulo '+(i+1)+' de '+CAPS.length+'</span></div>';
    c.p.forEach((p,j)=>{
      h+='<p class="txtE" data-cap="'+i+'" data-p="'+j+'" data-tr>'+paragrafo(i,j,p)+
        (i===1&&j===0?'<button class="marcaN" data-a="folha" data-v="nota">1</button>':'')+'</p>'+
        notasDo(i,j);
    });
    if(i===2)h+='<blockquote class="lq">A repetição é o que transforma imagem em dado.</blockquote>';
    if(i===2)h+='<figure class="figE"><img src="capas/capa-11.jpg" alt="Capa do Diário 02">'+
      '<figcaption>Registro de campo, expedição 02. A legenda herda a largura da coluna e fica '+

    if(i===1)h+='<p class="lnota">Nota de campo: as duas horas de silêncio foram a única regra que '+

  h+='<div class="lfimE"><span class="kicker">Fim do que foi preparado</span>'+

      '<span style="font-size:var(--t-peq);color:var(--ink-2)">Enviado hoje, 09:12. Se você ler por lá, '+

  '</div></div></div>'+barraSel();
  return h;

/* My Clippings.txt do aparelho — o que o Kindle guarda de verdade */
const CLIPS=[
 {capa:"01",livro:"Estudo de Viabilidade",n:6,novo:4,st:"novo"},
 {capa:"11",livro:"Diário 02",n:3,novo:3,st:"novo"},
 {capa:"04",livro:"Censo de Fauna",n:2,novo:0,st:"iguais"},
 {capa:null,livro:"Manual de campo (não está na estante)",n:5,novo:5,st:"conflito"}
];
/* ═══ DESTAQUE E NOTA ═══
   Endereco semantico: {cap,par,ini,fim} em offsets de caractere sobre
   CAPS[cap].p[par]. Nunca coordenada de tela — DEC-0016. */
/* O endereco tem GRAO, e o grao e onde ele para:
     trecho   cap,par,ini,fim   tem volta ao paragrafo
     capitulo cap, resto null   tem volta ao capitulo
     livro    tudo null         nao tem volta
   Nao ha campo de tipo. As formas sao derivadas de dois bits: ancora e nota. */
function escrito(cap,par,frag,nota,origem,k){
  const tem=cap!=null&&par!=null&&frag;
  let ini=null,fim=null;
  if(tem){
    const t=CAPS[cap].p[par],i=t.indexOf(frag);
    if(i<0)console.warn("semente sem ancora em",cap,par,frag.slice(0,40));
    ini=i<0?0:i;fim=i<0?t.length:i+frag.length;
  }
  return {k:k||("d"+cap+par),livro:ARQ.titulo,cap:(cap===undefined?null:cap),
    par:(tem?par:null),ini:ini,fim:fim,perg:null,nota:nota||"",origem:origem||"leitura"};
}
function semente(cap,par,frag,perg,nota,origem){
  const d=escrito(cap,par,frag,nota,origem);d.perg=(perg===undefined?null:perg);return d;
}
function sementes(){
  /* As quatro derivadas dos titulos dos capitulos e a quinta, que sempre foi
     anotacao livre com ponto de interrogacao no fim, deixam de ser um array a
     parte: sao escritos sem ancora, no mesmo acervo. */
  const q=[
    escrito(0,null,null,"O que a expedi\u00e7\u00e3o esperava encontrar antes de sair?","titulo","q0"),
    escrito(1,null,null,"Que m\u00e9todo de registro foi adotado, e por qu\u00ea?","titulo","q1"),
    escrito(2,null,null,"O que a repeti\u00e7\u00e3o fotogr\u00e1fica produz que uma foto isolada n\u00e3o produz?","titulo","q2"),
    escrito(3,null,null,"O que sobrou no fim, e por que isso virou um di\u00e1rio?","titulo","q3"),
    escrito(null,null,null,"Isso serve para o cap\u00edtulo de m\u00e9todo da minha pesquisa?","livro","q4")
  ];
  return q.concat([
    semente(1,1,"Adotamos a regra de escrever antes de conversar. Duas horas por dia sem falar com ningu\u00e9m, cada um com o pr\u00f3prio caderno.","q1"),
    semente(2,0,"A repeti\u00e7\u00e3o \u00e9 o que transforma imagem em dado.","q2",
      "É a frase que separa registro de coleta. Uma foto é lembrança; a série é medida."),
    /* a tese sobre o livro inteiro nasce SEM ancora: ela nao era daquele trecho */
    escrito(3,null,null,"O argumento do di\u00e1rio inteiro est\u00e1 aqui: o que valeu n\u00e3o foi a conclus\u00e3o, foi o que sobrou bruto.","livro","e0")
  ]);
}
S.dst=sementes();   /* aqui, e nao junto do let S: sementes() le CAPS */
const ancora=d=>d.ini!=null;
const escK=k=>S.dst.find(d=>d.k===k);
const dstK=escK;
/* ORDEM: o que e sobre o livro inteiro vem primeiro; depois tudo na ordem do
   livro; dentro de um capitulo, o que e sobre o capitulo vem antes dos trechos
   dele. Sem esta clausula, cap:null devolve NaN e o item se espalha. */
function ordem(a,b){
  const ga=a.cap==null?0:1,gb=b.cap==null?0:1;
  if(ga!==gb)return ga-gb;
  if(ga===0)return 0;
  if(a.cap!==b.cap)return a.cap-b.cap;
  const pa=a.par==null?0:1,pb=b.par==null?0:1;
  if(pa!==pb)return pa-pb;
  if(pa===0)return 0;
  return (a.par-b.par)||(a.ini-b.ini);
}
/* filhos e DERIVADO: apagar uma pergunta nao deixa filho orfao, e tirar um
   trecho nao deixa referencia morta. perg guarda CHAVE, nunca indice — com
   indice, o primeiro apagar reindexaria e moveria os trechos em silencio. */
const filhos=k=>S.dst.filter(d=>d.perg===k).sort(ordem);
const escTxt=d=>{if(!ancora(d))return"";const t=CAPS[d.cap]&&CAPS[d.cap].p[d.par];
  return t?t.slice(d.ini,d.fim):"";};
const dstTexto=escTxt;
/* null+1 === 1 em JS: o dstCap antigo nao estourava, ele MENTIA "Capitulo 1" */
const escEnd=d=>d.cap!=null?"Cap\u00edtulo "+(d.cap+1):ARQ.titulo;
const dstCap=escEnd;
const semAncora=()=>S.dst.filter(d=>d.livro===ARQ.titulo&&!ancora(d)).sort(ordem);
/* o paragrafo e emitido fatiado pelos destaques que caem nele */
function paragrafo(cap,par,txt){
  const ds=S.dst.filter(d=>d.cap===cap&&d.par===par).sort((a,b)=>a.ini-b.ini);
  if(!ds.length)return esc(txt);
  let h="",pos=0;
  ds.forEach(d=>{
    if(d.ini<pos)return;
    h+=esc(txt.slice(pos,d.ini));
    const tr=txt.slice(d.ini,d.fim);
    h+='<mark class="dst" id="mk-'+d.k+'" data-a="dst-abrir" data-v="'+d.k+'" tabindex="0" '+
      'role="button" aria-label="'+(d.nota?"Destaque com nota: ":"Destaque: ")+
      esc(tr.slice(0,50))+'">'+esc(tr)+'</mark>';
    pos=d.fim;
  });
  return h+esc(txt.slice(pos));
}
/* a nota fica no fluxo, logo abaixo do paragrafo. Ela e o proprio marcador:
   sinal apontando para o que esta a vista seria ruido. */
function notasDo(cap,par){
  return S.dst.filter(d=>d.cap===cap&&d.par===par&&(d.nota||S.notaAberta===d.k))
    .sort((a,b)=>a.ini-b.ini).map(notaE).join("");
}
function notaE(d){
  const pai=d.perg?escK(d.perg):null;
  const onde=!ancora(d)?"sobre o livro":(pai?'sob “'+esc(pai.nota.slice(0,30))+'…”':"solta");
  if(S.notaAberta!==d.k)
    return '<div class="notaE"><p>'+esc(d.nota)+'</p><div class="pe">'+
      '<button class="lnk mudo" data-a="dst-nota" data-v="'+d.k+'">Editar</button>'+
      '<span class="sp"></span><span class="dest">'+onde+'</span></div></div>';
  const rasc=S.rasc[d.k]!==undefined?S.rasc[d.k]:d.nota;
  return '<div class="notaE'+(S.erroNota?" -erro":"")+'">'+
    '<textarea class="campo" id="campoNota" placeholder="O que você pensou aqui" '+

function vMesa(){
  if(S.cena==="nova"||!S.conta)return mesaNova();
  const v=S.mesaVar||"reduzida";
  if(v==="reduzida")return mesaReduzida();
  if(v==="atual")return mesaAtual();
  const d=mDados();
  if(d.acervo===0&&!d.preps.length)return mesaVazia();
  let h='<div class="pad'+(v==="c"?" larga":"")+'">'+mCab()+mSolta();
  if(v==="a")h+=mResumo(d)+mPend(d)+mPrep(d)+mProntos(d)+mEstante(d);
  if(v==="b")h+=mContinuar(d)+mPend(d)+mPrep(d)+mProntos(d)+mEstante(d);
  if(v==="c")h+='<div class="mduas"><div>'+mResumo(d,true)+mPend(d)+mPrep(d)+'</div>'+
    '<div>'+mContinuar(d)+mProntos(d)+mEstante(d)+'</div></div>';
  return h+mEstados()+'</div>';
}

function vLivro(){

     um campo vazio nao e informacao, e "ainda nao enviado" ja esta dito pelo
     botao que continua ali. */
  const cl=[];
  if(S.cap>0)cl.push("Cap\u00edtulo "+(S.cap+1)+" de "+CAPS.length);
  /* o saldo do que ficou nao entra aqui: ele e da secao "O que ficou", que
     conta pela regra certa (ancora e nota sao coisas diferentes) e esta na
     mesma tela. Repetir aqui era repetir com OUTRA conta — o cabecalho somava
     nota livre como marcado e dizia 8 onde a secao dizia 2. */
  if(S.enviado)cl.push("Enviado hoje, 09:12");
  const fonte=["<b>EPUB</b>","reconhecido em 93 de 96 p\u00e1ginas"]
    .concat(S.traduzir?["traduzido para "+esc(S.traduzir)+" \u2014 o original em portugu\u00eas continua na estante"]:[])
    .concat(["de <b>"+esc(ARQ.nome)+"</b>"]);

    '<button class="volta" data-a="ir" data-v="estante">\u2039 Estante</button>'+
    '<div class="livro"><img class="capao" src="'+capa(S.capaEsc==="gerada"?ARQ.gerada:ARQ.capa)+
      '" alt="Capa de '+esc(ARQ.titulo)+'">'+
    '<div>'+
      '<div class="tit"><h1>'+esc(ARQ.titulo)+'</h1>'+
      '<button class="icb" data-a="folha" data-v="controles" aria-label="Controles do arquivo" '+
      'title="Controles do arquivo">\u22ee</button></div>'+
      '<p class="autor">'+esc(ARQ.autor)+'</p>'+
      (cl.length?'<p class="saldo" style="margin:var(--s3) 0 0">'+cl.join(" \u00b7 ")+'</p>':'')+
      '<p class="fonte">'+fonte.join(" \u00b7 ")+'</p>'+
      '<div class="acoes">'+
        '<button class="btn" data-a="ir" data-v="leitura">'+
          (S.cap>0?"Continuar no cap\u00edtulo "+(S.cap+1):"Ler")+'</button>'+
        (S.enviado?'':'<button class="btn sec2" data-a="folha" data-v="envio">Enviar ao Kindle</button>')+
      '</div>'+
      '<div class="acoes -mudas">'+
        (S.cap>0?'<button class="lnk mudo" data-a="ler-comeco">Ler do come\u00e7o</button>':'')+
        (S.enviado?'<button class="lnk mudo" data-a="folha" data-v="envio">Enviar de novo</button>':'')+
        '<button class="lnk mudo" data-a="ver-preparo">ver o preparo</button>'+
      '</div>'+

    (!S.pendResolvida?'<div style="margin:var(--s5) 0 0"><span class="pend">'+
      '<span class="n">!</span>Tr\u00eas p\u00e1ginas ficaram sem texto.'+
      '<button class="lnk" data-a="folha" data-v="paginas" style="padding:0 0 0 var(--s2)">ver as p\u00e1ginas</button>'+
      '</span></div>':'')+

function acoesDst(d){
  if(!ancora(d))
    /* sem ancora nao ha trecho para onde ir, e navegar seria mentira */
    return '<div class="acs">'+
      '<button class="lnk mudo" data-a="dst-editar" data-v="'+d.k+'">editar</button>'+
      '<button class="lnk mudo sob" data-a="ler-pergunta" data-v="'+d.k+'">ler com isto \u2192</button>'+
      '<button class="lnk mudo sob" data-a="dst-copiar" data-v="'+d.k+'">copiar com a origem</button>'+
      '<span class="sp" style="flex:1"></span>'+
      '<button class="lnk sob tirar" data-a="esc-apagar" data-v="'+d.k+'">apagar</button></div>';
  return '<div class="acs">'+
    '<button class="lnk mudo" data-a="dst-ir" data-v="'+d.k+'">ir ao trecho</button>'+
    '<button class="lnk mudo sob" data-a="dst-editar" data-v="'+d.k+'">'+
      (d.nota?"editar a nota":"anotar")+'</button>'+
    '<button class="lnk mudo sob" data-a="dst-sob" data-v="'+d.k+'">'+
      (d.perg?"trocar a pergunta":"guardar sob uma pergunta")+'</button>'+
    '<button class="lnk mudo sob" data-a="dst-copiar" data-v="'+d.k+'">copiar com a origem</button>'+
    '<span class="sp" style="flex:1"></span>'+
    '<button class="lnk sob tirar" data-a="dst-tirar" data-v="'+d.k+'">tirar</button></div>';
}
function itemMarcado(d,ideia){
  const end=esc(escEnd(d));
  const kd=d.origem==="kindle"?'<span class="kd">do Kindle</span>':"";
  /* SEM ANCORA: mesmo corpo da nota de trecho, regua de 1px, e nenhum retorno.
     A ausencia do simbolo de volta e a regua fina sao os dois sinais — nao ha
     rotulo, selo nem icone dizendo "sem trecho". */
  if(!ancora(d)){
    if(S.notaAberta===d.k)return notaLivre(d);
    const org=d.origem==="titulo"?'<span class="o">do t\u00edtulo do cap. '+(d.cap+1)+'</span>':"";
    return '<div class="tr -livre" id="e-'+d.k+'"><p>'+esc(d.nota)+'</p>'+
      '<cite>'+end+'</cite>'+org+acoesDst(d)+'</div>';
  }
  const pai=d.perg?escK(d.perg):null;
  const sob=pai?' \u00b7 '+esc(pai.nota.slice(0,26))+'\u2026':"";
  const corte=escTxt(d).length>64?"\u2026":"";
  if(ideia){
    const ab=S.dstAberto===d.k;
    return '<div class="tr -ideia" id="e-'+d.k+'"><p>'+esc(d.nota)+'</p>'+
      '<button class="volta" data-a="dst-abrirtr" data-v="'+d.k+'" aria-expanded="'+ab+'">\u21a9 '+
      esc(escTxt(d).slice(0,64))+corte+'</button>'+
      (ab?'<p class="cheio">\u201c'+esc(escTxt(d))+'\u201d</p>':'')+
      '<cite>'+end+sob+'</cite>'+kd+acoesDst(d)+'</div>';
  }
  return '<div class="tr" id="e-'+d.k+'"><p>'+esc(escTxt(d))+'</p>'+
    '<cite>'+end+sob+'</cite>'+kd+acoesDst(d)+'</div>';
}
/* o compositor sem ancora: mesmo campo, mesmo Pronto, outra superficie */
function notaLivre(d){
  const rasc=S.rasc[d.k]!==undefined?S.rasc[d.k]:d.nota;
  return '<div class="tr -livre" id="e-'+d.k+'">'+
    '<textarea class="campo" id="campoNota" aria-label="Sua anota\u00e7\u00e3o" '+
    'placeholder="O que voc\u00ea quer guardar sobre este livro">'+esc(rasc)+'</textarea>'+
    '<div class="pe"><button class="lnk" data-a="dst-guardar" data-v="'+d.k+'">Pronto</button>'+
    '<span class="sp" style="flex:1"></span>'+
    '<span class="dest">'+esc(escEnd(d))+'</span></div></div>';
}
function secMarcado(){
  const meus=S.dst.filter(d=>d.livro===ARQ.titulo).sort(ordem);
  /* a rede de desfazer vem ANTES de qualquer retorno */
  const desfaz=S.dstUndo?'<div class="desfezL"><span>'+
    (ancora(S.dstUndo.d)?"Trecho tirado.":"Apagado.")+'</span>'+
    '<button class="lnk" data-a="dst-desfazer" style="padding:0">desfazer</button></div>':"";
  let h='<div class="sec" id="marcado" style="margin-top:var(--s7)"><h3>O que ficou</h3>'+desfaz;
  const q=(S.qMarcado||"").toLowerCase().trim();
  const passa=d=>!q||((d.nota||"")+" "+escTxt(d)).toLowerCase().indexOf(q)>-1;
  /* um pai entra se ele OU um filho casa: senao a busca esconderia o dossie */
  const pais=meus.filter(d=>!ancora(d)&&(!q||passa(d)||filhos(d.k).some(passa)));
  const soltos=meus.filter(d=>ancora(d)&&!d.perg&&passa(d));
  const comNota=meus.filter(d=>ancora(d)&&d.nota).length;
  const marcados=meus.filter(ancora).length;
  if(!meus.length&&!S.escNovo)
    return h+'<p style="font-size:13px;color:var(--ink-2);line-height:1.6;max-width:58ch;margin:0">'+
      '<b>Nada aqui ainda.</b> O que voc\u00ea destacar lendo aparece preso ao trecho. '+
      'O que voc\u00ea escrever sobre o livro aparece sem trecho nenhum.</p>'+
      '<div style="margin-top:var(--s4)"><button class="lnk mudo" data-a="esc-novo" '+
      'style="padding:0">Escrever sobre o livro</button></div></div>';
  const cl=[];
  if(marcados)cl.push(marcados+' marcado'+(marcados>1?"s":""));
  if(comNota)cl.push(comNota+' com nota');
  if(pais.length)cl.push(pais.length+' anota\u00e7'+(pais.length>1?"\u00f5es":"\u00e3o"));
  h+=(cl.length?'<p class="saldo">'+cl.join(" \u00b7 ")+'</p>':'')+
    '<div class="dossie" style="border:none;padding:0;margin:0">';
  if(meus.length>8)
    h+='<input class="campoB" id="buscaMarcado" placeholder="Buscar no que voc\u00ea escreveu" '+
      'value="'+esc(S.qMarcado||"")+'" style="margin-bottom:var(--s4)">';
  if(q&&!pais.length&&!soltos.length)
    h+='<p style="font-size:13px;color:var(--ink-3);margin:0">Nada com \u201c'+esc(q)+'\u201d.</p>';
  /* o pai e um ITEM da lista, nao um cabecalho de secao: uma pergunta sem
     trecho nao some, ela so nao tem nada embaixo. Nao ha segunda lista. */
  pais.forEach(d=>{
    h+=itemMarcado(d,true);
    h+=filhos(d.k).filter(passa).map(f=>itemMarcado(f,!!f.nota)).join("");
  });
  if(S.escNovo)h+=notaLivre({k:S.escNovo,cap:null,nota:""});
  if(soltos.length)
    h+=(pais.length?'<div class="grpM">Solto no livro</div>':'')+
      soltos.map(d=>itemMarcado(d,!!d.nota)).join("");
  if(!S.escNovo)
    h+='<div class="faltam"><button class="lnk mudo" data-a="esc-novo" style="padding:0">'+
      'Escrever sobre o livro</button></div>';
  return h+'</div></div>';
}

/* ═══ ESTANTE ═══ */
/* Os quatro recortes saem do proprio acervo e a contagem e feita na hora:
   um filtro que anuncia um numero que ninguem consegue produzir e o mesmo
   erro de confianca inventada, so que em miniatura. "Ainda nao enviados"
   ficou de fora porque nao existe campo — e nao se inventa um. */
/* os recortes de formato saem do proprio acervo, e nao de uma lista escrita a
   mao: com PDF e EPUB fixos, 3 dos 14 itens (2 TXT, 1 XLSX) nao cabiam em
   recorte nenhum e "Tudo 14" deixava de fechar a conta na frente de quem soma.
   Formato agora particiona; "Com nota" e o unico recorte de estado. */
const FILTROS=(function(){
  const fs=[...new Set(ACERVO.map(b=>b.f))]
    .sort((a,b)=>ACERVO.filter(x=>x.f===b).length-ACERVO.filter(x=>x.f===a).length||a.localeCompare(b));
  return [["tudo","Tudo",()=>true],["nota","Com nota",b=>/nota/.test(b.q)]]
    .concat(fs.map(f=>[f.toLowerCase(),f,b=>b.f===f]));
})();
function vEstante(){
  const f=FILTROS.find(x=>x[0]===(S.fEstante||"tudo"))||FILTROS[0];
  const acervo=ACERVO.filter(f[2]);
  let h='<div class="pad larga">'+
    '<div style="display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)">'+
    '<div><h1 class="t">Estante</h1><p class="sub" style="margin:0">'+ACERVO.length+
      ' itens \u00b7 tudo que j\u00e1 foi preparado.</p></div>'+
    '<span class="sp"></span>'+
    '<span class="vista"><button data-a="vista" data-v="lista" aria-pressed="'+(S.estante==="lista")+'">Capas</button>'+
    /* o Caderno 03 poe a Estante 3D em "adiar" com a instrucao de marcar como
       experimento. Marcar so depois do clique seria marcar tarde: o aviso mora
       no botao, e a razao medida aparece quando a vista abre. */
    '<button data-a="vista" data-v="3d" aria-pressed="'+(S.estante==="3d")+'">Estante 3D'+
    '<span class="exp">exp</span></button></span></div>'+
    '<div class="filtroL">'+FILTROS.map(x=>
      '<button data-a="f-estante" data-v="'+x[0]+'" aria-pressed="'+(f[0]===x[0])+'">'+x[1]+
      '<span class="n">'+ACERVO.filter(x[2]).length+'</span></button>').join("")+'</div>';
  if(!acervo.length)
    return h+'<p class="sub">Nenhum item com esse recorte.</p></div>';
  if(S.estante==="lista"){
    h+='<div class="grade">'+acervo.map(b=>'<button class="bk" data-a="ir-livro">'+
      '<img src="'+capa(b.c)+'" alt="Capa de '+esc(b.t)+'" loading="lazy">'+
      '<span class="t">'+esc(b.t)+'</span><span class="a">'+esc(b.a)+' \u00b7 '+b.f+'</span>'+
      /* sem esta linha, "Malha Urbana · Ana Duarte · EPUB" aparece duas vezes
         identica: o campo que separa a edicao da variante existia no acervo e
         so o modo Estante mostrava. E e ele que explica o recorte "Com nota". */
      '<span class="q">'+esc(b.q)+'</span></button>').join("")+'</div>';
  }else{
    /* o numero e medido na propria tela, nao escrito a mao: 14 lombadas de
       ~18px numa tabua de 1000px ocupam 9% dela. Dizer "experimento" sem dizer
       o que ele faz pior seria selo decorativo. */
    h+='<div class="nota" style="margin:0 0 var(--s5)"><span>\u25c6</span><div>'+
      '<b>Experimento.</b> As lombadas ocupam menos de um d\u00e9cimo da prateleira, e o '+
      't\u00edtulo s\u00f3 se l\u00ea de lado, um por vez. Em <b>Capas</b> os '+ACERVO.length+
      ' t\u00edtulos ficam leg\u00edveis de uma vez. Isto continua aqui porque a estante '+
      '\u00e9 a met\u00e1fora certa \u2014 n\u00e3o porque j\u00e1 entrega mais que a lista.'+
      '</div></div>';
    const n=Math.ceil(acervo.length/5);
    const prats=[];for(let k=0;k<n;k++)prats.push(acervo.slice(k*5,k*5+5));
    h+=prats.map(pr=>'<div class="prat"><div class="lombs">'+pr.map(b=>
      '<button data-a="lomb" data-v="'+b.c+'" aria-pressed="'+(S.lombSel===b.c)+'" title="'+esc(b.t)+'">'+
      '<img src="'+lomb(b.l)+'" alt="Lombada de '+esc(b.t)+'" style="height:'+b.h+'px" loading="lazy"></button>').join("")+
      '</div><div class="tabua"></div></div>').join("");
    const b=acervo.find(x=>x.c===S.lombSel);
    h+='<div class="legenda">'+(b?'<b style="font-size:14px">'+esc(b.t)+'</b>'+
      '<span style="font-size:12.5px;color:var(--ink-3)">'+esc(b.a)+' \u00b7 '+b.f+' \u00b7 '+esc(b.q)+'</span>'+
      '<span class="sp"></span><button class="lnk" data-a="ir-livro">Abrir</button>':'')+'</div>';
  }
  /* a dock saiu daqui: ela repetia Capas/Estante, que ja estao no seletor
     acima, e a justificativa dela era manipulacao direta perto das maos —
     isso e Canvas. Trocar de vista e filtrar nao sao manipulacao. */
  return h+'</div>';
}
function vCanvas(nome){

    'manipulação direta, que precisam ficar perto das mãos.</p>'+

}

/* posicao da barra em coordenadas de .corpo, que e o bloco posicionado.
   O limiar de virar para baixo e MEDIDO: .leituraTopo encolhe quando o
   progresso esta desligado, e a .qbar quebra em duas linhas em tela estreita. */
function posRect(rr){
  const c=app.querySelector(".corpo");if(!c)return{x:0,y:0};
  const cr=c.getBoundingClientRect();
  const x=rr.left-cr.left+c.scrollLeft+rr.width/2;
  let y=rr.top-cr.top+c.scrollTop-46;
  const st=app.querySelector(".qbar")||app.querySelector(".leituraTopo");
  const lim=st?(st.getBoundingClientRect().bottom-cr.top+c.scrollTop+8):0;
  if(y<lim)y=rr.bottom-cr.top+c.scrollTop+8;   /* nao cobre o trecho: vai por baixo */
  /* e se mesmo por baixo ela ficasse atras do cabecalho fixo, quem cede e a
     rolagem: o trecho desce e continua a vista. A barra nunca cobre nada. */
  const d=lim-y;
  if(d>0&&d<240&&cr.height>0)c.scrollTop-=d;   /* nunca um salto: so o minimo */
  return {x:x,y:y};
}
const NAOESP=/[^\s]/;
const paragrafoDe=n=>{const e=n&&(n.nodeType===1?n:n.parentElement);
  return e?e.closest("[data-tr]"):null;};
/* A selecao so vale dentro de um paragrafo do texto. Atravessar dois, ou
   pegar legenda, citacao e titulo, e recusado EM SILENCIO — nada pisca. */
function capturaSel(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){
    if(S.selE&&!S.selE.desfazer&&!S.selE.confirma){S.selE=null;barra();}
    return;
  }
  const r=sel.getRangeAt(0);
  const pa=paragrafoDe(r.startContainer),pf=paragrafoDe(r.endContainer);
  if(!pa||pa!==pf){sel.removeAllRanges();if(S.selE){S.selE=null;barra();}return;}
  const cap=Number(pa.dataset.cap),par=Number(pa.dataset.p),t=CAPS[cap].p[par];
  const pre=document.createRange();
  pre.selectNodeContents(pa);pre.setEnd(r.startContainer,r.startOffset);
  let ini=pre.toString().length,fim=ini+r.toString().length;
  /* encaixe em palavra inteira: roda sozinho, sem controle e sem mencao.
     Come o caso dominante de "peguei meia palavra" antes de ele existir. */
  while(ini>0&&NAOESP.test(t.charAt(ini-1)))ini--;
  while(fim<t.length&&NAOESP.test(t.charAt(fim)))fim++;
  if(fim<=ini)return;
  /* encostar num destaque que ja existe REABRE aquele destaque em vez de
     criar outro por cima: destaques sobrepostos fatiariam o paragrafo errado. */
  const bate=S.dst.filter(d=>d.cap===cap&&d.par===par&&d.ini<fim&&d.fim>ini)
    .sort((x,z)=>x.ini-z.ini);
  const pos=posRect(r.getBoundingClientRect());
  S.selE=bate.length?Object.assign({k:bate[0].k},pos)
                    :Object.assign({cap:cap,par:par,ini:ini,fim:fim},pos);
  barra();
}
/* a barra entra sem repintar: pinta() destroi #app inteiro e a selecao viva
   morreria junto, deixando a pessoa com uma barra e nenhum trecho marcado. */
function barra(){
  const c=app.querySelector(".corpo");if(!c)return;
  const atual=c.querySelector(".selE");
  document.body.classList.toggle("-selecionando",!!S.selE);
  if(!S.selE){if(atual)atual.remove();return;}
  const h=barraSel();
  if(atual)atual.outerHTML=h;else c.insertAdjacentHTML("beforeend",h);
}
/* rascunho: qualquer pinta() recria o <textarea> e levaria o texto junto. */
function guardaRascunho(){
  const ta=document.getElementById("campoNota");
  if(ta&&S.notaAberta)S.rasc[S.notaAberta]=ta.value;
  return ta?{ini:ta.selectionStart,fim:ta.selectionEnd,alt:ta.style.height}:null;
}
function pinta(){
  const cAnt=app.querySelector(".corpo");
  const y=cAnt?cAnt.scrollTop:0;
  const taEst=guardaRascunho();
  const tinhaBusca=document.activeElement&&document.activeElement.id==="buscaMarcado";
  /* ancora semantica em vez de scrollTop cru: abrir uma nota no fluxo empurra
     a linha que a pessoa esta lendo, e o pixel de rolagem nao sabe disso. */
  let anc=null;
  if(S.lugar==="leitura"&&ultimoLugar==="leitura"&&cAnt){
    const cr=cAnt.getBoundingClientRect();
    const ps=app.querySelectorAll(".colE [data-tr]");
    for(let i=0;i<ps.length;i++){
      const rr=ps[i].getBoundingClientRect();
      if(rr.bottom>cr.top+4){anc={cap:ps[i].dataset.cap,par:ps[i].dataset.p,top:rr.top-cr.top};break;}
    }
  }
  /* os ajustes de leitura agem sobre as variáveis, não sobre cada regra */
  const CORPO=["1.02rem","1.16rem","1.3rem"],ENTRE=["1.5","1.62","1.78"],LARG=["30rem","42.1875rem","52rem"];
  const ESP=[".55em","1.05em","1.7em"];
  app.style.setProperty("--t-leitura",CORPO[S.corpo]);
  app.style.setProperty("--lh-leitura",ENTRE[S.entre]);
  app.style.setProperty("--esp-par",ESP[S.leit.espaco]);
  if(S.lugar==="leitura")app.style.setProperty("--col",LARG[S.largura]);
  else app.style.removeProperty("--col");
  app.innerHTML=topo()+'<div class="corpo">'+corpo()+'</div>'+vFolha();
  /* a contagem da pré-visualização é MEDIDA na própria tela do aparelho:
     altura real do conteúdo dividida pela altura visível. Nada estimado. */
  const rolo=document.getElementById("rolo2");
  if(rolo){
    const medir=()=>{
      /* a altura útil vem da tela do aparelho, não de um height:100% que
         depende do pai — assim a medição não muda de significado sozinha */
      const tela=document.getElementById("telaQ");
      if(tela){
        const cs=getComputedStyle(tela);
        const util=tela.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
        if(util>40)rolo.style.height=util+"px";
      }
      const alt=rolo.clientHeight||1,total=rolo.scrollHeight;
      /* razão direta entre altura do conteúdo e altura visível — é o único
         número aqui que não depende de interpretar estilo computado */
      const telas=Math.max(1,Math.ceil(total/alt));
      const m=document.getElementById("medQ"),p=document.getElementById("pagQ");
      if(m)m.innerHTML=S.formato==="pdf"?
        'A página não reflui — <b>o texto sai da tela</b>':
        'Neste corpo, o trecho ocupa <b>'+telas+' tela'+(telas>1?"s":"")+'</b> — medido aqui, não estimado.'+
        '<br><span style="opacity:.7">'+DISP[S.disp][1]+' · '+DISP[S.disp][2]+'</span>';
      if(p)p.textContent=S.formato==="pdf"?"1 de 96":"1 de "+telas;
    };
    medir();                     /* leitura de clientHeight já força o layout */
    setTimeout(medir,60);        /* segunda passada, depois de a fonte assentar */
  }
  /* o assistente valida enquanto se digita: o botão liga sozinho quando o
     endereço fecha em @kindle.com, e a mensagem de erro aparece antes do clique */
  const we=document.getElementById("wizEmail");
  if(we){
    we.focus();we.setSelectionRange(we.value.length,we.value.length);
    we.addEventListener("input",()=>{S.wiz.email=we.value;pinta();});
    const wn=document.getElementById("wizNome");
    if(wn)wn.addEventListener("input",()=>{S.wiz.nome=wn.value;});
  }
  /* confirmação por digitação: o botão só liga quando a palavra confere */
  const pc=document.getElementById("pcampo");
  if(pc&&S.folha==="apagar-conta"){
    pc.focus();pc.setSelectionRange(pc.value.length,pc.value.length);
    pc.addEventListener("input",()=>{S.prasc=pc.value;pinta();});
  }else if(pc){pc.focus();pc.setSelectionRange(pc.value.length,pc.value.length);}
  /* arrastar sobre a Mesa transforma a própria página em área de solta —
     no lugar do dropzone permanente que ocupava o topo */
  if(S.lugar==="mesa"&&S.conta){
    let dentro=0;
    app.addEventListener("dragenter",e=>{e.preventDefault();dentro++;app.classList.add("-arrastando");});
    app.addEventListener("dragover",e=>e.preventDefault());
    app.addEventListener("dragleave",()=>{if(--dentro<=0)app.classList.remove("-arrastando");});
    app.addEventListener("drop",e=>{e.preventDefault();dentro=0;app.classList.remove("-arrastando");
      S.lugar="item";S.dentro=false;pinta();});
  }
  /* o campo da lista tambem precisa ser reancorado a cada pinta(),
     senao ele perde o foco a cada tecla digitada. */
  const bm=document.getElementById("buscaMarcado");
  if(bm){
    /* so devolve o foco se ele ja estava aqui: incondicional, toda repintura
       rolava a tela ate a busca e tirava a pessoa de onde ela estava. */
    if(tinhaBusca){bm.focus();bm.setSelectionRange(bm.value.length,bm.value.length);}
    bm.addEventListener("input",()=>{S.qMarcado=bm.value;pinta();});
  }
  const campo=document.getElementById("campoBusca");
  if(campo){
    campo.focus();campo.setSelectionRange(campo.value.length,campo.value.length);
    campo.addEventListener("input",()=>{
      S.q=campo.value;
      const q=S.q.trim().toLowerCase();
      const ach=q?ACERVO.filter(b=>(b.t+" "+b.a+" "+b.f).toLowerCase().includes(q)):ACERVO.slice(0,5);
      document.getElementById("resBusca").innerHTML=resultados(ach,q);
    });
    campo.addEventListener("keydown",e=>{
      if(e.key==="Enter"){const p=document.querySelector("#resBusca .linha");if(p)p.click();}
    });
  }
  const c=app.querySelector(".corpo");
  if(c){
    c.scrollTop=y;
    /* entrando na leitura vinda de outra tela: "Continuar no capitulo 3" abria
       no primeiro paragrafo do capitulo 1. Volta ao paragrafo onde parou. */
    if(S.lugar==="leitura"&&ultimoLugar!=="leitura"){
      const ps=pars(),alvo=ps[Math.min(S.leit.par||0,ps.length-1)];
      if(alvo&&(S.leit.par||0)>0){
        c.scrollTop+=alvo.getBoundingClientRect().top-c.getBoundingClientRect().top-24;
      }
      marcaProgresso();
    }
    if(anc){
      const el=c.querySelector('[data-cap="'+anc.cap+'"][data-p="'+anc.par+'"]');
      if(el){const cr=c.getBoundingClientRect();
        c.scrollTop+=(el.getBoundingClientRect().top-cr.top)-anc.top;}
    }
    if(S.lugar==="leitura"){
      const ed=c.querySelector(".ed");
      if(ed){
        ed.addEventListener("mouseup",capturaSel);
        ed.addEventListener("touchend",capturaSel);
        /* selecao por teclado tambem abre a barra: sem isto o gesto central
           do produto seria exclusivo do mouse. */
        ed.addEventListener("keyup",e=>{if(e.shiftKey)capturaSel();});
      }
    }
    /* FORA do ramo da leitura: o compositor tambem abre na tela do livro, e
       la ele perderia cursor a cada pinta() — "nada foi perdido" viraria
       mentira justo na superficie nova. */
    const ta=document.getElementById("campoNota");
    if(ta){
      if(taEst&&taEst.alt)ta.style.height=taEst.alt;
      ta.focus();
      const fz=taEst?taEst.fim:ta.value.length;
      ta.setSelectionRange(taEst?taEst.ini:fz,fz);
    }
    document.body.classList.toggle("-selecionando",!!S.selE);
    c.addEventListener("scroll",()=>{
      marcaProgresso();
      const d=c.scrollTop>96;
      if(d!==S.dentro){S.dentro=d;const t=app.querySelector(".topo");
        if(t)t.classList.toggle("-dentro",d&&(S.lugar==="item"||S.lugar==="livro"));}
    });
  }
  ultimoLugar=S.lugar;
}
function tick(){
  clearInterval(timer);
  timer=setInterval(()=>{
    S.feito+=6;
    if(S.feito>=42&&!S.pendMostrada&&!S.pendResolvida){
      S.pendMostrada=true;clearInterval(timer);timer=null;S.folha="pend";pinta();return;}
    if(S.feito>=96){S.feito=96;clearInterval(timer);timer=null;S.fase="pronto";}
    pinta();
  },300);
}

app.addEventListener("click",ev=>{

  if(a==="fechar-veu"&&ev.target.closest("[data-stop]"))return;

  switch(a){
    case "nada":aviso("Controle representado");break;

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.notaAberta){
    /* grava ANTES de fechar: sem estas duas linhas o Escape destruiria o
       <textarea> com o texto dentro, e "nada foi perdido" viraria mentira. */
    const d=dstK(S.notaAberta),ta=document.getElementById("campoNota");
    if(d&&ta)d.nota=ta.value.trim();
    delete S.rasc[S.notaAberta];S.notaAberta=null;pinta();return;
  }
  if(e.key==="Escape"&&S.selE){S.selE=null;barra();return;}
  if((e.key==="Enter"||e.key===" ")&&document.activeElement&&
     document.activeElement.matches&&document.activeElement.matches("mark[data-a]")){
    e.preventDefault();document.activeElement.click();return;
  }
  if(e.key==="Escape"&&(S.folha||S.menu)){S.folha=null;S.menu=false;pinta();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"&&S.conta){e.preventDefault();S.folha="busca";S.q="";pinta();}
});

"no EPUB o texto reflui, em PDF não" ensina, e é a diferença entre confirmar e obedecer.</li>

<h3>O que foi reescrito</h3>

<h3>A Home foi reescrita — e o motivo importa antes do Figma</h3>
<p>A primeira versão desta Home <b>vendia o conversor, não o produto</b>. Eu a escrevi a partir do fluxo
de preparação que tinha acabado de construir, então ela herdou aquele escopo: seis faixas sobre

<p>O registro do projeto define o Mekora como <i>"ambiente pessoal de leitura e pesquisa que prepara

documentos para Kindle e conecta biblioteca, notas, perguntas e dossiês como contexto reutilizável"</i>,
e a <span class="mono">DEC-0018</span> pôs Estante, Canvas e Conexões dentro do MVP. A Home descrevia
menos da metade disso — e justamente a metade que qualquer conversor gratuito também faz.</p>
<p><b>O que mudou:</b> a promessa saiu de "seus arquivos viram livros" para <b>"uma estante para os

descreveu. E a conta deixou de pedir desculpa: <b>"a conta é a estante"</b> em vez de "converter não

exige conta", que posicionava cadastro como fricção em vez de como o produto.</p>

<h3>O que é estrutural e o que dá para trocar sem quebrar nada</h3>
<p>Para você implementar no Figma sem retrabalho: <b>a coluna da esquerda é argumento</b> — se mudar,
muda a decisão de produto junto. A da direita é redação e pode ser reescrita à vontade.</p>
<table><thead><tr><th>Estrutural — não troque sozinho</th><th>Substituível</th></tr></thead><tbody>
<tr><td class="n">"Uma estante para os livros que não vêm de loja" — é o posicionamento; sem ele o produto vira conversor</td><td>a formulação exata da frase</td></tr>
<tr><td class="n">Os dois problemas, nessa ordem: o PDF não reflui, e depois vira arquivo perdido</td><td>os exemplos de cada um</td></tr>
<tr><td class="n">"A conta é a estante" — define o que a conta é, e a ordem em que se pede</td><td>o texto de apoio</td></tr>
<tr><td class="n">A faixa "para quem", com prazer e estudo separados</td><td>os dois retratos</td></tr>
<tr><td class="n">Dizer que converter não exige conta, e dizer isso cedo</td><td>onde exatamente aparece</td></tr>
<tr><td class="n">"Um PDF no Kindle não é uma foto de um livro" — a única frase que sobreviveu inteira das duas versões</td><td>—</td></tr>
</tbody></table>
<p><b>Uma coisa que segurei de propósito:</b> a Home não promete leitor, dossiê nem pergunta como
prontos. O <span class="mono">capability_snapshot</span> marca biblioteca espacial e notas conectadas

produto é sem datar o que ainda não está de pé, e diz onde isso fica escrito.</p>
</div>`,
dock:`<div class="w"><h2>A dock: uma sai, uma fica, uma vira outra coisa</h2>
<p>A confusão é justa, porque hoje <b>existem três coisas diferentes chamadas dock</b> no produto, e
elas não têm o mesmo destino.</p>
<h3>1. A dock de navegação — sai</h3>
<p>Na biblioteca, a barra flutuante com Canvas · Estante · Conexões duplica o que a barra do topo faz.
Ter os lugares em duas molduras diferentes era parte do problema dos "dois produtos": na preparação a
navegação era uma pílula no topo, na biblioteca era uma dock embaixo. <b>Os lugares sobem para a barra
do topo</b>, que agora é a mesma nas quatro superfícies.</p>
<h3>2. A dock de ferramentas — fica, só onde há manipulação direta</h3>
<p>Adicionar nota, adicionar mídia, conectar, organizar, filtrar: são ferramentas que agem sobre
objetos que você está arrastando. Elas precisam ficar perto das mãos, e uma barra flutuante é a forma
certa. <b>Continua no Canvas, nas Conexões e na Estante</b> — e some no resto.</p>
<p>Abra Canvas ou Estante aqui do lado: a dock está lá, e agora só com ferramentas.</p>
<h3>3. A dock de ação da preparação — morre</h3>
<p>É a barra flutuante com <i>Reanalisar · Detalhes · Aplicar e continuar</i>. O trabalho dela é ter uma
ação principal, e isso uma barra flutuante faz mal: nas telas atuais ela <b>cobre o primeiro problema
encontrado</b> na análise do quadrinho, e o centro do antes/depois na preparação. Uma ação principal
precisa estar presa ao conteúdo que ela conclui, não pairando sobre ele.</p>
<p>No lugar dela entram duas coisas: o botão no fim do item, onde a leitura termina, e a
<b>faixa contextual do topo</b> — role a tela de um item e repare que o cabeçalho troca de conteúdo:
sai a navegação, entra o nome do arquivo, o estado e a ação principal. Custa zero pixel e resolve
"onde estou" sem cobrir nada.</p>
<h3>Resumo</h3>
<table><thead><tr><th>Qual</th><th>Onde estava</th><th>Destino</th></tr></thead><tbody>
<tr><td class="n">Navegação</td><td>Canvas e Estante</td><td>Sai — vira a barra do topo</td></tr>
<tr><td class="n">Ferramentas</td><td>Canvas e Estante</td><td>Fica, só nessas superfícies</td></tr>
<tr><td class="n">Ação da preparação</td><td>Análise, preparação, conversão</td><td>Morre — vira botão no item e faixa no topo</td></tr>
</tbody></table></div>`,
fluxos:`<div class="w"><h2>O que dá para percorrer aqui</h2>
<p>Três fluxos, do começo ao fim. Tudo simulado — nada é gravado, nenhum arquivo é lido.</p>
<h3>Chegada de um arquivo</h3>
<ul><li><b>Mesa → soltar → item.</b> A análise e a preparação são a mesma tela; as quatro abas de
etapa não existem mais.</li>
<li><b>Preparar com estas recomendações.</b> No meio do processamento aparece uma pendência real —
depois de o trabalho começar, não antes.</li>
<li><b>Pronto → Enviar ao Kindle → Abrir na estante.</b></li>
<li>Role a tela do item para ver a faixa do topo trocar de conteúdo.</li></ul>
<h3>Guiado e Personalizado</h3>
<ul><li>No item, canto direito: <b>Guiado · trocar</b>. O Personalizado abre com tudo já preenchido.</li>
<li>Mexa em um ajuste e volte para Guiado: ele pergunta o que fazer, e diz quantos são.</li></ul>
<h3>Do livro de volta ao preparo</h3>
<ul><li><b>Estante → capa → espaço do livro.</b> A ficha diz de onde o arquivo veio, e
<b>"ver o preparo"</b> volta para o item — o caminho de mão única entre preparação e biblioteca deixou
de existir.</li>
<li>Na Estante, o seletor <b>Estante</b> mostra a versão com as lombadas.</li></ul>
<h3>Perfil</h3>
<ul><li>Avatar no topo → <b>Perfil</b>. Cinco dobras, uma página só. Não há área de Configurações.</li>
<li>Repare em <b>Preferências</b>: o que tem contexto mora onde o efeito acontece; aqui fica o resto.</li></ul>
<h3>O que não está aqui, de propósito</h3>
<p>Leitor, destaques, notas de margem, Conhecimento e Rede já existem no <b>protótipo da área
pessoal</b> e continuam sendo a fonte deles. Este protótipo cobre a chegada do arquivo, a ficha do
livro e o perfil. Os dois usam os mesmos tokens porque são o mesmo produto.</p></div>`
