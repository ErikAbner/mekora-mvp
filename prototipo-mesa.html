<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · Mesa e preparação</title>
<style>
/* ════════════════════════════════════════════════════════════
   Mesmos tokens do prototipo.html — os dois são o mesmo produto,
   e essa é justamente a correção: a preparação passa a morar na
   moldura que a área pessoal já tinha.
   Bordas translúcidas e sombra zero vêm do sistema candidato
   (Caderno 03, seção 11).
   ════════════════════════════════════════════════════════════ */
:root{
  /* ── EDITORIAL UTILITY ──
     Off-white em vez de branco puro, preto levemente suavizado.
     Isto sobrepõe a regra antiga de "o creme é só do leitor": se a estrutura
     vai ser reta, ela não pode ser fria também. As camadas passam a vir do
     fundo, não da borda — é o que permite tirar borda de quase tudo. */
  --bg:#faf9f5;--bg-2:#f4f3ef;--bg-3:#edebe4;--nav:#f4f3ef;--branco:#ffffff;
  --ink:#151515;--ink-2:#57534d;--ink-3:#6e6a63;--ink-4:#b5b0a8;
  --line:rgba(21,21,21,.12);--line-2:rgba(21,21,21,.07);--line-3:rgba(21,21,21,.24);
  --acc:#c0451d;--acc-soft:#fdf0ea;
  --ok:#2f7d55;--ok-soft:#eef6f1;--warn:#976519;--warn-soft:#fdf4e6;--dan:#b23b2a;--dan-soft:#fdefec;
  --paper:#f1eee7;
  /* ── espaço: base 20px como no DOC, com meio-passo de 10 ──
     O DOC opera em múltiplos de 20 e usa 40 e 80 como respiro grande.
     Mantive isso e só troquei a base de 5px por 4px, que já era do Mekora. */
  --s1:4px;--s2:8px;--s3:12px;--s4:20px;--s5:30px;--s6:40px;--s7:60px;--s8:80px;
  /* ── RAIO ── estrutura é reta. O 4px era o pior dos dois mundos: perdia a
     nitidez do 0 sem comprar a simpatia de uma curva de verdade.
     --r1  0 — ação e estrutura: botão, campo, card, lista, folha
     --r2  0 — superfície grande
     --rm  2px — só mídia recortada, para o canto não brigar com a borda
     --rp  pílula — dado: tag, chip, trilho, interruptor
     50%   círculo — avatar e ponto. Não é raio, é forma.
     Pílula e círculo são os 5% que quebram a regra, e é por serem raros
     que eles funcionam: numa composição reta, uma curva vira sinal. */
  --r1:0px;--r2:0px;--rm:2px;--rp:999px;--h1:2.2rem;--h2:2.6rem;
  /* movimento amacia o que a geometria endureceu */
  --curva:cubic-bezier(.16,1,.3,1);--d1:.16s;--d2:.26s;--d3:.42s;
  --ui:-apple-system,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* ── medida editorial ── as três larguras do DOC: 575 → 675 → 775 ── */
  --col:35.9375rem;
  /* ── escala tipográfica: quanto maior o texto, menor a entrelinha ── */
  --t-display:clamp(2.6rem,1.6rem + 3.4vw,5.2rem);
  --t-h1:2.15rem;--t-h2:1.5rem;--t-h3:1.14rem;
  --t-leitura:1.16rem;--t-ui:.94rem;--t-peq:.83rem;--t-mono:.68rem;
  --lh-display:.94;--lh-h1:1.06;--lh-h2:1.2;--lh-h3:1.34;--lh-leitura:1.62;--lh-ui:1.5;
  --tr-display:-.03em;--tr-h1:-.025em;--tr-h2:-.015em;
}
@media (min-width:1200px){:root{--col:42.1875rem}}
@media (min-width:1600px){:root{--col:48.4375rem}}
/* O escuro nao segue o sistema: um prototipo de revisao abre na paleta que
   esta sendo decidida. Ele existe abaixo, e entra so quando pedido. */
:root[data-tema="escuro"]{
  --bg:#161513;--bg-2:#1e1c1a;--bg-3:#252320;--nav:#1b1917;
  --ink:#f1eee8;--ink-2:#b9b2a6;--ink-3:#948d81;--ink-4:#6b655c;
  --line:hsla(40,20%,96%,.18);--line-2:hsla(40,20%,96%,.10);--line-3:hsla(40,20%,96%,.32);
  --acc:#e4613d;--acc-soft:#2a1d17;
  --ok:#8fb283;--ok-soft:#1c241d;--warn:#d3a448;--warn-soft:#282017;--dan:#e0705c;--dan-soft:#2a1a17;
    --branco:#1e1c1a;--paper:#201e1b;
}
/* comparação ao vivo — para julgar com o olho, não com o argumento */
:root[data-raio="4"]{--r1:4px;--r2:8px;--rm:4px}
:root[data-fundo="neutro"]{--bg:#ffffff;--bg-2:#f7f7f5;--bg-3:#f0efec;--branco:#ffffff}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001s!important;animation:none!important}}
/* ══ A ESCALA FLUIDA DO DOC, SEM O PREÇO DELE ══
   O DOC.cc fixa o root em px por breakpoint (14 → 20px) e escala tudo junto.
   O efeito é ótimo e o preço é anular a preferência de tamanho de fonte do
   navegador — inaceitável num produto para quem lê muito, que é justamente
   quem aumenta a fonte. Aqui o clamp está em rem: 87,5% a 125% do tamanho
   que a PESSOA escolheu. A identidade é a mesma; a preferência sobrevive. */
html{font-size:clamp(.875rem,.82rem + .28vw,1.25rem)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--t-ui);
  line-height:var(--lh-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
/* link nunca sublinha: borda inferior translúcida que escurece no hover */
a,.linkE{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);
  transition:border-color var(--d1) var(--curva)}
a:hover,.linkE:hover{border-bottom-color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ MOLDURA ═══ a mesma do prototipo.html */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topo{display:flex;align-items:center;gap:var(--s2);height:56px;flex:0 0 56px;padding:0 var(--s5);
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}
.tcam{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform var(--d3) var(--curva)}
.topo.-dentro .tcam{transform:translateY(-56px)}
.tlin{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5)}
.marca{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;margin-right:var(--s5);
  padding:3px 6px;border-radius:var(--r1)}
.marca:hover{background:var(--bg-2)}
.topo nav{display:flex;gap:2px}
.topo nav button{padding:7px 13px;border-radius:var(--r1);color:var(--ink-2);font-size:13.5px}
.topo nav button:hover{background:var(--bg-2);color:var(--ink)}
.topo nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.busca{display:flex;align-items:center;gap:var(--s2);height:var(--h1);padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r1);color:var(--ink-3);font-size:13px;background:var(--bg-2)}
.busca:hover{border-color:var(--line-3);color:var(--ink-2)}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:var(--r1);padding:1px 5px}
.icb{width:32px;height:32px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);font-size:14px;border:1px solid transparent}
.icb:hover{background:var(--bg-2);border-color:var(--line)}
.uctl{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:var(--r1);
  border:1px solid var(--line);background:var(--bg-2)}
.uctl:hover{border-color:var(--line-3)}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center}
.uctl .ch{font-size:9px;color:var(--ink-3)}
/* faixa contextual: o nome do arquivo assume a barra quando se entra nele */
.tlin .fnome{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tlin .fest{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.pt{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.pt-ok{background:var(--ok)}.pt-at{background:var(--warn)}.pt-er{background:var(--dan)}
.pt-go{background:var(--ink);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}

.corpo{flex:1;min-height:0;overflow-y:auto;position:relative}
.pad{padding:var(--s6) var(--s7) var(--s7);max-width:860px;margin:0 auto}
.pad.larga{max-width:1120px}
h1.t{font-size:25px;font-weight:650;letter-spacing:-.025em;margin:0 0 var(--s1)}
p.sub{font-size:14px;color:var(--ink-2);margin:0 0 var(--s5);line-height:1.55;max-width:58ch}

/* ═══ MESA ═══ */
.solta{border:1.5px dashed var(--line-3);border-radius:var(--r2);padding:var(--s7) var(--s5);
  text-align:center;background:var(--bg-2);display:flex;flex-direction:column;align-items:center;
  gap:var(--s3);width:100%;transition:border-color var(--d1) var(--curva),background var(--d1) var(--curva)}
.solta:hover{border-color:var(--acc);background:var(--acc-soft)}
.solta .tt{font-size:19px;font-weight:650;letter-spacing:-.02em}
.solta .ds{font-size:13.5px;color:var(--ink-2);max-width:44ch}
.solta .fm{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.07em}
.solta.fina{flex-direction:row;justify-content:center;align-items:center;padding:var(--s4);gap:var(--s4);text-align:left}
.solta.fina .tt{font-size:14.5px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--s5);margin-top:var(--s6)}
.passo{border-left:2px solid var(--line);padding-left:var(--s3)}
.passo b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.passo span{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.grupo{margin-top:var(--s6)}
.gcab{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--line-2)}
.gcab h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gcab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.linha.-menu{grid-template-columns:minmax(0,1fr) auto}
.linha{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2);background:var(--branco);
  width:100%;transition:background var(--d1) var(--curva)}
.linha:last-child{border-bottom:none}
.linha:hover{background:var(--bg-2)}
.linha .capa{width:38px;height:50px;border-radius:var(--rm);border:1px solid var(--line);object-fit:cover;
  object-position:top;background:var(--paper);display:block}
.linha .capa.vazia{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:8px;color:var(--ink-3);background:var(--bg-3)}
.linha .nm{font-size:14px;font-weight:600;letter-spacing:-.005em;display:block}
.linha .st{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.linha .ac{font-size:13px;color:var(--acc);font-weight:600;white-space:nowrap}
@media(max-width:620px){.linha{grid-template-columns:38px minmax(0,1fr)}.linha .ac{grid-column:2}}

/* ═══ ITEM ═══ */
.volta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);
  padding:5px 9px 5px 5px;border-radius:var(--r1);margin-bottom:var(--s4)}
.volta:hover{color:var(--acc);background:var(--bg-2)}
.icab{display:flex;gap:var(--s4);align-items:flex-start;margin-bottom:var(--s5);flex-wrap:wrap}
.icab .cp{width:74px;height:98px;border-radius:var(--rm);border:1px solid var(--line);object-fit:cover;
  object-position:top;flex:0 0 74px;background:var(--paper)}
.icab .tx{flex:1;min-width:220px}
.icab h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.metas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta{font-size:11.5px;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--rp);padding:3px 10px}
.modo{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--r1);padding:6px 12px;white-space:nowrap}
.modo:hover{border-color:var(--line-3)}
.modo b{color:var(--ink);font-weight:650}
.estado{display:flex;gap:var(--s3);padding:var(--s4);border-radius:var(--r2);
  background:var(--branco);margin-bottom:var(--s5);align-items:flex-start;
  box-shadow:inset 2px 0 0 var(--ink)}
.estado.ok{background:var(--ok-soft);box-shadow:inset 2px 0 0 var(--ok)}
.estado.at{background:var(--warn-soft);box-shadow:inset 2px 0 0 var(--warn)}
.estado .pt{margin-top:6px}
.estado h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.012em}
.estado p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:60ch}
.sec{margin-bottom:var(--s5)}
.sec>h3{margin:0 0 var(--s3);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.lista{background:var(--branco);border-radius:var(--r2);overflow:hidden}
.li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:var(--s3);align-items:start;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:none}
.sn{width:20px;height:20px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex:0 0 20px;margin-top:1px}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-at{background:var(--warn-soft);color:var(--warn)}
.s-er{background:var(--dan-soft);color:var(--dan)}.s-in{background:var(--bg-3);color:var(--ink-2)}
.li .tx b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.li .tx span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.li .ac{font-size:12.5px;color:var(--acc);font-weight:600;white-space:nowrap;padding:2px 5px;border-radius:var(--r1)}
.li .ac:hover{background:var(--acc-soft)}
.acoes{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s5)}
.btn{height:var(--h2);padding:0 var(--s5);border-radius:var(--r1);background:var(--ink);color:var(--bg);
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  white-space:nowrap;transition:background var(--d1) var(--curva)}
.btn:hover{background:var(--acc);color:#fff}
.btn.sec2{background:none;border:1px solid var(--line-3);color:var(--ink);font-weight:550}
.btn.sec2:hover{background:var(--bg-2);border-color:var(--ink);color:var(--ink)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.lnk{font-size:13px;color:var(--acc);font-weight:600;padding:4px 6px;border-radius:var(--r1)}
.lnk:hover{background:var(--acc-soft)}
.lnk.mudo{color:var(--ink-3);font-weight:550}
.lnk.mudo:hover{color:var(--ink);background:var(--bg-2)}
.nota{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0 0;
  border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3);
  line-height:1.55;margin-top:var(--s5)}
.nota b{color:var(--ink)}
.trilho{height:5px;border-radius:var(--rp);background:var(--bg-3);overflow:hidden;margin:var(--s3) 0 var(--s2)}
.trilho i{display:block;height:100%;background:var(--ink);border-radius:var(--rp);transition:width .4s linear}
.leg{display:flex;justify-content:space-between;gap:var(--s3);font-size:12.5px;color:var(--ink-2)}
.leg .mn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.etapas{display:flex;flex-direction:column;gap:1px;margin-top:var(--s4)}
.etapa{display:flex;align-items:center;gap:var(--s3);font-size:12.5px;padding:5px 0;color:var(--ink-3)}
.etapa.feita{color:var(--ink-2)}.etapa.agora{color:var(--ink);font-weight:600}
.etapa .mk{width:14px;text-align:center;font-size:11px}
.pend{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--warn);background:var(--warn-soft);
  border-radius:var(--r1);padding:8px 15px;font-size:13px;font-weight:600;color:var(--ink)}
.pend .n{font-family:var(--mono);font-size:10px;color:var(--warn)}

/* ═══ ESPAÇO DO LIVRO ═══ */
/* A coluna de 230px segurava uma capa e quatro botoes e depois rolava vazia
   por mais de mil pixels. Ela nao vira sticky nem indice: deixa de existir
   como celula. O cabecalho fica em 152+30+558; do resto para baixo e coluna
   unica, e a pagina volta para a mesma moldura do preparo. */
.livro{display:grid;grid-template-columns:152px minmax(0,1fr);gap:var(--s5);align-items:start}
@media(max-width:680px){.livro{grid-template-columns:1fr;gap:var(--s4)}
  .livro .capao{max-width:120px}}
.livro .capao{width:100%;max-width:152px;border-radius:var(--rm);border:1px solid var(--line);
  display:block;background:var(--paper)}
.livro h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.livro .autor{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.livro .tit{display:flex;align-items:flex-start;gap:var(--s3)}
.livro .tit .icb{margin-left:auto;flex:0 0 auto}
/* duas linhas mudas. A de cima e medida — mono, caixa alta. A de baixo tem
   nome de arquivo e fato, e nome nao se mede: grotesca, caixa normal. */
/* A descricao e conteudo: espaco e tipografia, sem caixa. A frase e do
   proprio arquivo, entao ela e tratada como citacao — filete e serifa —
   e nao como texto que o Mekora escreveu sobre o livro. */
.descL{border-left:1px solid var(--line-3);padding-left:var(--s4);margin:var(--s4) 0 0}
.descL p{font-family:var(--serif);font-size:1.02rem;line-height:1.5;color:var(--ink);margin:0}
.descL .arco{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:var(--s2) 0 0;display:block}
/* A REGUA E O LIMITE DO CAMPO, e por isso ela e medida e nao escolhida.
   --line da 1,28:1 contra a pagina; limite de componente pede 3:1. Entre os
   tokens so --ink-3 alcanca (5,03) — --line-3 da 1,69 e tinta a 45% da 2,91.
   Trocar o fundo por --bg-2 tambem nao resolveria: 1,05:1, invisivel. */
.descL .campo{display:block;width:100%;min-height:3.2em;resize:vertical;
  font-family:var(--serif);font-size:1.02rem;line-height:1.5;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--ink-3);
  border-radius:var(--r1);padding:0 0 var(--s2)}
.descL .campo:focus{outline:0;border-bottom-color:var(--ink)}
.descL .campo::placeholder{color:var(--ink-4)}
.fonte{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:var(--s2) 0 0}
.fonte b{color:var(--ink-2);font-weight:550}
.acoes.-mudas{margin-top:var(--s3);gap:var(--s4)}
/* O QUE VOCE ESCREVEU NAO E CITACAO. Ele nasceu com filete de citacao, como
   os trechos, e o resultado foi uma cerca de linhas paralelas onde pai e filho
   eram irmaos visuais — o trecho arquivado sob uma pergunta ficava a 0px de
   recuo dela. Agora a escrita sem ancora fica na margem, SEM filete e SEM
   recuo, e o que esta arquivado sob ela recua. A hierarquia vira posicao, e
   sobra filete so onde ha mesmo alguem sendo citado. */
.dossie .tr.-livre{border-left:none;padding-left:0;margin-top:var(--s6)}
.dossie .tr.-livre:first-child{margin-top:0}
/* so o FILHO se aproxima do pai. "+.tr" pegava qualquer item seguinte,
   inclusive outra pergunta, e ai dois pais ficavam tao colados quanto pai e
   filho — o agrupamento sumia justamente onde ele precisava aparecer. */
.dossie .tr.-livre+.tr.-filho{margin-top:var(--s3)}
.dossie .tr.-filho+.tr.-filho{margin-top:var(--s3)}
/* o filho recua: e o recuo, nao o peso da linha, que diz que ele esta sob */
.dossie .tr.-filho{margin-left:var(--s5)}
.dossie .acs.-vazia{height:0;overflow:hidden;margin:0}
.dossie .tr:hover .acs.-vazia,.dossie .tr:focus-within .acs.-vazia{height:auto;margin-top:var(--s2)}
/* a frase e o controle: sem caixa, herdando a tipografia do conteudo. O
   sinal de que da para clicar aparece na aproximacao, como no resto da lista. */
.dossie .tr.-livre p>.abre{display:block;width:100%;text-align:left;font:inherit;color:inherit;
  padding:0;border-radius:0}
.dossie .tr.-livre p>.abre::after{content:" →";color:var(--ink-4);
  opacity:0;transition:opacity var(--d1) var(--curva)}
.dossie .tr.-livre:hover p>.abre::after,.dossie .tr.-livre p>.abre:focus-visible::after{opacity:1}
.dossie .tr.-livre p>.abre:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.dossie .tr.-livre .campo{display:block;width:100%;min-height:3.4em;resize:vertical;
  font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--ink-3);border-radius:var(--r1);
  padding:0 0 var(--s2)}
.dossie .tr.-livre .campo:focus{outline:0;border-bottom-color:var(--ink)}
.dossie .tr.-livre .campo::placeholder{color:var(--ink-4)}
.dossie .tr.-livre .pe{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2)}
.dossie .tr[id]{scroll-margin-top:var(--s6)}
.faltam{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2) var(--s3);
  border-top:1px solid var(--line-2);margin-top:var(--s6);padding-top:var(--s4);
  font-size:12.5px;color:var(--ink-3)}
.dossie .tr p{max-width:34em}
.dossie .tr .cheio{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  margin:var(--s3) 0 0;max-width:34em}
#marcado{scroll-margin-top:var(--s6)}

/* ═══ ESTANTE ═══ */
.vista{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--bg-2)}
.vista button{padding:6px 14px;font-size:12.5px;color:var(--ink-2)}
.vista button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vista button .exp{font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;margin-left:6px;padding:1px 4px;border:1px solid currentColor;
  opacity:.55;vertical-align:1px}
/* filtro colado na colecao que ele filtra, escrito por extenso. Nao e
   irmao do seletor de vista: aquele muda COMO se ve, este muda O QUE se ve.
   Por isso ele nao divide a linha com ele — fica embaixo, sobre o acervo. */
.filtroL{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:baseline;
  border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  padding:var(--s3) 0;margin-bottom:var(--s5)}
.filtroL button{font-size:13px;color:var(--ink-3);padding:2px 0}
.filtroL button:hover{color:var(--ink)}
.filtroL button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.filtroL .n{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-4);margin-left:5px}
.filtroL button[aria-pressed="true"] .n{color:var(--ink-3)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:var(--s5)}
.bk{text-align:left;display:block;width:100%}
.bk img{display:block;width:100%;height:auto;border-radius:var(--rm);border:1px solid var(--line);
  background:var(--paper);transition:transform var(--d2) var(--curva)}
.bk:hover img{transform:translateY(-3px)}
.bk .t{display:block;font-size:12.5px;font-weight:600;margin-top:9px;line-height:1.25}
.bk .a{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.bk .q{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.03em;
  color:var(--ink-3);margin-top:4px}
/* ═══ A FILA ═══
   Tres colunas, e o peso nao segue a posicao: "Lendo" fica no meio e mesmo
   assim ganha o teste dos cinco segundos, porque leva chao, capa maior e
   corpo maior. Enfase carrega a prioridade; a posicao carrega o tempo. */
.fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);align-items:start}
@media(max-width:900px){.fila{grid-template-columns:1fr;gap:var(--s7)}}
.fCol{min-width:0}
.fCab{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.fCab h2{font-family:var(--ui);font-size:13px;font-weight:600;margin:0;letter-spacing:.01em}
.fCab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
/* --ink-4 mede 2,05:1 e neste projeto so serve para borda e ponto. Estes
   dois sao texto: a etiqueta do gesto e o numero da posicao. */
.fCab .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-left:auto}
.fPil{display:flex;flex-direction:column;gap:var(--s3)}
.fCard{display:grid;grid-template-columns:auto 40px minmax(0,1fr);gap:var(--s3);
  align-items:start;padding:var(--s3);border:1px solid var(--line-2);background:none}
.fCard img{width:40px;height:auto;display:block;border:1px solid var(--line)}
.fCard .ttl{display:block;text-align:left;font-size:12.5px;font-weight:600;line-height:1.25;width:100%}
.fCard .ttl:hover{color:var(--acc)}
.fCard .a{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
/* o vinculo com o estudo e mono e pequeno: ele nao compete com o titulo do
   livro, mas e o que explica por que aquele livro esta na fila. */
.fCard .serve{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  margin-top:5px;color:var(--ink-3)}
.fCard .serve button{color:var(--ink-2);font:inherit}
.fCard .serve button:hover{color:var(--acc)}
.fCard .serve i{font-style:normal;color:var(--ink-4);margin:0 4px}
.fCard .serve.-sem{color:var(--ink-4)}
.fCard .pos{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:2px;min-width:11px}
.fAcs{display:flex;gap:var(--s3);margin-top:var(--s2)}
/* O mesmo botao empilhado seis vezes vira textura, e some como coisa
   clicavel. O gesto principal e o arrasto — o cursor ja diz —, e "por no
   topo" e o atalho de teclado, que aparece quando a pessoa chega perto.
   focus-within e o que o mantem alcancavel por Tab. */
.fCol.-fila .fAcs{opacity:0;transition:opacity var(--d1) var(--curva)}
.fCol.-fila .fCard:hover .fAcs,.fCol.-fila .fCard:focus-within .fAcs{opacity:1}
@media(hover:none){.fCol.-fila .fAcs{opacity:1}}
.fAcs button{font-size:11.5px;color:var(--ink-3)}
.fAcs button:hover{color:var(--ink)}
/* o que voce arrasta e a fila, e por isso so ela tem pega */
.fCol.-fila .fCard{cursor:grab;touch-action:none}
.fCol.-fila .fCard{transition:transform var(--d2) var(--curva)}
/* o cartao na mao nao interpola: ele esta EM baixo do dedo, e atraso ali le
   como atraso do proprio ponteiro. Quem interpola sao os vizinhos. */
.fCard.-arrastando{cursor:grabbing;background:var(--branco);border-color:var(--line);
  position:relative;z-index:2;transition:none;box-shadow:0 1px 0 var(--line-2)}
@media(prefers-reduced-motion:reduce){.fCol.-fila .fCard{transition:none}}
/* a coluna do meio e a resposta a "onde eu estou" */
.fCol.-agora .fCard{grid-template-columns:72px minmax(0,1fr);background:var(--bg-2);
  border:0;padding:var(--s4);gap:var(--s4)}
.fCol.-agora .fCard img{width:72px}
.fCol.-agora .fCard .ttl{font-size:14.5px}
.fCol.-agora .fCab h2{font-size:15px}
.fBarra{height:2px;background:var(--line-2);margin-top:var(--s3)}
.fBarra i{display:block;height:2px;background:var(--ink-2)}
.fPct{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:5px}
.fVazio{font-size:12px;color:var(--ink-3);line-height:1.5;padding:var(--s3) 0}
.fMais{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:var(--s2)}
.fRegra{font-size:12.5px;color:var(--ink-2);line-height:1.55;max-width:74ch;margin:var(--s6) 0 var(--s6)}
/* ═══ QUADRO DE ESTUDOS ═══
   Mesma linguagem da Fila, e a regra invertida. La duas colunas sao
   consequencia da leitura e voce ARRANJA a primeira; aqui duas sao
   consequencia da leitura e voce DECIDE a ultima.
   Fechar escapa da regra contra campo de estado porque status apodrece por
   exigir manutencao continua, e fechar acontece uma vez. */
.quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6);
  align-items:start;margin-top:var(--s5)}
.qCol{min-width:0}
.qCab{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);
  border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.qCab h2{font-family:var(--ui);font-size:13px;font-weight:600;margin:0;letter-spacing:.01em}
.qCab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.qCab .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-left:auto}
.qPil{display:flex;flex-direction:column;gap:var(--s3);min-height:60px}
.qCard{background:var(--bg-2);padding:var(--s4);cursor:grab;touch-action:none;
  transition:transform var(--d2) var(--curva)}
.qCard h3{margin:0;font-family:var(--ui);font-size:12.5px;font-weight:600;letter-spacing:.01em}
.qCard h3 .abre{text-align:left;width:100%}
.qCard h3 .abre:hover{color:var(--acc)}
.qCard .sobre{font-family:var(--serif);font-size:1.02rem;line-height:1.34;color:var(--ink);
  margin:var(--s2) 0 0}
.qCard .me{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);
  margin:var(--s3) 0 0}
.qCard .caps{display:flex;gap:5px;margin-top:var(--s3)}
.qCard .caps img{width:26px;height:auto;display:block;border:1px solid var(--line)}
.qAcs{margin-top:var(--s3);opacity:0;transition:opacity var(--d1) var(--curva)}
.qCard:hover .qAcs,.qCard:focus-within .qAcs{opacity:1}
.qAcs button{font-family:var(--ui);font-size:11.5px;color:var(--ink-2);padding:0}
.qAcs button:hover{color:var(--acc)}
.qCard.-arrastando{cursor:grabbing;background:var(--branco);position:relative;z-index:5}
/* a coluna que aceita marca com filete, e nao com chao: chao aqui competiria
   com o proprio cartao, que ja e chao. */
.qCol.-alvo .qPil{outline:1px dashed var(--line-3);outline-offset:var(--s3)}
.qCol.-recusa .qPil{outline:1px dashed var(--dan);outline-offset:var(--s3)}
.qCol.-fechado .qCard{background:transparent;border:1px solid var(--line)}
.qCol.-fechado .qCard .sobre{color:var(--ink-2)}
.qVazio{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:0}
.qPor{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--dan);
  margin:var(--s4) 0 0;min-height:13px}
.qRegra{font-size:12.5px;color:var(--ink-2);line-height:1.55;max-width:74ch;margin:var(--s2) 0 0}
@media(max-width:900px){.quadro{grid-template-columns:1fr;gap:var(--s5)}}
/* ═══ ESTUDOS ═══ */
/* o segundo nivel e visivelmente menor que o primeiro: sao recortes de uma
   lista, e nao lugares. Antes os seis estavam lado a lado com o mesmo peso. */
.nfila2{display:flex;align-items:baseline;gap:var(--s5);flex-wrap:wrap;
  margin:0 0 var(--s5);padding-bottom:var(--s3);border-bottom:1px solid var(--line-2)}
.nfila2 button{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:baseline;gap:4px}
.nfila2 button[aria-current="true"]{color:var(--ink);font-weight:600}
.nfila2 button i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--ink-3)}
.estNv{margin:var(--s5) 0 var(--s5)}
.estL{display:flex;flex-direction:column;gap:var(--s5)}
/* um estudo SEU leva chao, porque e conteudo. O sugerido, mais abaixo, leva
   filete: ele ainda nao e seu. */
.estC{background:var(--bg-2);padding:var(--s5)}
.estC h3{margin:0;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.01em}
.estC h3 .abre{text-align:left}
.estC h3 .abre:hover{color:var(--acc)}
/* a PERGUNTA e o que o cartao mostra de longe: o nome diz como o estudo se
   chama, e a pergunta diz para que ele existe. */
.estC .sobre{font-family:var(--serif);font-size:1.5rem;line-height:1.32;margin:var(--s2) 0 0;
  letter-spacing:-.01em;max-width:34ch}
.estC .me{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);
  margin:var(--s3) 0 0}
.estC .caps{display:flex;gap:6px;margin-top:var(--s4)}
.estC .caps img{width:40px;height:auto;display:block;border:1px solid var(--line)}
.estC+.estC{margin-top:0}
/* o sugerido: filete, e nao chao */
.sobreG{font-family:var(--serif);font-size:1.7rem;line-height:1.32;color:var(--ink);
  background:var(--bg-2);padding:var(--s5);margin:var(--s4) 0 0;letter-spacing:-.01em;box-sizing:border-box}
.sobreX{margin:var(--s4) 0 0}
.sobreX .lnk{padding:0;font-size:13px;color:var(--ink-3)}
.sobreX .lnk:hover{color:var(--acc)}
.estLv{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s3)}
.estLv .estLvI{display:block;text-align:left;width:96px}
.estLv img{display:block;width:96px;height:auto;border:1px solid var(--line)}
.estLv .t{display:block;font-size:12px;font-weight:600;margin-top:7px;line-height:1.25}
.estLv .q{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  color:var(--ink-3);margin-top:2px}
.estLv .estLvI:hover .t{color:var(--acc)}
/* a fonte de video ganha o simbolo de reproduzir sobre a capa: o cartao e
   igual porque a coisa e igual — uma fonte —, e o simbolo diz o que muda. */
.estLv .estLvI.-vid{position:relative}
.estLv .estLvI.-vid::after{content:"\25b6";position:absolute;left:50%;top:48px;
  transform:translate(-50%,-50%);width:26px;height:26px;border-radius:var(--rp);
  background:var(--ink);color:var(--bg);font-size:10px;display:flex;
  align-items:center;justify-content:center;padding-left:2px}
/* a relacionada aberta no lugar: ela cresce onde esta, e nao troca a tela */
.relD{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line-2)}
.relD .tr{font-family:var(--serif);font-style:italic;font-size:.95rem;line-height:1.55;
  color:var(--ink-2);margin:0 0 var(--s3);max-width:56ch}
.relG .cit.-aberta{background:var(--bg-2);padding:var(--s3) var(--s4)}
/* ── a passada de UI na pagina de uma nota ── */
/* Tags e Estudos gastavam tres niveis de rotulo para dois chips: o titulo do
   bloco, o subrotulo, e o conteudo, cada um numa linha. O subrotulo entra na
   linha do proprio conteudo, que e o que uma lista de definicao faz. */
.conc.-linha{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);
  align-items:baseline;margin-top:var(--s3)}
.conc.-linha>.sublbl{margin:0;grid-column:1}
.conc.-linha>*:not(.sublbl){grid-column:2}
/* os chips e a porta de criar dividem a mesma faixa: sao a mesma escolha com
   dois destinos, e nao duas linhas de coisa diferente. */
.conc.-linha .acs.-mesmalinha{margin-top:0;display:flex;flex-wrap:wrap;
  align-items:baseline;gap:var(--s3)}
/* baseline, e nao center: o chip tem borda e o botao nao, entao centrar as
   CAIXAS desalinhava os TEXTOS em 15px — medido. O que a pessoa le e a
   linha do texto. */
@media(max-width:560px){.conc.-linha{grid-template-columns:1fr}
  .conc.-linha>*:not(.sublbl){grid-column:1}}
/* "Talvez" e o grupo de menor confianca: ele pede a decisao so quando a pessoa
   chega perto. focus-within mantem alcancavel por Tab. */
.relG.-fraco .grupoE .cit>.acs{opacity:0;transition:opacity var(--d1) var(--curva)}
.relG.-fraco .grupoE .cit:hover>.acs,
.relG.-fraco .grupoE .cit:focus-within>.acs{opacity:1}
@media(hover:none){.relG.-fraco .grupoE .cit>.acs{opacity:1}}
/* O bloco de classificacao e METADADO da nota, e estava com o mesmo respiro de
   60px que separa a nota do que esta em volta dela. Com tudo a mesma
   distancia, nada agrupa: ele sobe para junto das acoes. */
.acsN+.bloco{margin-top:var(--s5)}
/* ═══ O CONTINENTE E O ATOMO ═══
   Medido: na pagina do estudo, o maior elemento era uma NOTA de 19,9px, e nao
   o assunto do estudo. O continente perdia para o conteudo na propria pagina
   dele — e um continente que nao domina a propria pagina nao parece um lugar,
   parece mais um item. Dentro de um estudo a nota e REFERENCIA, e por isso
   encolhe: e a mesma regra que ja vale para Relacionadas dentro de uma nota. */
.colE .trl .pas .nt,
.colE > .grupoE .cit > p.-nota{font-size:.98rem;line-height:1.55;max-width:56ch}
/* e o assunto do estudo cresce, porque e ele o objeto da tela */
.pergG{font-size:2rem}
/* o estado do estudo, na propria pagina: e a unica coisa aqui que diz "em que
   pe isto esta", e ele estava so no Quadro. */
.estE{font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  font-size:9.5px;padding:2px 6px;border:1px solid var(--line-3);color:var(--ink-2)}
.estE.-andando{border-color:var(--ink);color:var(--ink)}
.estE.-fechado{border-color:var(--line-2);color:var(--ink-3)}
.acDes{margin:var(--s5) 0 0}
.acDes .lnk{padding:0;font-size:12.5px;color:var(--ink-3);font-weight:400}
.acDes .lnk:hover{color:var(--dan);background:none}

/* ═══ VIDEO ═══ */
.vidT{display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--s5);align-items:start;
  background:var(--bg-2);padding:var(--s5);margin-bottom:var(--s7)}
@media(max-width:640px){.vidT{grid-template-columns:1fr;gap:var(--s4)}}
.vidQ{position:relative;line-height:0}
.vidQ img{width:100%;height:auto;display:block;border:1px solid var(--line)}
.vidP{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;border-radius:var(--rp);background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:3px}
.vidM .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);display:block}
.vidD{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:var(--s3) 0 0;max-width:56ch}
.vidD b{color:var(--ink)}
.vidF{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);margin:var(--s3) 0 0}
/* o timecode e ENDERECO: ele mora na margem, e nao no meio da frase */
.txtE.-vid{position:relative}
@media(min-width:900px){.txtE.-vid{padding-left:0}
  .txtE.-vid .vidTc{position:absolute;left:-74px;top:.35em;width:60px;text-align:right}}
.vidTc{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);
  padding:0;margin-right:var(--s3)}
.vidTc:hover{color:var(--acc)}
.prat{margin-bottom:var(--s5)}
.lombs{display:flex;align-items:flex-end;gap:2px;padding:0 var(--s5);min-height:150px}
.lombs img{display:block;width:auto;border-radius:var(--rm) var(--rm) 0 0;transition:transform var(--d2) var(--curva)}
.lombs button:hover img{transform:translateY(-9px)}
.lombs button[aria-pressed="true"] img{transform:translateY(-15px)}
.tabua{height:9px;background:var(--bg-3);border-bottom:4px solid var(--ink-4);border-radius:var(--r1)}
.legenda{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s5) 0;min-height:36px}

/* ═══ PERFIL ═══ */
.pcab{display:flex;gap:var(--s5);align-items:center;padding-bottom:var(--s5);
  border-bottom:1px solid var(--line);margin-bottom:var(--s5);flex-wrap:wrap}
.pcab .ava{width:64px;height:64px;font-size:22px}
.pcab h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em}
.pcab .h{font-size:13px;color:var(--ink-3);margin-top:3px}
.dobra{border-bottom:1px solid var(--line-2);background:var(--branco);overflow:hidden}
.dobra:first-of-type{border-top:1px solid var(--line-2)}
.dobra>button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s4)}
.dobra>button:hover{background:var(--bg-2)}
.dobra .nm{font-size:14.5px;font-weight:650}
.dobra .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dobra .ch{margin-left:auto;color:var(--ink-3);font-size:11px}
.dobra .in{padding:0 var(--s4) var(--s4);background:var(--bg)}
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13.5px;font-weight:600}
.row .tx span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.sw{width:38px;height:22px;border-radius:var(--rp);background:var(--line-3);position:relative;flex:0 0 38px;
  transition:background var(--d1) var(--curva)}
.sw i{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:var(--bg);
  transition:left var(--d1) var(--curva)}
.sw[aria-pressed="true"]{background:var(--ink)}
.sw[aria-pressed="true"] i{left:18.5px}
.espelho{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:var(--r1);padding:2px 6px;color:var(--ink-3);white-space:nowrap}

/* ══════════════════════════════════════════════════════════
   CAMADA EDITORIAL — derivada do DOC.cc.
   Vale na Home e dentro do arquivo, que são as duas superfícies
   onde se lê. O aparato do produto (Mesa, item, perfil) continua
   em grotesca e densidade de ferramenta.
   ══════════════════════════════════════════════════════════ */
.ed{padding:0 var(--s4)}
.colE{width:100%;max-width:var(--col);margin:0 auto}
.colE.larga{max-width:calc(var(--col) + 12rem)}
.faixaE{padding:var(--s8) 0}
.faixaE+.faixaE{border-top:1px solid var(--line-2)}
.displayE{font-family:var(--ui);font-size:var(--t-display);line-height:var(--lh-display);
  letter-spacing:var(--tr-display);font-weight:700;margin:0;text-wrap:balance}
.h1E{font-family:var(--serif);font-size:var(--t-h1);line-height:var(--lh-h1);letter-spacing:var(--tr-h1);
  font-weight:400;margin:0}
.h2E{font-family:var(--ui);font-size:var(--t-h2);line-height:var(--lh-h2);letter-spacing:var(--tr-h2);
  font-weight:700;margin:0}
.h3E{font-family:var(--ui);font-size:var(--t-h3);line-height:var(--lh-h3);font-weight:700;margin:0}
.kicker{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:var(--s4)}
.leadE{font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink-2);
  margin:var(--s4) 0 0}
.txtE{font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink);
  margin:0 0 1.05em}
.txtE.mudo{color:var(--ink-2)}
/* botão do DOC: outline puro que inverte no hover, sem raio */
.btnO{display:inline-flex;align-items:center;justify-content:center;padding:.7rem 1.25rem;
  border:1px solid var(--line-3);font-size:var(--t-ui);font-weight:500;color:var(--ink);
  background:none;border-radius:var(--r1);transition:background var(--d1) var(--curva),color var(--d1) var(--curva),
  border-color var(--d1) var(--curva)}
.btnO:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btnO.forte{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btnO.forte:hover{background:var(--acc);border-color:var(--acc);color:#fff}
/* matriz de tag 2×2 do DOC */
.tagE{display:inline-flex;align-items:center;border-radius:var(--rp);padding:.25rem .625rem .375rem;
  font-size:var(--t-peq);background:var(--bg-3);border:1px solid var(--bg-3);color:var(--ink);
  transition:background var(--d1) var(--curva),border-color var(--d1) var(--curva)}
.tagE:hover{background:var(--bg);border-color:var(--ink)}
.tagE.main{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tagE.main:hover{background:var(--ink-2);border-color:var(--ink-2)}
.tagsE{display:flex;gap:.625rem;flex-wrap:wrap}
/* índice numerado com divisória — o padrão de lista ordenada do DOC */
.indiceE{list-style:none;margin:var(--s5) 0 0;padding:0;counter-reset:i}
.indiceE li{counter-increment:i;border-bottom:1px solid var(--line-2)}
.indiceE li button{display:flex;align-items:baseline;gap:var(--s4);width:100%;padding:.75rem 0;
  font-size:var(--t-ui);color:var(--ink)}
.indiceE li button:hover .nomeI{border-bottom-color:var(--ink)}
.indiceE .numI{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3);
  min-width:2.2rem}
.indiceE .nomeI{border-bottom:1px solid transparent;transition:border-color var(--d1) var(--curva)}
.indiceE .metaI{margin-left:auto;font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3)}
/* figura e legenda: legenda herda a largura da coluna, centralizada */
.figE{margin:var(--s6) 0}
.figE img{display:block;width:100%;height:auto;border-radius:var(--rm);border:1px solid var(--line)}
.figE figcaption{width:100%;max-width:var(--col);margin:var(--s4) auto 0;text-align:center;
  font-size:var(--t-peq);line-height:1.5;color:var(--ink-3)}
.duasE{display:grid;grid-template-columns:1fr;gap:var(--s6)}
@media (min-width:1000px){.duasE{grid-template-columns:repeat(2,1fr);gap:var(--s4)}}
.duasE.tres{grid-template-columns:1fr}
@media (min-width:1000px){.duasE.tres{grid-template-columns:repeat(3,1fr)}}

/* ══ LEITURA DENTRO DO ARQUIVO ══ */
.leituraTopo{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) var(--s5) var(--s3)}
.leituraTopo .lin{display:flex;align-items:baseline;gap:var(--s4)}
.leituraTopo .obra{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink);text-align:left;padding:0}
.leituraTopo .obra i{font-style:normal;color:var(--ink-3)}
.leituraTopo .obra:hover{background:none;color:var(--ink)}
.leituraTopo .obra:hover i{color:var(--ink-2)}
.leituraTopo .cap,.leituraTopo .lido{font-family:var(--mono);font-size:var(--t-mono);
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.leituraTopo .-fer{align-items:center}
.leituraTopo .tt{font-family:var(--serif);font-size:var(--t-ui);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
/* A DOCK DE LEITURA — embaixo, onde ficam as ferramentas.
   Topo: onde estou. Centro: o conteudo. Rodape: o que posso fazer.
   E a mesma regra da dock de conversao e da de canvas, com outro conteudo. */
/* absolute dentro de .corpo, e nao fixed na janela: ela anda com o texto, o
   que faz a compensacao de rolagem deixar de ser necessaria em vez de ser
   resolvida. translate(-50%,-100%) ancora o meio de baixo no trecho. */
.selbar{position:absolute;z-index:40;transform:translate(-50%,-100%);
  margin-top:calc(-1 * var(--s2));pointer-events:none}
.selbar[hidden]{display:none}
.selcx{display:inline-flex;align-items:center;gap:var(--s2);pointer-events:auto;
  max-width:min(520px,calc(100vw - 2*var(--s4)));
  background:var(--bg);border:1px solid var(--ink);padding:5px}
.selcx .dl{font-size:13px;color:var(--ink-2);padding:7px 13px;white-space:nowrap;border-radius:var(--r1)}
.selcx .dl:hover{background:var(--bg-3);color:var(--ink)}
.selcx .dl.-pri{color:var(--ink);font-weight:600}
.selcx .dl.-perigo{color:var(--ink-3)}
.selcx .dl.-perigo:hover{color:var(--dan);background:var(--dan-soft)}
.selcx .av{font-size:var(--t-peq);color:var(--ink-3);padding:0 var(--s3);white-space:nowrap}
.selcx.-exc{border-color:var(--dan)}
.selcx.-exc .av{color:var(--dan)}
.selcx .sp{flex:1;min-width:var(--s4)}
/* a fita de ferramentas do topo: tres palavras, uma familia so */
.ferL{display:inline-flex;gap:2px}
.leituraTopo .lnk.mudo.-on{background:var(--ink);color:var(--bg)}
.leituraTopo .tt{text-align:left;max-width:32ch}
/* APARENCIA: sobe de baixo e para na dock. O texto continua atras — coberto
   so o rodape, e nao a coluna inteira como fazia a folha de 1000px. */
.paparencia{position:fixed;left:50%;transform:translateX(-50%);top:calc(61px + var(--s3));
  z-index:39;width:min(calc(100vw - 2*var(--s4)),720px);background:var(--bg);
  border:1px solid var(--line-3);padding:var(--s4);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3) var(--s5)}
.pagrupo>h4{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 var(--s2)}
/* o especime do painel e compacto: com o padding da folha antiga, tres deles
   nao cabiam em 206px e quebravam em duas linhas — 178px por grupo, e o
   painel ocupando meia tela. */
.paparencia .espec{min-width:0;padding:6px 4px;gap:5px}
.paparencia .espec .rt{font-size:10.5px}
.paparencia .espec .am{min-height:20px;display:flex;align-items:center;justify-content:center}
/* a amostra do alinhamento e o proprio alinhamento: quatro filetes com a
   ultima linha curta à esquerda, e reta no justificado. */
.al{display:block;width:26px;height:13px;
  background:repeating-linear-gradient(0deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.82}
.al.e{-webkit-mask:linear-gradient(#000 0 0) 0 0/100% 10px no-repeat,
  linear-gradient(#000 0 0) 0 10px/62% 3px no-repeat;
  mask:linear-gradient(#000 0 0) 0 0/100% 10px no-repeat,
  linear-gradient(#000 0 0) 0 10px/62% 3px no-repeat}
.pafim{grid-column:1/-1;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  border-top:1px solid var(--line-2);padding-top:var(--s3)}
.pafim .lb{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
/* FOCO: sai tudo menos o livro */
/* o topo nao some: apaga. Sumindo de vez, a saida do foco morava so na dock —
   e a dock deixou de existir. Apagado, o texto domina e o controle volta com o
   mouse ou com o teclado. */
/* Foco: as DUAS camadas de chrome se apagam juntas — produto e livro. Apagar
   e nao esconder mantem a saida alcancavel pelo mouse e pelo teclado; escondida,
   ela so voltaria por atalho que ninguem descobre. */
.leitura-foco .leituraTopo,.leitura-foco .topo{opacity:.08;transition:opacity var(--d2) var(--curva)}
.leitura-foco .leituraTopo:hover,.leitura-foco .leituraTopo:focus-within,
.leitura-foco .topo:hover,.leitura-foco .topo:focus-within{opacity:1}
/* a linha do livro some junto; o que sobra e o titulo, o progresso e a saida */
.leitura-foco .leituraTopo .lin:first-child{opacity:0;height:0;overflow:hidden;margin:0}
.leitura-foco .leituraTopo:hover .lin:first-child,
.leitura-foco .leituraTopo:focus-within .lin:first-child{opacity:1;height:auto;overflow:visible}
.leitura-foco .qbar{display:none}
.leituraTopo .menuL{font-size:16px;padding:4px 9px}
.leituraTopo .tt{display:flex;flex-direction:column;line-height:1.2}
.leituraTopo .tt i{font-family:var(--ui);font-style:normal;font-size:var(--t-peq);color:var(--ink-3)}
@media(max-width:760px){
  .selcx{max-width:calc(100vw - 2*var(--s4))}
  /* no celular, uma coluna de seis grupos comia 52% da tela. Duas colunas e
     teto de 40vh deixam a leitura respirando atras do painel. */
  .paparencia{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:40vh;
    overflow-y:auto;border-left:none;border-right:none;
    grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
}
/* PAINEL LATERAL — navegacao dentro do livro fica AO LADO do que ela navega.
   O veu nao escurece: escurecer o texto para mostrar o indice do texto e o
   mesmo erro da folha centrada, so que mais bonito. */
.veu.-lado{background:transparent;justify-content:flex-end;align-items:stretch;
  padding:56px 0 0}   /* comeca abaixo da navegacao global, que continua alcancavel */
.painelLado{width:min(340px,86vw);background:var(--bg);border-left:1px solid var(--line-3);
  display:flex;flex-direction:column;height:100%;box-shadow:-1px 0 0 var(--line-2)}
.plcab{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3);
  border-bottom:1px solid var(--line)}
.plcorpo{flex:1;overflow-y:auto;padding:var(--s4)}
.plnota{font-size:var(--t-peq);color:var(--ink-3);line-height:1.6;margin:var(--s5) 0 0;
  border-top:1px solid var(--line-2);padding-top:var(--s3)}
.plpe{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s4) var(--s4);
  border-top:1px solid var(--line);font-size:var(--t-peq);color:var(--ink-3)}
.plpe .mono{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.08em}
.painelLado .indiceE li button[aria-current="true"] .nomeI{color:var(--ink);font-weight:600}
.fio{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--line-2)}
.fio i{display:block;height:100%;background:var(--ink)}
.lsec{scroll-margin-top:70px}
.lsec+.lsec{margin-top:var(--s8)}
/* a régua atravessa, o título não sai da coluna — a correção de 2026-08-11 */
.lcap{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);
  font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:var(--s6) 0 var(--s4);margin-bottom:var(--s3)}
.lsec+.lsec .lcap::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:100vw;height:1px;background:var(--line)}
.lq{margin:var(--s6) 0;padding:0;border:0;font-family:var(--serif);font-size:1.34rem;line-height:1.34;
  color:var(--ink);width:117%;max-width:none;margin-left:-8.5%}
@media (max-width:760px){.lq{width:100%;margin-left:0}}
.lq::before{content:"";display:block;width:34px;height:1px;background:currentColor;opacity:.35;
  margin-bottom:.7em}
.lnota{font-family:var(--ui);font-size:var(--t-peq);line-height:1.5;color:var(--ink-2);
  width:93%;margin-left:7%;margin-bottom:1.05em}
.marcaN{font-size:.62em;vertical-align:super;color:var(--acc);margin-left:.2em;line-height:1;
  position:relative;padding:0 .5em .8em}
.marcaN::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:26px;height:26px}
.lfimE{margin-top:var(--s8);padding-top:var(--s5);border-top:1px solid var(--line)}
.aparelho{display:flex;gap:var(--s4);align-items:center;padding:var(--s4);border:1px solid var(--line);
  border-radius:var(--r2);background:var(--bg-2);margin-top:var(--s5)}

/* ══ VER TODAS AS PÁGINAS ══ */
.ed2{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;height:min(62vh,500px)}
@container (max-width:860px){.ed2{grid-template-columns:170px minmax(0,1fr);height:min(62vh,500px)}
  .ed2 .acoes2{grid-column:1/-1;border-left:none;border-top:1px solid var(--line-2);height:auto}}
@container (max-width:560px){.ed2{grid-template-columns:1fr;height:auto}
  .ed2 .filtros{border-right:none;border-bottom:1px solid var(--line-2)}}
@media(max-width:900px){.ed2{grid-template-columns:1fr;height:auto}}
.ed2 .filtros{border-right:1px solid var(--line-2);padding:var(--s3);overflow:auto;background:var(--bg)}
.ed2 .filtros button{display:flex;justify-content:space-between;gap:var(--s2);width:100%;
  padding:8px var(--s3);font-size:12.5px;color:var(--ink-2)}
.ed2 .filtros button:hover{background:var(--bg-2)}
.ed2 .filtros button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ed2 .filtros .n{font-family:var(--mono);font-size:10px;opacity:.7}
.pgrade{overflow:auto;padding:var(--s4);display:grid;gap:var(--s4);background:var(--bg-2);
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));align-content:start}
.pg2{position:relative;padding:2px;border:2px solid transparent;background:none}
.pg2 .im{display:block;height:106px;background:var(--branco);border:1px solid var(--line);position:relative;overflow:hidden}
.pg2 .im i{position:absolute;inset:5px;display:block;
  background:repeating-linear-gradient(0deg,var(--line-2) 0 1px,transparent 1px 4px)}
.pg2.semtexto .im i{background:repeating-linear-gradient(135deg,var(--dan-soft) 0 5px,transparent 5px 10px)}
.pg2.dim .im{border-color:var(--warn)}
.pg2.fora .im{opacity:.32}
.pg2.girada .im i{transform:rotate(90deg) scale(.7)}
.pg2 .lg{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:center;margin-top:4px}
.pg2[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.pg2 .tag2{position:absolute;top:5px;left:5px;font-family:var(--mono);font-size:8px;letter-spacing:.05em;
  text-transform:uppercase;background:var(--ink);color:var(--bg);padding:1px 4px}
.pg2 .tag2.al{background:var(--warn);color:#fff}
.pg2 .tag2.er{background:var(--dan);color:#fff}
.ed2 .painel{border-left:1px solid var(--line-2);padding:var(--s4);overflow:auto;background:var(--bg)}
.ferr{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--s4)}
.ferr button{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3);font-size:12.5px;
  color:var(--ink-2);border:1px solid var(--line)}
.ferr button:hover:not([disabled]){border-color:var(--ink);color:var(--ink)}
.ferr button[disabled]{opacity:.38;cursor:not-allowed}
.ferr .k{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ink-3);
  border:1px solid var(--line);padding:0 4px}

/* ══ PRÉ-VISUALIZAÇÃO NO APARELHO ══ */
.prev{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:var(--s5);align-items:start}
@media(max-width:820px){.prev{grid-template-columns:1fr}}
.aparelhoQ{display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.telaQ{width:100%;max-width:300px;aspect-ratio:1236/1680;background:var(--paper);border:1px solid var(--line-3);
  padding:18px 16px;overflow:hidden;position:relative;color:#26221c}
.telaQ.paisagem{aspect-ratio:1680/1236;max-width:400px}
.telaQ .rolo2{height:100%;overflow:hidden}
.telaQ p{margin:0 0 .75em;font-family:var(--serif);text-align:justify;hyphens:auto}
.telaQ.pdf .rolo2{transform-origin:top left}
.telaQ .marcaQ{position:absolute;left:16px;right:16px;bottom:6px;display:flex;justify-content:space-between;
  font-family:var(--ui);font-size:8px;color:rgba(38,34,28,.5)}
.medida{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.05em;color:var(--ink-3);text-align:center}
.medida b{color:var(--ink)}
.ctrls{display:flex;flex-direction:column;gap:var(--s4)}
.ctrl b{display:block;font-size:12.5px;font-weight:600;margin-bottom:var(--s2)}
.ctrl .opts{display:flex;flex-wrap:wrap;gap:var(--s1)}
.ctrl .opts button{border:1px solid var(--line);padding:6px 11px;font-size:12px;color:var(--ink-2)}
.ctrl .opts button:hover{border-color:var(--ink);color:var(--ink)}
.ctrl .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ══ PERFIL E CONTA ══ */
.umenu .grp{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:var(--s3) var(--s3) var(--s1)}
.parea{display:grid;grid-template-columns:206px minmax(0,1fr);gap:var(--s7);align-items:start}
@media(max-width:860px){.parea{grid-template-columns:1fr;gap:var(--s5)}.prail{display:none}}
.prail{position:sticky;top:var(--s4);display:flex;flex-direction:column;gap:1px}
.prail button{display:flex;align-items:center;gap:var(--s3);padding:9px var(--s3);font-size:13.5px;
  color:var(--ink-2);border-left:2px solid transparent}
.prail button:hover{background:var(--bg-2);color:var(--ink)}
.prail button[aria-current="true"]{border-left-color:var(--ink);color:var(--ink);font-weight:650;background:var(--bg-2)}
.prail .pt{margin-left:auto}
.pcards{display:flex;flex-direction:column;background:var(--branco)}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4);border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.pcard:last-child{border-bottom:none}
.pcard:hover{background:var(--bg-2)}
.pcard .nm{font-size:14.5px;font-weight:650;display:block}
.pcard .rs{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:block;line-height:1.5}
.pcard .ch{color:var(--ink-3);font-size:12px}
.atencao{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);background:var(--warn-soft);
  box-shadow:inset 2px 0 0 var(--warn);margin-bottom:var(--s5)}
.atencao b{display:block;font-size:14px}
.atencao p{margin:3px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.campo{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.campo:last-of-type{border-bottom:none}
.campo .k{font-size:12.5px;color:var(--ink-3)}
.campo .v{font-size:14px}
.campo .v small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45}
@media(max-width:620px){.campo{grid-template-columns:1fr;gap:var(--s2)}}
.campoedit{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;width:100%}
.campoedit input{flex:1;min-width:180px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg-2);
  border:1px solid var(--line-3);border-radius:var(--r1);padding:.5rem .6rem}
.campoedit input:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--branco)}
.selo{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:var(--t-mono);
  letter-spacing:.06em;text-transform:uppercase;border-radius:var(--rp);padding:3px 9px;
  border:1px solid var(--line);color:var(--ink-3)}
.selo.ok{border-color:var(--ok);color:var(--ok)}
.selo.al{border-color:var(--warn);color:var(--warn)}
.selo.pend{border-color:var(--line-3);color:var(--ink-2);background:var(--bg-2)}
.ap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s4);border-bottom:1px solid var(--line-2);background:var(--branco)}
.ap:last-child{border-bottom:none}
.ap .nm{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ap .em{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:4px;display:block;word-break:break-all}
.ap .us{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:block}
.vazio{padding:var(--s7) var(--s4);text-align:center;background:var(--branco)}
.vazio b{display:block;font-size:15px;margin-bottom:var(--s2)}
.vazio p{margin:0 auto var(--s4);font-size:13.5px;color:var(--ink-2);max-width:46ch;line-height:1.6}
.grupoP{margin-bottom:var(--s6)}
.grupoP>h3{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3)}
.opcao{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);padding:var(--s3) var(--s4);
  width:100%;text-align:left;background:var(--branco);border-bottom:1px solid var(--line-2);align-items:start}
.opcao:last-child{border-bottom:none}
.opcao:hover{background:var(--bg-2)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-3);margin-top:2px;flex:0 0 16px;
  display:flex;align-items:center;justify-content:center}
.opcao[aria-pressed="true"] .radio{border-color:var(--ink);border-width:5px}
.opcao .nm{font-size:13.5px;font-weight:600}
.opcao .ds{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.5;display:block}
.histdia{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:var(--s5) 0 var(--s2);border-bottom:1px solid var(--line-2)}
.histl{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.histl:hover{background:var(--bg-2)}
.histl .h{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.histl .t{font-size:13.5px}
.histl .o{font-size:12px;color:var(--ink-3)}
@media(max-width:620px){.histl{grid-template-columns:56px minmax(0,1fr)}.histl .o{grid-column:2}}
.perigo{border:1px solid var(--dan);padding:var(--s4);background:var(--dan-soft)}
.perigo b{display:block;font-size:14px;margin-bottom:var(--s2)}
.perigo p{margin:0 0 var(--s3);font-size:13px;color:var(--ink-2);line-height:1.55}
.btnD{height:var(--h2);padding:0 var(--s5);border:1px solid var(--dan);color:var(--dan);background:none;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center}
.btnD:hover{background:var(--dan);color:#fff}
.pendencia{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);
  border:1px dashed var(--line-3);font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:var(--s4)}

/* ══ MESA REDUZIDA ══ uma página editorial que por acaso é interativa.
   Quatro níveis com peso diferente: foco, exceção, estado do sistema,
   biblioteca. O tratamento visual é o que separa as categorias — dar o
   mesmo peso a todas foi o que produziu a sensação de painel. */
.mlede{font-family:var(--serif);font-size:clamp(1.6rem,1.1rem + 1.5vw,2.5rem);line-height:1.14;
  letter-spacing:-.02em;font-weight:400;margin:0;max-width:20ch;text-wrap:balance}
.mtopo{display:flex;align-items:flex-end;gap:var(--s6);flex-wrap:wrap;
  padding-bottom:var(--s7);margin-bottom:var(--s7);border-bottom:1px solid var(--line)}
.mtopo .tx{flex:1;min-width:280px}
.meyebrow{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:var(--s4)}
/* 1 · foco — um item dominante, tratado como matéria de capa */
.mfoco{display:grid;grid-template-columns:190px minmax(0,1fr);gap:var(--s6);align-items:start;
  margin-bottom:var(--s8)}
@media(max-width:680px){.mfoco{grid-template-columns:1fr;gap:var(--s4)}.mfoco img{max-width:150px}}
.mfoco img{width:100%;height:auto;border:1px solid var(--line);background:var(--paper)}
.mfoco h2{font-family:var(--serif);font-size:clamp(1.5rem,1.1rem + 1vw,2.1rem);line-height:1.1;
  letter-spacing:-.02em;font-weight:400;margin:0 0 var(--s3)}
.mfoco .onde{font-size:15px;line-height:1.6;color:var(--ink);margin:0 0 var(--s2)}
.mfoco .desde{font-size:13.5px;line-height:1.6;color:var(--ink-3);margin:0 0 var(--s2)}
/* a fila e outro assunto que este livro: respiro maior antes das acoes, e um
   filete acima para dizer que o que vem depois nao e sobre ele. */
/* de onde o item vem: e o que permite uma lista so de "precisa de voce" sem
   a pessoa perder de vista se aquilo e preparo ou trabalho. */
.mexc .it .qt{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--ink-3);margin-top:var(--s2)}
.mexc.mand .it .nm{font-size:15px}
.mexc.mand .it .pq{font-family:var(--serif);font-size:1.02rem;line-height:1.5;color:var(--ink);
  max-width:48ch}
.mfoco .mfila{font-size:13px;line-height:1.6;color:var(--ink-3);margin:var(--s4) 0 var(--s5);
  padding-top:var(--s3);border-top:1px solid var(--line-2)}
.mfoco .mfila .lnk{padding:0;font-size:13px;color:var(--ink-2)}
.mfoco .mfila .lnk:hover{color:var(--acc)}
/* 2 · exceção — chama atenção, e só existe quando existe */
.mexc{border-top:1px solid var(--line);padding-top:var(--s4);margin-bottom:var(--s7)}
.mexc .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.mexc .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--warn)}
.mexc .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3);margin-left:auto}
.mexc .it+.it{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line-2)}
.mexc .nm{font-size:16px;font-weight:650;letter-spacing:-.01em;display:block}
.mexc .pq{font-size:14px;color:var(--ink-2);line-height:1.6;margin:6px 0 var(--s4);max-width:52ch}
/* 3 · estado do sistema — informa sem chamar */
.mest{border-top:1px solid var(--line);padding-top:var(--s4);margin-bottom:var(--s7)}
.mest .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
.mest .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3)}
.mest .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3);margin-left:auto}
.mest .it{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;padding:7px 0;font-size:13.5px;
  color:var(--ink-2)}
.mest .it b{font-weight:600;color:var(--ink)}
.mest .it .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mest .it button{margin-left:auto}
/* 4 · biblioteca — amostra, não cópia da Estante */
.mbib{border-top:1px solid var(--line);padding-top:var(--s4)}
.mbib .cab{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.mbib .cab .r{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3)}
.mbib .cab .n{font-family:var(--mono);font-size:var(--t-mono);color:var(--ink-3)}
.mbib .cab .lnk{margin-left:auto}
.mbib .capas{display:flex;gap:var(--s4);align-items:flex-end;flex-wrap:wrap}
.mbib .capas button{display:block}
.mbib .capas img{width:82px;height:auto;border:1px solid var(--line);background:var(--paper);
  transition:transform var(--d2) var(--curva)}
.mbib .capas button:hover img{transform:translateY(-4px)}
/* a Mesa inteira vira área de solta ao arrastar */
#app.-arrastando .corpo{box-shadow:inset 0 0 0 2px var(--acc)}
.msoltando{position:absolute;inset:0;background:var(--acc-soft);display:flex;align-items:center;
  justify-content:center;z-index:50;pointer-events:none}
.msoltando span{font-family:var(--serif);font-size:1.6rem;letter-spacing:-.015em}

/* ══ MESA (explorações A, B, C — preservadas no seletor) ══ */
.mduas{display:grid;grid-template-columns:290px minmax(0,1fr);gap:var(--s7);align-items:start}
@media(max-width:900px){.mduas{grid-template-columns:1fr;gap:var(--s6)}}
.mresumo{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:var(--s6)}
.mresumo button{flex:1;padding:var(--s4) var(--s3) var(--s4) 0;text-align:left;
  border-right:1px solid var(--line-2)}
.mresumo button:last-child{border-right:none;padding-right:0}
.mresumo button:hover .n{color:var(--acc)}
.mresumo .n{display:block;font-size:1.7rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  transition:color var(--d1) var(--curva)}
.mresumo .l{display:block;font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.35}
.mresumo.fina button{padding:var(--s3) var(--s3) var(--s3) 0}
.mresumo.fina .n{font-size:1.25rem}
.msec{margin-bottom:var(--s7)}
.msec>h2{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line-2);
  display:flex;gap:var(--s2);align-items:baseline}
.msec>h2 .ct{margin-left:auto;font-size:11px;letter-spacing:.06em}
.mpend{padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.mpend:last-child{border-bottom:none}
.mpend .tipo{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--warn);display:block;margin-bottom:5px}
.mpend .nm{font-size:15px;font-weight:650;letter-spacing:-.01em;display:block}
.mpend .cons{font-size:13px;color:var(--ink-2);line-height:1.55;margin:5px 0 0;max-width:56ch}
.mpend .acao{margin-top:var(--s3)}
.mprep{padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.mprep:last-child{border-bottom:none}
.mprep .nm{font-size:14px;font-weight:600;display:block}
.mprep .et{font-size:13px;color:var(--ink-2);margin-top:4px;display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap}
.mprep .et .t{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mprep .bg{font-size:12px;color:var(--ink-3);margin-top:5px;display:block}
.mcont{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--s4);align-items:start}
.mcont img{width:88px;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper)}
.mcont h3{font-family:var(--serif);font-size:1.45rem;line-height:1.15;letter-spacing:-.015em;font-weight:400;margin:0}
.mcont .meta{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.mcont .prog{height:2px;background:var(--line);margin:var(--s3) 0 var(--s2);max-width:240px}
.mcont .prog i{display:block;height:100%;background:var(--ink)}
.mprontos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--s4)}
.mpronto{text-align:left;display:block}
.mpronto img{width:100%;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper);
  transition:transform var(--d2) var(--curva)}
.mpronto:hover img{transform:translateY(-3px)}
.mpronto .t{display:block;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.25}
.mpronto .q{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mcapas{display:flex;gap:var(--s2);align-items:flex-end}
.mcapas img{width:58px;height:auto;border:1px solid var(--line);border-radius:var(--rm);background:var(--paper)}
@media(max-width:520px){.mcapas img:nth-child(n+5){display:none}}
.msolta{display:flex;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:var(--s6);flex-wrap:wrap}
.msolta .tx{flex:1;min-width:200px}
.msolta .tt{font-size:14px;font-weight:650;display:block}
.msolta .fm{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.07em;color:var(--ink-3);
  display:block;margin-top:4px}
.msolta.arrastando{box-shadow:inset 0 0 0 2px var(--acc);background:var(--acc-soft)}
.mestados{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;padding-top:var(--s5);
  border-top:1px solid var(--line-2);margin-top:var(--s7)}
.mestados .lb{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.1em;color:var(--ink-3)}
.mvazio{padding:var(--s7) 0;max-width:44ch}
.mvazio h2{font-family:var(--serif);font-size:1.5rem;font-weight:400;letter-spacing:-.015em;margin:0 0 var(--s3)}
.mvazio p{font-size:14px;line-height:1.62;color:var(--ink-2);margin:0 0 var(--s4)}

/* ══ LEITURA ══ os ajustes agem por variável, e a superfície obedece */
.ed.-esq .txtE,.ed.-esq .lnota{text-align:left}
.ed.-just .txtE{text-align:justify;hyphens:auto}
.ed.-grot .txtE,.ed.-grot .lq{font-family:var(--ui)}
/* .marcaN e .lnota sao do DOCUMENTO — nota de rodape do original e nota de
   campo do autor. O grupo "Seus destaques" do Aa nao manda nelas: escondia o
   texto de outra pessoa e chamava de seu. Elas ficam sem controle, de proposito. */

/* ══ DESTAQUE E NOTA ══
   Nao ha grifo. Um degrau de papel e um filete: a marca usa a mesma camada
   que o sistema ja usa para separar superficies, e mora dentro da linha.
   Cor de marca-texto seria o unico elemento saturado da tela — mais alto que
   o acento, que esta reservado a excecao. */
.ed ::selection{background:var(--line)}
.dst{background:var(--bg-3);border-bottom:1px solid var(--line-3);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  padding:.06em 0;color:inherit;cursor:pointer;
  scroll-margin-top:calc(var(--topo-sticky,70px) + var(--s4));
  transition:border-color var(--d1) var(--curva)}
.dst:hover{border-bottom-color:var(--ink)}
.dst:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.ed.-semdst .dst{background:none;border-bottom:0}
.ed.-semdst .notaE{display:none}

/* a barra: lasca de papel com filete. Zero sombra, raio 0. Fundo escuro foi
   recusado — tinta cheia e o elemento mais alto da paleta, e o alto e da
   excecao. Gastar preto no gesto mais frequente do produto seria inflacao. */
.selE{position:absolute;z-index:40;display:flex;align-items:center;gap:var(--s3);
  height:38px;padding:0 var(--s3);background:var(--bg);border:1px solid var(--ink);
  border-radius:var(--r1);white-space:nowrap;transform:translateX(-50%);
  animation:selEntra var(--d1) var(--curva)}
@keyframes selEntra{from{opacity:0}to{opacity:1}}
.selE .dest{font-family:var(--ui);font-size:var(--t-peq);color:var(--ink-3);
  padding-right:var(--s3);border-right:1px solid var(--line)}
.selE button{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink);
  padding:5px 7px;border-radius:var(--r1)}
.selE button.mudo{color:var(--ink-3);font-weight:550}
.selE button:hover{background:var(--bg-3)}
.selE .exc{font-family:var(--ui);font-size:var(--t-peq);color:var(--dan);
  padding-right:var(--s2)}
.selE button.perigo{color:var(--dan)}
@media(max-width:760px){
  .selE{position:fixed;left:var(--s4);right:var(--s4);bottom:var(--s4);height:44px;
    transform:none;justify-content:space-between;overflow-x:auto}
}
body.-selecionando #notasbt{display:none}

/* a nota mora no fluxo, logo abaixo do paragrafo de origem. O recuo de 7% e
   da .lnota, que e do documento; aqui o filete carrega apenas "isto e nota". */
/* Filete de 2px em tinta significa, no vocabulario desta interface, "ha voz
   de autor atras". Enquanto voce escreve, o texto e SEU — a moldura estava
   dizendo o contrario. E recuo diz "aparte, secundario", que e o oposto do
   ato principal. O compositor perde as duas: regra fina em cima, medida
   inteira, e o campo respira. */
.notaE{border-top:1px solid var(--line);padding-top:var(--s3);
  margin:var(--s3) 0 var(--esp-par,1.05em);text-align:left}
/* na lista do livro o compositor nao precisa da regra em cima: os itens ja
   vem separados. So a medida e o respiro. */
.escL{margin:var(--s4) 0 var(--esp-par,1.05em);text-align:left}
.notaE.-erro,.escL.-erro{border-top-color:var(--dan)}
.notaE p{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  margin:0;white-space:pre-wrap;border-left:2px solid var(--ink);padding-left:var(--s4)}
/* 4.8em nascia com quase cinco linhas vazias para uma frase de uma linha, e
   um campo grande pede um texto grande. Duas linhas, e ele cresce sozinho. */
.notaE .campo,.escL .campo{display:block;width:100%;min-height:2.4em;resize:vertical;
  font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--ink-3);
  border-radius:var(--r1);padding:0 0 var(--s2)}
.notaE .campo:focus,.escL .campo:focus{outline:0;border-bottom-color:var(--ink)}
.notaE .campo::placeholder,.escL .campo::placeholder{color:var(--ink-4)}
.notaE .pe,.escL .pe{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
/* Pronto usava --acc, que e o acento reservado a excecao. Guardar uma nota e
   o gesto mais frequente do produto: tinta cheia, nao cor de alarme. */
.notaE .pe .lnk,.escL .pe .lnk,.tr.-livre .pe .lnk,.descL .pe .lnk{color:var(--ink)}
.notaE .pe .lnk:hover,.escL .pe .lnk:hover,.tr.-livre .pe .lnk:hover,.descL .pe .lnk:hover{background:var(--bg-3)}
.notaE .pe .lnk.mudo,.escL .pe .lnk.mudo,.tr.-livre .pe .lnk.mudo,.descL .pe .lnk.mudo{color:var(--ink-3)}
/* o destino era um rotulo que virou botao e continuou parecendo rotulo — e por
   isso ninguem achou. Dois estados a vista, o atual marcado: e escolha. */
.destino{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;
  margin-left:auto}
.destino button{padding:4px 9px;font-family:var(--ui);font-size:var(--t-peq);color:var(--ink-3);
  border-right:1px solid var(--line)}
.destino button:last-child{border-right:none}
.destino button:hover{background:var(--bg-2);color:var(--ink)}
.destino button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* escrever sem marcar nada: pendurado na linha do capitulo e no fim do livro,
   que ja estao na tela. O lugar onde se clica define o endereco. */
.lcap .escq{font-family:var(--ui);font-size:var(--t-peq);letter-spacing:0;text-transform:none;
  color:var(--ink-3);padding:0;white-space:nowrap;border-bottom:1px solid var(--line)}
.lcap .escq:hover{color:var(--ink)}
.colE>.notaE{margin-top:var(--s4)}
.notaE .pe .sp,.escL .pe .sp{flex:1}
/* o endereco e ROTULO: diz onde a escrita vai morar, e nao se aperta. Estava
   em --t-peq dentro de .notaE — maior que o "Pronto" de 13px que ele acompanha
   — e sem regra nenhuma em .cab, onde herdava serifa em tinta cheia do corpo
   do item. A coisa que nao se pode apertar era a mais forte da linha. Mesmo
   corpo e mesma cor do "Pronto"; quem manda na linha e a cor de acento dele. */
.notaE .dest,.escL .dest,.dossie .tr .dest{font-family:var(--ui);font-size:13px;color:var(--ink-3)}
.notaE.-erro,.escL.-erro{background:var(--dan-soft);padding:var(--s3) var(--s4)}
.notaE .erro,.escL .erro{font-family:var(--ui);font-size:var(--t-peq);color:var(--dan);
  line-height:1.5;margin:var(--s3) 0 0}

.qbar .cont{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.06em;
  color:var(--ink-3);padding:4px 6px;border-radius:var(--r1)}
.qbar button.cont:hover{color:var(--ink);background:var(--bg-3)}

/* as duas listas reusam .dossie .tr e so trocam os papeis por estado:
   com nota, a nota e o corpo e o trecho vira a volta. */
.dossie .tr.-ideia p,.dossie .tr.-livre p{font-size:var(--t-leitura);
  line-height:var(--lh-leitura);color:var(--ink)}
.dossie .tr .volta{font-family:var(--serif);font-style:italic;font-size:13px;
  color:var(--ink-3);display:block;margin-top:var(--s2);text-align:left}
.dossie .tr .volta:hover{color:var(--ink)}
/* uma acao visivel por item — ir ao trecho, que e o ponto da lista.
   As outras sao ferramenta avancada: aparecem quando a pessoa se aproxima.
   Em aparelho sem hover elas ficam sempre, porque la nao ha como pedir. */
.dossie .tr .acs{display:flex;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap;align-items:center}
.dossie .tr .acs .sob{opacity:0;transition:opacity var(--d1) var(--curva)}
.dossie .tr:hover .acs .sob,.dossie .tr:focus-within .acs .sob{opacity:1}
@media(hover:none){.dossie .tr .acs .sob{opacity:1}}
.dossie .tr .acs .tirar{color:var(--ink-3)}
.dossie .tr .acs .tirar:hover{color:var(--dan)}
.desfezL{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0 var(--s3) var(--s4);
  border-left:2px solid var(--ink);margin-bottom:var(--s4);font-size:13px;color:var(--ink)}
.dossie .tr .kd{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
