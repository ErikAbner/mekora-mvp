  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);
  padding:1px 5px;margin-left:var(--s2)}
.saldo{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 var(--s4)}
.grpM{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:var(--s5) 0 var(--s3)}
.grpM:first-of-type{margin-top:var(--s4)}
.txtE{margin-bottom:var(--esp-par,1.05em)}
/* @container e nao @media: o gatilho e a largura da FOLHA, nao a da janela.
   Com media query a previa continuava em duas colunas dentro de um container
   de 560px enquanto a janela tivesse 1900 — que era exatamente o defeito. */
.aacols{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:var(--s6)}
@container (max-width:700px){.aacols{grid-template-columns:1fr;gap:var(--s5)}.aaprev{display:none}}
@media(max-width:760px){.aacols{grid-template-columns:1fr}.aaprev{display:none}}
.aactl{max-height:min(58vh,520px);overflow-y:auto;padding-right:var(--s3)}
.aagrupo{margin-bottom:var(--s5)}
.aagrupo>h4{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3)}
.especs{display:flex;gap:var(--s2);flex-wrap:wrap}
.espec{flex:1;min-width:64px;border:1px solid var(--line);padding:var(--s3) var(--s2);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color var(--d1) var(--curva)}
.espec:hover{border-color:var(--line-3)}
.espec[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.espec .am{height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.espec .rt{font-size:11px;color:var(--ink-3);line-height:1.2}
.espec[aria-pressed="true"] .rt{color:var(--ink)}
/* espécimes desenhados: a amostra mostra o efeito, não o nome dele */
.espec .lin{display:block;width:26px;height:16px;background-repeat:repeat-y;background-size:100% 100%}
.espec .lin.j{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 3px)}
.espec .lin.p{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 5px)}
.espec .lin.s{background-image:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 8px)}
.espec .col{display:block;height:18px;background:var(--ink)}
.espec .col.e{width:10px}.espec .col.p{width:20px}.espec .col.l{width:30px}
.espec .par{display:block;width:26px;height:18px;background-repeat:no-repeat;
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(var(--ink),var(--ink));
  background-size:100% 5px,100% 5px}
.espec .par.j{background-position:0 2px,0 10px}
.espec .par.p{background-position:0 0,0 13px}
.espec .par.s{background-position:0 0,0 16px}
.espec .al{display:block;width:26px;height:16px;background-repeat:no-repeat;
  background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(var(--ink),var(--ink)),
  linear-gradient(var(--ink),var(--ink));background-size:100% 3px,100% 3px,100% 3px;
  background-position:0 0,0 6px,0 12px}
.espec .al.e{background-size:100% 3px,100% 3px,62% 3px}
.espec .tm{display:block;width:22px;height:22px;border:1px solid var(--line-3)}
.espec .tm.c{background:#faf9f5}.espec .tm.e{background:#161513}
.aaprev{border-left:1px solid var(--line-2);padding-left:var(--s6);max-height:min(58vh,520px);overflow:hidden}
@container (max-width:700px){.aaprev{border-left:none;padding-left:0}}
@media(max-width:760px){.aaprev{border-left:none;padding-left:0}}
.aaprev .cap{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:var(--s4)}
.aaprev .pv p{font-family:var(--serif);font-size:var(--t-leitura);line-height:var(--lh-leitura);
  color:var(--ink);margin:0 0 var(--esp-par,1.05em)}
.aaprev .pv.-just p{text-align:justify;hyphens:auto}
.aaprev .pv.-esq p{text-align:left}
.aaprev .pv.-grot p{font-family:var(--ui)}
.aaesc{border:1px solid var(--line-3);padding:var(--s4);margin-top:var(--s5)}
.aaesc .tt{font-size:13.5px;font-weight:650;display:block;margin-bottom:var(--s3)}
.aaesc .cons{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:var(--s3) 0 0}


/* ══ PERGUNTAS QUE GUIAM A LEITURA ══
   Derivadas dos títulos do próprio arquivo — determinístico, não inventado.
   O usuário acrescenta as dele. Cada destaque pode responder uma. */
.pgs2{border-top:1px solid var(--line);padding-top:var(--s4);margin-top:var(--s6)}
.pg2i{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s3);align-items:start;
  padding:var(--s4) 0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.pg2i:last-child{border-bottom:none}
.pg2i:hover{background:var(--bg-2)}
.pg2i .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}
.pg2i .q{font-family:var(--serif);font-size:1.06rem;line-height:1.35;letter-spacing:-.01em;display:block}
.pg2i .r{font-size:12.5px;color:var(--ink-3);margin-top:5px;display:block}
.pg2i .ch{font-size:12px;color:var(--ink-3);margin-top:4px}
.pgorig{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);padding:2px 7px;white-space:nowrap}
/* barra de pergunta dentro da leitura */
.qbar{position:sticky;top:56px;z-index:15;background:var(--bg-2);border-bottom:1px solid var(--line);
  padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap}
.qbar .lb{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3)}
.qbar .q{font-family:var(--serif);font-size:1.02rem;flex:1;min-width:200px}
.dossie{border-top:1px solid var(--line);padding-top:var(--s5);margin-top:var(--s7)}
.dossie .q{font-family:var(--serif);font-size:1.24rem;line-height:1.3;margin:0 0 var(--s3)}
.dossie .tr{border-left:2px solid var(--ink);padding-left:var(--s4);margin:0 0 var(--s4)}
/* PENDURADA — a alternativa. Oito itens empilhavam oito filetes identicos na
   mesma coluna ao longo de 1100px: o filete deixa de distinguir e vira cerca.
   Aqui a procedencia sai para a margem e a distincao vem da POSICAO, nao de
   1px contra 2px — um sinal que ninguem relatou ter notado. */
.dossie.-pend .tr{border-left:none;padding-left:0;display:grid;
  grid-template-columns:132px minmax(0,1fr);gap:var(--s5);
  padding:var(--s4) 0;border-top:1px solid var(--line-2);margin:0}
.dossie.-pend .tr:first-of-type{border-top:none;padding-top:0}
.dossie.-pend .tr.-filho{margin-left:0}
.dossie.-pend .tr.-livre+.tr.-filho{border-top:none;padding-top:0}
.dossie.-pend .tr>cite{grid-column:1;grid-row:1;margin:0;text-align:right;
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;line-height:1.5;
  color:var(--ink-3);font-style:normal}
.dossie.-pend .tr>p,.dossie.-pend .tr>.volta,.dossie.-pend .tr>.cheio,
.dossie.-pend .tr>.acs,.dossie.-pend .tr>.kd{grid-column:2}
.dossie.-pend .tr>p{margin:0}
/* sem filete, o que separa nota de trecho e a propria letra: o que voce
   escreveu vem em corpo de leitura, o que o livro escreveu vem menor */
.dossie.-pend .tr.-livre>p,.dossie.-pend .tr.-ideia>p{font-size:var(--t-leitura);
  line-height:var(--lh-leitura);color:var(--ink)}
.dossie.-pend .tr:not(.-livre):not(.-ideia)>p{font-family:var(--serif);font-size:15px;
  line-height:1.6;color:var(--ink-2)}
.dossie.-pend .tr>.acs{margin-top:var(--s2)}
@media(max-width:680px){
  .dossie.-pend .tr{grid-template-columns:1fr;gap:var(--s2)}
  .dossie.-pend .tr>cite{grid-column:1;text-align:left}
  .dossie.-pend .tr>p,.dossie.-pend .tr>.volta,.dossie.-pend .tr>.cheio,
  .dossie.-pend .tr>.acs{grid-column:1}
}
.dossie .tr p{font-family:var(--serif);font-size:15px;line-height:1.6;margin:0;color:var(--ink-2)}
.dossie .tr cite{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-style:normal;
  display:block;margin-top:7px}

/* ══ KINDLE POR CABO ══ */
.usb{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s6) 0}
.usbfig{display:flex;align-items:center;gap:var(--s5)}
.usbap{width:74px;height:100px;border:1px solid var(--line-3);background:var(--paper);position:relative}
.usbap i{position:absolute;inset:7px 7px 14px;display:block;
  background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 5px)}
.usbap.-on{border-color:var(--ink)}
.usbfio{width:88px;height:1px;background:var(--line-3);position:relative}
.usbfio i{position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:var(--ink);
  animation:corre 1.5s linear infinite}
.usbfio.-volta i{animation-direction:reverse}
@keyframes corre{from{left:0}to{left:83px}}
@media (prefers-reduced-motion:reduce){.usbfio i{animation:none;left:40px}}
.usbmk{width:74px;height:74px;border:1px solid var(--line-3);display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-size:15px}
.usbst{font-size:14px;color:var(--ink-2);text-align:center;min-height:22px}
.usbst b{color:var(--ink)}
.usbtr{width:100%;max-width:300px;height:2px;background:var(--line);overflow:hidden}
.usbtr i{display:block;height:100%;background:var(--ink);transition:width .3s linear}
.usbach{width:100%;border-top:1px solid var(--line-2);margin-top:var(--s4)}
.usbl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:var(--s3);align-items:center;
  padding:var(--s3) 0;border-bottom:1px solid var(--line-2)}
.usbl:last-child{border-bottom:none}
.usbl img{width:34px;height:44px;object-fit:cover;object-position:top;border:1px solid var(--line)}
.usbl .nm{font-size:13.5px;font-weight:600;display:block}
.usbl .ds{font-size:12.5px;color:var(--ink-2);display:block;margin-top:2px}
.usbl .st2{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap}
.usbl .st2.novo{color:var(--ok)}
.usbl .st2.conf{color:var(--warn)}

/* ══ ATUALIZAÇÕES ══ */
.nov{display:grid;grid-template-columns:116px minmax(0,1fr);gap:var(--s4);align-items:start;
  padding:var(--s4) 0;border-bottom:1px solid var(--line-2)}
.nov:last-child{border-bottom:none}
.nov b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.nov p{margin:5px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:58ch}
@media(max-width:620px){.nov{grid-template-columns:1fr;gap:var(--s2)}}
.instavel{border:1px solid var(--warn);background:var(--warn-soft);padding:var(--s4);margin-top:var(--s6)}
.instavel h3{margin:0 0 var(--s3);font-size:14.5px;font-weight:650}
.instavel .li2{padding:var(--s3) 0;border-top:1px solid rgba(168,112,28,.25)}
.instavel .li2 b{display:block;font-size:13.5px}
.instavel .li2 p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}

/* ══ CENTRAL DE AJUDA ══ orientada por tarefa, não por índice de tópicos */
.htarefas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;
  background:var(--line-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  margin:var(--s5) 0}
.htarefa{background:var(--branco);padding:var(--s4);text-align:left;display:flex;flex-direction:column;gap:6px}
.htarefa:hover{background:var(--bg-2)}
.htarefa .n{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;color:var(--ink-3)}
.htarefa .t{font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.htarefa .d{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.htarefa .cta{font-size:12.5px;color:var(--acc);font-weight:600;margin-top:auto;padding-top:var(--s2)}
.hcat{margin-bottom:var(--s6)}
.hcat>h3{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--line-2)}
.hitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:baseline;
  width:100%;text-align:left;padding:var(--s3) 0;border-bottom:1px solid var(--line-2)}
.hitem:last-child{border-bottom:none}
.hitem:hover{background:var(--bg-2)}
.hitem .t{font-size:14px;font-weight:600;display:block}
.hitem .d{font-size:12.5px;color:var(--ink-2);line-height:1.55;display:block;margin-top:3px}
.hitem .ch{font-size:12px;color:var(--ink-3)}

/* ══ ASSISTENTE DE CONEXÃO DO KINDLE ══
   Etapa frágil: aqui a redundância vale mais que o minimalismo. */
.wcont{max-width:520px;margin:0 auto}
.wpasso{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:var(--s3)}
.wh{font-family:var(--serif);font-size:1.7rem;line-height:1.15;letter-spacing:-.02em;font-weight:400;
  margin:0 0 var(--s3);text-wrap:balance}
.wp{font-size:14px;line-height:1.62;color:var(--ink-2);margin:0 0 var(--s4);max-width:52ch}
.wp b{color:var(--ink)}
.wetapas{display:flex;flex-direction:column;gap:1px;margin:var(--s5) 0}
.wetapa{display:grid;grid-template-columns:34px minmax(0,1fr);gap:var(--s3);padding:var(--s3) 0;
  border-bottom:1px solid var(--line-2);align-items:baseline}
.wetapa:last-child{border-bottom:none}
.wetapa .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wetapa .t{font-size:13.5px}
.wetapa.feita .n,.wetapa.feita .t{color:var(--ink-3)}
.wetapa.agora .t{font-weight:650}
/* representação esquemática da tela da Amazon — não é captura, e não finge ser */
.wamz{border:1px solid var(--line-3);background:var(--bg-2);padding:var(--s4);margin:var(--s4) 0;
  font-family:var(--ui);font-size:12.5px}
.wamz .cab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:var(--s3);
  display:flex;justify-content:space-between}
.wamz .lin{padding:7px 0;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.wamz .lin:last-child{border-bottom:none}
.wamz .lin.alvo{background:var(--warn-soft);box-shadow:inset 2px 0 0 var(--warn);
  padding-left:9px;margin-left:-9px;color:var(--ink);font-weight:600}
.wamz .lin.alvo::after{content:" ←";color:var(--warn);font-weight:700}
.wamz .em{font-family:var(--mono);font-size:11.5px}
.wcam{display:flex;flex-direction:column;gap:2px;margin:var(--s4) 0;font-size:12.5px;color:var(--ink-2)}
.wcam span{padding:6px 0}
.wcam span+span::before{content:"↓";display:block;color:var(--ink-3);font-size:11px;margin-bottom:4px}
.wcam span:last-child{font-weight:650;color:var(--ink)}
.wend{border:1px solid var(--line-3);background:var(--branco);padding:var(--s5);text-align:center;margin:var(--s4) 0}
.wend b{display:block;font-family:var(--mono);font-size:1.15rem;letter-spacing:.01em;word-break:break-all;
  margin-bottom:var(--s3)}
.wverif{border-top:1px solid var(--line-2);padding-top:var(--s4);margin-top:var(--s4)}
.wverif p{font-size:13px;color:var(--ink-2);margin:0 0 var(--s3)}
.wok{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);background:var(--ok-soft);
  box-shadow:inset 2px 0 0 var(--ok);margin-bottom:var(--s2)}
.wok b{display:block;font-size:13.5px}
.wok span{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.werr{padding:var(--s3) var(--s4);background:var(--dan-soft);box-shadow:inset 2px 0 0 var(--dan);
  font-size:13px;line-height:1.55;margin-top:var(--s3)}

/* ═══ DOCK ═══ só nas superfícies espaciais */
.dock{position:sticky;bottom:var(--s5);margin:var(--s6) auto 0;width:max-content;display:flex;gap:var(--s1);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:5px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 15px;border-radius:var(--r1);
  font-size:11.5px;color:var(--ink-2)}
.dock button:hover{background:var(--bg-2);color:var(--ink)}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dock .div{width:1px;background:var(--line-2);margin:6px 4px}

/* ═══ FOLHA ═══ */
.veu{position:fixed;inset:0;background:rgba(20,19,17,.44);display:flex;align-items:flex-start;
  justify-content:center;padding:var(--s6) var(--s4);z-index:80;overflow-y:auto}
.folha{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);width:100%;
  max-width:560px;overflow:hidden;container-type:inline-size}
/* leitura e paginas sao bancadas: precisam de mesa, nao de coluna */
.folha.-bancada{max-width:1000px}
.folha.-media{max-width:760px}
.fcab{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line-2)}
.fcab .ct{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fcab h2{margin:3px 0 0;font-size:17px;font-weight:650;letter-spacing:-.018em}
.fx{width:30px;height:30px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--ink-2);border:1px solid var(--line);flex:0 0 30px}
.fx:hover{background:var(--bg-2);color:var(--ink)}
.fcorpo{padding:var(--s4)}
.fpe{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);border-top:1px solid var(--line-2);
  background:var(--bg-2);flex-wrap:wrap}
.campoB{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg-2);
  border:1px solid var(--line);border-radius:var(--r1);padding:.7rem .8rem}
.campoB:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--branco)}
.segE{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.segE button{padding:6px 12px;font-size:12.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.segE button:last-child{border-right:none}
.segE button:hover{background:var(--bg-2);color:var(--ink)}
.segE button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.conf{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--rp);padding:5px 12px}
.conf b{color:var(--ink);font-weight:650}
.pgs{display:flex;gap:var(--s3);justify-content:center;padding:var(--s4);background:var(--bg-2);
  border-radius:var(--r1);margin-bottom:var(--s4)}
.pg{width:86px;height:120px;border:1px solid var(--line);border-radius:var(--r1);background:var(--bg);position:relative;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--mono);
  font-size:9px;color:var(--ink-3)}
.pg i{position:absolute;inset:6px 6px 20px;border-radius:var(--r1);
  background:repeating-linear-gradient(135deg,var(--bg-3) 0 7px,var(--bg-2) 7px 14px)}
.pg.dup{width:172px}
.seta{display:flex;align-items:center;font-size:19px;color:var(--ink-3)}

/* ═══ MENU DA CONTA ═══ */
.umenu{position:absolute;top:50px;right:var(--s5);width:262px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);z-index:70;overflow:hidden}
.umenu .id{padding:var(--s4);border-bottom:1px solid var(--line-2);display:flex;gap:var(--s3);align-items:center}
.umenu .id .ava{width:38px;height:38px;font-size:14px}
.umenu .id .n{font-size:14px;font-weight:600}
.umenu .id .e{font-size:12px;color:var(--ink-3);margin-top:1px}
.umenu ul{list-style:none;margin:0;padding:var(--s2)}
.umenu li button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:9px var(--s3);
  border-radius:var(--r1);font-size:13.5px}
.umenu li button:hover{background:var(--bg-2)}
.umenu li button .ic{width:16px;text-align:center;color:var(--ink-3);font-size:12px}
.umenu .divi{height:1px;background:var(--line-2);margin:var(--s2) 0}

/* ═══ PAINEL DE NOTAS ═══ */
#ctl{position:fixed;left:18px;bottom:18px;z-index:90;display:flex;gap:1px;background:var(--line);
  border:1px solid var(--line)}
#ctl button{background:var(--branco);color:var(--ink-2);font-size:11.5px;padding:8px 13px;
  font-family:var(--mono);letter-spacing:.05em}
#ctl button:hover{background:var(--bg-2);color:var(--ink)}
#ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#notasbt{position:fixed;right:18px;bottom:18px;z-index:90;background:var(--ink);color:var(--bg);
  border-radius:var(--r1);padding:10px 17px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
#notasbt:hover{background:var(--acc);color:#fff}
#notasbt .bdg{font-family:var(--mono);font-size:9px;background:var(--acc);color:#fff;border-radius:var(--rp);
  padding:2px 7px}
#notas{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column}
#notas[hidden]{display:none}
.ncab{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.nabas{display:flex;gap:2px}
.nabas button{padding:7px 13px;border-radius:var(--r1);font-size:13px;color:var(--ink-2)}
.nabas button:hover{background:var(--bg-2)}
.nabas button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ncorpo{flex:1;overflow-y:auto;padding:var(--s6) var(--s7)}
.ncorpo .w{max-width:820px}
.ncorpo h2{font-size:22px;font-weight:400;font-family:var(--serif);letter-spacing:-.015em;margin:0 0 var(--s3)}
.ncorpo h3{font-size:12px;font-weight:700;letter-spacing:.06em;margin:var(--s6) 0 var(--s3);color:var(--ink-2)}
.ncorpo p{font-size:14px;line-height:1.65;color:var(--ink-2);margin:0 0 var(--s3);max-width:68ch}
.ncorpo p b,.ncorpo li b{color:var(--ink);font-weight:600}
.ncorpo ul{margin:0 0 var(--s3);padding-left:20px;font-size:14px;line-height:1.65;color:var(--ink-2);
  display:flex;flex-direction:column;gap:6px;max-width:68ch}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:var(--s3) 0}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:400;padding:9px 11px;border-bottom:1px solid var(--line)}
td{padding:9px 11px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top;line-height:1.5}
td.n{color:var(--ink);font-weight:600}
.copy{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-top:var(--s4)}
.cpl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s4);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--line-2)}
.cpl:last-child{border-bottom:none}
.cpl .onde{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
.cpl .txt{font-size:13.5px;color:var(--ink);line-height:1.5}
.cpl .pq{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:4px}
.mau{color:var(--dan);text-decoration:line-through;text-decoration-thickness:1px}

/* A JUNCAO
   Do Erik: o trecho mora DENTRO do bloco da pergunta, num degrau de papel —
   contencao inequivoca, que nem filete nem recuo conseguiram dizer. Um filete
   por GRUPO, nao por item: a cerca acaba porque ha uma linha onde ha um
   assunto, e nao uma por coisa escrita. E a destrutiva no canto superior
   direito, sempre no mesmo lugar.
   Meu: menos controle. So o que se usa trabalhando fica a vista; copiar com a
   origem e ferramenta de levar para fora e espera ser pedida. */
.grupoE{border-left:2px solid var(--line-3);padding-left:var(--s4);margin:0 0 var(--s6)}
.grupoE:last-child{margin-bottom:0}
.grupoE .cab{position:relative;padding-right:var(--s6)}
.grupoE .cab>p{margin:0;font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink)}
/* uma regra so: todo texto que voce le e a porta de onde ele veio. Botao,
   nesta lista, e sempre arrumacao — nunca o caminho principal. */
.grupoE p>.abre{display:block;width:100%;text-align:left;font:inherit;color:inherit;
  padding:0;border-radius:0}
/* --ink-4 mede 2,05:1 e o proprio projeto o proibiu em texto. Uma seta que
   existe para anunciar nao pode estar no limiar de nao ser vista. */
.grupoE p>.abre::after{content:" →";color:var(--ink-3);
  transition:color var(--d1) var(--curva)}
.grupoE .cab:hover>p>.abre::after,.grupoE .cit:hover>p>.abre::after,
.grupoE p>.abre:focus-visible::after{color:var(--ink)}
.grupoE p>.abre:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.grupoE cite{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3);
  font-style:normal;display:block;margin-top:6px}
/* o degrau de papel: o trecho esta DENTRO, e o fundo diz isso sem borda */
/* O CHAO MUDA DE LADO. O degrau de papel marcava a CITACAO, e por isso a
   frase do autor pesava mais do que a sua — medido: pai sem fundo, filho
   com fundo branco. Agora o chao e do conteudo, e a citacao volta a ser
   marcada como citacao sempre foi: filete e italico. */
/* padrao: um item da lista E conteudo, e conteudo tem chao. A excecao e o
   trecho sem nota — citacao pura —, que troca chao por filete.
   Sem inverter assim, a especificidade de :has() fazia a excecao vencer a
   regra do filho, e todo mundo acabava com o mesmo fundo. */
.grupoE .cit{position:relative;padding:var(--s3) var(--s6) var(--s3) var(--s4);
  margin-top:var(--s4);background:var(--bg-2)}
.grupoE .cit:not(:has(>p.-nota)){background:none;border-left:1px solid var(--line-2)}
/* A CABECA DO GRUPO GANHA O CHAO, e o que esta guardado sob ela recua e
   troca chao por filete. Antes era o contrario — a cabeca sem fundo e o
   filho com fundo branco —, e o grupo lia de tras para a frente. */
.grupoE .cab{background:var(--bg-2);padding:var(--s3) var(--s6) var(--s3) var(--s4)}
.grupoE:has(>.cab) .cit{background:none;border-left:1px solid var(--line-2);
  margin-left:var(--s5)}
.grupoE:has(>.cab) .cit>p.-nota{font-size:1rem;line-height:1.55}
.grupoE .cit>p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2)}
.grupoE .cit>p.-nota{font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink)}
/* a coluna larga serve a estrutura da pagina, e nao a linha de texto */
.colE.larga .grupoE .cit>p{max-width:64ch}
.colE.larga .grupoE .cit>p.-nota{max-width:58ch}
.grupoE .cit .volta{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);
  display:block;margin-top:var(--s2);text-align:left}
.grupoE .cit .volta:hover{color:var(--ink)}
.grupoE .cit .cheio{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-2);
  margin:var(--s3) 0 0}
.grupoE .cit+.cit{margin-top:var(--s2)}
/* uma so, sempre no mesmo canto, e so ela e destrutiva */
.grupoE .lix{position:absolute;top:0;right:0;font-family:var(--ui);font-size:var(--t-peq);
  color:var(--ink-4);padding:2px 4px}
.grupoE .lix:hover{color:var(--dan)}
/* acoes a vista: o primario tem caixa, o resto e texto. Esconder o caminho
   principal falhou tres vezes hoje — o que se esconde agora e so o que serve
   para levar material para fora. */
.grupoE .acs{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3)}
.grupoE .acs .pri{border:1px solid var(--line-3);padding:6px 14px;font-size:13px;
  color:var(--ink);font-weight:600;border-radius:var(--r1)}
.grupoE .acs .pri:hover{background:var(--bg-3)}
.grupoE .acs .sec{font-size:13px;color:var(--ink-3);padding:6px 0}
.grupoE .acs .sec:hover{color:var(--ink)}
.grupoE .acs .sob{opacity:0;transition:opacity var(--d1) var(--curva)}
/* o gatilho estava no GRUPO: passar num cartao revelava a acao secundaria
   de todos os outros. Medido: dois cartoes, duas secundarias acesas juntas. */
.grupoE .cit:hover .acs .sob,.grupoE .cab:hover .acs .sob,
.grupoE .acs .sob:focus-visible{opacity:1}
@media(hover:none){.grupoE .acs .sob{opacity:1}}
/* ═══ NOTAS ═══ Nada de card: as notas já têm uma forma nesta casa — filete
   à esquerda, degrau de papel, tipografia. A área de Notas usa a MESMA, e é
   por isso que uma nota lida aqui é reconhecível como a mesma coisa que você
   escreveu lá dentro. */
.nfila{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  margin-top:var(--s5);padding-bottom:var(--s3);border-bottom:1px solid var(--line-2)}
/* com dois niveis, o filete e do grupo: ele desce para o segundo, e o
   primeiro so encosta. Sem isto o segundo nivel pendura por fora da linha
   que deveria fechar o cabecalho. */
.nfila:has(+.nfila2){padding-bottom:var(--s2);border-bottom:0}
.nfila button[data-a="nota-filtro"]{font-size:13px;color:var(--ink-3);padding:4px 0;
  border-bottom:1px solid transparent;border-radius:0}
.nfila button[data-a="nota-filtro"]:hover{color:var(--ink)}
.nfila button[data-a="nota-filtro"][aria-current]{color:var(--ink);font-weight:600;
  border-bottom-color:var(--ink)}
.nfila button i{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3);
  letter-spacing:.05em;margin-left:3px}
/* o filete vertical separa a partição do estado: as três primeiras dividem
   todas as notas, "Para revisar" atravessa as três. */
.nfila .di{width:1px;height:14px;background:var(--line);margin:0 var(--s2)}
.nfila .sp{flex:1}
.campoN{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--branco);
  border:1px solid var(--line);border-radius:var(--r1);padding:5px 9px;width:150px}
.campoN:focus{outline:1px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.vazioN{font-size:13px;color:var(--ink-2);line-height:1.65;max-width:58ch;margin:var(--s6) 0 0}
.cit .rev{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--warn);display:block;margin-top:4px}
/* ═══ A IDEIA ═══ Sugestão não é aviso: nada de cor de alerta, nada de brilho.
   O que a distingue de uma nota é a moldura fina e o fundo um passo atrás —
   ela é do sistema, e o sistema fala baixo. */
/* A sugestao leva FILETE, e o estudo seu leva chao. Com painel proprio ela
   pesava mais do que o estudo de verdade logo acima — a mesma inversao que
   a rodada de hierarquia consertou na lista, aparecendo de novo aqui. */
.ideia{border-left:2px solid var(--line-3);padding:0 0 0 var(--s4);
  margin-top:var(--s4);background:none}
.ideia>.soltoE{margin-top:0}
.ideia .frase{font-family:var(--serif);font-size:1.05rem;line-height:1.55;color:var(--ink-2);
  margin:0;max-width:52ch}
.ideia .pal{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.06em;color:var(--ink-2);
  margin:var(--s3) 0 var(--s5)}
.ideia .pal b{color:var(--ink);font-weight:600}
/* 90 caracteres por linha em serifa de 17px: medido na captura, a amostra
   atravessava a coluna larga inteira. A caixa e larga; a linha, nao. */
.ideia .grupoE{margin-top:var(--s4)}
.ideia .grupoE .cit{background:none;border-left:1px solid var(--line-2)}
.ideia .grupoE .cit>p{max-width:60ch}
.ideia .grupoE .cit>p.-nota{max-width:56ch}
.ideia .acs{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s5)}
.ideia .acs .pri{border:1px solid var(--line-3);padding:6px 14px;font-size:13px;color:var(--ink);
  font-weight:600;border-radius:var(--r1)}
.ideia .acs .pri:hover{background:var(--bg-3)}
.ideia .acs .sec{font-size:13px;color:var(--ink-3);padding:6px 0}
.ideia .acs .sec:hover{color:var(--ink)}
.ideia .nomeia{margin-top:var(--s5)}
.ideia .nomeia label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:var(--s2)}
/* "como cheguei aqui" fica fechado e é um link, não um botão: quem confia na
   sugestão nunca precisa abrir, e quem não confia precisa poder. */
.ideia .como{display:block;font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.09em;
  color:var(--ink-3);padding:var(--s4) 0 0;text-align:left}
.ideia .como:hover{color:var(--ink)}
.ideia .comoD{border-top:1px solid var(--line-2);margin-top:var(--s3);padding-top:var(--s3)}
.ideia .comoD ul{margin:0;padding-left:1.1em;list-style:none}
.ideia .comoD li{font-family:var(--mono);font-size:11px;color:var(--ink-2);line-height:1.8;
  text-indent:-1.1em}
.ideia .comoD li::before{content:"· ";color:var(--ink-3)}
.ideia .comoD p{font-size:12px;color:var(--ink-3);line-height:1.65;margin:var(--s3) 0 0;max-width:56ch}
/* ═══ UMA NOTA ═══ */
.volt{padding:0;margin-bottom:var(--s5);display:inline-block}
/* 1,35rem contra 1,16rem das relacionadas davam 17% de diferenca entre "o
   assunto desta pagina" e "uma referencia de apoio". Hierarquia e distancia,
   e 17% nao e distancia. */
.notaG{font-family:var(--serif);font-size:1.9rem;line-height:1.32;color:var(--ink);
  margin:0;letter-spacing:-.01em;background:var(--bg-2);
  padding:var(--s5);box-sizing:border-box}
.notaG+.ondeN{margin-top:var(--s4)}
.ondeN{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.07em;color:var(--ink-3);
  margin:var(--s4) 0 0}
/* a nota ficou com o chao, entao a citacao volta a ser marcada como citacao:
   filete e italico. Duas coisas com o mesmo fundo na mesma tela e o mesmo
   problema de antes, invertido. */
.trechoN{background:none;border-left:2px solid var(--line-3);
  padding:0 0 0 var(--s4);margin-top:var(--s5)}
.trechoN p{font-style:italic}
.trechoN p{font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--ink-2);margin:0}
.trechoN .volta{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);
  display:block;margin-top:var(--s3);text-align:left}
.trechoN .volta:hover{color:var(--ink)}
/* as regras de .acs so existem dentro de .grupoE, e fora dela a fila saia
   grudada: "Abrir no livroEditarLevar ao Canvas". A fila de acoes da nota
   tem as suas proprias. */
/* o estado da ancora e informacao do sistema: informa em silencio, e so
   aparece quando deixou de ser verdade que o trecho esta onde estava. */
.reanc{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3);
  margin:var(--s2) 0 0;line-height:1.6;display:block}
.cit .reanc{margin-top:4px}
.trechoN.-perdida{border-left:2px solid var(--warn)}
.trechoN.-perdida p:first-child{font-family:var(--ui);font-size:13px;color:var(--ink-2)}
.volta.-perdida{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);
  display:block;margin-top:var(--s3)}
.acsN{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;
  margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line-2)}
.acsN .pri{border:1px solid var(--line-3);padding:7px 15px;font-size:13px;color:var(--ink);
  font-weight:600;border-radius:var(--r1)}
.acsN .pri:hover{background:var(--bg-3)}
.acsN .sec{font-size:13px;color:var(--ink-3);padding:7px 0}
.acsN .sec:hover{color:var(--ink)}
.acsN .-dan:hover{color:var(--dan)}
/* a fila de relacoes nao precisa de respiro de bloco: ela e uma acao por
   item, e nao uma decisao. */
.rels .grupoE .cit .acs{margin-top:var(--s2)}
.rels .grupoE .cit{padding-bottom:var(--s3);background:none;border-left:1px solid var(--line-2)}
/* dentro de Relacionadas, uma nota e REFERENCIA e nao conteudo: ela encolhe
   para nao competir com o assunto da pagina. */
.rels .grupoE .cit>p.-nota{font-size:.95rem;line-height:1.55;max-width:52ch}
/* o conceito e um rotulo, e rotulo tem forma de rotulo: nem card, nem
   linha de lista. E o unico lugar do produto com canto arredondado — nao
   tem: raio zero aqui tambem, porque a excecao custaria a regra. */
/* BLOCO: 60px separando blocos, 30px separando o que esta DENTRO de um.
   Antes tudo tinha 60, e por isso nada agrupava. */
.bloco{margin-top:var(--s7)}
/* dentro do bloco o respiro e 20, e nao 30: Tags e Conceitos sao a mesma
   pergunta feita duas vezes, e nao dois assuntos. */
.bloco .conc{margin-top:var(--s4)}
.bloco .conc:first-of-type{margin-top:var(--s3)}
.bloco .conc .acs{margin-top:var(--s2)}
.cchips{margin-top:var(--s2)}
.sublbl{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:var(--s2)}
.cabB{display:flex;align-items:baseline;gap:var(--s5);flex-wrap:wrap}
.cabB .soltoE{margin:0}
.cabB .sec{font-size:13px;color:var(--ink-3);padding:2px 0}
.cabB .sec:hover{color:var(--ink)}
/* O CONJUNTO: faixa fina logo abaixo da migalha. Ela responde "por que estou
   aqui" — a migalha responde "onde" — e por isso sao dois elementos, e nao
   um so tentando dizer as duas coisas. */
/* Uma barra de largura inteira com chao e filete grosso, colada embaixo da
   migalha, lia como um segundo nivel do mesmo endereco — duas barras
   empilhadas sao dois enderecos. A tira responde outra pergunta (por que lista
   voce esta andando) e por isso e uma LINHA do mesmo cabecalho: sem chao, sem
   filete, e subindo para junto da migalha. */
.conj{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:0;background:none;margin:calc(var(--s5)*-1 + var(--s2)) 0 var(--s6)}
.conj.-simples{gap:var(--s2)}
.conj.-simples .ant,.conj.-simples .prox,.conj.-simples .-off{padding:2px 5px}
.conj .em{font-size:12.5px;color:var(--ink-2)}
.conj .em b{color:var(--ink);font-weight:600}
.conj .pos{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3)}
.conj .sp{flex:1}
.conj .ant,.conj .prox{font-family:var(--mono);font-size:14px;line-height:1;
  padding:2px 7px}
.conj .-off{font-family:var(--mono);font-size:14px;line-height:1;padding:2px 7px;color:var(--ink-4)}
.conj .sai{font-size:12.5px}
.conj button{font-size:12.5px;color:var(--ink-3);padding:2px 6px;border-radius:0}
.conj button:hover{color:var(--ink);background:var(--bg-3)}
.conj .-off{font-size:12.5px;color:var(--ink-4);padding:2px 6px}
.acsN .di{width:1px;height:16px;background:var(--line);align-self:center}
.conc{margin-top:var(--s7)}
/* a tag e mais leve que o conceito: ela e uma palavra, e nao um lugar. */
.cchip.-tag{padding-left:6px}
.cchip.-tag .ir{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding:0 2px}
.cchip.-tag .ir:hover{color:var(--acc)}
.cchip.-add{border-style:dashed;color:var(--ink-3);font-size:13px;padding:4px 10px}
.cchip.-add:hover{color:var(--ink);border-color:var(--ink)}
.cchip.-campo{padding:2px 4px 2px 8px;gap:4px}
.campoT{font-family:var(--mono);font-size:12px;color:var(--ink);background:transparent;border:0;
  width:110px;padding:2px 0}
.campoT:focus{outline:none}
.cchip.-campo button{font-size:11px;color:var(--ink-3);padding:2px 4px}
.tagSug{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.tagSug span{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3)}
.tagSug button{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:2px 6px;
  border:1px solid var(--line-2);border-radius:var(--r1)}
.tagSug button:hover{color:var(--ink);border-color:var(--ink)}
.tgL{display:block;margin-top:5px}
.tgL button{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ink-3);
  padding:1px 4px 1px 0;border-radius:0}
.tgL button:hover{color:var(--acc)}
.colP{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.colP button{font-size:13px;color:var(--ink-2);padding:5px 10px;border:1px solid var(--line-2);
  border-radius:var(--r1)}
.colP button:hover{border-color:var(--ink);color:var(--ink)}
.colP button[aria-pressed="true"]{color:var(--ink);border-color:var(--line-3);font-weight:600}
.colP .vaz{font-size:13px;color:var(--ink-3)}
.colF .lb2{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3)}
.colF .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:4px}
.colF button[aria-pressed="true"] .n{color:var(--bg-3)}
.colF{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4)}
.colF button{font-size:13px;color:var(--ink-3);padding:4px 10px;border:1px solid var(--line-2);
  border-radius:var(--r1)}
.colF button:hover{color:var(--ink);border-color:var(--ink)}
.colF button[aria-pressed="true"]{color:var(--branco);background:var(--ink);border-color:var(--ink)}
.colF .nv{border-style:dashed}
.colF .campoB{width:200px;padding:5px 9px;font-size:13px}
.cchips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-3);
  padding:4px 6px 4px 10px;font-size:13px;color:var(--ink);border-radius:var(--r1)}
.cchip button{font-size:11px;color:var(--ink-3);padding:0 2px;line-height:1}
.cchip button:hover{color:var(--dan)}
.conc .acs{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s4)}
.conc .acs .sec{font-size:13px;color:var(--ink-3);padding:4px 0}
.conc .acs .sec:hover{color:var(--ink)}
.conc .nomeia{margin-top:var(--s4)}
.conc .nomeia label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:var(--s2)}
.conc .nomeia .pri{border:1px solid var(--line-3);padding:6px 14px;font-size:13px;
  color:var(--ink);font-weight:600;border-radius:var(--r1)}
.conc .nomeia .acs{margin-top:var(--s3)}
.acsLig{display:flex;margin-bottom:var(--s5)}
.acsLig .sec{font-size:13px;color:var(--ink-3);padding:4px 0}
.acsLig .sec:hover{color:var(--ink)}
.ligP{border:1px solid var(--line);background:var(--bg-2);padding:var(--s4);margin-bottom:var(--s5)}
.ligP label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:var(--s2)}
.ligL{margin-top:var(--s3);max-height:250px;overflow-y:auto}
.ligI{display:block;width:100%;text-align:left;padding:var(--s3) var(--s3);border-radius:0;
  background:var(--branco);border:1px solid var(--line-2);margin-bottom:2px}
.ligI:hover{border-color:var(--ink)}
.ligI .tx{display:block;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink)}
.ligI .lv{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  color:var(--ink-3);margin-top:4px}
.ligP .acs{margin-top:var(--s3)}
.ligP .acs .sec{font-size:13px;color:var(--ink-3);padding:2px 0}
/* ═══ MOVIMENTO ═══
   Quatro, e cada uma diz uma coisa que o estado parado nao diz: que o item
   MUDOU de categoria, QUAIS dois foram ligados, que a trilha e uma ordem, e
   ONDE o trecho foi reencontrado depois de o texto mudar. Nada aqui existe
   para suavizar: se a animacao pode ser removida sem perder informacao, ela
   nao deveria estar aqui. */
@keyframes subiu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes traca{to{stroke-dashoffset:0}}
@keyframes chega{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes reachou{0%,100%{background:var(--bg-3)}35%{background:var(--warn-soft)}}
.cit.-subiu{animation:subiu var(--d3) var(--curva) both}
.cvLinhas line.-traca{animation:traca .5s var(--curva) forwards}
.trl.-entra>*{animation:chega var(--d2) var(--curva) both;animation-delay:calc(var(--i,0) * 110ms)}
.dst.-reachou{animation:reachou 1.6s var(--curva) 1}
@media(prefers-reduced-motion:reduce){
  .cit.-subiu,.trl.-entra>*,.dst.-reachou{animation:none}
  .cvLinhas line.-traca{animation:none;stroke-dashoffset:0!important}
}
.rels{margin-top:var(--s7)}
.relG{margin-top:var(--s5)}
.relG:first-of-type{margin-top:var(--s3)}
.relX{font-size:12px;color:var(--ink-3);line-height:1.6;margin:0 0 var(--s4);max-width:56ch}
/* dentro de Relacionadas o item e REFERENCIA: filete, e nao chao. O chao
   agora e da nota que a pagina trata. */
/* dois filetes empilhados marcavam a MESMA coisa: em Relacionadas o grupo
   e a nota. Fica o de fora, que alinha com a margem da pagina. */
.relG .grupoE .cit{background:none;border-left:0;padding-left:0}
/* ═══ CONEXÕES ═══ */
.dirNav{display:flex;gap:var(--s5);margin-top:var(--s5);padding-bottom:var(--s3);
  border-bottom:1px solid var(--line-2)}
.dirNav a{font-family:var(--mono);font-size:var(--t-mono);letter-spacing:.09em;
  color:var(--ink-3);text-decoration:none}
.dirNav a:hover{color:var(--ink)}
.dirC{padding:var(--s8) 0}
.dirC+.dirC{border-top:1px solid var(--line-2)}
.dirT{font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);font-weight:600;margin:0 0 var(--s4);padding-bottom:var(--s3);
  border-bottom:1px solid var(--line-3)}
.dirP{font-size:13px;color:var(--ink-2);line-height:1.65;margin:0;max-width:58ch}
.dirP b{color:var(--ink);font-weight:600}
.dirP.-nao{color:var(--ink-3);margin-top:2px}
.dirNota{font-size:13px;color:var(--ink-2);line-height:1.7;max-width:60ch;margin:var(--s5) 0 0;
  padding-top:var(--s4);border-top:1px solid var(--line-2)}
.dirNota b{color:var(--ink);font-weight:600}
/* o mapa: filete, tinta e quadrado — o mesmo vocabulário do resto da casa.
   Sem brilho, sem gradiente, sem neon: uma rede não fica mais verdadeira
   por parecer um cérebro. */
/* a legenda tem a largura do mapa: solta na pagina, os tres rotulos se
   espalhavam por 930px e paravam de parecer uma legenda. */
.mapaW{margin:var(--s5) 0 0;max-width:480px}
/* A REDE. O no e uma caixa com o texto dentro, e nao um ponto: e isso que
   torna a coisa reconhecivel parada, sem hover. Livro tem canto reto e uma
   guia colorida; assunto tem forma de pilula porque e rotulo; ideia e uma
   folha branca com duas linhas do que voce escreveu. */
.redeW{margin:var(--s5) 0 0}
.rede{display:block;width:100%;height:auto;max-width:900px;border:1px solid var(--line-2);
  background:var(--bg-2)}
.rede .rbox{fill:var(--branco);stroke:var(--line-3);stroke-width:1}
.rede .-livro .rbox{fill:var(--bg-3);stroke:var(--line)}
.rede .-assunto .rbox{fill:var(--ink);stroke:var(--ink)}
.rede .-conceito .rbox{fill:var(--acc);stroke:var(--acc)}
.rede .rt{font-family:var(--serif);font-size:11.5px;fill:var(--ink)}
.rede .rt.-2{fill:var(--ink-2)}
.rede .rt.-livro{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;fill:var(--ink-2)}
.rede .rt.-assunto,.rede .rt.-conceito{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  fill:var(--branco)}
.rede .rl{fill:none;stroke:var(--ink);stroke-opacity:.2}
.rede .rl.-origem{stroke-opacity:.42}
.rede .rl.-tema{stroke-dasharray:2 3;stroke-opacity:.3}
.rede .rl.-sua{stroke:var(--acc);stroke-opacity:.85}
.rede .-nota{cursor:pointer}
.rede .-nota:hover .rbox{stroke:var(--ink);stroke-width:1.5}
.redeL{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s3);
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.redeL span{display:inline-flex;align-items:center;gap:6px}
.redeL span::before{content:"";width:9px;height:9px;border:1px solid var(--line-3);
  background:var(--branco)}
.redeL .-livro::before{background:var(--bg-3)}
.redeL .-assunto::before{background:var(--ink);border-color:var(--ink);border-radius:var(--rp)}
.redeL .-conceito::before{background:var(--acc);border-color:var(--acc);border-radius:var(--rp)}
.redeL .-lorigem::before,.redeL .-ltema::before{width:16px;height:1px;border:0;background:var(--ink);
  opacity:.42}
.redeL .-ltema::before{opacity:.3}
.redeL .di{width:1px;height:12px;background:var(--line);border:0}
.redeL .di::before{display:none}
.mapa{display:block;width:100%;max-width:480px;height:auto}
.mapa .ln{stroke:var(--ink)}
.mapa .ln.-possivel{stroke-opacity:.14}
.mapa .ln.-forte{stroke-opacity:.34}
.mapa .ln.-sua{stroke:var(--acc);stroke-opacity:.85}
.mapa .pt{fill:var(--ink)}
.mapa .rot{font-family:var(--mono);font-size:8.5px;fill:var(--ink-3);letter-spacing:.03em}
/* .leg ja existia noutro componente, com justify-content:space-between —
   foi ela que espalhou esta legenda por 930px, e a largura maxima que eu
   tinha posto so escondia a heranca. Nome proprio, e ela some. */
.mapa .pt.-livro{fill:none;stroke:var(--ink);stroke-width:1}
.mapa .pt.-conceito{fill:var(--acc)}
.mapa .pt.-trecho{fill:var(--ink);fill-opacity:.35}
.mapa .rot.-livro,.mapa .rot.-conceito{fill:var(--ink-2)}
.mapa .ln.-pertence{stroke-opacity:.1}
.mapa .alvo{fill:transparent;cursor:pointer}
.mapa .alvo:hover+.pt{fill:var(--acc)}
.mapaF{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s4);
  max-width:480px}
.mapaF .zl{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3)}
.mapaFoco{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);
  padding:var(--s2) var(--s3);background:var(--bg-2);border-left:2px solid var(--ink);max-width:480px}
.mapaFoco span{font-size:12px;color:var(--ink-2)}
.mapaF button{display:inline-flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink-3);
  padding:3px 0;border-radius:0;border-bottom:1px solid transparent}
.mapaF button:hover{color:var(--ink)}
.mapaF button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.mapaF button b{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-3)}
.mapaN{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);
  margin:var(--s3) 0 0;max-width:480px;line-height:1.7}
.mapaN b{color:var(--ink);font-weight:600;font-family:var(--ui);font-size:11px;letter-spacing:0}
.legM{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s3);max-width:480px}
.legM span{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:6px}
.legM span::before{content:"";width:16px;height:1px;background:var(--ink)}
.legM .-possivel::before{opacity:.14}
.legM .-forte::before{opacity:.34}
.legM .-sua::before{background:var(--acc);opacity:.85}
/* a trilha: um passo por bloco, e a palavra que liga escrita no meio do
   caminho — a razão da ligação é texto, e não a inclinação de uma linha. */
/* o filete do elo acompanha a largura dos passos: solto, ele atravessava a
   coluna inteira e ligava dois blocos estreitos com uma regua larga. */
.trl{margin-top:var(--s4);border-left:2px solid var(--line-3);padding-left:var(--s5);
  max-width:62ch}
/* dentro do conceito, o que sobra da trilha usa a mesma medida dela */
.colE .grupoE{max-width:62ch}
.pas{position:relative}
.pas .lv{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:var(--s2)}
.pas .tr{font-family:var(--serif);font-size:14px;line-height:1.6;color:var(--ink-2);
  margin:0 0 var(--s2);max-width:56ch}
.pas .nt{margin:0;font-size:var(--t-leitura);line-height:var(--lh-leitura);color:var(--ink);
  max-width:52ch}
.pas .nt .abre{display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:0;
  border-radius:0}
.pas .nt .abre::after{content:" →";color:var(--ink-3)}
.pas .nt .abre:hover::after{color:var(--ink)}
/* o elo separa dois passos, entao ele precisa de mais ar do que tinha: com
   12px de cada lado, o fim de um passo e o comeco do seguinte encostavam. */
.elo{display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0}
.elo::before{content:"";width:22px;height:1px;background:var(--line-3)}
.elo span{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-2)}
.elo::after{content:"";flex:1;height:1px;background:var(--line-2)}
/* três palavras que não são sinônimas */
.tresP{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5);margin:var(--s5) 0 0;
  padding:var(--s4) 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}

/* PAGINACAO por coluna: o texto flui em colunas da largura da tela e a
   navegacao e horizontal. Nao ha "pagina" guardada em lugar nenhum — ela e
   consequencia do corpo, da coluna e da altura, e muda quando qualquer um
   dos tres muda. Por isso a ancora continua sendo a citacao. */
.ed.-pag{height:calc(100vh - 168px);overflow-x:auto;overflow-y:hidden;

.ed.-pag .colE{height:100%;box-sizing:border-box;column-width:var(--col);

/* ═══ LEITURA DENTRO DO ARQUIVO ═══
   A superfície onde o sistema do DOC.cc faz mais diferença: medida
   de 575 → 675 → 775, régua que atravessa na fronteira de capítulo
   sem tirar o título da coluna, citação escapando 17% e nota
   subordinada a 93%, legenda na largura da coluna. */
/* CAPS passa a ser o texto do livro ABERTO. Era um array fixo, e por isso
   todo livro do acervo tinha os mesmos quatro capitulos. */
/* getter, nao Proxy: sobre um alvo vazio, map e forEach enxergam buracos e
   devolvem null ou nao iteram — o length vinha certo e o conteudo nao. */
Object.defineProperty(globalThis,"CAPS",{get:()=>ARQ.caps});
/* Progresso medido, nao declarado.
   A unidade e o PARAGRAFO, nao o pixel: mudar corpo, entrelinha ou coluna
   muda a altura do documento e nao pode mudar onde a pessoa esta no texto.
   medeProg() devolve o paragrafo que encosta no topo da leitura, e o quanto
   dele ficou para tras. */
function pars(){return document.querySelectorAll(".colE [data-tr]");}
/* mede o que ficou PARA TRAS: no primeiro paragrafo nada foi lido, e 0% e a
   unica resposta honesta. 100% so quando a rolagem acaba de verdade. */
function medeProg(){
  const c=app.querySelector(".corpo"),ps=pars();
  if(!c||!ps.length)return null;
  if(c.scrollTop+c.clientHeight>=c.scrollHeight-8)return {i:ps.length-1,prog:100};
  const topo=c.getBoundingClientRect().top;
  let i=ps.length-1;
  for(let k=0;k<ps.length;k++)if(ps[k].getBoundingClientRect().bottom>topo+4){i=k;break;}
  return {i:i,prog:Math.round(i/ps.length*100)};
}
function progresso(){
  const m=medeProg();
  return m?m.prog:(S.leit.lidoAte||0);
}
function rotuloProg(prog){
  return S.leit.progresso==="capitulo"
    ?(ARQ.tipo==="video"?"trecho ":"cap. ")+(S.cap+1)+" de "+CAPS.length:prog+"%";
}
/* uma passada de scroll atualiza fio, rotulo e S.cap sem repintar: repintar
   aqui destruiria a selecao e o cursor de quem esta escrevendo uma nota. */
function marcaProgresso(){
  if(S.lugar!=="leitura")return;
  const m=medeProg();if(!m)return;
  const ps=pars();
  S.leit.lidoAte=m.prog;S.leit.par=m.i;
  const cap=Number(ps[m.i].dataset.cap);
  if(!Number.isNaN(cap))S.cap=cap;
  /* a leitura ESCREVE no acervo: e isto que faz "Lendo" e "Lido" existirem
     sem ninguem manter um campo a mao. */
  const nb=noAcervo(ARQ.titulo);
  if(nb)nb.prog=Math.max(nb.prog||0,Math.max(1,m.prog));
  const f=document.getElementById("progF");if(f)f.style.width=m.prog+"%";
  const t=document.getElementById("progT");if(t)t.textContent=rotuloProg(m.prog);
}
function vLeitura(){
  /* o progresso NAO sai de S.cap: o leitor rola os quatro capitulos de uma vez,
     e (cap+1)/total anunciava 75% com a pessoa parada no primeiro paragrafo.
     Numero sem medicao e confianca inventada — aqui ele passa a ser medido no
     scroll, pela ancora semantica (o paragrafo no topo), nunca por pixel. */
  const prog=progresso();
  /* TOPO: onde estou. So isso — recolhido, o titulo, e o resto do produto
     atras do menu. A navegacao global competia com a capa do livro. */
  /* ☰ e ⋯ diziam o que? "O icone so esconde o vocabulario atras de um clique"
     e regra desta casa desde 30c8a44, e o topo da leitura era o unico lugar
     que a quebrava — dois glifos, zero palavras. Agora cada controle se nomeia,
     e cada um pertence a UMA familia: Mekora leva a lugares, as tres do meio
     mudam o que voce faz, "Este arquivo" age sobre o objeto. */
  /* Nao e uma segunda navbar: e o cabecalho editorial do objeto, e as
     ferramentas da leitura moram dentro dele. Tres camadas com funcao unica —
     produto (a barra de cima), livro (esta linha), ferramenta (a de baixo) —
     no lugar de navbar, navbar, menu, dock, popup. Sem card e sem container:
     tipografia, espaco, metadado e um filete. */
  let h='<div class="leituraTopo">'+

/* ═══ DESTAQUE E NOTA ═══
   Endereco semantico: {cap,par,ini,fim} em offsets de caractere sobre
   CAPS[cap].p[par]. Nunca coordenada de tela — DEC-0016. */
/* O endereco tem GRAO, e o grao e onde ele para:
     trecho   cap,par,ini,fim   tem volta ao paragrafo
     capitulo cap, resto null   tem volta ao capitulo
     livro    tudo null         nao tem volta
   Nao ha campo de tipo. As formas sao derivadas de dois bits: ancora e nota. */
/* coordenada so identifica dentro de um livro: cap 0 par 1 existe nos tres.
   O livro entra na chave, e entra no filtro de quem le por coordenada.
   Fica ANTES de escrito(): sementes() roda no topo e chamaria sig() na zona
   morta, e um throw ali deixa sem inicializar tudo que vem depois. */
const sig=t=>(t||"").normalize("NFD").replace(/[^a-zA-Z0-9]/g,"").slice(0,4).toLowerCase();
const noLivro=(d,cap,par)=>d.livro===ARQ.titulo&&d.cap===cap&&d.par===par;
function escrito(cap,par,frag,nota,origem,k,livro){
  const lv=livro||ARQ.titulo;
  const tem=cap!=null&&par!=null&&frag;
  let ini=null,fim=null,cita=null,antes="",depois="";
  if(tem){
    const t=(LIVROS[lv]||ARQ).caps[cap].p[par],i=t.indexOf(frag);
    if(i<0)console.warn("semente sem ancora em",lv,cap,par,frag.slice(0,40));
    ini=i<0?0:i;fim=i<0?t.length:i+frag.length;

    cita=t.slice(ini,fim);

       ate desambiguar quando a citacao aparece mais de uma vez na fonte. */
    const cx=contextoDe((LIVROS[lv]||ARQ).caps,cap,par,ini,fim);
    antes=cx.antes;depois=cx.depois;
  }
  return {k:k||("d"+sig(lv)+cap+par),livro:lv,cita:cita,antes:antes,depois:depois,cap:(cap===undefined?null:cap),
    par:(tem?par:null),ini:ini,fim:fim,perg:null,nota:nota||"",origem:origem||"leitura"};
}
function semente(cap,par,frag,perg,nota,origem,k,livro){

}

const ancora=d=>d.ini!=null;

/* ORDEM: o que e sobre o livro inteiro vem primeiro; depois tudo na ordem do
   livro; dentro de um capitulo, o que e sobre o capitulo vem antes dos trechos
   dele. Sem esta clausula, cap:null devolve NaN e o item se espalha. */
function ordem(a,b){
  const ga=a.cap==null?0:1,gb=b.cap==null?0:1;
  if(ga!==gb)return ga-gb;
  if(ga===0)return 0;
  if(a.cap!==b.cap)return a.cap-b.cap;
  const pa=a.par==null?0:1,pb=b.par==null?0:1;
  if(pa!==pb)return pa-pb;
  if(pa===0)return 0;
  return (a.par-b.par)||(a.ini-b.ini);
}
/* filhos e DERIVADO: apagar uma pergunta nao deixa filho orfao, e tirar um
   trecho nao deixa referencia morta. perg guarda CHAVE, nunca indice — com
   indice, o primeiro apagar reindexaria e moveria os trechos em silencio. */
const filhos=k=>S.dst.filter(d=>d.perg===k).sort(ordem);
/* o texto vem do LIVRO DA NOTA, nao do livro aberto: uma nota de Malha
   Urbana lida a partir da area de Notas precisa devolver o trecho dela. */
const livroDe=d=>LIVROS[d.livro]||ARQ;
/* ═══════════════════════════════════════════════════════════════════
   A ÂNCORA
   Número de página não serve: a paginação é consequência da fonte, do
   corpo, da margem e da tela. Mas deslocamento dentro do parágrafo
   também não serve sozinho — ele morre no primeiro OCR corrigido, na
   primeira tradução, no primeiro parágrafo remontado. Fazemos conversão:
   o texto MUDA embaixo da nota, e isso é o caso normal, não a exceção.

   Então a âncora é a citação, mais um pouco do que vem antes e do que
   vem depois. O deslocamento continua guardado, mas rebaixado a dica de
   por onde começar a procurar.

   E o casamento não é só exato. Uma transcrição automática revisada
   troca palavra DENTRO do trecho — não move a frase, reescreve um
   pedaço dela — e contra isso deslocamento e busca literal falham do
   mesmo jeito. Por isso a última tentativa é aproximada, e ela devolve
   um NÚMERO.

   Quando a nota é reencontrada fora do lugar previsto, a tela DIZ, com o
   número ao lado. Uma âncora que se conserta em silêncio é uma âncora em
   que ninguém pode confiar, porque ninguém sabe quando ela falhou — e um
   conserto sem número é um conserto com que ninguém pode discordar.
   ═══════════════════════════════════════════════════════════════════ */

/* ── QUANTO CONTEXTO GRAVAR ──────────────────────────────────────────
   A política vem do `describe` do apache/incubator-annotator (Apache-2.0,
   arquivado em 2025): gravar mais do que o estritamente necessário, não
   cortar no meio de palavra, e ampliar até desambiguar quando a citação
   aparece mais de uma vez na fonte. É leitura, não dependência — o match
   daquele pacote é exato, e exato é justamente o que falha aqui. */
const CTX = 28;       /* letras de contexto de cada lado, ponto de partida */
const CTX_MAX = 112;  /* teto: contexto que cresce sem parar vira o texto todo */
let versaoTexto = 0;  /* sobe quando o texto de um livro muda */

/* cortar "colecio" no meio faz o prefixo casar PIOR do que se ele não
   existisse: meia palavra não é contexto, é ruído com o peso de contexto. */
function ctxAntes(t, i, n) {
  let j = Math.max(0, i - n);
  while (j > 0 && !/\s/.test(t[j - 1])) j--;
  return t.slice(j, i);
}
function ctxDepois(t, f, n) {
  let j = Math.min(t.length, f + n);
  while (j < t.length && !/\s/.test(t[j])) j++;
  return t.slice(f, j);
}
const ocorre = (t, s) => {
  if (!s) return 0;
  let n = 0, i = t.indexOf(s);
  while (i > -1) { n++; i = t.indexOf(s, i + 1); }
  return n;
};
/* amplia enquanto a citação com o contexto ainda aparecer mais de uma vez
   na fonte inteira: contexto que não desambigua não é contexto. */
function contextoDe(caps, cap, par, ini, fim) {
  const t = caps[cap].p[par], cita = t.slice(ini, fim);
  const todo = caps.map(c => c.p.join("\n")).join("\n");
  let n = CTX, antes = ctxAntes(t, ini, n), depois = ctxDepois(t, fim, n);
  while (n < CTX_MAX && ocorre(todo, antes + cita + depois) > 1) {
    n += CTX; antes = ctxAntes(t, ini, n); depois = ctxDepois(t, fim, n);
  }
  return { antes: antes, depois: depois };
}

/* ── REANCORAGEM APROXIMADA ──────────────────────────────────────────
   Método e pesos de `src/annotator/anchoring/match-quote.ts` do
   hypothesis/client (BSD-2-Clause), conferido por leitura em 31/08 e
   registrado em docs/references/colheita-github-mekora-2026-08-31.md do
   Project OS. Os quatro pesos e a tolerância são os de lá, literais.

   O que NÃO veio de lá é a implementação do casamento. O original depende
   de approx-string-match, que faz Myers por palavra de bit para aguentar
   texto de milhões de caracteres. Uma fonte aqui tem alguns milhares, e a
   mesma resposta — a menor distância de edição terminando em cada posição
   — cabe numa tabela direta de quarenta linhas. Adotar o método, não a
   dependência: é a mesma regra que já valeu para o axe-core. */
const PESO_CITA = 50, PESO_ANTES = 20, PESO_DEPOIS = 20, PESO_POS = 2;

/* ── O LIMIAR DE RECUSA — decisão de produto, não da biblioteca ───────
   O match-quote.ts não recusa nada: `maxErrors = cita/2` aceita metade da
   citação errada, e quem decide que a âncora ficou órfã é quem usa.

   São DOIS números, porque um só não separa os dois casos que importam.

   PISO_CITA = 0,75 — a citação precisa continuar sendo a citação: até um
   erro a cada quatro letras. Abaixo disso ela não reancora por melhor que
   esteja o texto em volta. É este número que fecha o buraco da
   biblioteca: com contexto perfeito e metade da citação errada o score
   composto dá 0,73 e passaria por cima de qualquer limiar razoável.

   LIMIAR = 0,55 — o score composto. O caso que OBRIGA este valor: citação
   intacta com todo o texto em volta reescrito dá (50+0+0+2)/92 = 0,565, e
   ele TEM de passar, porque a âncora é a citação e o contexto é só o
   desempate. 0,55 fica logo abaixo dele.

   Os dois juntos RECUSAM: citação 25% quebrada com o contexto também
   perdido — (37,5+0+0+2)/92 = 0,43. Isso é passagem reescrita, e não
   trecho movido. E ACEITAM: citação 25% quebrada com o contexto inteiro
   de pé — 0,87 — porque aí o lugar é o mesmo e só a frase foi mexida.

   Os dois números aparecem na tela quando recusam. Limiar escondido é
   limiar em que ninguém pode discordar. */

/* menor distância de edição entre `p` e QUALQUER trecho de `t`, com início
   livre. Devolve um candidato por posição final que couber em `maxErr`. */
function aprox(t, p, maxErr) {
  const m = p.length, n = t.length;
  if (!m || !n) return [];
  let d = new Int32Array(m + 1), dS = new Int32Array(m + 1),
      e = new Int32Array(m + 1), eS = new Int32Array(m + 1);
  for (let j = 0; j <= m; j++) { d[j] = j; dS[j] = 0; }
  const cand = [];
  for (let i = 1; i <= n; i++) {
    e[0] = 0; eS[0] = i;
    for (let j = 1; j <= m; j++) {
      let v = d[j - 1] + (t.charCodeAt(i - 1) === p.charCodeAt(j - 1) ? 0 : 1), s = dS[j - 1];
      if (d[j] + 1 < v) { v = d[j] + 1; s = dS[j]; }        /* sobra letra no texto */
      if (e[j - 1] + 1 < v) { v = e[j - 1] + 1; s = eS[j - 1]; } /* falta letra no texto */
      e[j] = v; eS[j] = s;

    if (e[m] <= maxErr) cand.push({ ini: eS[m], fim: i, erros: e[m] });
    const td = d; d = e; e = td;
    const ts = dS; dS = eS; eS = ts;

/* a tabela devolve um candidato por posição final, então o mesmo trecho

   — que é o que o approx-string-match entrega —, no máximo `n`: pontuar
   custa mais que achar. */

  const ord = cand.slice().sort((a, b) => a.erros - b.erros || a.ini - b.ini), fica = [];
  for (const c of ord) {

/* o quanto `alvo` ainda aparece em `t`: 1 é idêntico, 0 é irreconhecível.
   É o textMatchScore do match-quote.ts. */
function quanto(t, alvo) {
  if (!alvo.length || !t.length) return 0;
  const c = aprox(t, alvo, alvo.length);
  if (!c.length) return 0;
  let min = alvo.length;
  for (const x of c) if (x.erros < min) min = x.erros;

   Procurar parágrafo a parágrafo perde o caso em que a revisão PARTE um
   trecho em dois: nenhum dos dois pedaços contém a citação inteira. Na
   fita a quebra é uma letra a mais no meio, e não um limite — um erro,
   e não uma perda. O mapa devolve (capítulo, parágrafo, deslocamento). */

    off.push([]);

      mapa.push({ cap: c, par: p, off: s.length });

function achaPerto(txt, cita, perto) {

  const pC = 1 - c.erros / cita.length;
  const pA = antes ? quanto(F.s.slice(Math.max(0, c.ini - antes.length), c.ini), antes) : 1;
  const pD = depois ? quanto(F.s.slice(c.fim, c.fim + depois.length), depois) : 1;
  const pP = dica == null ? 1 : 1 - Math.abs(c.ini - dica) / F.s.length;
  return {
    score: (PESO_CITA * pC + PESO_ANTES * pA + PESO_DEPOIS * pD + PESO_POS * pP) / PESO_TOT,
    pC: pC, pA: pA, pD: pD

  if (mel.pC >= PISO_CITA && mel.score >= LIMIAR) return r2;

    if(r.ini>pos)segs.push({de:pos,ate:r.ini,d:null});
    segs.push({de:r.ini,ate:r.fim,d:x.d});pos=r.fim;});
  if(pos<txt.length)segs.push({de:pos,ate:txt.length,d:null});
  return segs;
}
function paragrafo(cap,par,txt){
  /* fatia pela ancora RESOLVIDA: se o texto mudou, o deslocamento guardado
     marcaria o pedaco errado — e uma marca no lugar errado e pior do que
     marca nenhuma, porque parece certa. */
  const segs=segmentos(cap,par,txt).filter(x=>x.d);
  if(!segs.length)return esc(txt);
  let h="",pos=0;
  segs.forEach(sg=>{
    const d=sg.d,r={ini:sg.de,fim:sg.ate};
    h+=esc(txt.slice(pos,r.ini));
    const tr=txt.slice(r.ini,r.fim);
    h+='<mark class="dst'+(r.como&&r.como!=="exata"?" -reachou":"")+
      '" id="mk-'+d.k+'" data-a="dst-abrir" data-v="'+d.k+'" tabindex="0" '+
      'role="button" aria-label="'+(d.nota?"Destaque com nota: ":"Destaque: ")+
      esc(tr.slice(0,50))+'">'+esc(tr)+'</mark>';
    pos=r.fim;
  });
  return h+esc(txt.slice(pos));
}

/* A DOCK DE LEITURA

/* A DOCK VIROU BARRA DE SELECAO, que e o que ela ja parecia ser.

   sobre conteudo. Lidas juntas, viravam "quatro ferramentas quaisquer" — e o
   formato (caixa pequena, flutuando, junto ao texto) e o de popover de
   selecao. As tres primeiras subiram para o topo, onde ferramenta mora; a
   quarta e acao sobre trecho e vive na selecao. Sem selecao, nada flutua.
   A compensacao de rolagem que derrubou a barra antiga nao volta: aquela era
   position:fixed e precisava seguir a janela. Esta e absolute dentro de
   .corpo — anda junto com o texto porque E parte dele. */

/* ═══ ESPAÇO DO LIVRO ═══ */
function vLivro(){
  /* Duas linhas mudas guardam a ficha inteira. Clausula sem dado nao aparece:
     um campo vazio nao e informacao, e "ainda nao enviado" ja esta dito pelo
     botao que continua ali. */
  const cl=[];
  if(S.cap>0)cl.push((ARQ.tipo==="video"?"Trecho":"Capítulo")+" "+(S.cap+1)+" de "+CAPS.length);
  /* o saldo do que ficou nao entra aqui: ele e da secao "O que ficou", que
     conta pela regra certa (ancora e nota sao coisas diferentes) e esta na
     mesma tela. Repetir aqui era repetir com OUTRA conta — o cabecalho somava
     nota livre como marcado e dizia 8 onde a secao dizia 2. */
  if(S.enviado)cl.push("Enviado hoje, 09:12");
  /* A ficha diz o que a FONTE e. Escrita para livro, ela dizia "EPUB" e
     "undefined de undefined paginas" sobre uma aula gravada — video nao tem
     pagina nem reconhecimento de texto; tem duracao e transcricao. */
  const fonte=(ARQ.tipo==="video"
    ?["<b>V\u00eddeo</b>","<b>"+mmss(ARQ.dur)+"</b> de dura\u00e7\u00e3o",
      "transcri\u00e7\u00e3o "+esc(ARQ.transcrita||"autom\u00e1tica")]
    :["<b>EPUB</b>","reconhecido em "+ARQ.lidas+" de "+ARQ.pgs+" p\u00e1ginas"])
    .concat(S.traduzir?["traduzido para "+esc(S.traduzir)+" \u2014 o original em portugu\u00eas continua na estante"]:[])
    .concat(["de <b>"+esc(ARQ.nome)+"</b>"]);
  return '<div class="pad">'+
    '<button class="volta" data-a="ir" data-v="estante">\u2039 Estante</button>'+
    '<div class="livro"><img class="capao" src="'+capa(S.capaEsc==="gerada"?ARQ.gerada:ARQ.capa)+
      '" alt="Capa de '+esc(ARQ.titulo)+'">'+

/* o compositor sem ancora: mesmo campo, mesmo Pronto, outra superficie */
function notaLivre(d){

  /* era "cab" — classe generica que cinco outros componentes usam como

    '">'+esc(rasc)+'</textarea>'+

       promessa "seu texto continua aqui" precisa aparecer nos DOIS lugares,
       senao a falha e muda justo onde a pessoa acabou de escrever. */
    (!aqui&&S.erroNota?'<p class="erro">Não deu para guardar agora. <b>Seu texto continua aqui</b> — nada foi perdido. '+
      '<button class="lnk" data-a="dst-guardar" data-v="'+d.k+'" style="padding:0">Tentar de novo</button></p>':"")+

function secMarcado(){
  const meus=S.dst.filter(d=>d.livro===ARQ.titulo).sort(ordem);
  /* a rede de desfazer vem ANTES de qualquer retorno */
  const desfaz=S.dstUndo?'<div class="desfezL"><span>'+

  /* um pai entra se ele OU um filho casa: senao a busca esconderia o dossie */
  const pais=meus.filter(d=>!ancora(d)&&(!q||passa(d)||filhos(d.k).some(passa)));
  const soltos=meus.filter(d=>ancora(d)&&!d.perg&&passa(d));

    return h+'<p style="font-size:13px;color:var(--ink-2);line-height:1.6;max-width:58ch;margin:0">'+
      '<b>Nada aqui ainda.</b> O que voc\u00ea destacar lendo aparece preso ao trecho. '+
      'O que voc\u00ea escrever sobre o livro aparece sem trecho nenhum.</p>'+
      '<div style="margin-top:var(--s4)"><button class="lnk mudo" data-a="esc-novo" '+
      'style="padding:0">Escrever sobre o livro</button></div></div>';
  /* "1 com nota" e subconjunto de "2 marcados": lado a lado eles pareciam
     categorias irmas. A parte entra DENTRO da frase do todo. */
  const cl=[];
  if(pais.length)cl.push(pais.length+' anota\u00e7'+(pais.length>1?"\u00f5es":"\u00e3o"));
  if(marcados)cl.push(marcados+' trecho'+(marcados>1?"s":"")+' marcado'+(marcados>1?"s":"")+
    (comNota?', '+comNota+' com nota':''));
  h+=(cl.length?'<p class="saldo">'+cl.join(" \u00b7 ")+'</p>':'')+
    '<div class="dossie'+(S.lista==="pend"?" -pend":"")+'" style="border:none;padding:0;margin:0">';
  if(meus.length>8)
    h+='<input class="campoB" id="buscaMarcado" placeholder="Buscar no que voc\u00ea escreveu" '+
      'value="'+esc(S.qMarcado||"")+'" style="margin-bottom:var(--s4)">';
  if(q&&!pais.length&&!soltos.length)
    h+='<p style="font-size:13px;color:var(--ink-3);margin:0">Nada com \u201c'+esc(q)+'\u201d.</p>';
  /* o pai e um ITEM da lista, nao um cabecalho de secao: uma pergunta sem
     trecho nao some, ela so nao tem nada embaixo. Nao ha segunda lista. */
  /* um filete por GRUPO — um assunto, uma linha — em vez de um por coisa
     escrita, que era a cerca. E "Solto no livro" vira separador: era titulo
     de item, e o slot do titulo pertence ao que voce escreveu, nao a uma
     categoria. */
  pais.forEach(d=>{
    h+='<div class="grupoE">'+cabecaE(d)+
      filhos(d.k).filter(passa).map(citaE).join("")+'</div>';
  });
  if(S.escNovo)h+='<div class="grupoE">'+notaLivre({k:S.escNovo,cap:null,nota:""})+'</div>';
  if(soltos.length)
    h+=(pais.length?'<div class="soltoE">Solto no livro</div>':'')+
      '<div class="grupoE">'+soltos.map(citaE).join("")+'</div>';
  if(!S.escNovo)
    h+='<div class="faltam"><button class="lnk mudo" data-a="esc-novo" style="padding:0">'+
      'Escrever sobre o livro</button></div>';
  return h+'</div></div>';
}

/* Os quatro recortes saem do proprio acervo e a contagem e feita na hora:
   um filtro que anuncia um numero que ninguem consegue produzir e o mesmo
   erro de confianca inventada, so que em miniatura. "Ainda nao enviados"
   ficou de fora porque nao existe campo — e nao se inventa um. */
/* os recortes de formato saem do proprio acervo, e nao de uma lista escrita a
   mao: com PDF e EPUB fixos, 3 dos 14 itens (2 TXT, 1 XLSX) nao cabiam em
   recorte nenhum e "Tudo 14" deixava de fechar a conta na frente de quem soma.
   Formato agora particiona; "Com nota" e o unico recorte de estado. */
/* A terceira linha do cartao carregava quatro tipos de fato ao mesmo tempo:
   contagem de nota, estado de leitura, procedencia e desambiguacao. */
/* derivado da leitura, e nao um campo que alguem mantem: campo de status a
   mao e a primeira coisa que fica desatualizada, e dai o filtro volta a
   mentir — so que com a culpa do usuario. */
const estadoDe=b=>b.prog>=100?"lido":(b.prog>0?"lendo":"novo");
const ESTADO={novo:"não comecei",lendo:"lendo",lido:"lido"};
/* o livro do acervo que corresponde ao que esta aberto */
const noAcervo=t=>ACERVO.find(b=>b.t===t)||null;
const FILTROS=(function(){
  /* Perguntas que alguem faz na frente de uma estante — e nenhuma delas e
     "quais vieram de PDF". Quadrinho so entra se existir algum: filtro que
     sempre devolve zero e ruido permanente. */
  const base=[["tudo","Tudo",()=>true],
    ["lendo","Lendo",b=>estadoDe(b)==="lendo"],
    ["novo","N\u00e3o comecei",b=>estadoDe(b)==="novo"],
    ["nota","Com nota",b=>b.nn>0],
    ["kindle","No Kindle",b=>!!b.kin]];
  if(ACERVO.some(b=>b.tipo==="quadrinho"))
    base.push(["quadrinho","Quadrinhos",b=>b.tipo==="quadrinho"]);
  return base;
})();
/* ═══ A FILA ═══
   Uma coluna se arranja e duas sao consequencia. "A ler" e o acervo que voce
   ainda nao abriu, na ordem que voce quis; abrir um livro tira dali sozinho.
   Nao ha gesto para arrastar entre colunas de proposito: se arrastar bastasse
   para dizer "estou lendo", o quadro voltaria a ser um campo de status a mao,

function vFila(acervo){
  const naFila=b=>{const i=S.ordemFila.indexOf(b.c);return i<0?900+ACERVO.indexOf(b):i;};
  const aler=acervo.filter(b=>estadoDe(b)==="novo").sort((a,b)=>naFila(a)-naFila(b));
  /* quem esta mais perto do fim primeiro: e o que se termina com menos esforco */

  const serve=b=>{

  const cartaoFila=(b,i)=>'<div class="fCard" data-t="'+b.c+'">'+

    (i>0?'<div class="fAcs"><button data-a="fila-topo" data-v="'+b.c+'">p\u00f4r no topo</button></div>':'')+
    '</div></div>';
  const cartaoAgora=b=>'<div class="fCard" data-t="'+b.c+'">'+imgDe(b)+'<div>'+nome(b)+

    '<div class="fAcs"><button data-a="ir-livro" data-v="'+esc(b.t)+'">continuar</button>'+

  const cartaoLido=b=>'<div class="fCard" data-t="'+b.c+'"><span class="pos">\u2713</span>'+

    (b.nn?'<span class="fPct">'+b.nn+' nota'+(b.nn>1?'s':'')+'</span>':'')+

  const corte=4, mostra=lidos.slice(0,corte);
  return '<p class="fRegra">Voc\u00ea arranja <b>a ler</b> \u2014 essa \u00e9 a decis\u00e3o, e cada livro diz '+

    'livro o tira da fila, e chegar ao fim o termina. N\u00e3o se arrasta entre colunas porque '+
    'arrastar n\u00e3o \u00e9 ler.</p>'+

    '<div class="fCol -fila"><div class="fCab"><h2>A ler</h2><span class="n">'+aler.length+'</span>'+
      (aler.length>1?'<span class="lb">arraste para ordenar</span>':'')+'</div>'+
      (aler.length?'<div class="fPil" id="filaPilha">'+aler.map(cartaoFila).join("")+'</div>'
        :'<p class="fVazio">Nada esperando. Tudo que voc\u00ea tem j\u00e1 foi aberto.</p>')+'</div>'+
    '<div class="fCol -agora"><div class="fCab"><h2>Lendo</h2><span class="n">'+agora.length+'</span></div>'+
      (agora.length?'<div class="fPil">'+agora.map(cartaoAgora).join("")+'</div>'

/* Arrastar nao mexe no DOM: mexer matava a captura de ponteiro no primeiro
   pixel — medido, lostpointercapture chegava junto com o primeiro pointermove,
   e dali em diante nada mais alcancava o cartao. Agora o cartao segue o
   ponteiro por transform, os vizinhos abrem espaco por transform, e a ordem so
   e escrita ao soltar. A captura mora no container, que nao se move. */
function filaArrastavel(){
  const pilha=document.getElementById("filaPilha");
  if(!pilha)return;
  pilha.addEventListener("pointerdown",ev=>{
    const c=ev.target.closest(".fCard");
    if(!c||ev.button||ev.target.closest("[data-a]"))return;
    const cartoes=[...pilha.querySelectorAll(".fCard")];
    const de=cartoes.indexOf(c);
    if(de<0)return;
    ev.preventDefault();
    /* medidos UMA vez: como nada no DOM se move durante o arrasto, estes
       retangulos continuam validos ate soltar. */
    const rs=cartoes.map(x=>x.getBoundingClientRect());
    const centros=rs.map(r=>r.top+r.height/2);
    /* o primeiro cartao nao tem a linha de acoes, entao as alturas diferem:
       o indice sai dos centros medidos, e nao de uma altura media. */
    const salto=rs[de].height+(rs.length>1?Math.max(0,rs[1].top-rs[0].bottom):0);
    const y0=ev.clientY;
    let alvo=de,arrastando=false;
    pilha.setPointerCapture(ev.pointerId);
    const desloca=()=>cartoes.forEach((x,i)=>{
      if(x===c)return;
      const d=(de<alvo&&i>de&&i<=alvo)?-salto:(de>alvo&&i>=alvo&&i<de)?salto:0;
      x.style.transform=d?"translateY("+d+"px)":"";
    });
    const move=e=>{
      const dy=e.clientY-y0;
      /* limiar: sem ele, todo clique no corpo do cartao vira um arrasto de
         zero pixel que reescreve a ordem e repinta a tela. */
      if(!arrastando){if(Math.abs(dy)<4)return;arrastando=true;c.classList.add("-arrastando");}
      c.style.transform="translateY("+dy+"px)";
      const y=centros[de]+dy;
      let novo=de;
      if(dy<0)while(novo>0&&y<centros[novo-1])novo--;
      else while(novo<centros.length-1&&y>centros[novo+1])novo++;
      if(novo!==alvo){alvo=novo;desloca();}
    };
    const solta=()=>{
      pilha.removeEventListener("pointermove",move);
      pilha.removeEventListener("pointerup",solta);
      pilha.removeEventListener("pointercancel",solta);
      cartoes.forEach(x=>{x.style.transform="";});
      c.classList.remove("-arrastando");
      if(!arrastando)return;
      const ordem=cartoes.map(x=>x.dataset.t);
      ordem.splice(de,1);ordem.splice(alvo,0,c.dataset.t);
      S.ordemFila=ordem;
      pinta();
    };
    pilha.addEventListener("pointermove",move);
    pilha.addEventListener("pointerup",solta);
    pilha.addEventListener("pointercancel",solta);
  });
}
function vEstante(){
  /* Na Fila, "Lendo" e "Nao comecei" sao as COLUNAS. Um recorte que repete o
     eixo da vista nao recorta nada — some. */
  const eixo=S.estante==="fila";
  const FS=eixo?FILTROS.filter(x=>["tudo","nota","kindle","quadrinho"].indexOf(x[0])>-1):FILTROS;
  const f=FS.find(x=>x[0]===(S.fEstante||"tudo"))||FS[0];
  const col=S.fEstudo?estudoK(S.fEstudo):null;
  /* a colecao recorta ANTES do filtro: ela e o conjunto, e o filtro e uma
     pergunta sobre o conjunto. */
  /* o estudo recorta ANTES do filtro: ele e o conjunto, e o filtro e uma

   A regra inteira cabe numa frase — e é por isso que o Mekora consegue

const PARAR=new Set(("que para uma com dos das por nao mas seu sua ele ela isso "+

const prefixos=t=>[...new Set(semAcento(t||"")
  .split(/[^a-z]+/).filter(w=>w.length>5&&!PARAR.has(w)).map(w=>w.slice(0,5)))];

   paragrafo — e isso nao e uma relacao entre elas, e a mesma passagem citada
   duas vezes. Media com cinco palavras em comum, e nenhuma era de quem leu.

   trecho do outro. Trecho contra trecho, nunca — esse texto e do autor. */
function comuns(a,b){

     nome de uma ideia que o material inteiro chama de "repeticao". */
  const c={};
  ds.forEach(d=>((d.nota||"")+" "+escTxt(d)).split(/[^A-Za-zÀ-ÿ]+/)
    .filter(w=>w.length>5&&semAcento(w).slice(0,5)===pref)
    .forEach(w=>{w=w.toLowerCase();c[w]=(c[w]||0)+1;}));

const levadas=()=>S.dst.filter(d=>d.nota&&d.levada);

/* ═══ IDEIAS EMERGENTES ═══
   Uma ideia não é uma palavra: é um grupo de notas que se tocam. E só conta

   apenas o assunto daquele livro de volta. */
function ideias(){
  const uteis=levadas().filter(d=>d.livro);
