<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mekora · Mesa e preparação</title>
<style>
/* ════════════════════════════════════════════════════════════
   Mesmos tokens do prototipo.html — os dois são o mesmo produto,
   e essa é justamente a correção: a preparação passa a morar na
   moldura que a área pessoal já tinha.
   Bordas translúcidas e sombra zero vêm do sistema candidato
   (Caderno 03, seção 11).
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#ffffff;--bg-2:#f7f7f5;--bg-3:#f0efec;--nav:#f4f3f0;
  --ink:#1a1917;--ink-2:#57534d;--ink-3:#706c65;--ink-4:#b5b0a8;
  --line:rgba(26,25,23,.17);--line-2:rgba(26,25,23,.09);--line-3:rgba(26,25,23,.32);
  --acc:#c8481f;--acc-soft:#fdf0ea;
  --ok:#2f7d55;--ok-soft:#eef6f1;--warn:#a8701c;--warn-soft:#fdf4e6;--dan:#b23b2a;--dan-soft:#fdefec;
  --paper:#f1eee7;
  /* ── espaço: base 20px como no DOC, com meio-passo de 10 ──
     O DOC opera em múltiplos de 20 e usa 40 e 80 como respiro grande.
     Mantive isso e só troquei a base de 5px por 4px, que já era do Mekora. */
  --s1:4px;--s2:8px;--s3:12px;--s4:20px;--s5:30px;--s6:40px;--s7:60px;--s8:80px;
  /* ── RAIO: a forma diz o que a coisa é, não em que tela ela está ──
     --r1  ação e objeto pequeno: botão, controle, campo, miniatura
     --r2  superfície: card, lista, folha, dock, imagem grande
     --rp  dado: tag, chip de metadado, trilho, interruptor — pílula lê como
           rótulo, e é isso que separa "isto informa" de "isto faz"
     50%   círculo: avatar e ponto de estado. Não é raio, é forma. */
  --r1:4px;--r2:8px;--rp:999px;--h1:2.2rem;--h2:2.6rem;
  --curva:cubic-bezier(.16,1,.3,1);--d1:.12s;--d2:.24s;--d3:.42s;
  --ui:-apple-system,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* ── medida editorial ── as três larguras do DOC: 575 → 675 → 775 ── */
  --col:35.9375rem;
  /* ── escala tipográfica: quanto maior o texto, menor a entrelinha ── */
  --t-display:clamp(2.6rem,1.6rem + 3.4vw,5.2rem);
  --t-h1:2.15rem;--t-h2:1.5rem;--t-h3:1.14rem;
  --t-leitura:1.16rem;--t-ui:.94rem;--t-peq:.83rem;--t-mono:.68rem;
  --lh-display:.94;--lh-h1:1.06;--lh-h2:1.2;--lh-h3:1.34;--lh-leitura:1.62;--lh-ui:1.5;
  --tr-display:-.03em;--tr-h1:-.025em;--tr-h2:-.015em;
}
@media (min-width:1200px){:root{--col:42.1875rem}}
@media (min-width:1600px){:root{--col:48.4375rem}}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --bg:#161513;--bg-2:#1e1c1a;--bg-3:#252320;--nav:#1b1917;
    --ink:#f1eee8;--ink-2:#b9b2a6;--ink-3:#948d81;--ink-4:#6b655c;
    --line:hsla(40,20%,96%,.18);--line-2:hsla(40,20%,96%,.10);--line-3:hsla(40,20%,96%,.32);
    --acc:#e4613d;--acc-soft:#2a1d17;
    --ok:#8fb283;--ok-soft:#1c241d;--warn:#d3a448;--warn-soft:#282017;--dan:#e0705c;--dan-soft:#2a1a17;
  }
}
:root[data-tema="escuro"]{
  --bg:#161513;--bg-2:#1e1c1a;--bg-3:#252320;--nav:#1b1917;
  --ink:#f1eee8;--ink-2:#b9b2a6;--ink-3:#948d81;--ink-4:#6b655c;
  --line:hsla(40,20%,96%,.18);--line-2:hsla(40,20%,96%,.10);--line-3:hsla(40,20%,96%,.32);
  --acc:#e4613d;--acc-soft:#2a1d17;
  --ok:#8fb283;--ok-soft:#1c241d;--warn:#d3a448;--warn-soft:#282017;--dan:#e0705c;--dan-soft:#2a1a17;
}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001s!important;animation:none!important}}
/* ══ A ESCALA FLUIDA DO DOC, SEM O PREÇO DELE ══
   O DOC.cc fixa o root em px por breakpoint (14 → 20px) e escala tudo junto.
   O efeito é ótimo e o preço é anular a preferência de tamanho de fonte do
   navegador — inaceitável num produto para quem lê muito, que é justamente
   quem aumenta a fonte. Aqui o clamp está em rem: 87,5% a 125% do tamanho
   que a PESSOA escolheu. A identidade é a mesma; a preferência sobrevive. */
html{font-size:clamp(.875rem,.82rem + .28vw,1.25rem)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:var(--t-ui);
  line-height:var(--lh-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
/* link nunca sublinha: borda inferior translúcida que escurece no hover */
a,.linkE{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);
  transition:border-color var(--d1) var(--curva)}
a:hover,.linkE:hover{border-bottom-color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ═══ MOLDURA ═══ a mesma do prototipo.html */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topo{display:flex;align-items:center;gap:var(--s2);height:56px;flex:0 0 56px;padding:0 var(--s5);
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;overflow:hidden}
.tcam{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform var(--d3) var(--curva)}
.topo.-dentro .tcam{transform:translateY(-56px)}
.tlin{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5)}
.marca{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;margin-right:var(--s5);
  padding:3px 6px;border-radius:var(--r1)}
.marca:hover{background:var(--bg-2)}
.topo nav{display:flex;gap:2px}
.topo nav button{padding:7px 13px;border-radius:var(--r1);color:var(--ink-2);font-size:13.5px}
.topo nav button:hover{background:var(--bg-2);color:var(--ink)}
.topo nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.busca{display:flex;align-items:center;gap:var(--s2);height:var(--h1);padding:0 var(--s3);
  border:1px solid var(--line);border-radius:var(--r1);color:var(--ink-3);font-size:13px;background:var(--bg-2)}
.busca:hover{border-color:var(--line-3);color:var(--ink-2)}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:var(--r1);padding:1px 5px}
.icb{width:32px;height:32px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);font-size:14px;border:1px solid transparent}
.icb:hover{background:var(--bg-2);border-color:var(--line)}
.uctl{display:flex;align-items:center;gap:7px;padding:4px 8px 4px 4px;border-radius:var(--r1);
  border:1px solid var(--line);background:var(--bg-2)}
.uctl:hover{border-color:var(--line-3)}
.ava{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center}
.uctl .ch{font-size:9px;color:var(--ink-3)}
/* faixa contextual: o nome do arquivo assume a barra quando se entra nele */
.tlin .fnome{font-size:14px;font-weight:600;letter-spacing:-.01em}
.tlin .fest{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.pt{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.pt-ok{background:var(--ok)}.pt-at{background:var(--warn)}.pt-er{background:var(--dan)}
.pt-go{background:var(--ink);animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}

.corpo{flex:1;min-height:0;overflow-y:auto;position:relative}
.pad{padding:var(--s6) var(--s7) var(--s7);max-width:860px;margin:0 auto}
.pad.larga{max-width:1120px}
h1.t{font-size:25px;font-weight:650;letter-spacing:-.025em;margin:0 0 var(--s1)}
p.sub{font-size:14px;color:var(--ink-2);margin:0 0 var(--s5);line-height:1.55;max-width:58ch}

/* ═══ MESA ═══ */
.solta{border:1.5px dashed var(--line-3);border-radius:var(--r2);padding:var(--s7) var(--s5);
  text-align:center;background:var(--bg-2);display:flex;flex-direction:column;align-items:center;
  gap:var(--s3);width:100%;transition:border-color var(--d1) var(--curva),background var(--d1) var(--curva)}
.solta:hover{border-color:var(--acc);background:var(--acc-soft)}
.solta .tt{font-size:19px;font-weight:650;letter-spacing:-.02em}
.solta .ds{font-size:13.5px;color:var(--ink-2);max-width:44ch}
.solta .fm{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.07em}
.solta.fina{flex-direction:row;justify-content:center;align-items:center;padding:var(--s4);gap:var(--s4);text-align:left}
.solta.fina .tt{font-size:14.5px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--s5);margin-top:var(--s6)}
.passo{border-left:2px solid var(--line);padding-left:var(--s3)}
.passo b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px}
.passo span{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.grupo{margin-top:var(--s6)}
.gcab{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--line-2)}
.gcab h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gcab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.linha{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:var(--s4);align-items:center;
  padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);
  margin-bottom:var(--s2);width:100%;transition:border-color var(--d1) var(--curva)}
.linha:hover{border-color:var(--line-3);background:var(--bg-2)}
.linha .capa{width:38px;height:50px;border-radius:var(--r1);border:1px solid var(--line);object-fit:cover;
  object-position:top;background:var(--paper);display:block}
.linha .capa.vazia{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:8px;color:var(--ink-3);background:var(--bg-3)}
.linha .nm{font-size:14px;font-weight:600;letter-spacing:-.005em;display:block}
.linha .st{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.linha .ac{font-size:13px;color:var(--acc);font-weight:600;white-space:nowrap}
@media(max-width:620px){.linha{grid-template-columns:38px minmax(0,1fr)}.linha .ac{grid-column:2}}

/* ═══ ITEM ═══ */
.volta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);
  padding:5px 9px 5px 5px;border-radius:var(--r1);margin-bottom:var(--s4)}
.volta:hover{color:var(--acc);background:var(--bg-2)}
.icab{display:flex;gap:var(--s4);align-items:flex-start;margin-bottom:var(--s5);flex-wrap:wrap}
.icab .cp{width:74px;height:98px;border-radius:var(--r1);border:1px solid var(--line);object-fit:cover;
  object-position:top;flex:0 0 74px;background:var(--paper)}
.icab .tx{flex:1;min-width:220px}
.icab h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.metas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta{font-size:11.5px;color:var(--ink-2);background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--rp);padding:3px 10px}
.modo{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--r1);padding:6px 12px;white-space:nowrap}
.modo:hover{border-color:var(--line-3)}
.modo b{color:var(--ink);font-weight:650}
.estado{display:flex;gap:var(--s3);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r2);
  background:var(--bg-2);margin-bottom:var(--s5);align-items:flex-start}
.estado.ok{background:var(--ok-soft);border-color:var(--ok)}
.estado.at{background:var(--warn-soft);border-color:var(--warn)}
.estado .pt{margin-top:6px}
.estado h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.012em}
.estado p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:60ch}
.sec{margin-bottom:var(--s5)}
.sec>h3{margin:0 0 var(--s3);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.lista{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:var(--s3);align-items:start;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:none}
.sn{width:20px;height:20px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex:0 0 20px;margin-top:1px}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-at{background:var(--warn-soft);color:var(--warn)}
.s-er{background:var(--dan-soft);color:var(--dan)}.s-in{background:var(--bg-3);color:var(--ink-2)}
.li .tx b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.li .tx span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.li .ac{font-size:12.5px;color:var(--acc);font-weight:600;white-space:nowrap;padding:2px 5px;border-radius:var(--r1)}
.li .ac:hover{background:var(--acc-soft)}
.acoes{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s5)}
.btn{height:var(--h2);padding:0 var(--s5);border-radius:var(--r1);background:var(--ink);color:var(--bg);
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  white-space:nowrap;transition:background var(--d1) var(--curva)}
.btn:hover{background:var(--acc);color:#fff}
.btn.sec2{background:none;border:1px solid var(--line-3);color:var(--ink);font-weight:550}
.btn.sec2:hover{background:var(--bg-2);border-color:var(--ink);color:var(--ink)}
.btn.sm{height:var(--h1);padding:0 var(--s4);font-size:12.5px}
.lnk{font-size:13px;color:var(--acc);font-weight:600;padding:4px 6px;border-radius:var(--r1)}
.lnk:hover{background:var(--acc-soft)}
.lnk.mudo{color:var(--ink-3);font-weight:550}
.lnk.mudo:hover{color:var(--ink);background:var(--bg-2)}
.nota{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r1);
  background:var(--bg-2);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);
  line-height:1.55;margin-top:var(--s4)}
.nota b{color:var(--ink)}
.trilho{height:5px;border-radius:var(--rp);background:var(--bg-3);overflow:hidden;margin:var(--s3) 0 var(--s2)}
.trilho i{display:block;height:100%;background:var(--ink);border-radius:var(--rp);transition:width .4s linear}
.leg{display:flex;justify-content:space-between;gap:var(--s3);font-size:12.5px;color:var(--ink-2)}
.leg .mn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.etapas{display:flex;flex-direction:column;gap:1px;margin-top:var(--s4)}
.etapa{display:flex;align-items:center;gap:var(--s3);font-size:12.5px;padding:5px 0;color:var(--ink-3)}
.etapa.feita{color:var(--ink-2)}.etapa.agora{color:var(--ink);font-weight:600}
.etapa .mk{width:14px;text-align:center;font-size:11px}
.pend{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--warn);background:var(--warn-soft);
  border-radius:var(--r1);padding:8px 15px;font-size:13px;font-weight:600;color:var(--ink)}
.pend .n{font-family:var(--mono);font-size:10px;color:var(--warn)}

/* ═══ ESPAÇO DO LIVRO ═══ */
.livro{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--s7);align-items:start}
@media(max-width:800px){.livro{grid-template-columns:1fr;gap:var(--s5)}}
.livro .capao{width:100%;border-radius:var(--r2);border:1px solid var(--line);display:block;background:var(--paper)}
.livro h1{margin:0 0 6px;font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.livro .autor{font-size:14px;color:var(--ink-2);margin:0 0 var(--s4)}
.barra{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s4) 0 var(--s5)}
.dado{display:grid;grid-template-columns:130px minmax(0,1fr);gap:var(--s4);padding:9px 0;
  border-bottom:1px solid var(--line-2);font-size:13.5px}
.dado .k{color:var(--ink-3);font-size:12.5px}
.dado:last-child{border-bottom:none}

/* ═══ ESTANTE ═══ */
.vista{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--bg-2)}
.vista button{padding:6px 14px;font-size:12.5px;color:var(--ink-2)}
.vista button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:var(--s5)}
.bk{text-align:left;display:block;width:100%}
.bk img{display:block;width:100%;height:auto;border-radius:var(--r1);border:1px solid var(--line);
  background:var(--paper);transition:transform var(--d2) var(--curva)}
.bk:hover img{transform:translateY(-3px)}
.bk .t{display:block;font-size:12.5px;font-weight:600;margin-top:9px;line-height:1.25}
.bk .a{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.prat{margin-bottom:var(--s5)}
.lombs{display:flex;align-items:flex-end;gap:2px;padding:0 var(--s5);min-height:150px}
.lombs img{display:block;width:auto;border-radius:var(--r1) var(--r1) 0 0;transition:transform var(--d2) var(--curva)}
.lombs button:hover img{transform:translateY(-9px)}
.lombs button[aria-pressed="true"] img{transform:translateY(-15px)}
.tabua{height:9px;background:var(--bg-3);border-bottom:4px solid var(--ink-4);border-radius:var(--r1)}
.legenda{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s5) 0;min-height:36px}

/* ═══ PERFIL ═══ */
.pcab{display:flex;gap:var(--s5);align-items:center;padding-bottom:var(--s5);
  border-bottom:1px solid var(--line);margin-bottom:var(--s5);flex-wrap:wrap}
.pcab .ava{width:64px;height:64px;font-size:22px}
.pcab h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em}
.pcab .h{font-size:13px;color:var(--ink-3);margin-top:3px}
.dobra{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:var(--s2);overflow:hidden}
.dobra>button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s4)}
.dobra>button:hover{background:var(--bg-2)}
.dobra .nm{font-size:14.5px;font-weight:650}
.dobra .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dobra .ch{margin-left:auto;color:var(--ink-3);font-size:11px}
.dobra .in{padding:0 var(--s4) var(--s4);border-top:1px solid var(--line-2)}

/* ═══ LEITURA DENTRO DO ARQUIVO ═══
   A superfície onde o sistema do DOC.cc faz mais diferença: medida
   de 575 → 675 → 775, régua que atravessa na fronteira de capítulo
   sem tirar o título da coluna, citação escapando 17% e nota
   subordinada a 93%, legenda na largura da coluna. */
const CAPS=[
 {n:"Chegada",p:["A expedição partiu de manhã, com o material dividido em três caixas e a certeza de que uma delas voltaria vazia.",
   "Nenhum registro anterior descrevia o acesso pelo lado leste. Levamos isso como convite, e não como aviso."]},
 {n:"O registro de campo",p:["Anotar o que se vê é mais difícil do que parece: metade do trabalho é resistir a anotar o que se esperava ver.",
   "Adotamos a regra de escrever antes de conversar. Duas horas por dia sem falar com ninguém, cada um com o próprio caderno."]},
 {n:"Método",p:["Fotografia a cada duzentos metros, sempre na mesma altura, sempre com a mesma lente. A repetição é o que transforma imagem em dado.",
   "O que não cabia na fotografia entrava no caderno, com hora e coordenada."]},
 {n:"O que ficou",p:["No fim, o que sobrou não foram as conclusões. Foi o material bruto: 96 páginas de anotação, 340 fotografias e uma lista de perguntas que ninguém tinha feito antes de sair.",
   "É por isso que este diário existe em vez de um relatório."]}
];
function vLeitura(){
  const prog=Math.round((S.cap+1)/CAPS.length*100);
  let h='<div class="leituraTopo"><button class="lnk mudo" data-a="ir-livro">‹ '+esc(ARQ.titulo)+'</button>'+
    '<span class="sp"></span>'+
    '<button class="lnk mudo" data-a="folha" data-v="sumario">Sumário</button>'+
    '<button class="lnk mudo" data-a="nada">Aa</button>'+
    '<span class="mono" style="font-size:var(--t-mono);color:var(--ink-3)">'+prog+'%</span>'+
    '<div class="fio"><i style="width:'+prog+'%"></i></div></div>';

  h+='<div class="ed" style="padding-bottom:var(--s8)"><div class="colE">';
  CAPS.forEach((c,i)=>{
    h+='<section class="lsec" id="cap'+i+'"><div class="lcap"><span>'+esc(c.n)+'</span>'+
      '<span>Capítulo '+(i+1)+' de '+CAPS.length+'</span></div>';
    c.p.forEach((p,j)=>{
      h+='<p class="txtE">'+esc(p)+(i===1&&j===0?'<button class="marcaN" data-a="folha" data-v="nota">1</button>':'')+'</p>';
    });
    if(i===0)h+='<blockquote class="lq">A repetição é o que transforma imagem em dado.</blockquote>';
    if(i===2)h+='<figure class="figE"><img src="capas/capa-11.jpg" alt="Capa do Diário 02">'+
      '<figcaption>Registro de campo, expedição 02. A legenda herda a largura da coluna e fica '+
      'centrada — é assim que uma imagem larga não quebra o ritmo da leitura.</figcaption></figure>';
    if(i===1)h+='<p class="lnota">Nota de campo: as duas horas de silêncio foram a única regra que '+
      'sobreviveu à segunda semana.</p>';
    h+='</section>';
  });
  h+='<div class="lfimE"><span class="kicker">Fim do que foi preparado</span>'+
    '<p class="txtE mudo">Você está lendo o EPUB que o Mekora gerou a partir de um PDF digitalizado de '+
    '96 páginas. O original continua guardado.</p>'+
    '<div class="aparelho"><i class="pt pt-ok"></i><div style="flex:1">'+
      '<b style="display:block;font-size:var(--t-ui)">Também está no seu Kindle</b>'+
      '<span style="font-size:var(--t-peq);color:var(--ink-2)">Enviado hoje, 09:12. Se você ler por lá, '+
      'a página em que parou volta para cá.</span></div>'+
      '<button class="btnO" data-a="nada">Continuar no Kindle</button></div>'+
  '</div></div></div>';
  return h;
}

function cab(){

function est(k,t,p){

/* ═══ ESTANTE ═══ */
function vEstante(){
  let h='<div class="pad larga">'+
    '<div style="display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)">'+
    '<div><h1 class="t">Estante</h1><p class="sub" style="margin:0">14 itens · tudo que já foi preparado.</p></div>'+
    '<span class="sp"></span>'+
    '<span class="vista"><button data-a="vista" data-v="lista" aria-pressed="'+(S.estante==="lista")+'">Capas</button>'+
    '<button data-a="vista" data-v="3d" aria-pressed="'+(S.estante==="3d")+'">Estante</button></span></div>';
  if(S.estante==="lista"){
    h+='<div class="grade">'+ACERVO.map(b=>'<button class="bk" data-a="ir-livro">'+
      '<img src="'+capa(b.c)+'" alt="Capa de '+esc(b.t)+'" loading="lazy">'+
      '<span class="t">'+esc(b.t)+'</span><span class="a">'+esc(b.a)+' · '+b.f+'</span></button>').join("")+'</div>';
  }else{
    const prats=[ACERVO.slice(0,5),ACERVO.slice(5,10),ACERVO.slice(10)];
    h+=prats.map(p=>'<div class="prat"><div class="lombs">'+p.map(b=>
      '<button data-a="lomb" data-v="'+b.c+'" aria-pressed="'+(S.lombSel===b.c)+'" title="'+esc(b.t)+'">'+
      '<img src="'+lomb(b.l)+'" alt="Lombada de '+esc(b.t)+'" style="height:'+b.h+'px" loading="lazy"></button>').join("")+
      '</div><div class="tabua"></div></div>').join("");
    const b=ACERVO.find(x=>x.c===S.lombSel);
    h+='<div class="legenda">'+(b?'<b style="font-size:14px">'+esc(b.t)+'</b>'+
      '<span style="font-size:12.5px;color:var(--ink-3)">'+esc(b.a)+' · '+b.f+' · '+esc(b.q)+'</span>'+
      '<span class="sp"></span><button class="lnk" data-a="ir-livro">Abrir</button>':'')+'</div>';
  }
  h+=dock(["Capas","Estante","Filtrar","Organizar"],S.estante==="lista"?0:1);
  return h+'</div>';
}
function vCanvas(nome){
  return '<div class="pad larga"><h1 class="t">'+nome+'</h1>'+
    '<p class="sub">Superfície espacial. É aqui — e só aqui — que a dock existe: ela segura ferramentas de '+
    'manipulação direta, que precisam ficar perto das mãos.</p>'+
    '<div style="border:1px dashed var(--line);border-radius:var(--r2);padding:var(--s7);text-align:center;'+
    'color:var(--ink-3);font-size:13.5px">Preservado do protótipo da área pessoal.<br>'+
    'O que muda aqui é só a barra do topo, que passou a ser a mesma das outras telas.</div>'+
    dock(["Nota","Mídia","Conectar","Organizar","Filtrar"],-1)+'</div>';
}
function dock(its,on){
  return '<div class="dock">'+its.map((t,i)=>'<button data-a="nada"'+(i===on?' aria-pressed="true"':'')+
    '>'+t+'</button>').join("")+'</div>';
}

function folha(ct,tit,corpo,pe){
  return '<div class="veu" data-a="fechar-veu"><div class="folha" data-stop="1">'+
    '<div class="fcab"><div><span class="ct">'+ct+'</span><h2>'+tit+'</h2></div><span class="sp"></span>'+
    '<button class="fx" data-a="fechar" aria-label="Fechar">✕</button></div>'+
    '<div class="fcorpo">'+corpo+'</div><div class="fpe"><span class="sp"></span>'+(pe||"")+'</div></div></div>';
}

/* ═══ RENDER ═══ */
function corpo(){
  if(S.lugar==="home")return vHome();
  if(S.lugar==="leitura")return vLeitura();
  if(S.lugar==="mesa")return vMesa();
  if(S.lugar==="item")return vItem();
  if(S.lugar==="livro")return vLivro();
  if(S.lugar==="estante")return vEstante();
  if(S.lugar==="canvas")return vCanvas("Canvas");
  if(S.lugar==="conexoes")return vCanvas("Conexões");
  if(S.lugar==="perfil")return vPerfil();
  return vMesa();
}
function pinta(){
  const y=app.querySelector(".corpo")?app.querySelector(".corpo").scrollTop:0;
  app.innerHTML=topo()+'<div class="corpo">'+corpo()+'</div>'+vFolha();
  const c=app.querySelector(".corpo");
  if(c){
    c.scrollTop=y;
    c.addEventListener("scroll",()=>{
      const d=c.scrollTop>96;
      if(d!==S.dentro){S.dentro=d;const t=app.querySelector(".topo");
        if(t)t.classList.toggle("-dentro",d&&(S.lugar==="item"||S.lugar==="livro"));}
    });
  }
}
function tick(){
  clearInterval(timer);
  timer=setInterval(()=>{
    S.feito+=6;
    if(S.feito>=42&&!S.pendMostrada&&!S.pendResolvida){
      S.pendMostrada=true;clearInterval(timer);timer=null;S.folha="pend";pinta();return;}
    if(S.feito>=96){S.feito=96;clearInterval(timer);timer=null;S.fase="pronto";}
    pinta();
  },300);
}
function aviso(t){S.aviso=t;S.folha="aviso";}

app.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==="fechar-veu"&&ev.target.closest("[data-stop]"))return;
  if(S.menu&&a!=="menu")S.menu=false;
  switch(a){
    case "nada":aviso("Controle representado");break;
    case "fechar":case "fechar-veu":S.folha=null;S.aviso=null;break;
    case "menu":S.menu=!S.menu;break;
    case "ir":S.lugar=v;S.folha=null;S.dentro=false;break;
    case "ir-livro":S.lugar="livro";S.folha=null;S.dentro=false;break;
    case "abrir-item":S.lugar="item";S.folha=null;S.dentro=false;break;
    case "soltar":S.lugar="item";S.cena="trabalho";S.dentro=false;break;
    case "rolar":{const alvo=document.getElementById(v);
      if(alvo)alvo.scrollIntoView({behavior:"smooth",block:"start"});return;}
    case "cap":{S.cap=Number(v);S.folha=null;pinta();
      const el=document.getElementById("cap"+v);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
    case "folha":S.folha=v;break;
    case "fechar-aviso":S.avisoUso=false;break;
    case "modo":
      if(S.modo==="guiado")S.modo="personalizado";
      else if(S.manuais>0)S.folha="volta";
      else S.modo="guiado";
      break;
    case "manual":S.manuais++;aviso("Ajuste manual registrado — "+S.manuais+" no total");break;
    case "guiado":S.modo="guiado";S.folha=null;if(v==="descartar")S.manuais=0;break;
    case "capa":S.capaEsc=v;S.folha=null;break;
    case "trad":S.traduzir=v||null;S.folha=null;break;
    case "preparar":S.fase="preparando";S.feito=0;tick();break;
    case "cancelar":clearInterval(timer);timer=null;S.fase="analise";S.feito=0;S.pendMostrada=false;break;
    case "pend-ok":S.pendResolvida=true;S.folha=null;tick();break;
    case "pend-retry":S.pendResolvida=true;S.folha=null;tick();aviso("Nova tentativa — leva mais 40 s");break;
    case "enviar":S.folha=null;S.enviado=true;break;
    case "baixar":aviso("Download iniciado");break;
    case "feito":S.feitoAberto=!S.feitoAberto;break;
    case "vista":S.estante=v;break;
    case "lomb":S.lombSel=v;break;
    case "dobra":S.perfil=S.perfil===v?"":v;break;
    case "criar-conta":S.conta=true;S.folha=null;S.cena="trabalho";S.lugar="mesa";break;
  }
  pinta();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.folha||S.menu)){S.folha=null;S.menu=false;pinta();}});

dock:`<div class="w"><h2>A dock: uma sai, uma fica, uma vira outra coisa</h2>
<p>A confusão é justa, porque hoje <b>existem três coisas diferentes chamadas dock</b> no produto, e

<h3>1. A dock de navegação — sai</h3>
<p>Na biblioteca, a barra flutuante com Canvas · Estante · Conexões duplica o que a barra do topo faz.

navegação era uma pílula no topo, na biblioteca era uma dock embaixo. <b>Os lugares sobem para a barra

<p>Adicionar nota, adicionar mídia, conectar, organizar, filtrar: são ferramentas que agem sobre

NT.sistema=`<div class="w"><h2>O que veio do DOC.cc, e onde está aplicado</h2>
<p>Na rodada anterior eu escrevi sobre o sistema deles e entreguei um produto que não o usava.
Aqui ele está aplicado — e as duas superfícies onde ele de fato serve são a <b>Home</b> e a
<b>leitura dentro do arquivo</b>, porque são as duas onde se lê. O aparato do produto — Mesa, item,
perfil — continua em grotesca e densidade de ferramenta, de propósito.</p>
<h3>Adotado</h3>
<table><thead><tr><th>Do DOC</th><th>Como está aqui</th><th>Onde ver</th></tr></thead><tbody>
<tr><td class="n">Escala fluida por root</td><td><code>clamp(.875rem, .82rem + .28vw, 1.25rem)</code> no <code>html</code> — tudo o mais em rem, e a escala inteira cresce com a tela</td><td>toda parte; estique a janela</td></tr>
<tr><td class="n">Entrelinha fecha quando o corpo cresce</td><td>display .94 · h1 1.06 · h2 1.2 · h3 1.34 · leitura 1.62 · interface 1.5</td><td>Home, título contra corpo</td></tr>
<tr><td class="n">Medida editorial</td><td>575 → 675 → 775px conforme a tela, sempre centrada</td><td>leitura e Home</td></tr>
<tr><td class="n">Ritmo vertical de 80px entre módulos</td><td><code>--s8</code>, com divisória de 1px entre faixas</td><td>Home</td></tr>
<tr><td class="n">Gutter de 20 e 40</td><td>base 4 do Mekora, degraus operacionais em 20 e 40</td><td>toda parte</td></tr>
<tr><td class="n">Link por borda inferior</td><td>nunca <code>text-decoration</code>; a borda escurece no hover</td><td>Home, sumário</td></tr>
<tr><td class="n">Botão outline que inverte</td><td>sem raio, 1px, vira sólido no hover</td><td>Home, leitura</td></tr>
<tr><td class="n">Matriz de tag 2×2</td><td>default e main, claro e invertido</td><td>Home, "o que entra"</td></tr>
<tr><td class="n">Lista ordenada como índice</td><td>número em mono, divisória de 1px por item, meta à direita</td><td>Home, "como funciona"; sumário</td></tr>
<tr><td class="n">Legenda na largura da coluna</td><td>imagem larga, legenda estreita e centrada</td><td>leitura, capítulo 3</td></tr>
<tr><td class="n">Zero sombra</td><td>profundidade por borda translúcida</td><td>toda parte</td></tr>
<tr><td class="n">Uma curva só</td><td><code>cubic-bezier(.16,1,.3,1)</code>, quatro durações</td><td>toda parte</td></tr>
</tbody></table>
<h3>O raio — um defeito que o Erik encontrou, e a regra que saiu dele</h3>
<p>Ao trazer o botão reto do DOC para um produto cujos botões eram pílula, eu não reconciliei os dois.
O resultado era <b>seis valores de raio convivendo</b> — 0, 2, 3, 4, 5, 8 e 999px —, e a pergunta
"por que aqui é quadrado e ali é redondo" não tinha resposta, porque não havia regra.</p>
<p>A regra que adotei não é sobre tela, é sobre <b>o que a coisa é</b>:</p>
<table><thead><tr><th>Raio</th><th>É</th><th>Exemplo</th></tr></thead><tbody>
<tr><td class="n">4px</td><td>ação e objeto pequeno</td><td>botão, campo de busca, seletor, miniatura de capa</td></tr>
<tr><td class="n">8px</td><td>superfície</td><td>card, lista, folha, dock, capa grande</td></tr>
<tr><td class="n">pílula</td><td>dado</td><td>tag, chip de metadado, trilho de progresso, interruptor</td></tr>
<tr><td class="n">círculo</td><td>forma, não raio</td><td>avatar, ponto de estado</td></tr>
</tbody></table>
<p>O ganho não é arrumação: hoje o chip <b>"96 páginas"</b> e o botão <b>"Baixar"</b> tinham
exatamente a mesma forma. Separando os dois, <b>a forma passa a dizer se aquilo faz alguma coisa</b>
— antes de ler o texto. Sobraram quatro valores, e cada um tem um significado.</p>
<p>Duas exceções, declaradas: o interruptor continua pílula porque a forma dele é funcional — um
trilho com um botão correndo dentro —, e a lombada do livro mantém o arredondamento só no topo,
porque é a borda de um objeto físico.</p>
<h3>O que mudei em vez de copiar</h3>
<p><b>O root em px.</b> O DOC fixa <code>html{font-size:14px}</code> e sobe até 20px por breakpoint.
É o truque central da identidade deles e o preço é anular a preferência de tamanho de fonte do
navegador — inaceitável num produto para quem lê muito, que é exatamente quem aumenta a fonte.
Aqui o <code>clamp</code> está em <b>rem</b>: 87,5% a 125% do tamanho que a pessoa escolheu.
Mesma identidade, preferência preservada.</p>
<p><b>As durações.</b> .8s a 1.3s é ritmo de revista. Numa ferramenta virou .12 / .24 / .42s.</p>
<p><b>A base de espaço.</b> 4px, que já era do Mekora, com os degraus operacionais de 20 e 40 do DOC.</p>
<h3>O que continua recusado, e por medição</h3>
<p>Medida de 50 caracteres e entrelinha 1,30 foram testadas em 11 de agosto e reprovadas: ritmo de
ensaio de oito minutos, com retorno de linha a cada ~8 palavras — cansa em 300 páginas. O bleed de
título chegou a entrar e <b>você o reprovou no dia seguinte</b>, porque o olho tinha de sair da coluna
e voltar a cada capítulo. Sobrou a régua atravessando na fronteira de capítulo, com o título alinhado
ao texto — está na leitura, entre um capítulo e outro.</p></div>`;
