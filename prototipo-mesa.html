const NAOESP=/[^\s]/;
const paragrafoDe=n=>{const e=n&&(n.nodeType===1?n:n.parentElement);
  return e?e.closest("[data-tr]"):null;};
/* A selecao so vale dentro de um paragrafo do texto. Atravessar dois, ou
   pegar legenda, citacao e titulo, e recusado EM SILENCIO — nada pisca. */
function capturaSel(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){
    if(S.selE&&!S.selE.desfazer&&!S.selE.confirma){S.selE=null;barra();}
    return;
  }
  const r=sel.getRangeAt(0);
  const pa=paragrafoDe(r.startContainer),pf=paragrafoDe(r.endContainer);
  if(!pa||pa!==pf){sel.removeAllRanges();if(S.selE){S.selE=null;barra();}return;}
  const cap=Number(pa.dataset.cap),par=Number(pa.dataset.p),t=CAPS[cap].p[par];
  const pre=document.createRange();
  pre.selectNodeContents(pa);pre.setEnd(r.startContainer,r.startOffset);
  let ini=pre.toString().length,fim=ini+r.toString().length;
  /* encaixe em palavra inteira: roda sozinho, sem controle e sem mencao.
     Come o caso dominante de "peguei meia palavra" antes de ele existir. */
  while(ini>0&&NAOESP.test(t.charAt(ini-1)))ini--;
  while(fim<t.length&&NAOESP.test(t.charAt(fim)))fim++;
  if(fim<=ini)return;
  /* encostar num destaque que ja existe REABRE aquele destaque em vez de
     criar outro por cima: destaques sobrepostos fatiariam o paragrafo errado. */
  const bate=S.dst.map(d=>({d:d,r:ancoraDe(d)}))
    .filter(x=>x.r&&x.d.livro===ARQ.titulo&&x.r.cap===cap&&x.r.par===par
      &&x.r.ini<fim&&x.r.fim>ini)
    .sort((x,z)=>x.r.ini-z.r.ini);
  S.selE=bate.length?{k:bate[0].d.k}:{cap:cap,par:par,ini:ini,fim:fim};
  Object.assign(S.selE,ondeEsta(r));
  barra();
}
/* coordenada do trecho DENTRO do documento rolavel, nao da janela: somando o
   scrollTop de .corpo, a barra fica presa ao texto e a rolagem nao a move. */
function ondeEsta(r){
  const c=app.querySelector(".corpo");if(!c)return {};
  const cx=c.getBoundingClientRect(),caixas=[...r.getClientRects()];
  if(!caixas.length)return {};
  const a=caixas[0];
  const col=app.querySelector(".colE"),cr=col?col.getBoundingClientRect():cx;
  /* presa a coluna de texto: uma barra a meia altura de um trecho que comeca
     na ultima palavra da linha sairia pela direita. */
  const meio=Math.min(Math.max(a.left+a.width/2,cr.left+90),cr.right-90);
  return {x:Math.round(meio-cx.left+c.scrollLeft),
          y:Math.round(a.top-cx.top+c.scrollTop)};
}
/* a barra entra sem repintar: pinta() destroi #app inteiro e a selecao viva
   morreria junto, deixando a pessoa com uma barra e nenhum trecho marcado. */
function barra(){
  /* a selecao troca o CONTEUDO da dock, em vez de abrir uma barra flutuante
     em cima do texto. Um lugar so responde "o que posso fazer agora" — e o
     posicionamento perto do trecho, que custou compensacao de rolagem e
     limiar medido de sticky, deixou de ser um problema porque deixou de
     existir. Custo assumido: no desktop a dock fica mais longe da mao. */
  document.body.classList.toggle("-selecionando",!!S.selE);
  const host=document.getElementById("selbar");
  if(!host)return;
  /* innerHTML num host fixo, e nao outerHTML: com outerHTML, o primeiro estado
     vazio apagaria o proprio no e nao haveria onde escrever o proximo. */
  const c=selConteudo();
  host.innerHTML=c;host.hidden=!c;
  if(S.selE&&S.selE.x!=null){host.style.left=S.selE.x+"px";host.style.top=S.selE.y+"px";}
}
/* rascunho: qualquer pinta() recria o <textarea> e levaria o texto junto. */
function guardaRascunho(){
  const ta=document.getElementById("campoNota");
  const alvo=S.notaAberta||S.escNovo||(S.descAberta?"desc":null)||(S.escAqui?"aqui":null);
  if(ta&&alvo)S.rasc[alvo]=ta.value;
  return ta?{ini:ta.selectionStart,fim:ta.selectionEnd,alt:ta.style.height}:null;
}
function pinta(){
  const cAnt=app.querySelector(".corpo");
  const y=cAnt?cAnt.scrollTop:0;
  const taEst=guardaRascunho();
  const tinhaBusca=document.activeElement&&document.activeElement.id==="buscaMarcado";
  const focoLig=document.activeElement&&document.activeElement.id==="qConectar";
  /* ancora semantica em vez de scrollTop cru: abrir uma nota no fluxo empurra
     a linha que a pessoa esta lendo, e o pixel de rolagem nao sabe disso. */
  let anc=null;
  if(S.lugar==="leitura"&&ultimoLugar==="leitura"&&cAnt){

     volta. Hamburguer promete o app inteiro, e nao e para la que se vai. */
  /* a leitura escondia a navegacao global inteira. Uma barra estrutural que
     existe em quatro lugares e some no quinto deixa de ser estrutural: some o
     "onde estou no Mekora" justo onde a pessoa fica mais tempo. Ela volta —
     sem nenhuma das quatro areas marcada como atual, porque estar dentro de um
     objeto da Estante nao e estar na Estante. */
  const semTopo=false;
  document.body.classList.toggle("leitura-foco",S.lugar==="leitura"&&!!S.foco);
  app.innerHTML=(semTopo?"":topo())+'<div class="corpo">'+corpo()+'</div>'+vFolha();
  /* a contagem da pré-visualização é MEDIDA na própria tela do aparelho:
     altura real do conteúdo dividida pela altura visível. Nada estimado. */
  const rolo=document.getElementById("rolo2");
  if(rolo){
    const medir=()=>{
      /* a altura útil vem da tela do aparelho, não de um height:100% que
         depende do pai — assim a medição não muda de significado sozinha */
      const tela=document.getElementById("telaQ");

        const util=tela.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
        if(util>40)rolo.style.height=util+"px";
      }
      const alt=rolo.clientHeight||1,total=rolo.scrollHeight;
      /* razão direta entre altura do conteúdo e altura visível — é o único
         número aqui que não depende de interpretar estilo computado */
      const telas=Math.max(1,Math.ceil(total/alt));
      const m=document.getElementById("medQ"),p=document.getElementById("pagQ");
      if(m)m.innerHTML=S.formato==="pdf"?
        'A página não reflui — <b>o texto sai da tela</b>':

        '<br><span style="opacity:.7">'+DISP[S.disp][1]+' · '+DISP[S.disp][2]+'</span>';
      if(p)p.textContent=S.formato==="pdf"?"1 de 96":"1 de "+telas;
    };
    medir();                     /* leitura de clientHeight já força o layout */

  }
  /* o assistente valida enquanto se digita: o botão liga sozinho quando o

  const we=document.getElementById("wizEmail");

    we.addEventListener("input",()=>{S.wiz.email=we.value;pinta();});
    const wn=document.getElementById("wizNome");
    if(wn)wn.addEventListener("input",()=>{S.wiz.nome=wn.value;});
  }
  /* confirmação por digitação: o botão só liga quando a palavra confere */
  const pc=document.getElementById("pcampo");
  if(pc&&S.folha==="apagar-conta"){
    pc.focus();pc.setSelectionRange(pc.value.length,pc.value.length);
    pc.addEventListener("input",()=>{S.prasc=pc.value;pinta();});
  }else if(pc){pc.focus();pc.setSelectionRange(pc.value.length,pc.value.length);}
  /* arrastar sobre a Mesa transforma a própria página em área de solta —
     no lugar do dropzone permanente que ocupava o topo */
  if(S.lugar==="mesa"&&S.conta){
    let dentro=0;
    app.addEventListener("dragenter",e=>{e.preventDefault();dentro++;app.classList.add("-arrastando");});
    app.addEventListener("dragover",e=>e.preventDefault());
    app.addEventListener("dragleave",()=>{if(--dentro<=0)app.classList.remove("-arrastando");});
    app.addEventListener("drop",e=>{e.preventDefault();dentro=0;app.classList.remove("-arrastando");

  const bm=document.getElementById("buscaMarcado");

    if(tinhaBusca){bm.focus();bm.setSelectionRange(bm.value.length,bm.value.length);}

  const cp=document.getElementById("campoPergunta");

    cp.focus();cp.setSelectionRange(cp.value.length,cp.value.length);
    cp.addEventListener("input",()=>{S.qPergunta=cp.value;pinta();});
  }
  const ql=document.getElementById("qConectar");
  if(ql){
    if(focoLig){ql.focus();ql.setSelectionRange(ql.value.length,ql.value.length);}

  const campo=document.getElementById("campoBusca");

      document.getElementById("resBusca").innerHTML=resultados(ach,q);

    });
  }
  const c=app.querySelector(".corpo");
  if(c){
    c.scrollTop=y;
    /* entrando na leitura vinda de outra tela: "Continuar no capitulo 3" abria
       no primeiro paragrafo do capitulo 1. Volta ao paragrafo onde parou. */
    if(S.lugar==="leitura"&&ultimoLugar!=="leitura"){
      const ps=pars(),alvo=ps[Math.min(S.leit.par||0,ps.length-1)];
      if(alvo&&(S.leit.par||0)>0){
        c.scrollTop+=alvo.getBoundingClientRect().top-c.getBoundingClientRect().top-24;
      }
      marcaProgresso();
    }
    if(anc){
      const el=c.querySelector('[data-cap="'+anc.cap+'"][data-p="'+anc.par+'"]');
      if(el){const cr=c.getBoundingClientRect();
        c.scrollTop+=(el.getBoundingClientRect().top-cr.top)-anc.top;}
    }
    if(S.lugar==="leitura"){
      const ed=c.querySelector(".ed");
      if(ed){
        ed.addEventListener("mouseup",capturaSel);
        ed.addEventListener("touchend",capturaSel);
        /* selecao por teclado tambem abre a barra: sem isto o gesto central
           do produto seria exclusivo do mouse. */
        ed.addEventListener("keyup",e=>{if(e.shiftKey)capturaSel();});
      }
    }
    /* FORA do ramo da leitura: o compositor tambem abre na tela do livro, e
       la ele perderia cursor a cada pinta() — "nada foi perdido" viraria
       mentira justo na superficie nova. */
    const ta=document.getElementById("campoNota");
    if(ta){
      if(taEst&&taEst.alt)ta.style.height=taEst.alt;
      ta.focus();
      const fz=taEst?taEst.fim:ta.value.length;
      ta.setSelectionRange(taEst?taEst.ini:fz,fz);

    const bl=c.querySelector(".leituraTopo");
    if(bl)document.documentElement.style.setProperty("--barraL",Math.round(bl.getBoundingClientRect().height)+"px");
    document.body.classList.toggle("-selecionando",!!S.selE);
    c.addEventListener("scroll",()=>{
      marcaProgresso();
      const d=c.scrollTop>96;
      if(d!==S.dentro){S.dentro=d;const t=app.querySelector(".topo");
        if(t)t.classList.toggle("-dentro",d&&(S.lugar==="item"||S.lugar==="livro"));}
    });
  }
  /* as ligacoes so podem ser desenhadas depois que as caixas existem e tem
     altura: medir e o unico jeito de a linha encostar no que ela liga. */
  if(S.lugar==="canvas"){desenhaLigacoes();arrastavel();}
  if(S.lugar==="notas"&&S.nfiltro==="estudos"&&S.estVista==="leitura")filaArrastavel();
  if(S.lugar==="notas"&&S.nfiltro==="estudos"&&S.estVista==="quadro")quadroArrastavel();
  /* A regua acompanha o cursor porque e assim que ela serve: uma faixa fixa
     no meio da tela obrigaria a pessoa a mover o texto ate ela, que e o
     contrario do problema que ela resolve. */
  /* "pagina 3 de 12" e o unico numero honesto no modo paginado: ele muda
     quando a fonte muda, e e por isso que ele nao pode ser guardado em lugar
     nenhum nem servir de ancora. */
  const ep=document.getElementById("edPag");
  if(ep){
    /* Quantas colunas cabem NA LARGURA REAL, e nao quantas o navegador
       resolve sozinho: com column-width de 723px numa tela de 1440, cabia
       uma so, e ela esticava para 1360 — 133 caracteres por linha. O alvo e
       a medida de leitura; a conta e quantas medidas cabem, e o que sobra
       vira margem. */
    const ce=ep.querySelector(".colE");
    if(ce){
      const alvo=parseFloat(getComputedStyle(ce).columnWidth)||660;
      const gap=64,disp=ep.clientWidth;
      const n=Math.max(1,Math.floor((disp+gap)/(alvo+gap)));
      const lado=Math.max(24,Math.round((disp-(n*alvo+(n-1)*gap))/2));
      ce.style.columnCount=n;ce.style.columnWidth="auto";ce.style.columnGap=gap+"px";
      ce.style.paddingLeft=lado+"px";ce.style.paddingRight=lado+"px";
    }
    const conta=()=>{const n=document.getElementById("pgN");if(!n)return;
      const t=Math.max(1,Math.round(ep.scrollWidth/ep.clientWidth));
      n.textContent="página "+(Math.round(ep.scrollLeft/ep.clientWidth)+1)+" de "+t;};
    ep.addEventListener("scroll",conta);
    requestAnimationFrame(conta);
  }
  const rg=document.getElementById("regua");
  if(rg){
    const ed=rg.parentElement;
    ed.addEventListener("pointermove",e=>{
      const r=ed.getBoundingClientRect();
      rg.style.top=(e.clientY-r.top-15)+"px";rg.style.opacity="1";});
    ed.addEventListener("pointerleave",()=>{rg.style.opacity="0";});
  }
  ultimoLugar=S.lugar;
}
function tick(){
  clearInterval(timer);
  timer=setInterval(()=>{
    S.feito+=6;
    if(S.feito>=42&&!S.pendMostrada&&!S.pendResolvida){
      S.pendMostrada=true;clearInterval(timer);timer=null;S.folha="pend";pinta();return;}
    if(S.feito>=96){S.feito=96;clearInterval(timer);timer=null;S.fase="pronto";}
    pinta();
  },300);
}
function aviso(t){S.aviso=t;S.folha="aviso";}
/* uma porta so para o roteador: o toque no item do canvas entra pelo mesmo
   switch, e nao por uma segunda copia da regra. */
function acaoCanvas(k){
  app.dispatchEvent(new CustomEvent("cv",{detail:k}));
}


app.addEventListener("cv",ev=>{roteia("cv-tocar",ev.detail,null);});
app.addEventListener("click",ev=>{
  /* No canvas, o item inteiro e alvo nos modos Ligar e Tirar: exigir mira
     num botao pequeno para ligar duas coisas seria trabalho manual dentro
     de uma superficie que existe para manipulacao direta. */
  const it=ev.target.closest(".cvIt");
  if(it&&(S.cvModo==="ligar"||S.cvModo==="tirar")&&!ev.target.closest("[data-a]")){
    acaoCanvas(it.dataset.k);return;}
  const el=ev.target.closest("[data-a]");if(!el)return;
  if(el.dataset.a==="fechar-veu"&&ev.target.closest("[data-stop]"))return;
  roteia(el.dataset.a,el.dataset.v,el);
});
function roteia(a,v,el){
  el=el||{dataset:{}};
  if(S.menu&&a!=="menu")S.menu=false;
  /* qualquer outra acao fecha o menu da linha: um menu que fica aberto atras
     do que voce acabou de fazer e um menu que voce vai tocar sem querer. */
  if(S.linhaMenu&&a!=="linha-menu")S.linhaMenu=null;
  /* o rastro do que acabou de ser ligado dura ate a proxima acao: se ficasse,
     a animacao se repetiria a cada repintura e viraria decoracao. */
  if(S.novaRel&&a!=="nota-ligar"&&a!=="cv-tocar")S.novaRel=null;
  switch(a){
    case "nada":aviso("Controle representado");break;
    case "fechar":case "fechar-veu":S.folha=null;S.aviso=null;break;
    case "menu":S.menu=!S.menu;break;
    case "ir":S.lugar=v;S.folha=null;S.dentro=false;S.dstUndo=null;S.deLivro=false;
      if(v==="leitura")S.perg=null;   /* senao "Ler" reabria a pergunta calada */
      break;
    case "ir-livro":{
      /* o titulo vem em v. Sem ele, os 14 itens do acervo abriam o mesmo
         caderno — e o sufixo "#notas", que existia para descer ate "O que
         ficou", tambem nunca chegava: nenhuma das onze chamadas passava valor.
         Nem todo livro do acervo tem texto proprio, e mostrar o caderno de
         outro seria a mesma perda que "voltar a origem" existe para evitar. */
      const [alvo,mod]=String(v||"").split("#");
      if(alvo){
        if(!LIVROS[alvo]){
          aviso("“"+alvo+"” está na estante, mas não abre aqui: "+
            Object.keys(LIVROS).length+" livros têm texto próprio neste protótipo, "+
            "e este não é um deles.");break;}
        ARQ=LIVROS[alvo];
      }
      S.lugar="livro";S.folha=null;S.dentro=false;S.dstUndo=null;S.deLivro=false;
      if(mod==="notas"){pinta();const el=document.getElementById("marcado");
        if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
      break;}
    case "abrir-item":S.lugar="item";S.folha=null;S.dentro=false;S.dstUndo=null;break;
    case "soltar":S.lugar="item";S.cena="trabalho";S.dentro=false;break;
    case "rolar":{const alvo=document.getElementById(v);
      if(alvo)alvo.scrollIntoView({behavior:"smooth",block:"start"});return;}
    case "cap":{S.cap=Number(v);S.folha=null;pinta();
      const el=document.getElementById("cap"+v);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
    case "folha":S.folha=v;if(v==="ajuda")S.ajuda=null;if(v==="busca")S.q="";break;
    case "fechar-aviso":S.avisoUso=false;break;
    case "modo":
      if(S.modo==="guiado")S.modo="personalizado";
      else if(S.manuais>0)S.folha="volta";
      else S.modo="guiado";
      break;
    case "manual":S.manuais++;aviso("Ajuste manual registrado — "+S.manuais+" no total");break;
    case "guiado":S.modo="guiado";S.folha=null;if(v==="descartar")S.manuais=0;break;
    case "capa":S.capaEsc=v;S.folha=null;break;
    case "trad":S.traduzir=v||null;S.folha=null;break;
    case "preparar":S.fase="preparando";S.feito=0;tick();break;
    case "cancelar":clearInterval(timer);timer=null;S.fase="analise";S.feito=0;S.pendMostrada=false;break;
    case "pend-ok":S.pendResolvida=true;S.folha=null;tick();break;
    case "pend-retry":S.pendResolvida=true;S.folha=null;tick();aviso("Nova tentativa — leva mais 40 s");break;
    case "enviar":S.folha=null;S.enviado=true;break;
    case "baixar":aviso("Download iniciado");break;
    case "feito":S.feitoAberto=!S.feitoAberto;break;

    case "vista":S.estante=v;

    case "livro-terminei":{const b=ACERVO.find(x=>x.c===v);if(b)b.prog=100;break;}

    case "f-estante":S.fEstante=v;S.lombSel=null;break;

    case "ler-pergunta":S.perg=v;S.folha=null;S.lugar="leitura";S.dentro=false;break;

    case "perg-sair":S.perg=null;break;

    case "dst-criar":{

    case "dst-abrir":{

    case "dst-nota":S.notaAberta=v;S.selE=null;S.erroNota=false;break;

      setTimeout(()=>{

           notasDo() parava de emitir o compositor e o campo sumia com o texto

        if(d&&S.paraLivro&&ancora(d)){d.par=null;d.ini=null;d.fim=null;d.origem="livro";d.perg=null;}

        if(d&&!ancora(d)&&!d.nota)S.dst=S.dst.filter(x=>x.k!==v);
        delete S.rasc[v];S.notaAberta=null;S.erroNota=false;pinta();
      },700);
      return;}
    case "dst-apagar-nota":{
      const d=dstK(v);if(d)d.nota="";delete S.rasc[v];S.notaAberta=null;break;}
    case "dst-tirar":{
      const d=dstK(v);if(!d)break;
      /* "nunca perder" e comportamento, nao tela: tirar um destaque que tem
         nota apaga a nota junto, e por isso passa por uma porta. Na leitura
         a porta e a propria barra; fora dela e uma folha, porque a barra

      if(d.nota&&!el.dataset.f){

      if(S.lugar==="leitura")
        S.selE=Object.assign({},S.selE||{x:0,y:0},{k:null,confirma:false,desfazer:true});
      break;}
    /* editar a nota a partir da lista leva ao texto: a nota mora no fluxo,
       e edita-la longe do trecho seria escrever sobre o que nao esta a vista. */
    case "dst-editar":{
      const d=escK(v);if(!d)break;
      /* sem ancora nao ha trecho para onde ir: edita onde esta */
      if(!ancora(d)){S.notaAberta=v;S.folha=null;
        if(d.origem==="titulo")d.origem="minha";  /* deixou de ser derivada */

      S.lugar="leitura";S.folha=null;S.selE=null;S.cap=d.cap;

    case "ler-comeco":S.cap=0;S.leit.par=0;S.leit.lidoAte=0;S.lugar="leitura";S.folha=null;break;

    case "ver-preparo":S.lugar="item";S.fase="pronto";S.feitoAberto=true;S.deLivro=true;S.folha=null;break;
    /* nasce sem selecionar nada, e o endereco sai do lugar onde se clicou:

    case "esc-aqui":{

    case "esc-grao":{

      S.dstUndo={d:d,filhos:fs.map(x=>x.k)};

    case "sel-fim":S.selE=null;break;
    case "sel-copiar":{

      const d=dstK(v);S.selE=null;
      aviso(d?"Copiado com a origem — "+dstCap(d)+", "+ARQ.titulo:"Copiado");break;}
    /* ═══ NOTAS ═══ */
    case "mapa-zoom":S.mapaZoom=Number(v);S.mapaFoco=null;break;

    case "tag-nova":S.tagNova=v||null;break;
    case "tag-por":{
      const par=v.split("|");

        .toLowerCase().replace(/^#/,"").replace(/\s+/g,"-");
      const d=escK(k);

      const par=v.split("|"),d=escK(par[1]);

    case "tag-ver":

    /* COLECAO e do acervo: um conjunto de LIVROS que voce juntou de proposito.

    case "est-filtrar":S.fEstudo=S.fEstudo===v?null:v;break;

    case "ir-fila":S.lugar="notas";S.nfiltro="estudos";S.estVista="leitura";

    case "pag":{

    case "vista-texto":S.vista=v;S.folha=null;break;
    case "marcar-lido":{

    case "cont-vista":S.conteudoVista=v;break;

    case "sum-aba":S.sumAba=v;break;
    /* ═══ CANVAS ═══ */
    case "cv-modo":S.cvModo=v;S.cvLigando=null;break;
    /* escrever no canvas cria uma nota SOLTA de verdade: ela aparece em

    case "cv-nota":{

    case "cv-fonte":{

      if(ehChaveFonte(v)){

    case "nota-origem":{

    case "levar":{

dock:`<div class="w"><h2>A dock: uma sai, uma fica, uma vira outra coisa</h2>

<p>Adicionar nota, adicionar mídia, conectar, organizar, filtrar: são ferramentas que agem sobre

NT.conhecimento=`<div class="w"><h2>Notas, conexões e organização: o que está de pé e o que é aposta</h2>
<p>A hipótese que esta rodada foi testar: <b>o mapa não deve ser o produto — o produto é nota com
memória mais relação útil</b>. O protótipo agora dá para testar isso, porque os três livros do
cenário têm <b>texto próprio</b>. Antes, os catorze compartilhavam um só, e uma nota de Malha Urbana
voltava para o Diário 02: a memória não podia falhar, porque não existia.</p>

<h3>O estado de cada coisa</h3>
<p>Nada aqui é "pronto". A coluna do estado é o que separa o que já se sustenta do que é convite
para o próximo teste.</p>
<table><thead><tr><th>Coisa</th><th>Estado</th><th>Por quê</th></tr></thead><tbody>
<tr><td class="n">Nota presa ao trecho, e a volta à origem</td><td><b>Atual</b></td><td>Funciona atravessando livros: abrir a origem de uma nota de outro livro troca o livro aberto, o capítulo e rola até a marca.</td></tr>
<tr><td class="n">Portão do “levar”, e a área chamada Conhecimento</td><td><b>Atual</b></td><td>Escrever não traz nada para cá. O painel do livro conta “4 de 8 anotações levadas”, e sugestão só sai do que foi levado.</td></tr>
<tr><td class="n">Migalhas de endereço</td><td><b>Atual</b></td><td>Onde a coisa mora, e não por onde você passou. “Como chegou” continua na faixa de recorte.</td></tr>
<tr><td class="n">Por pergunta</td><td><b>Exploração forte</b></td><td>Reúne em vez de recuperar, nas suas palavras, comparando só o começo. Falta saber se a pessoa faz a pergunta sem exemplo na frente.</td></tr>
<tr><td class="n">Área de Notas (Todas · De livros · Soltas · Para revisar)</td><td><b>Atual</b></td><td>As três primeiras são partição; "Para revisar" é estado seu e atravessa as três — por isso está depois de um filete, e não como quarta irmã.</td></tr>
<tr><td class="n">Nota solta</td><td><b>Atual</b></td><td>Nasce fora de livro nenhum, e a área tem uma fila só para elas.</td></tr>
<tr><td class="n">Relações por palavra em comum</td><td><b>Exploração forte</b></td><td>A regra cabe numa frase e é dizível. O que ainda não sei é se ela sobrevive a duzentas notas sem virar ruído.</td></tr>
<tr><td class="n">Trilha entre livros</td><td><b>Exploração forte</b></td><td>É a única das três direções em que cada passo é legível sem clicar. Sai do material real, e não de um exemplo escrito à mão.</td></tr>
<tr><td class="n">Ideia emergente e Território</td><td><b>Experimental</b></td><td>A contagem funciona; o nome não. Ver abaixo.</td></tr>
<tr><td class="n">Mapa como área</td><td><b>Removido</b></td><td>Reprovado por medida: a posição não carregava informação. Sobrevive recolhido dentro de um conceito.</td></tr>
<tr><td class="n">Página de um conceito, com a trilha dentro</td><td><b>Atual</b></td><td>É o que sobrou de Conexões quando a duplicação e o mapa saíram — e o que sobrou não era uma área.</td></tr>
<tr><td class="n">Canvas: mover, ligar, escrever, tirar</td><td><b>Exploração forte</b></td><td>A ligação feita à mão é o mesmo objeto da relação da nota, o que impede Canvas e Conexões de virarem a mesma tela.</td></tr>
<tr><td class="n">Pauta de “Para revisar”</td><td><b>Exploração forte</b></td><td>Sai inteira de contagem sobre o que você escreveu. Nenhum número inventado.</td></tr>
<tr><td class="n">Menu de objeto na linha da nota</td><td><b>Atual</b></td><td>Um controle por item, escondido até o cursor chegar. A porta continua sendo a frase.</td></tr>
<tr><td class="n">Conectar como ação do leitor</td><td><b>Futuro</b></td><td>Continua fora da barra de seleção, como combinado. Ligar duas notas só existe dentro de uma nota, onde há as duas pontas.</td></tr>
<tr><td class="n">Zoom semântico</td><td><b>Futuro</b></td><td>Só faz sentido depois que existir densidade suficiente para haver o que esconder.</td></tr>
</tbody></table>

<h3>Onde o Mekora não consegue chegar sozinho</h3>
<p>O cenário pedia que o produto percebesse "Observação como sistema" entre três notas de três
livros. Ele percebe a <b>travessia</b>: contando, encontra <span class="mono">repetição</span>
ligando Diário 02 a Estudo de Viabilidade e <span class="mono">registro</span> ligando Diário 02 a
Malha Urbana. Mas nenhuma das três notas usa a palavra "sistema".</p>
<p><b>Esse nome é interpretação, e interpretação não sai de contagem.</b> Por isso a tela oferece as
palavras que contou e o botão diz <b>Dar um nome</b> — nomear é o gesto que transforma o palpite do
sistema em coisa sua, e é o que separa Território de pasta. Se o Mekora escrevesse "Observação como
sistema" sozinho, ele estaria acertando por sorte numa tela e errando com a mesma confiança na
seguinte.</p>
<p>É a mesma razão de <b>como cheguei aqui</b> estar sempre a um clique: quem confia na sugestão
nunca abre, e quem não confia precisa poder discordar do argumento, e não da conclusão.</p>

<h3>Dois defeitos que a medição pegou, e que não eram de aparência</h3>
<ul>
<li><b>Citar a mesma passagem não é uma relação.</b> Duas notas sobre o mesmo parágrafo apareciam com
cinco palavras em comum — e nenhuma era de quem leu: eram do autor, vindas do trecho idêntico. Agora
o que você escreveu conta contra o que o outro escreveu e contra o trecho do outro; trecho contra
trecho, nunca. As cinco palavras viraram duas, e as duas são defensáveis.</li>
<li><b>A ideia dizia "repete" onde o material inteiro diz "repetição".</b> A palavra mostrada era a
primeira encontrada, não a mais usada. Um assunto batizado com a forma mais pobre de si mesmo não é
reconhecível como seu.</li>
</ul>

<h3>A âncora, que é a decisão que não dá para adiar</h3>
<p>Número de página não serve: a paginação é consequência da fonte, do corpo, da margem e da tela.
Mas deslocamento dentro do parágrafo <b>também não serve sozinho</b> — e esse é o ponto que só
aparece porque nós convertemos. O texto muda embaixo da nota, e isso é o caso normal: OCR corrigido,
parágrafo remontado, tradução, reconversão.</p>
<p>Então a âncora guardada é <span class="mono">citação + o que vem antes + o que vem depois</span>,
e o deslocamento foi rebaixado a <i>dica de por onde começar a procurar</i>. A resolução tenta, nesta
ordem: o lugar exato, o mesmo parágrafo pelo contexto, o mesmo parágrafo pela citação, o capítulo, o
livro inteiro.</p>
<p>No seletor de revisão existe um botão <b>reconverter</b>. Ele faz com o texto o que uma
reconversão faria — nota de tradutor na frente do parágrafo, “Fotografia” virando “Fotografía”,
“duzentos metros” virando “200 metros” — e você pode conferir que os destaques continuam no lugar e
que a nota passa a dizer <i>“O parágrafo mudou; o trecho foi reencontrado pelo texto em volta.”</i></p>
<table><thead><tr><th>O que muda no texto</th><th>O que a nota faz</th></tr></thead><tbody>
<tr><td class="n">Uma palavra antes do trecho muda</td><td>reencontra pelo contexto</td></tr>
<tr><td class="n">Uma frase inteira é inserida antes</td><td>reencontra pelo contexto</td></tr>
<tr><td class="n">O contexto muda dos dois lados</td><td>reencontra pela citação</td></tr>
<tr><td class="n">O trecho migra de capítulo</td><td>reencontra no livro, e diz que migrou</td></tr>
<tr><td class="n">O trecho deixa de existir</td><td><b>diz que perdeu</b>, e guarda a citação original</td></tr>
</tbody></table>
<p><b>O último caso é o mais importante.</b> Uma âncora que se conserta em silêncio é uma âncora em
que ninguém pode confiar, porque ninguém sabe quando ela falhou. Quando o trecho some, a nota
continua sendo sua, a tela diz o que se perdeu, e mostra a citação que estava guardada.</p>

<h3>Conceito e Território são o mesmo objeto</h3>
<p>Um grupo de notas com nome. A única diferença é quem começou: <b>você reuniu</b> ou <b>o Mekora
notou e você nomeou</b>. Duas palavras para a mesma coisa seria pior do que uma. Antes só dava para
nomear o que a contagem tinha achado — o que deixava metade do gesto de fora, porque as ideias que
você já tem não esperam a contagem chegar nelas.</p>

<h3>Por que o mapa ganhou interruptores de tipo de nó</h3>
<p>Não para salvá-lo. Ligue <b>Trechos marcados</b> e repare de onde vêm as linhas novas: trecho liga
com trecho por estarem no mesmo capítulo — informação que você já tinha antes de abrir o mapa. Um
argumento que você confere sozinho vale mais do que um que precisa aceitar de mim.</p>

<h3>Duas coisas do lote de referências que eu não faria</h3>
<ul>
<li><b>Brilho no painel de leitura.</b> Um app de navegador ou de desktop não controla o brilho da
tela. O que dá para fazer é escurecer a página com uma camada por cima — que não é brilho, é sujeira
sobre o texto, e piora o contraste em vez de melhorar. Tema escuro já cobre a necessidade real.</li>
<li><b>Destaques populares.</b> Aquilo é o agregado de milhões de leitores da Amazon. Não temos esse
corpo e não vamos ter: a biblioteca é de uma pessoa só. Prometer isso seria prometer um dado que não
existe. A razão escrita aqui antes era outra — <i>“o produto é local”</i> — e ela caducou quando o
produto passou a ser web. A recusa continua de pé; o que a sustenta é o corpo de leitores, não o
lugar onde o produto roda.</li>
</ul>

<h3>Onde eu discordo do desenho de três colunas no desktop</h3>
<p>Medido a 1440: a coluna de leitura tem <b>724px</b>, e sobram <b>358px de cada lado</b>. Um painel
de notas à direita cabe inteiro na margem que já está vazia — <b>ele não custa uma linha de leitura</b>.
O trilho de biblioteca à esquerda é outra história: ele custa largura de verdade e compra pouco,
porque a Estante está a um clique e ninguém troca de livro no meio de um parágrafo.</p>
<p>Então: painel da direita sim, recolhido por padrão e fora do modo Foco; trilho da esquerda não.</p>

<h3>A crítica da página de uma nota, e o que ela mediu</h3>
<p>Rodada pelo método do <b>Design Critique</b> (interface-craft), que exige contagem e proíbe
prescrição sem justificativa. O pacote não está nesta máquina — está no Mac —, então segui o método
a partir do registro em <span class="mono">docs/references/interface-craft-2026-08-12.md</span>, e
não a skill em si.</p>
<table><thead><tr><th>O que foi medido</th><th>Antes</th><th>Agora</th></tr></thead><tbody>
<tr><td class="n">Cabeçalhos de seção (todos com um único estilo)</td><td><b>4</b></td><td><b>2</b></td></tr>
<tr><td class="n">Vãos de 60px idênticos e seguidos</td><td><b>3</b></td><td>2, e agora separam blocos</td></tr>
<tr><td class="n">Altura da coluna</td><td>1363 px</td><td>1145 px</td></tr>
<tr><td class="n">A migalha repete o título</td><td><b>sim</b></td><td>não</td></tr>
<tr><td class="n">Frases que explicam o algoritmo dentro do conteúdo</td><td><b>2</b></td><td><b>0</b></td></tr>
<tr><td class="n">Textos abaixo de 4,5:1</td><td>0</td><td>0</td></tr>
</tbody></table>
<p><b>Três vãos de 60px seguidos e idênticos era o defeito estrutural.</b> Quatro seções à mesma
distância umas das outras não formam grupos — formam pilha. Agora 60 separa <i>bloco</i> e 20 separa
o que está <i>dentro</i> de um: Tags e Conceitos viraram “Como você classifica”, e Conectar entrou no
cabeçalho de “Relacionadas” em vez de flutuar sozinho entre dois vazios.</p>

<h3>A orientação — e uma regra minha que estava errada</h3>
<p>A reclamação foi <i>“é fácil se perder dentro dos grupos, não dá pra entender onde você está e por
que está lá”</i>. Medido, entrando numa nota por três caminhos diferentes:</p>
<ul>
<li>vindo de um <b>conceito</b>: nenhuma menção ao conceito, nenhuma volta para ele, nenhum vizinho;</li>
<li>vindo de um <b>recorte de duas notas</b>: a faixa do recorte não acompanhava — o estado sobrevivia
e voltar restaurava, mas a tela não dizia;</li>
<li>a migalha era <b>idêntica nos três casos</b>.</li>
</ul>
<p>Ontem eu registrei aqui: <i>“a migalha diz onde a coisa mora, e não por onde você passou”</i>.
<b>Essa regra está errada para lista→detalhe.</b> Ela vale para hierarquia estável — uma pasta dentro
de outra. Numa lista, “por que estou aqui” faz parte de “onde estou”, e separar as duas deixou a
segunda sem dono nenhum.</p>
<p>O conserto não foi trocar uma pela outra. O <b>conjunto</b> passou a ser estado explícito, montado
no clique — quem sabe de onde você veio é o lugar de onde você clicou. A nota mostra
<b>“Em Observação como sistema · 3 de 6 · ‹ anterior · próxima ›”</b>, e a migalha reflete o conjunto:
<span class="mono">Conhecimento › Ideias › Observação como sistema</span>, com o último item clicável
de volta. Trocar de nota dentro do conjunto mantém a fila; entrar de fora monta uma nova.</p>
<p>E a migalha parou de repetir o título: ela termina no <b>pai</b>. O último item era o começo do H1
truncado, dois centímetros acima do próprio H1.</p>

<h3>A copy</h3>
<ul>
<li><b>“Ligação sua. O Mekora não teria achado esta: as duas notas não repetem nenhuma palavra.”</b> e
<b>“Uma palavra em comum. Pode não ser nada.”</b> saíram. É argumento meu, e argumento meu mora aqui.
Os três grupos viraram subtítulos de “Relacionadas” em vez de quatro seções irmãs.</li>
<li><b>“em comum: padrão”</b> → <i>“as duas falam de ‘padrão’”</i>. Telegrama vira frase.</li>
<li><b>“ligar de verdade”</b> → <i>“Confirmar a ligação”</i>. Versus ligar de mentira?</li>
<li><b>“Esta nota ainda não está em nenhum conceito.”</b> saiu: o botão já diz isso. Narrar ausência
não é ajudar.</li>
<li><b>“Escrita aqui, sem livro”</b> → <i>“Escrita aqui”</i>. “Sem livro” já estava dito por “aqui”.</li>
<li>Cinco verbos de naturezas diferentes na mesma fila com o mesmo peso ganharam filete: o que abre,
o que muda o estado, e o que destrói — este sozinho, no fim.</li>
</ul>

<h3>O que eu não consertei, e por quê</h3>
<ul>
<li><b>Cinco pesos de controle na mesma página.</b> Contei e deixei: eles correspondem a cinco coisas
de fato diferentes (ação primária, ação secundária, chip, rótulo, e o texto de uma nota que é porta).
Reduzir por estética faria duas delas mentirem sobre a própria natureza.</li>
<li><b>A página continua alta para uma nota solta.</b> Sem trecho de origem, sobram título, metadata,
ações e dois blocos quase vazios. Isso é honesto — a nota solta tem menos —, mas provavelmente pede
um arranjo próprio, e isso é outra rodada.</li>
<li><b>Nada foi visto a 390</b>, e a faixa do conjunto com “anterior/próxima” é justamente o tipo de
coisa que quebra primeiro lá.</li>
</ul>

<h3>O portão do “levar”, e o nome que ele obriga a mudar</h3>
<p>A tese é sua, e estava escrita no protótipo da área pessoal desde 11 de agosto: <i>“O que chega
aqui não é tudo que foi destacado: é o que a pessoa levou, pela ponte do leitor. A distinção é o
produto — sem ela isto vira o arquivo que ninguém abre.”</i></p>
<p>Escrever uma anotação no livro não a manda para lugar nenhum. <b>Levar</b> é um segundo gesto,
feito de propósito, no painel do livro ou dentro da nota. E o painel mostra a diferença sem
explicá-la: <b>“4 de 8 anotações levadas”</b>.</p>
<p><b>Aceitar o portão obriga a renomear a área.</b> Uma tela chamada <i>Notas</i> que não mostra
todas as suas notas é mentira. <i>Conhecimento</i> passa a ser honesto justamente por não receber
tudo — o nome deixa de ser uma promessa sobre o valor e vira a descrição do recorte. Eu tinha
argumentado contra esse nome; o portão inverte o meu próprio argumento.</p>
<p>Duas consequências que não são cosméticas: <b>sugestão só sai do que foi levado</b> — o portão
serve também para calar o palpite sobre material que você não escolheu guardar; e <b>tirar do
Conhecimento não apaga a anotação</b>, ela volta a morar só no livro, que é de onde nunca saiu.</p>
<p>A pauta de revisão ganhou a pendência que o portão cria, e ela passou a ser a primeira:
<b>“3 anotações escritas e ainda não levadas”</b>.</p>

<h3>Migalhas: endereço, e não rastro</h3>
<p>A migalha diz <b>onde a coisa mora</b>, e não por onde você passou. Um rastro de navegação muda a
cada visita e mente sobre a estrutura; o endereço é sempre o mesmo, e é ele que permite voltar sem se
perder.</p>
<table><thead><tr><th>Onde você está</th><th>A migalha</th></tr></thead><tbody>
<tr><td class="n">Uma nota dentro de um estudo</td><td>Conhecimento › Estudos › Método de campo</td></tr>
<tr><td class="n">Uma nota fora de qualquer um</td><td>Conhecimento › Fora de estudo</td></tr>
<tr><td class="n">Um estudo</td><td>Conhecimento › Estudos › Método de campo</td></tr>
</tbody></table>
<p>O meio da migalha é o <b>estudo</b>, e essa foi a correção desta rodada. Antes era o livro da nota,
recalculado a cada salto — andando a rota, ela dizia “Diário 02”, depois “Soltas”, depois “Diário 02”,
sem eu ter feito nada além de seguir em frente. Um estudo não muda quando você pula de nota, e é isso
que o torna endereço.</p>
<p><b>“Como você chegou” continua sendo outra coisa</b>, com componente próprio: a faixa de recorte
(“Mostrando uma nota de <i>Malha Urbana</i>”). São duas perguntas diferentes e por isso dois
elementos diferentes — a mesma disciplina das quatro categorias de interação.</p>
<p>Onde ela <b>não</b> entra: na leitura. O cabeçalho do livro já responde “onde estou” com título,
autor e capítulo, e aquele contrato está fechado. Duas respostas para a mesma pergunta é pior do que
nenhuma.</p>

<h3>Por pergunta: a busca que monta em vez de recuperar</h3>
<p>A busca comum devolve; esta <b>reúne</b>. Duas decisões vieram inteiras da sua exploração, porque
as duas já tinham sido testadas lá:</p>
<ul>
<li><b>Procura nas suas palavras</b>, não no texto dos livros. O dossiê junta o que você já pensou,
não o que o autor escreveu — sem isso ele devolve o livro de volta, que é o contrário do que se
pediu.</li>
<li><b>Compara só o começo da palavra.</b> Sem sinônimo e sem modelo de linguagem: ele erra de um
jeito previsível, e é isso que o torna confiável. Um acerto que você não consegue explicar vale menos
do que um erro que você consegue.</li>
</ul>
<p>Uma correção medida sobre a regra original: cortar duas letras resolve “guardo” → “guardar” (6
viram 4), mas não resolve <span class="mono">repetição</span> → <span class="mono">repetido</span>,
porque 9 letras viram 7 e “repetido” não contém “repetic”. Com <b>teto de seis</b> os dois casos
passam, e a regra continua cabendo numa frase.</p>
<p>O resultado diz de onde veio (“4 de 7 — de um livro”) e por que casou (“Casou por:
<span class="mono">repeti</span>, <span class="mono">regist</span>”). E o vazio é resposta:
<i>“Nada seu sobre ‘blockchain’ ainda. Isso pode ser resposta: é um assunto que você leu e não
escreveu sobre.”</i></p>

<h3>A rota fazia ciclo, e a medida mostra</h3>
<p>Você disse que em poucos cliques não sabia mais onde estava nem por quê. Andei a rota em vez de
imaginar — entrar na lista, abrir uma nota, e depois clicar sempre na primeira “relacionada”:</p>

<tr><td class="n">2 · segui a primeira</td><td>Conhecimento › Soltas</td><td>“Vale testar…”</td></tr>

<p>A relacionada de A era B e a de B era A: dois cliques e você voltava, com a interface apresentando

<p><b>Migalha nenhuma conserta ciclo.</b> O que conserta é a relacionada não ser navegação: agora ela
<b>abre no lugar</b>, e ir para ela é um gesto separado que diz o que faz. Andando a mesma rota
depois: cinco saltos, a migalha diz <span class="mono">Conhecimento › Estudos › Método de campo</span>
nos cinco, e a tela não troca.</p>

<h3>Coleção e Conceito eram a mesma coisa cortada ao meio</h3>
<p>Você perguntou para que servia Coleções na Estante. Medido, uma coleção tinha três campos
(<span class="mono">id, nome, livros</span>) e fazia uma coisa: 14 livros viravam 2. Sem página, sem
notas, sem pergunta, uma por vez — um filtro que você alimentava à mão e que não devolvia nada, dentro
de um produto que tem regra explícita contra exigir organização manual.</p>
<p>E o Conhecimento tinha <b>7 notas e cinco recortes</b> sobre elas — três deles mostrando uma nota
cada. Isso não é uma área: é uma lista com cinco filtros, e por isso não havia nada estável para a
migalha apontar.</p>
<p>Coleção agrupava livros; Conceito agrupava notas. <b>Um estudo é os dois, mais a pergunta</b> — que
é o que permite um assunto terminar. Caixa de entrada de notas não termina; pergunta se responde.
Nomear um grupo que o Mekora contou <b>cria</b> um estudo: uma entrada emergente e uma manual para o
mesmo objeto, porque se fossem dois objetos a confusão voltaria com outro nome.</p>
<p>As seis abas viraram três — <b>Estudos</b>, <b>Todas as notas</b>, <b>Por pergunta</b> — e os
recortes antigos desceram um nível, que é onde eles sempre estiveram: são cortes de uma lista, e não
lugares.</p>

<h3>Sem estudo ainda</h3>
<p>A frase é sua e ela evitou um erro que eu ia cometer — inventar um estudo guarda-chuva só para a

aqui.”</i> Por isso <b>Fora de estudo</b> é um lugar com nome, e não uma sobra.</p>

<h3>O que a cobertura pegou nesta rodada</h3>

inteiro estava sem cobertura, e um <span class="mono">gesto is not defined</span> passou pelo smoke
com zero erros. Cinco casos novos para as abas, cinco para o portão e a pergunta — <b>251 telas</b>,

<h3>Correção: eu generalizei demais, e a exploração de 11 de agosto prova</h3>
<p>A medida abaixo continua verdadeira sobre <b>o mapa que eu tinha feito</b>. Mas eu tirei dela uma
conclusão maior do que ela sustentava — “arranjo espacial não serve para notas de leitura” — e a
exploração da área pessoal, que já existia no repositório, mostra o contrário. Rodei o mesmo
critério nas duas:</p>

<p><b>O problema não era rede. Era a minha rede.</b> Três defeitos, e nenhum é de gosto: círculo por
ordem de inserção em vez de layout de força; arestas adivinhadas em vez de fatos; e o nó como bolinha
anônima em vez de caixa com o objeto dentro.</p>
<p>A rede do conceito foi refeita nesse modelo — força determinística, arestas que são fatos
(<i>saiu deste livro</i>, <i>toca neste assunto</i>, <i>você ligou</i>), e o nó carregando o que é.
Medida com o mesmo critério: <b>razão 1,42, zero caixas sobrepostas</b>. Ligados a 161px, não ligados
a 229px.</p>
<p>Duas coisas quebraram no caminho e foram medidas para fechar: a repulsão diagonal deixava caixas
largas se cruzarem (agora ela testa a sobreposição real e empurra no eixo mais curto), e o corte de
texto partia palavra ao meio — “não” virava “nã…”, que lê como erro de digitação e não como texto
cortado.</p>

<h3>Conexões saiu da navegação, e a medida que a matou</h3>
<p>Você perguntou se aquilo era mesmo a melhor forma de ver estudos. Fui medir em vez de opinar: se
dois pontos próximos no mapa tinham alguma relação entre si.</p>
<table><thead><tr><th>O que foi medido</th><th>Resultado</th></tr></thead><tbody>
<tr><td class="n">Correlação entre força da relação e proximidade</td><td><b>−0,145</b></td></tr>
<tr><td class="n">Distância média entre notas <b>relacionadas</b></td><td>202 px</td></tr>

</tbody></table>
<p>As notas sem relação ficavam <b>mais perto</b> do que as relacionadas. A posição — que é a variável
visual mais forte de qualquer arranjo espacial — não carregava informação nenhuma e ainda enganava um
pouco. Toda a informação estava nas linhas, e linha se lê traçando com o olho, um par de cada vez. Os
rótulos confirmavam o resto: <span class="mono">sobrou fim</span>, <span class="mono">frase separa</span>,
<span class="mono">serve capítulo</span> — fragmentos que ninguém reconhece como uma ideia sua.</p>
<p>Um layout de força consertaria a posição. Mas seria melhorar exatamente as bolinhas flutuantes que
estavam sendo recusadas, e continuaria sem responder “o que eu faço agora”.</p>

<h3>E a duplicação que eu tinha criado sem perceber</h3>
<p>Medindo o que existia <i>só</i> em Conexões, sobrou pouco. <b>Territórios</b> e <b>Notas › Ideias</b>
listavam o mesmo objeto, com o mesmo nome e quase as mesmas ações — eu duplicei isso na rodada
anterior. Fora o mapa, o único conteúdo exclusivo era a <b>trilha</b>. E uma trilha é a forma de
<i>um</i> conceito atravessando livros: ela pertence ao conceito, não a uma área.</p>
<p>Então Conexões não era uma área. Era <b>a página de uma ideia</b>, que ainda não existia.</p>

<h3>O que existe agora</h3>
<ul>
<li>A navegação tem quatro lugares: <b>Mesa · Estante · Notas · Canvas</b>. O Canvas fica, porque lá o
espaço é intenção sua — a posição significa o que você decidiu que ela significa.</li>
<li>Um conceito tem <b>página própria</b>, aberta pelo nome em Notas › Ideias: quantas notas, quais
livros, quem começou, e as ações — ver na lista, renomear, desfazer.</li>
<li>O corpo dessa página é <b>como isto se formou</b>: a trilha, com a palavra que liga cada dois
passos escrita entre eles. O que não entrou no caminho aparece embaixo, em <b>também aqui dentro</b> —
nenhuma nota do conceito some.</li>
<li>A <b>rede</b> sobrevive como opção recolhida, só neste tamanho, e diz a própria limitação na
tela: “a posição não quer dizer nada; quem carrega informação são as linhas”.</li>
<li>Links antigos para <span class="mono">conexoes</span> caem em Notas › Ideias em vez de quebrar.</li>
</ul>

<h3>Como a trilha escolhe o caminho</h3>
<p>Três critérios, nesta ordem: quantos <b>livros</b> o caminho atravessa, quantas <b>palavras
diferentes</b> o ligam, e só então o tamanho. O segundo critério existe porque o vencedor sem ele era
um caminho em que <span class="mono">registro</span> ligava três notas seguidas — isso não é uma ideia
se desenvolvendo, é a mesma palavra repetida.</p>
<p>No material atual o caminho vencedor visita o Diário 02 três vezes, e isso está certo: é onde há
mais notas sobre este assunto. A trilha reflete o material, e não uma simetria que eu tivesse imposto.</p>

<h3>Movimento: quatro, e cada um diz algo que o estado parado não diz</h3>
<ul>
<li><b>A relação sobe de categoria.</b> Ligar move o item de “Talvez” para “Você ligou”. Sem
movimento, ele some de um lugar e aparece noutro no mesmo quadro, e parece que um sumiu e outro
nasceu — em vez de o mesmo ter mudado de estado.</li>
<li><b>A linha se traça de A para B</b> no Canvas. Uma linha que aparece inteira não diz <i>quais</i>
duas coisas foram ligadas quando há oito na mesa.</li>
<li><b>A trilha chega em ordem</b>, porque ela é uma ordem. E só ao chegar em Conexões: repetir a
entrada a cada repintura transformaria um argumento numa animação de abertura.</li>
<li><b>O trecho reencontrado pisca uma vez</b> onde foi achado, depois de o texto mudar.</li>
</ul>
<p>A regra: <b>se a animação pode ser removida sem perder informação, ela não deveria estar lá.</b>
Todas respeitam <span class="mono">prefers-reduced-motion</span>.</p>

<h3>Três defeitos que a medição pegou nesta rodada</h3>
<ul>
<li><b>Os destaques sumiam na versão Original</b> — e a folha do seletor promete, por escrito, que
eles sobrevivem. As duas versões passaram a ler a mesma função de segmentos: concordar por construção
é melhor do que concordar por disciplina.</li>
<li><b>A barra de página ficou dentro do container que rola</b>, porque eu contei errado os três
fechamentos de <span class="mono">div</span>. Resultado: 53px de texto cortados, com
<span class="mono">overflow-y:hidden</span> escondendo o corte. Texto invisível é pior do que texto
feio.</li>
<li><b>O mapa afastado dava quatro pontos e zero linhas.</b> As únicas arestas que existiam eram
nota–nota e nota–livro, e as notas tinham acabado de sumir. Zoom semântico não é esconder.</li>
</ul>

<h3>O que continua de fora, e por quê</h3>
<ul>
<li><b>Leitura em voz alta.</b> Combinamos que não era prioridade. A decisão relevante continua
sendo de arquitetura e não de tela — onde a síntese roda, com que voz, e se o áudio acompanha o
texto. O que mudou é que a resposta não é mais “o sintetizador do sistema operacional”: num produto
web isso vira uma escolha, e ela ainda não foi feita.</li>
<li><b>Cor de destaque.</b> Continua fora por decisão declarada: sete cores pedem que a pessoa
invente uma taxonomia antes de ter material, e daqui a seis meses ninguém lembra o que era o azul.</li>
<li><b>Brilho e destaques populares.</b> O primeiro o app não controla; o segundo depende de um corpo
de leitores que uma biblioteca de uma pessoa só não tem.</li>
<li><b>O celular.</b> Nada foi visto a 390 ainda — e agora existem uma superfície arrastável, um mapa
com zoom e um modo paginado, que são os três casos mais difíceis de tudo.</li>
</ul>

<h3>Canvas é intenção; Conexões é descoberta — e isso agora vale no modelo</h3>
<p>A regra sozinha não segura nada: duas telas separadas só por uma explicação acabam fazendo a mesma
coisa em duas aparências. Então ela foi para o modelo. <b>A linha que você puxa à mão no Canvas é
exatamente o mesmo objeto que aparece em “Você ligou” dentro da nota.</b> Não existe relação-de-canvas
e relação-de-nota: existe relação, e duas maneiras de fazer uma.</p>
<p>O mesmo vale para o resto do que o Canvas faz. <b>Escrever aqui</b> cria uma nota solta de verdade,
que aparece em Notas › Soltas no mesmo instante — o Canvas não inventa um segundo tipo de objeto, ele
decide onde o objeto fica. <b>Tirar</b> tira da mesa e não apaga a nota. E o que é trazido continua
sabendo de onde veio: o item na mesa mostra livro e capítulo, e abre no trecho.</p>
<p>Antes desta rodada não havia Canvas nenhum: havia um título, um parágrafo explicando que ali
existia uma dock, cinco botões que não faziam nada e uma lista vertical. Não dava para avaliar se
competia com Conexões porque não havia o que competir.</p>

<h3>A dissertação saiu das telas</h3>
<p>Conexões estava dizendo coisas como <i>“Não responde: o que eu faço agora. Nenhum ponto do mapa é
uma próxima ação”</i> e três parágrafos de <i>“Por que esta vem primeiro”</i>. Isso é <b>argumento meu
para você</b>, e argumento meu não é conteúdo de tela: quem usa não deveria precisar ler uma
justificativa para entender uma visualização. Cada direção ficou com uma linha, e o raciocínio inteiro
mora aqui. “Mapa neural” virou <b>Mapa</b> — “neural” é exatamente a palavra que este projeto
proibiu na primeira rodada.</p>
<p>O argumento continua o mesmo, e é este:</p>
<ul>
<li><b>Mapa</b> responde “o que está ligado com quê” e não responde “o que eu faço agora”. Com onze
notas ele já está quase cheio; com duzentas vira nuvem. Para saber <i>qual</i> é a relação entre dois
pontos é preciso clicar — e aí você está lendo uma nota, que é a tela de Notas. Ligue <b>Trechos
marcados</b> e veja de onde vêm as linhas novas: trecho liga com trecho por estarem no mesmo capítulo,
informação que você já tinha antes de abrir o mapa.</li>
<li><b>Trilhas</b> responde “como uma ideia levou à outra”, e é a única das três em que cada passo é
legível sem clicar em nada: a palavra entre dois passos é a razão da ligação, dita, e não sugerida
pela inclinação de uma linha. Uma trilha cabe numa conversa.</li>
<li><b>Territórios</b> responde “que assuntos apareceram sozinhos”, e não é fase: é limiar. Oferecido
cedo demais vira pasta com outro nome — e pasta é o que este produto não quer obrigar ninguém a
manter. A condição já está no código: o assunto só aparece quando se repete em <i>livros
diferentes</i>.</li>
</ul>

<h3>“Para revisar” deixou de ser uma categoria vazia</h3>
<p>Ela contava quantas notas você tinha marcado à mão, o que começava em zero e tendia a continuar
zero. Agora ela lê o próprio material e monta uma pauta: trecho marcado e nunca escrito, nota que não
encosta em nenhuma outra, par que o Mekora achou parecido e ninguém decidiu, assunto que se repetiu e
continua sem nome, nota cujo trecho a reconversão perdeu.</p>
<p>Cada linha leva ao recorte que ela descreve, e o recorte diz por que está recortado. <b>Nenhuma
delas inventa um número:</b> todas saem de contagem sobre o que você escreveu — que é o contrário de
gamificação, porque o retorno é o seu próprio material e não um ponto que o produto distribui.</p>

<h3>O que eu não mudei, e por quê</h3>
<ul>
<li><b>Highlights sem nota continuam fora da lista de Notas</b> — mas deixaram de estar enterrados: o
painel do livro tem uma aba <b>Destaques</b>, e a pauta de revisão os traz de volta pelo nome. A área
se chama Notas e a fila dela é uma partição de notas; misturar destaque ali faria os números pararem
de fechar. A distinção que você pediu existe, só não como quinta aba.</li>
<li><b>A área continua se chamando Notas, e não Conhecimento.</b> “Conhecimento” é uma afirmação sobre
o resultado; “Notas” descreve o conteúdo. Quem decide se aquilo virou conhecimento é quem escreveu.</li>
<li><b>Tag e Coleção ainda não existem</b>, de propósito. Conceito já cobre “ideia nomeada”, e três
palavras para classificar antes de existir material é a organização manual que o produto disse que não
ia exigir.</li>
</ul>

<h3>A ordem que eu proponho, e onde ela discorda da sua</h3>
<p>Concordo com as fases 1 e 2. Discordo da 3 e da 4 — não na ordem, mas em <b>o que decide a
passagem</b>.</p>
<ul>
<li><b>Fase 1 — nota com origem.</b> Já de pé. É a única fase que se justifica sozinha: mesmo que
nada mais exista, não perder de onde a nota veio já é o produto.</li>
<li><b>Fase 2 — relacionadas e trilhas.</b> A trilha deveria vir <b>junto</b> das relacionadas, e não
depois: uma relação isolada é uma curiosidade, e três em fila são um argumento. É a trilha que faz a
relação valer a pena de ler.</li>
<li><b>Fase 3 — territórios: não é fase, é limiar.</b> Território oferecido cedo demais vira pasta com
outro nome. Ele não deve aparecer quando o código estiver pronto, e sim quando o mesmo assunto se
repetir <b>em livros diferentes</b> — que é a condição que o protótipo já usa. Num acervo de doze
notas de um livro só, essa tela deve continuar vazia, e vazia é o comportamento certo.</li>
<li><b>Fase 4 — mapa: talvez nunca.</b> Não porque seja difícil, mas porque em nenhum tamanho ele
responde "o que eu faço agora". Com onze notas já está quase cheio; com duzentas vira nuvem. E para
saber o que liga dois pontos é preciso clicar — e aí você está lendo uma nota, que é a tela de Notas.
Se ele entrar um dia, deve entrar como <b>vista</b> de Conexões, e não como a porta dela.</li>
</ul>

<h3>O que continua em aberto</h3>
<ul>
<li>O nome de "Soltas". Testei contra <span class="mono">Caixa de pensamento</span>, <span class="mono">Em
aberto</span>, <span class="mono">Rascunhos</span> e <span class="mono">Entrada</span>. "Soltas"
ganhou porque descreve o estado sem prometer arrumação futura — "Entrada" e "Rascunhos" prometem que
aquilo vai virar outra coisa, e a maioria não vira.</li>
<li>O limiar de uma palavra em comum. Hoje uma palavra basta para "talvez". Pode ser generoso demais
num acervo grande — mas apertar isso agora, com onze notas, seria calibrar no escuro.</li>
<li>Nenhuma dessas telas foi vista no celular ainda.</li>
</ul>
</div>`;
NT.sistema=`<div class="w"><h2>O que veio do DOC.cc, e onde está aplicado</h2>
<p>Na rodada anterior eu escrevi sobre o sistema deles e entreguei um produto que não o usava.
Aqui ele está aplicado — e as duas superfícies onde ele de fato serve são a <b>Home</b> e a
<b>leitura dentro do arquivo</b>, porque são as duas onde se lê. O aparato do produto — Mesa, item,
perfil — continua em grotesca e densidade de ferramenta, de propósito.</p>
<h3>Adotado</h3>
<table><thead><tr><th>Do DOC</th><th>Como está aqui</th><th>Onde ver</th></tr></thead><tbody>
<tr><td class="n">Escala fluida por root</td><td><code>clamp(.875rem, .82rem + .28vw, 1.25rem)</code> no <code>html</code> — tudo o mais em rem, e a escala inteira cresce com a tela</td><td>toda parte; estique a janela</td></tr>
<tr><td class="n">Entrelinha fecha quando o corpo cresce</td><td>display .94 · h1 1.06 · h2 1.2 · h3 1.34 · leitura 1.62 · interface 1.5</td><td>Home, título contra corpo</td></tr>
<tr><td class="n">Medida editorial</td><td>575 → 675 → 775px conforme a tela, sempre centrada</td><td>leitura e Home</td></tr>
<tr><td class="n">Ritmo vertical de 80px entre módulos</td><td><code>--s8</code>, com divisória de 1px entre faixas</td><td>Home</td></tr>
<tr><td class="n">Gutter de 20 e 40</td><td>base 4 do Mekora, degraus operacionais em 20 e 40</td><td>toda parte</td></tr>
<tr><td class="n">Link por borda inferior</td><td>nunca <code>text-decoration</code>; a borda escurece no hover</td><td>Home, sumário</td></tr>
<tr><td class="n">Botão outline que inverte</td><td>sem raio, 1px, vira sólido no hover</td><td>Home, leitura</td></tr>
<tr><td class="n">Matriz de tag 2×2</td><td>default e main, claro e invertido</td><td>Home, "o que entra"</td></tr>
<tr><td class="n">Lista ordenada como índice</td><td>número em mono, divisória de 1px por item, meta à direita</td><td>Home, "como funciona"; sumário</td></tr>
<tr><td class="n">Legenda na largura da coluna</td><td>imagem larga, legenda estreita e centrada</td><td>leitura, capítulo 3</td></tr>
<tr><td class="n">Zero sombra</td><td>profundidade por borda translúcida</td><td>toda parte</td></tr>
<tr><td class="n">Uma curva só</td><td><code>cubic-bezier(.16,1,.3,1)</code>, quatro durações</td><td>toda parte</td></tr>
</tbody></table>
<h3>Editorial Utility — por que o 4px virou 0</h3>
<p>Sua pergunta seguinte foi a certa: <b>entre 4px e 0, por que não 0?</b> O 4px era o pior dos dois
mundos — perdia a nitidez do reto sem comprar a simpatia de uma curva de verdade. Virou 0.</p>
<p>O medo de ficar quadrado demais é justo, e a resposta não é devolver raio: é <b>substituir a função
que o raio exercia</b>. Ele fazia quatro trabalhos, e cada um foi para outro lugar:</p>
<table><thead><tr><th>O raio fazia</th><th>Agora faz</th></tr></thead><tbody>
<tr><td class="n">Separar grupos</td><td>Espaço, alinhamento e divisória de 1px a 7% — não borda em volta de tudo</td></tr>
<tr><td class="n">Criar camada</td><td>Fundo: <code>#faf9f5</code> geral, <code>#fff</code> no painel, <code>#f4f3ef</code> no recuado</td></tr>
<tr><td class="n">Suavizar</td><td>Off-white em vez de branco puro, preto em <code>#151515</code>, linha a 12% de opacidade</td></tr>
<tr><td class="n">Indicar interatividade</td><td>Movimento e mudança de fundo no hover, e a forma: pílula é dado, reto é ação</td></tr>
</tbody></table>
<p><b>O que tirei de borda:</b> as linhas da Mesa eram cinco caixas com borda própria, empilhadas —
viraram um painel branco com divisórias. O bloco de estado perdeu a borda e ganhou uma barra de 2px
à esquerda. As notas de rodapé perderam a caixa e ficaram com uma hairline em cima. As cinco dobras
do Perfil eram cinco caixas; viraram uma lista. Borda sobrou onde há objeto de verdade: controle,
folha sobre véu e a zona de soltar arquivo.</p>
<p><b>A vantagem que este produto tem e outros não:</b> a Estante é feita de capas. Elas já trazem
cor, textura e forma. Se o chrome for neutro e reto, ele funciona como galeria —
<b>interface é estrutura, conteúdo é personalidade</b> — em vez de competir com aquilo que o usuário
coloca dentro dele.</p>
<p><b>Dá para julgar com o olho:</b> os dois botões no canto inferior esquerdo trocam
<b>raio 0 × 4px</b> e <b>off-white × branco puro</b>, ao vivo, em qualquer tela. Era o único jeito
honesto de responder essa pergunta.</p>
<h3>A regra de raio que sobrou</h3>
<p>Ao trazer o botão reto do DOC para um produto cujos botões eram pílula, eu não reconciliei os dois.
O resultado era <b>seis valores de raio convivendo</b> — 0, 2, 3, 4, 5, 8 e 999px —, e a pergunta
"por que aqui é quadrado e ali é redondo" não tinha resposta, porque não havia regra.</p>
<p>A regra que adotei não é sobre tela, é sobre <b>o que a coisa é</b>:</p>
<table><thead><tr><th>Raio</th><th>É</th><th>Exemplo</th></tr></thead><tbody>
<tr><td class="n">4px</td><td>ação e objeto pequeno</td><td>botão, campo de busca, seletor, miniatura de capa</td></tr>
<tr><td class="n">8px</td><td>superfície</td><td>card, lista, folha, dock, capa grande</td></tr>
<tr><td class="n">pílula</td><td>dado</td><td>tag, chip de metadado, trilho de progresso, interruptor</td></tr>
<tr><td class="n">círculo</td><td>forma, não raio</td><td>avatar, ponto de estado</td></tr>
</tbody></table>
<p>O ganho não é arrumação: hoje o chip <b>"96 páginas"</b> e o botão <b>"Baixar"</b> tinham
exatamente a mesma forma. Separando os dois, <b>a forma passa a dizer se aquilo faz alguma coisa</b>
— antes de ler o texto. Sobraram quatro valores, e cada um tem um significado.</p>
<p>Duas exceções, declaradas: o interruptor continua pílula porque a forma dele é funcional — um
trilho com um botão correndo dentro —, e a lombada do livro mantém o arredondamento só no topo,
porque é a borda de um objeto físico.</p>
<h3>O que mudei em vez de copiar</h3>
<p><b>O root em px.</b> O DOC fixa <code>html{font-size:14px}</code> e sobe até 20px por breakpoint.
É o truque central da identidade deles e o preço é anular a preferência de tamanho de fonte do
navegador — inaceitável num produto para quem lê muito, que é exatamente quem aumenta a fonte.
Aqui o <code>clamp</code> está em <b>rem</b>: 87,5% a 125% do tamanho que a pessoa escolheu.
Mesma identidade, preferência preservada.</p>
<p><b>As durações.</b> .8s a 1.3s é ritmo de revista. Numa ferramenta virou .12 / .24 / .42s.</p>
<p><b>A base de espaço.</b> 4px, que já era do Mekora, com os degraus operacionais de 20 e 40 do DOC.</p>
<h3>O que continua recusado, e por medição</h3>
<p>Medida de 50 caracteres e entrelinha 1,30 foram testadas em 11 de agosto e reprovadas: ritmo de
ensaio de oito minutos, com retorno de linha a cada ~8 palavras — cansa em 300 páginas. O bleed de
título chegou a entrar e <b>você o reprovou no dia seguinte</b>, porque o olho tinha de sair da coluna
e voltar a cada capítulo. Sobrou a régua atravessando na fronteira de capítulo, com o título alinhado
ao texto — está na leitura, entre um capítulo e outro.</p></div>`;

     Sao dois estragos de naturezas diferentes, de proposito. A CONVERSAO
     mexe em volta do trecho: insere frase na frente, troca palavra vizinha,
     move o paragrafo. A REVISAO DE TRANSCRICAO mexe DENTRO dele — corrige
     uma palavra da propria citacao, e parte uma fala em duas no meio dela.

  const REVISOES={
    "Diário 02":{rot:"reconverter",feito:"texto reconvertido",f:caps=>{

      /* parte uma fala em duas, pelo texto e nao pelo indice: quem parte uma
         fala marca onde a segunda comeca, entao o timecode entra junto. */
      const parte=(c,acha,tempo)=>{
        const i=c.p.findIndex(t=>t.indexOf(acha)>-1),t=c.p[i],j=t.indexOf(acha);
        c.p.splice(i,1,t.slice(0,j).trim(),t.slice(j));
