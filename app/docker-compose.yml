services:
  kindle-tool:
    build: .
    ports:
      # v1.2.1 — bind restrito ao localhost do host (ferramenta local,
      # sem autenticação; não expor na rede)
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
